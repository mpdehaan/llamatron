version: 1.0.591
title: Printed song
description: a set for the PDF export's tests

scales:
  - { name: C Major, root: C, type: major }
  - { name: F Major, root: F, type: major }

patterns:
  - name: tune
    steps: 4
    step_size: 1/4
    degree: [1, 2, 3, 5]
    octave: [5, 5, 5, 5]
  - name: answer
    steps: 4
    step_size: 1/4
    degree: [~, 1, ~, 3]
    octave: [4, 4, 4, 4]
  - name: high
    steps: 2
    step_size: 1/2
    degree: [1, ~]
    octave: [6, 6]
  - name: held
    steps: 4
    step_size: 1/4
    degree: [1, ~, 4, ~]
    octave: [4, 4, 4, 4]
    chord: [M, ~, M, ~]
    gate: [1/2, ~, 1/2, ~]
  - name: beat
    steps: 4
    step_size: 1/4
    degree: [1, 1, 1, 1]
    octave: [2, 2, 2, 2]

songs:
  - name: printed
    tempo: 100
    scale: C Major
    tracks:
      - { name: lead }
      - { name: fiddle }
      - { name: piano }
      - { name: kick, drum: true }
    scenes:
      - name: first
        section: verse
        clips:
          - { track: lead, pattern: tune }
          - { track: fiddle, pattern: high }
          - { track: piano, pattern: held }
          - { track: kick, pattern: beat }
      - name: second
        section: verse
        clips:
          - { track: lead, pattern: tune }
          - { track: piano, pattern: held }
      - name: third
        section: chorus
        scale: F Major
        clips:
          - { track: fiddle, pattern: answer }
          - { track: piano, pattern: held }
