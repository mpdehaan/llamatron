chord_trait: harmony

players:
  drums:
    1:
      says: 'A drum machine running one bar, dead on the grid, with no fills.'
      fill_every: 0
    2:
      says: 'A drum machine. An open hat added before every fourth bar, the clap a touch late, and the kick dropping out before every eighth bar.'
      fill_every: 8
      varies: [{bars: [4], choices: [{bar: {open: {steps: 16, loud: [14]}}}]}]
      fill: [{bar: {kick: {steps: 16, loud: [0, 4]}}}]
      timing: {clap: {drag: 8}, snare: {drag: 8}}
      uneven: 3
    3:
      says: 'A drum machine. A soft extra clap, an open hat in the second bar, a kick pickup in the fourth, and a snare roll that speeds up before every eighth bar.'
      fill_every: 8
      adds: [{bar: {clap: {steps: 16, soft: [15]}}}]
      varies:
        - {bars: [2], choices: [{bar: {open: {steps: 16, loud: [14]}}}]}
        - {bars: [4], choices: [{bar: {kick: {steps: 16, loud: [14]}}}]}
      fill: [{bar: {snare: {steps: 16, loud: [0, 4, 8, 10, 12, 13, 14, 15]}}}]
      timing: {hat: {rush: 4}}
      uneven: 5
    4:
      says: 'A drum machine programmed bar by bar. A soft rim in every bar, a different small change in the second, third and fourth bars, and toms into every fourth bar. Holds back until the track opens up.'
      fill_every: 4
      adds: [{bar: {rim: {steps: 16, soft: [3, 9]}}}]
      varies:
        - {bars: [2], choices: [{bar: {kick: {steps: 16, loud: [14]}, rim: {steps: 16, soft: [6, 12]}}}]}
        - {bars: [3], choices: [{bar: {cowbell: {steps: 16, loud: [2, 10]}}}]}
        - {bars: [4], choices: [{bar: {kick: {steps: 16, loud: [7]}, open: {steps: 16, loud: [14]}}}]}
      fill: [{bar: {tom high: {steps: 16, loud: [8, 9, 11]}, tom mid: {steps: 16, loud: [12]}, tom low: {steps: 16, loud: [13, 14, 15]}, snare: {steps: 16, loud: [4], soft: [6, 7]}}}]
      timing: {clap: {drag: 12}, snare: {drag: 12}}
      uneven: 7
  bass:
    1: {says: 'Plays the bass part exactly as written, on the beat.'}
    2: {says: 'Plays the bass part as written, leaning back a little.'}
    3: {says: 'Plays the bass part pushing ahead of the beat.'}
    4: {says: 'Plays the bass part far behind the beat.'}
  rhythm:
    1: {says: 'Plays the part exactly as written, tight and even.'}
    2: {says: 'Plays the part with a wider, slightly loose stroke.'}
    3: {says: 'Plays the part loosely, each stroke spread across the strings.'}
    4: {says: 'Plays the part with the widest and loosest stroke.'}
  lead:
    1: {says: 'Few notes, close together.', span: 2}
    2: {says: 'A hook that leaves room.', span: 3}
    3: {says: 'A line over a wider range.', span: 4}
    4: {says: 'The widest range.', span: 4}
  keys:
    1: {says: 'Plays the part exactly as written.'}
    2: {says: 'Plays the part as written.'}
    3: {says: 'Plays the part pushing ahead of the beat.'}
    4: {says: 'Plays the part leaning far back.'}

sounds: {synth bass: 39, acid bass: 40, sub bass: 39, pad: 90, piano: 2, organ: 18, arp: 82, soft arp: 6, square: 81, lead: 82, voice: 86}

sections:
  intro:
    intensity: {drums: 1, keys: 2}
    bars: 8
    plays: [drums, chords]
    plan: []
  groove:
    crash: true
    bars: 16
    plays: [drums, bass, chords, arp, lead]
    plan: [{line: hook}, {line: hook, varied: true}, {line: hook}, {line: turn, higher: true}, {line: hook}, {line: hook, varied: true}, {line: hook}, {line: turn, higher: true, varied: true}]
  breakdown:
    bars: 8
    plays: [chords, arp, lead]
    plan: [{line: calm}, {line: calm, varied: true}, {line: calm}, {line: rise, higher: true}]
  build:
    intensity: {drums: 3}
    bars: 4
    plays: [drums, chords, arp]
    plan: []
  outro:
    intensity: {drums: 2, bass: 2, keys: 2}
    bars: 8
    plays: [drums, bass, chords]
    plan: []
  ending: {held: true, plays: [bass, chords]}

melody:
  grid: 8
  line_bars: 2
  span: 3
  home: {degree: 5}
  ladder: [{degree: 1}, {degree: 2}, {degree: 3}, {degree: 5}, {degree: 7}]
  rhythms:
    - [{steps: 3}, {steps: 3}, {steps: 2}, {steps: 3}, {steps: 3}, {rest: 2}]
    - [{rest: 2}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 2}, {steps: 6}, {rest: 2}]
    - [{steps: 2}, {steps: 1}, {steps: 3}, {steps: 2}, {steps: 3}, {steps: 3}, {rest: 2}]
    - [{steps: 4}, {steps: 2}, {steps: 2}, {steps: 6}, {rest: 2}]
  answer_rhythms:
    - [{steps: 3}, {steps: 3}, {steps: 2}, {steps: 3}, {steps: 3}, {rest: 2}]
