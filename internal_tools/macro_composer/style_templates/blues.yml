  - {role: bass, player: bass, trait: bass, octave: 2, velocity: 104}
  - {role: drums, player: drums, drums: [drums]}

players:
  drums:
    1:
      says: 'Kick, snare and hats. The shuffle by the book, the same every bar, with one fill at the end of each chorus.'
      fill_every: 12
      uneven: 2
    2:
      says: 'A small kit. The shuffle a little behind the beat, a soft kick before every fourth bar, and a snare triplet into each turn.'
      fill_every: 4
      varies: {every: 4, choices: [{bar: {kick: {steps: 12, soft: [11]}}}]}
      fill: [{bar: {snare: {steps: 12, loud: [3, 9, 10, 11]}}}]
      timing: {snare: {drag: 12}}
      uneven: 5
    3:
      says: 'A larger kit. Quiet snare notes on the upbeats, the kick shuffling in every other bar, and the toms answering at each turn.'
      fill_every: 4
      adds: [{bar: {snare: {steps: 12, soft: [2, 8]}}}]
      varies: {every: 2, choices: [{bar: {kick: {steps: 12, soft: [5, 11]}}}]}
      fill: [{bar: {snare: {steps: 12, loud: [3, 6, 8], soft: [7]}, tom high: {steps: 12, loud: [9, 10]}, tom low: {steps: 12, loud: [11]}}}]
      timing: {snare: {drag: 8}}
      uneven: 7
    4:
      says: 'A large kit. The snare whispers on every upbeat, the kick never plays the same bar twice, and a fill of triplets runs the whole last bar, far behind the beat.'
      fill_every: 4
      adds: [{bar: {snare: {steps: 12, soft: [2, 5, 8, 11]}}}]
      varies: {every: 2, choices: [{bar: {kick: {steps: 12, soft: [2, 8], loud: [11]}, open: {steps: 12, loud: [11]}}}]}
      fill: [{silences: [hat, ride, hat by foot], bar: {kick: {steps: 12, loud: [0, 6]}, snare: {steps: 12, loud: [0, 1, 2], soft: [3]}, tom high: {steps: 12, loud: [4, 5, 6]}, tom mid: {steps: 12, loud: [7, 8]}, tom low: {steps: 12, loud: [9, 10, 11]}}}]
      timing: {snare: {drag: 16}, ride: {drag: 6}, hat: {drag: 6}}
      uneven: 9
  bass:
    1: {says: 'Plays the bass part exactly as written, on the beat.'}
    2: {says: 'Plays the bass part as written, leaning back a little.', timing: {drag: 6}}
    3: {says: 'Plays the bass part pushing ahead of the beat.'}
    4: {says: 'Plays the bass part far behind the beat.', timing: {drag: 14}}
  rhythm:
    1: {says: 'Plays the part exactly as written, tight and even.'}
    2: {says: 'Plays the part with a wider, slightly loose stroke.'}
    3: {says: 'Plays the part loosely, each stroke spread across the strings.', guitarify: {spread: 12, loose_timing: 12}}
    4: {says: 'Plays the part with the widest and loosest stroke.'}
  lead:
    1: {says: 'Few notes, close together, each one sung.', span: 2}
    2: {says: 'Phrases that leave room, behind the beat.', span: 3, timing: {drag: 10}}
    3: {says: 'Busy lines over a wide range.', span: 4, busy: true, timing: {drag: 6}}
    4: {says: 'The widest range and the most notes.', span: 5, busy: true}
  session:
    1: {says: 'Answers in few notes.', span: 2}
    2: {says: 'Answers that leave room.', span: 3, timing: {drag: 8}}
    3: {says: 'Busy answers.', span: 4}
    4: {says: 'Answers over the widest range.', span: 5}

sounds: {bass: 34, upright bass: 33, guitar: 28, lead guitar: 30, harmonica: 23, piano: 1, organ: 17, horns: 62, saxophone: 67, voice: 54}

sections:
  intro:
    bars: 4
    chords: [5, 4, 1, 5]
    plays: [drums, bass, comping, answers]
    plan: [{line: intro, answer: true}, {line: intro, answer: true, varied: true}]
  chorus:
    bars: 12
    plays: [drums, bass, comping, lead, answers]
    plan: [{line: a}, {line: reply, answer: true}, {line: a}, {line: reply, answer: true, varied: true}, {line: b, higher: true}, {line: close, answer: true}]
  solo:
    bars: 12
    plays: [drums, bass, comping, answers]
    plan: [{line: s1, answer: true}, {line: s2, answer: true, higher: true}, {line: s1, answer: true, varied: true}, {line: s3, answer: true, higher: true},
           {line: s4, answer: true, higher: true}, {line: s5, answer: true}]
  ending: {held: true, plays: [bass, comping]}

