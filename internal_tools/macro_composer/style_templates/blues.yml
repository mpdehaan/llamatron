    - [{rest: 2}, {steps: 1}, {steps: 1}, {steps: 1}, {steps: 1}, {steps: 3}, {steps: 3}, {steps: 3}, {steps: 6}, {rest: 3}]
    - [{rest: 3}, {steps: 3}, {steps: 2}, {steps: 1}, {steps: 3}, {steps: 2}, {steps: 1}, {steps: 6}, {rest: 3}]
