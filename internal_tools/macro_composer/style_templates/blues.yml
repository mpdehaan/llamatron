  texas shuffle:    {meter: 4/4, feel: shuffle, tempo: 128, drums: both hands shuffle, bass: boogie, chords: twelve bar quick change, comping: guitar stabs on the upbeats, lead: guitar, answers: none}
  driving shuffle:  {meter: 4/4, feel: shuffle, tempo: 150, drums: driving shuffle, bass: roots, chords: twelve bar, comping: guitar boogie, lead: voice, answers: guitar}
  slow blues:       {meter: 12/8, feel: triplets, tempo: 60, drums: slow twelve-eight, bass: slow walk, chords: twelve bar slow change, comping: piano triplets, lead: voice, answers: guitar}
  minor blues:      {meter: 12/8, feel: triplets, tempo: 66, drums: slow twelve-eight, bass: slow walk, chords: minor twelve bar, comping: organ held, lead: guitar, answers: none}
  jump blues:       {meter: 4/4, feel: swing, tempo: 170, drums: swing ride, bass: walking, chords: twelve bar with two five, comping: horn riffs, lead: voice, answers: saxophone}

