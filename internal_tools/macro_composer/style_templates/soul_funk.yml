# A style template: soul and funk. The MacroComposer's arranger reads it (internal_tools/macro_composer/arranger.py).
#
# templates   the kinds of blues: each a set of picks to start from, any of which a song may change.
# traits      what a song picks. Each trait lists its values; share is roughly how many songs in a hundred use the value, so
#             the commonest is the one recommended; needs says what another trait must be for the value to fit.
#             A drum value holds its bar, each drum's hits: loud, soft or none. A value a player plays holds its sound and
#             its figure, bars of notes written over chord one, which a Progression moves through the song's chords.
# roles       the band in track order, the chords first, then the lead and the backing, the bass, and the drums last: which
#             trait each plays, how high and how loud.
# sections    what plays in each kind of section, and the plan of its tune: which line returns and who plays each.
# melody      the habits a tune is sketched by when a song gives none: the notes used, rhythm cells, how far it ranges.
# Sixteen steps to a bar, sixteenths; twelve in 12/8. No band, label, artist or work is named or followed.

