        - {bars: [3], grid: 16, ends: [{degree: 5, steps: 1}, {degree: 6, steps: 1}]}
        - {bars: [4], grid: 16, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 6, steps: 1}, {degree: 5, steps: 1}, {degree: 3, steps: 1}]}
  rhythm:
    1: {says: 'Plays the part exactly as written, tight and even.', guitarify: {spread: 4}}
    2: {says: 'Plays the part with a wider, slightly loose stroke.', guitarify: {spread: 12, loose_timing: 8}}
    3: {says: 'Plays the part loosely, each stroke spread across the strings.', guitarify: {spread: 6}}
    4: {says: 'Plays the part with the widest and loosest stroke.', guitarify: {spread: 10, loose_timing: 14}}
  lead:
    1: {says: 'Few notes, close together.', span: 2}
    2: {says: 'Phrases that leave room, behind the beat.', span: 3, timing: {drag: 10}}
    3: {says: 'Busy lines over a wide range.', span: 4, busy: true}
    4: {says: 'The widest range and the most notes.', span: 5, busy: true, timing: {drag: 6}}
  keys:
    1: {says: 'Plays the part exactly as written.'}
    2: {says: 'Plays the part as written.'}
    3: {says: 'Plays the part pushing ahead of the beat.'}
    4: {says: 'Plays the part leaning far back.'}

