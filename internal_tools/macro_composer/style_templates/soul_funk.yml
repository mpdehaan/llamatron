        - {bars: [4], grid: 16, ends: [{degree: 5, steps: 1}, {degree: 6, steps: 1}, {degree: 1, octave: 1, steps: 2}]}
    4:
      says: 'Behind the beat. Pops the octave twice at the end of the second bar, ends the third with two notes of their own, and runs down from the octave into each turn.'
      timing: {drag: 8}
      varies:
