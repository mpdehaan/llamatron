[package]
name = "llamatron-backend"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "llamatron's backend: a daemon that plays the built-in synths and FluidSynth and sends MIDI on time"
publish = false

[lib]
name = "llamatron_backend"
path = "src/lib.rs"

[[bin]]
name = "llamatron-backend"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
rtrb = "0.3"
rmpv = "1"
rmp = "0.8"
log = "0.4"
flexi_logger = "0.29"
libc = "0.2"
rustfft = "6"
thiserror = "1"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"

[target.'cfg(not(target_os = "macos"))'.dependencies]
midir = "0.10"
