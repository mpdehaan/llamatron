[package]
name = "llamatron-tracker"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "llamatron's tracker: the text UI's pages, dialogs and keys (the Python package interface/tracker/)"
publish = false

[dependencies]
llamatron-math = { path = "../math" }
llamatron-strings = { path = "../strings" }
llamatron-model = { path = "../model" }
llamatron-engine = { path = "../engine" }
llamatron-importers = { path = "../importers" }
llamatron-backend = { path = "../backend" }
rmpv = "1"
llamatron-exporters = { path = "../exporters" }
unicode-width = "0.2"
crossterm = "0.28"
