# Ideas
#
# The user's ideas for later, kept by Claude, with what each would mean for the code: what it touches, what it
# depends on and what is still undecided. Nothing here is finished: Claude removes an idea as soon as it's built,
# without being asked, and trims the finished parts out of one that's partly built. Ideas are added when the user asks.
#
# Each idea has a title, a priority and a text. Priority 1 is the highest. The user's words are numbers here:
# high is 1, medium is 5, low is 10, and an idea the user hasn't ranked is 99. The file is kept sorted, priority 1
# at the top, and ideas of one priority keep the order they have, so the user can edit a priority or move an idea by
# hand; internal_tools/sort_ideas.sh puts the file back in order, and Claude runs it whenever the file is out of order.
# A title that starts "In progress:" is work started but not finished, which is named first when the user asks what
# to do next. Keys are described by what they do, not by their letters, since the letters change.

- title: "Bassify: a generator that plays a clip's chords as a bass player would"
  priority: 1
  text: |
    The user asks whether, beside Guitarify, a Bassify is needed and what it would do. To discuss before anything is built. Claude's
    first thoughts, to bring as proposals: a bass has no chord to strum, so its two halves would be which note of the chord is
    played and how the bar is filled. Notes: root, fifth, octave, third, an approach note a step or a half step before the next
    chord, a walk through the scale, all kept in a bass's range on four or five strings. A bar of cells as Guitarify's, with
    its own strokes: root, fifth, octave, approach, a ghost (dead) note, a slide in, a rest, and a note held or cut short.
    Ready-made bars by style: roots in eighths, root and fifth on one and three, a walking four, octaves on the off-beats, a
    reggae bar that leaves beat one empty, a funk sixteenth bar with ghosts, a gallop, an acid bar. It would let a row of chords
    become a bass line with no bass pattern written, and give the wizard's bass player a generator to set rather than notes to
    write. What it overlaps: the Progression generator already moves a figure through chords, and the wizard's bass player
    already writes lines, so the questions are whether Bassify replaces either or sits beside them, and whether a bar of
    strokes is the right picture for a bass.

- title: "A picker field's mark that is not taken for the other arrows"
  priority: 1
  text: |
    A settings field that opens a list of choices shows a dim down-pointing triangle after its value (`MSG_PICKER_MARK`). At a small
    text size, and from a distance, that mark reads like the tracker's other triangles and diamonds: the selected row's mark, the
    play mark, the flyout's mark and the keyswitch light. The user asks how a list field could be marked differently, so that
    the kind of field is still seen at a glance and is not confused with those. To discuss with pictures of the candidates at
    the size they are drawn, before anything changes; whatever is chosen changes every settings page, the mockup rules of
    `.claude/UX.md` and the screenshots.

- title: "In progress: the designs agreed with the user on 2026-11-11, to build in this order"
  priority: 1
  text: |
    What is left of the designs settled question by question with the user; each part is trimmed out
    as it is built. Examples still to come take the genres the user approved: Electronic for
    filter_sweep, idm_chaos1 to 3 and drift_berlin; Classical for drift_canon, drift_pastoral,
    chamber_music, brass_doorknob, adagio and harmonizer; Children's for row_your_boat; New age for
    newish_age and gorge; Rock for van_llama and whipping_llama; Musical theatre for retro_musical;
    Jazz for piano_trio, bigband, llama_supreme and weather; Easy listening for the_mall; Metal for
    black_midi.

    11. **The Harmonizer**. Each harmonizer is one voice: in the scale, exact half steps, voice-led,
        or later chord tones; Delay, one of the time settings with "(none)" as its default, makes a
        canon or a round; "Follow the melody's rhythm" (default) or "Keep this track's rhythm". The
        design had a Lead track field on the Scene page, overridable on the clip page; the Hocket,
        built since, names its source track on the generator instead, at the user's choice, so the
        Harmonizer might well do the same, to be asked when it's built.
        Canon, once a generator of its own, is this Delay: the clip repeated a number of steps later, moved along the scale
        and quieter, so one line becomes a round or a canon; its demo, `row_your_boat.yml`, Row, Row, Row Your Boat as a
        round, is to show how a round is edited in the tracker.
    12. **General MIDI previews in git**: the user's goal is to check `sh user_scripts/demos_to_midi.sh`'s files, with
        `previews/DEMOS.md` describing every demo, into git, so that people without a synth can hear the
        demos (not yet).
    **Demos not yet written, each about three minutes unless noted**: filter_sweep, idm_chaos1 to
    idm_chaos3, drift_canon, drift_pastoral (classical: a pastoral for strings, winds and horn in F
    major, Drift shaping dynamics and ornaments and borrowing Lydian), drift_berlin, row_your_boat,
    harmonizer; the pieces van_llama, whipping_llama (with Strum on its rhythm guitar, as van_llama),
    retro_musical, piano_trio (a jazz piano trio at a medium swing: ii–V–I changes from Progression,
    a walking bass, brushes), bigband, chamber_music, gorge, the_mall, newish_age, brass_doorknob,
    llama_supreme, black_midi and adagio (with Drift), and weather (ten minutes). Each is original
    music in the style asked, never a copy of a song.

    **After all this**: look at Numerology and Renoise online for ideas; suggest clearer names for the
    demos whose names don't say their style.

- title: "A view of a progression's chords as keyboards"
  priority: 1
  text: |
    From the user: the progression editor could have a button that shows the progression's chords as drawings, each chord listed
    with the keyboard the Chord dialog draws, the chord's keys filled, so that the changes from chord to chord can be seen. The
    view scrolls down one drawing at a time and stops at the last, never going round. Only where it makes sense: whether it does,
    and when the button can be offered (a progression's chords are numbers in whatever scale a clip plays them under, so a scale
    has to be known), is to be discussed with the user first, on its own, with a drawing by Claude, once the other ideas of the
    current work are done. What it would mean for the code: `Keyboard` and `chord_keys` in `tui/components/keyboard.py` already draw
    one chord, `ChordsEditor.in_words` names each chord in the song's scale, and an Inset Window is the read-only window the
    tracker has for looking inside things.

- title: "Mono instruments, to be discussed"
  priority: 1
  text: |
    From the user on 2026-11-11, while designing the Hocket, as a high priority discussion: a Mono
    toggle on the instrument editor, for an instrument that plays one note at a time, as a monosynth or
    a modular patch does. A Hocket hands notes to tracks that may also play notes of their own, and
    several tracks may share one instrument, so notes can overlap on an instrument that can't sound
    them together. What it needs, to discuss: whether Mono changes what is exported and played in real
    time, or only warns; which note wins when two overlap (the newest, cutting the one before, as most
    monosynths do, or the oldest, or the highest or lowest); what a chord does on a mono instrument
    (its root, its top note, or refused); whether an overlap cut short becomes a legato slide, as the
    Glide row's overlap is; whether it is judged per track or across every track sharing the
    instrument; and whether the analyzer idea below would report overlaps on a mono instrument.

- title: "Music videos from a Live set's audio, a helper script apart from the tracker"
  priority: 1
  text: |
    From the user on 2026-11-11: a spin-off mode of the project, a helper script that works
    differently from the tracker and turns a finished song into a music video for YouTube, a `.mov`
    of a visualizer playing to the song's own audio. It takes two things: the audio that Ableton Live
    renders from the song's Live set, probably AIFF, where the set may have been given any synths and
    effects in Live, and the song's MIDI files, which the script reads so that the visualizer follows
    the real notes and everything lines up with the audio. The Live set has to keep the song's
    playing time, so that the audio and the MIDI last the same.

    - **What the video shows.** The visualizer alone, full screen, with no scene bar, no clips and no
      tracker around it. It doesn't open with the splash's sine-wave letters; instead something like a
      "produced by llamatron" that flies in from the left and then fades away, its look to be designed.
    - **Where it lives.** Not in the GUI: a script run from the command line, given the audio file and
      the MIDI files.
    - **What it would mean for the code.** The visualizer modes (`visualizers/`) already draw from
      what they hear (`visualizers/heard.py`), which the script would feed from the MIDI files by
      time rather than from real-time playback; each frame drawn at a fixed rate, rendered to images
      rather than to a terminal, and joined with the audio into a `.mov` (`ffmpeg`, if installed, or
      AVFoundation on a Mac). How the visualizer's characters and big pixels become video frames, at
      what resolution, is the main thing to design.
    - **Undecided.** The audio formats taken; how the MIDI files are given (the MIDI (Stems) export,
      the single file, or the set itself); which visualizer mode, or Cycle; the intro's look and
      length; the video's size and frame rate; and what is done when the audio and the MIDI disagree
      in length.

- title: "A humanize generator"
  priority: 1
  text: |
    From the user on 2026-11-11, at the top priority. A generator, beside the arpeggiators,
    AutoRatchets and the coming Drift, that makes a part sound played by a person rather than a
    machine: small random changes to each note's velocity, its timing a little early or late, and
    perhaps its gate a little longer or shorter, each within a range the composer sets, with a seed
    like an arp's so that a take can be repeated. Drift's Vel+= with a small range does the velocity
    part slowly, trigger by trigger; humanize works note by note, which is what a player's hands do.
    What it needs: a settings class and an editor like the others, and a place in the render.
    Velocity can change on a finished clip's sounds in a chain, as generators work today, but timing
    can't: the groove moves notes in `exporters/timing.py` after the render, so humanized timing
    would either be applied there, as a per-note random groove, or the chain would need to move a
    note's start, which no generator does yet. Undecided: the ranges and their defaults, whether
    timing is in ticks, milliseconds or a share of a step, whether it stays inside a groove's cell so
    that notes keep their order, and whether a drum track wants different defaults from a melody.
    `mainstreet_hoedown.yml` is the first song it would suit.

- title: "Showing where playback is, inside the patterns, and lighting the roll"
  priority: 1
  text: |
    From the user on 2026-11-10, after hearing real-time playback for the first time, and the first
    of the high priorities.

    - **Progress through a scene shown inside the scene's patterns.** Arrange's scene bar and each
      playing clip's bar fill as read heads today; the user thinks the step that is playing can be
      shown in the patterns of the playing scene too, so that the pattern editor open on a playing pattern marks the step
      that sounds now. What it needs: the transport knows each scene's elapsed seconds
      (`scene_elapsed`), and a clip's step at a moment is the elapsed time at the scene's tempo in
      the pattern's step size, modulo the pattern's length, with the direction's order for a
      pattern that doesn't play forward; the pattern editor would ask the transport on the playback
      timer's tick, as Arrange does, and draw the step's edge or step number differently.
    - **Listen in a dialog that shows where it is in the pattern.** `L` (Listen) on the clip page
      and in the pattern editor says `listening` on the status line today. The user would consider
      a dialog, like the one above, that stays up while listening and shows the step that sounds
      now, with the same key stopping it.
    - **The piano roll lighting up, in colour.** The roll could light the note that sounds now, in
      colour, as the lights on Arrange are the one place colour is allowed today (`.claude/UX.md`,
      "Drawing"). The user wants to explore the questions about a colour mode as this is built,
      rather than settle them first: which things light, whether a colour mode is a setting, and
      what shows without colour.
    - **A key that plays and stops says what it will do.** Where a legend or the F1 dialog lists
      `L` twice, as play and as stop, the user wants the word to change with the state, so that the
      key says what pressing it does now, and `Play/Stop` as one entry only where the state can't be
      known. The legends already switch (`ClipPage` and `PatternEditor` bind `LISTEN` or
      `STOP_LISTENING` by state), so the doubled `L` is the F1 dialog, which lists every binding of
      the class, `LISTEN` and `STOP_LISTENING` both; the same goes for Arrange's `PLAY_SCENE` and
      `STOP_PLAYING`, `PLAY_CLIP` and `STOP_CLIP`. The F1 dialog would list the one that applies
      now, or one line with both words.

- title: "Info about a set on the Open page, before opening it"
  priority: 1
  text: |
    From the user on 2026-11-10. On the Open page, a key on a set's row, `I` (Info) say, opens a
    dialog that says what the file holds before you decide to open it: the set's title, its
    description (the one line saying what it plays), its author, and for each song its name, its
    tempo and its length when played. ENTER in the dialog opens the set and ESC cancels, back to the
    list, so that a look costs one key and opening after the look costs one more.

    - **What it would mean for the code.** The dialog reads the file the way the Open page already
      reads nothing: `Setlist.read_file` gives the title, description, author and each song's
      tempo, and the length comes from the same estimate Arrange uses (`tui/lengths.py`,
      `measured(song)`), which needs a `Document` of the set, so the dialog builds one in memory
      and throws it away unless ENTER keeps it, in which case opening is already done. A file that
      can't be read says so in the dialog instead, with the file's error, and a file that needs
      corrections says that it would open with corrections and how many. The dialog is a
      `MessageDialog` with two answers rather than one, ENTER open and ESC cancel, which is a
      `ConfirmDialog` whose buttons read Open and Cancel. The key goes in `keybindings.OpenPage`
      with a legend entry, and the Open page's help names it.
    - **Undecided.** Whether ENTER on a row should show the info first and ENTER again open, which
      would cost everyone a key on every open, or stay as it is with the info on its own key,
      which Claude would choose. Whether a set of several songs lists them all, or the first few
      with a count, since the dialog has to fit an 80 by 24 console.

- title: "The file picker, shared and better"
  priority: 1
  text: |
    From the user on 2026-11-10. Every file picker is one: the Open page
    (`screens/set/open_page.py`, which starts in `examples/`), the MIDI import's, and any later one, the
    same page given what files it shows and where it starts. The files people want may be far
    outside the tracker's directory, so it needs to get there quickly: a full path typed in, with
    `~` for the home directory, and perhaps recent directories and recent files. The MIDI import
    starts in the home directory until this is designed. Undecided: which of those, and how a typed
    path is reached on a page whose `/` already searches, for which Claude offered a row at the top
    of the list, "type a path", that ENTER opens a prompt on (a directory goes there, a file opens,
    a path that doesn't exist says so on the status line), a letter key, `G` (Go to path), opening
    the same prompt, or both, recommending the row, since nobody has to know a key to get around.

- title: "Accents on beats: velocity in grooves"
  priority: 1
  text: |
    We should use the time signature information of the arrangement demo to add velocity on beats.
    We should research whether we can automatically use, in a per track setting, some knowledge
    of time signature to maybe auto fill in the velocity numbers, but this can be explored seperately.

    Claude's note from 2026-11-07: this and "velocity shaping in grooves" are the same feature seen
    from two sides. A groove already repeats a row of cells from the start of the scene, so a second
    row on a groove, a velocity amount per cell, gives accents on the beats per track with no new
    concept, chosen the way grooves are now. Swing on the MPC, the Linn drums, Elektron's boxes and
    the Cirklon is timing only, and a velocity-only pattern is an accent row rather than a groove,
    which is why timing came first.

- title: "Marking the chords that fit the scale in the chord picker"
  priority: 1
  text: |
    From the user on 2026-11-08: when the pattern editor knows the one scale a pattern plays under
    (the gauge's scale, `Document.pattern_scale`, known when the pattern's uses agree on one or when
    nothing uses it and the current song has one), the chord picker on the Chord row (`ENTER`, the
    `GridChoiceDialog` laid out by `CHORD_GROUPS`) puts a check mark beside each fixed chord whose
    notes all lie in that scale from the step's note, like `✓ M` on a major chord from the root of a
    major scale. The scale chords (`5`, `3`, `7` and so on) are built from the scale, so they always
    fit and need no mark; the mark is for the named ones, `M`, `m`, `dom7` and the rest. Since a new
    song starts with `C Major` as its scale, the scale is known most of the time, and only a pattern
    played under several scales goes without the marks. What it would mean for the code: a `Chord` or
    `Scale` method that says whether a chord's notes are all in a scale, `GridChoiceDialog` taking a
    mark per option, and the Chord row working out the marks from the step's degree, accidental and
    octave. The user wants to talk this over before it's started.

- title: "New patterns from the clip page"
  priority: 1
  text: |
    From the user on 2026-11-08. `P` (Pattern) already opens a clip's pattern in the editor, from
    Arrange and from the clip page. The clip page could gain two `Button`s under its settings: one
    that adds a new pattern, assigns it to the clip and opens it, so a clip can be filled in without
    a trip to the Patterns page; and one that adds a new pattern as a copy of another, asking which
    pattern to copy in a picker and then assigning and opening it the same way. Because a pattern
    made this way is used by this clip alone, the editor knows its scale at once, from the clip's
    scene or the song. What it would mean for the code: the clip page building its buttons with
    `FieldPage.button`, `Document.add_pattern` and `copy_named` (the Patterns page's `C`) followed by
    `set_clip_slot_setting`, then opening the editor as `P` does. The user wants to talk this over
    before it's started.

- title: "More ways to munge a pattern"
  priority: 1
  text: |
    The user has tried the pattern editor's munge dialog (`M`: reverse after the cursor, reverse before
    it, reverse all, pivot around it, randomize) by hand, so the next step is to think about which
    other munges earn a place in it. Each is a `Pattern` method that rearranges or rewrites the steps
    in place, like the five there now, and the cursor stays on its step. Candidates to weigh, not
    decisions: rotate the steps left or right by one (the Cirklon's and Elektron's nudge), invert the
    degrees around the step under the cursor or around the scale's root, transpose every degree by a
    number of scale steps, double the pattern by repeating it at twice the steps or halve it, thin it
    by dropping every other note or by a probability, swap two halves, and copy one row's values from
    another pattern. Which of them belong in the munge dialog, which are really pattern generators
    (see "Pattern generators on the Patterns page", which already has notes for pattern builders, and
    "Transforms that enrich a melody") and which want a key of their own is the thing to decide.

- title: "Listening to a scene on the Scene page, and progress bars on every listen"
  priority: 2
  text: |
    The Scene page gains a way to listen to its scene, as the clip page and the pattern editor listen to theirs. Listening
    may need everything else stopped first. With it, a question to talk through with the user before anything is built:
    whether a listen shows a progress bar as it plays, and on which pages that makes sense (the clip page, the pattern
    editor, the Scene page, a picker's preview). To work out: what a scene's listen does while a song plays from Arrange,
    stop the song, refuse, or wait for the bar; whether looping clips are cut at the scene's length; and one drawing of the
    bar shared by every page that listens, the length bars' read heads on Arrange being the nearest thing there is.

    The way in would be Play and Stop buttons on the Scene page, as the clip page has.

- title: "Isorhythm: a rhythm and a series of pitches that repeat at different lengths"
  priority: 3
  text: |
    A repeating rhythm and a repeating series of pitches, each of its own length, played together so that the two drift out
    of phase and meet again only after many bars, as in medieval isorhythm. To look at first: how much already works, since a
    pattern's rows can each have a step of their own and a list generator steps through its values note by note, so a row of
    pitches of one length under a rhythm of another may need only a demo; and what is missing, such as a pattern's pitch row
    and rhythm row having lengths of their own, or a generator that deals a series of degrees to whatever notes arrive.

- title: "Canon and imitation: a track replaying another's pattern after a delay"
  priority: 3
  text: |
    A generator that replays a pattern on another track after a delay, moved up or down within the scale: rounds, stretto
    where the entries crowd closer, and phasing where the delay keeps growing a little each time round. What exists already:
    the Harmonizer's Delay repeats a clip some steps later, moved along the scale and quieter, on the same track. What would
    be new: taking the notes from another track, as the Hocket does, and a delay that changes over time. To settle: whether
    this is a new source for the Harmonizer or a generator of its own, and how Restart treats the growing delay.

- title: "Serial transforms as playback generators: inversion, retrograde, augmentation"
  priority: 3
  text: |
    Generators that turn a clip's line upside down around a note of the scale, play the line backwards, or stretch or
    squeeze the line's lengths, at playback, leaving the pattern as written, so that they chain with Voice leading and
    Progression. What exists already: Munge reverses and pivots a pattern for good in the pattern editor, and the serial
    melody style of the MacroComposer makes the forms of a row. To settle: where in a chain each belongs, what retrograde
    means for a clip that loops or is cut short by its scene, and whether inversion is by scale step or by half step.

- title: "Modal interchange for a scene: borrowing the parallel scale without rewriting patterns"
  priority: 3
  text: |
    A scene, such as a bridge, played in the parallel minor or another scale type on the same root, the patterns untouched.
    What exists already: a scene can name a scale of its own, and degrees stay degrees until the clip knows its scale, so a
    scene set to the parallel scale already borrows the whole of the scale; a step can borrow a scale type for one chord.
    What may be missing: a quick way to say "the song's scale, but minor" on a scene without making a named scale, and
    borrowing for some tracks of a scene only. Likely first a demo and a short field, then anything more.

- title: "Velocity Assist: a few named velocity levels in place of numbers"
  priority: 5
  text: |
    An easy way to enter velocity: the song defines a few important levels, say soft, normal and accent, each with its number, and a
    step's velocity is picked by switching between those levels, where today a number from 0 to 127 is typed or stepped. The levels
    live on a tab or section of the Song page called Velocity Assist, or a name like it.

    Which way a song works is the song's own setting. A song whose file says nothing about it has complex velocity, every number
    allowed, so that every file written before the feature opens and plays as it does now. A new song made in the tracker stores
    simple velocity by default, and the setting can be switched either way. Switching a song from complex velocity back to simple
    warns first, since numbers will be lost, and asks how many levels to use; the song's velocities are then fitted to that many
    levels.

    Touches: a new setting on Song with its levels (composition/, the file format, defaults for a new set), the Song page, the
    pattern editor's Velocity row (stepping and ENTER pick a level in simple mode), the piano roll if velocity is entered there,
    and undo for the switch. Playback and the exporters need no change, since a level is stored or resolved as its number.

    Undecided: whether a step stores the level's name, so that changing a level's number changes every step that uses it, or the
    number alone; how the numbers of a complex song are fitted to the levels (nearest level, or levels chosen from the numbers the
    song uses); what the default levels and their numbers are; whether generators that change velocity, such as Swell, are allowed
    to leave the levels; what the Velocity row draws for a level; and what an import from MIDI chooses.

- title: "Hiding tracks on Arrange"
  priority: 5
  text: |
    A key on the Arrange page, the hide key, opens a dialog that lists the song's tracks and lets a person hide and show each one, so that tracks a person does not need to see, such as a muted chords track or other guide tracks, take no room on the Arrange page. A hidden track still plays and is still followed, as before; hiding changes only what Arrange draws. How many tracks are hidden has to be shown somewhere on the Arrange page, so that nobody forgets tracks are there. To discuss before building: where the count shows, whether the choice is kept in the set file or only for the session, what the cursor does at a hidden track, and whether Scene View, the details view and the exports show hidden tracks. For the code: a setting of the track or of the song, the Arrange page's drawing and cursor skipping hidden columns, a new dialog, and the key's binding in tui/keybindings.py.

- title: "Sheet music and chord sheets as PDF"
  priority: 8
  text: |
    The user's idea: export a song as printed music, sheet music and chord sheets, as PDF files. Nothing of it is
    designed. What it would touch: a new kind of export beside the MIDI ones (exporters/exports.py), reading the rendered
    grid for the notes and the patterns' Chord rows and the Progression generator for the chord names, which
    tui/chord_text.py already puts in words. Undecided: whether sheet music means a staff for every track or a lead sheet
    of one track with chord symbols over it; whether a chord sheet is bars of chord names alone, by scene; what draws the
    PDF, since nothing in requirements.txt does and a new dependency is the user's to approve; how notes off the grid, a
    groove, a strum, ratchets, are written; and how repeats and scenes become bars, repeat signs and section names.

- title: "In progress: the demos as a course, agreed with the user"
  priority: 10
  text: |
    What is left:
    - The demos as a course (the user's choice): the featured songs first (edm_density, minimal_techno,
       mainstreet_hoedown and new ones), then a learning path from hello_world and the Entertainer, which uses no
       features, through each feature simplest first, the order kept in one data file that docs/DEMOS.md's tables and the
       descriptions come from; each demo's entry in docs/DEMOS.md and its set's Notes get generated "Read about it" links to
       the chapter and heading of every feature it uses (from internal_tools/demo_features.py and a map of features to
       chapters), a test failing when a link is missing or points nowhere. The examples are in examples/learning, examples/other and
       examples/by_genre (the user's choice), where the new demos go by purpose.

- title: "Digest and discuss the computer music ideas"
  priority: 15
  text: |
    `.claude/COMPUTER_MUSIC_IDEAS.yml` holds some twenty ideas from algorithmic composition, sorted by family (probability,
    grammars, rules, processes, search, rhythm and meter, import, tuning). To do with the user: check what each says of
    llamatron against the code, since the statements came from the website; discuss each family in a reply of its own; and
    decide which ideas are folded into this file with a priority, which are dropped, and which join an idea already here
    (the canons with "Canon and imitation", phasing with the same, the chord grammar and the seed browser with the wizard).
    An idea leaves that file when it is folded in or dropped.

- title: "Playing lights on the list pages"
  priority: 20
  text: |
    While a song plays in real time, the Patterns page lights a playing mark beside each pattern that a playing clip is
    playing at that moment, and the Generators and Chains pages do the same for each generator and chain that is active
    in a clip that is playing. It would use the lights Arrange already has, so that the same mark means playing everywhere.
    On the Patterns page a group's heading lights too, while any pattern of the group is playing, so that a closed group
    still shows that something inside plays.
    To work out: the transport already knows which clips play, so each list asks it which patterns, chains and generators
    those clips use, a chain counting its generators; whether a pattern reached only through a generator lights; and where
    the mark goes in a row beside the count columns.

- title: "Looping a whole scene, to tweak patterns live"
  priority: 21
  text: |
    A way to loop one whole scene in real-time playback, for changing patterns by ear as they play. While the loop is set,
    no clip's follow action runs, so the scene plays round until the loop is taken off. A scene set to loop blocks export,
    which needs a song that ends, and never blocks real-time playback. To work out: whether the loop is a setting kept in
    the set's file or a state of the tracker only; what sets it and takes it off, and how Arrange shows it; and how export
    says which scene blocks it.

    Asked before, on 2026-11-09, as a scene that loops until another is launched, where a scene's Repeat is a fixed count. To
    decide with it: whether an export ignores the loop and plays the scene's Repeat as it does now, or warns in the export
    dialog and on the command line, where this idea says the loop blocks export. For the code it would be read only by
    real-time playback and never by `SongRenderer` or the exporters. How it sits with a looping clip needs settling first,
    since a scene whose every clip loops already plays until the human starts something else, which stops an export today.

- title: "Global patterns: a song's own or the set's"
  priority: 50
  text: |
    The user's idea: a pattern normally belongs to one song, and a pattern may instead belong to the set, where every song can
    use it. Today every pattern belongs to the set and every song shares it, so this changes the model and the file format;
    Claude is to discuss its concerns and ideas with the user, with a drawing of the list of patterns and of the main screen,
    before anything is built. It has to be fitted to pattern groups, built since, which the Patterns page now lists by.

    Settled so far for the Patterns page: it lists the global patterns and the current song's own, narrowed by the search where
    one is typed; a column for global patterns is headed GLOBAL and holds a solid circle where the pattern is global; the key that
    makes a pattern global or a song's own again is named for Global; a new pattern is the current song's own. A file saved before
    the change opens with every pattern global, so nothing changes in what it means, and every demo and homage with one song
    keeps its patterns global (`.claude/PRINCIPLES.md`). The main screen's Patterns cell counts the current song's own patterns,
    the global ones and the total, like `3+2=5`; when either of the two is zero, the cell shows the one number alone.

    A pattern that stops being global: a dialog titled "Copy Pattern to Songs" lists the songs, each with how many clips of it
    play the pattern, like `in 8 clips`, with no OK button; several songs can be selected and each gets a copy of its own; it
    shows ten songs at most and scrolls, with a scroll bar drawn at the right of the list, since a set may hold fifty songs.
    Once the copies are made the global pattern is removed, and ENTER is refused while no song is marked.

    Names: each song has names of its own, so two songs may each have a pattern of one name, but a global pattern's name and
    any song's own pattern's name never match; a copy made into a song keeps the global pattern's name, which can't clash.
    Making a pattern global, or renaming one, where that rule would break opens a dialog titled "New name required, conflict in N
    song(s)", holding only the tracker's standard text field, opened on a free numbered name, and its keys, ENTER reading
    "rename/promote"; only a name free everywhere the pattern would be seen is accepted.

    The user wants generators and chains to work exactly as patterns do in all of this, a song's own or global, once Claude has
    shown it understands what that means; open there: a global chain that links a song's own generator, the order of the
    Generators page, and what the pages' columns show.

