    cc2: [60, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
  bright:
    steps: 16
    degree: [5, ~, ~, ~, ~, ~, ~, ~, 1, ~, ~, ~, ~, ~, ~, ~]
    cc1: [80, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
    cc4: [10, ~, ~, ~, ~, ~, ~, ~, 110, ~, ~, ~, ~, ~, ~, ~]
songs:
  sweeps:
    tempo: 120
    scale: C Major
    tracks:
      lead: { cc: [1, 7, 64, ~] }
      pad: { cc: [~, 7, ~, 74] }
    scenes:
      - name: swell
        tracks:
          lead: { pattern: swell, repeat: 2 }
          pad: { pattern: bright }
      - name: climb
        tracks:
          lead: { pattern: climb, repeat: 4 }
          pad: { pattern: hush, repeat: 2 }
      - name: rest
        tracks:
          lead: { pattern: hush }
