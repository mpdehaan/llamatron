title: CC sweeps
description: a set made to test the MIDI import's CCs
notes: |
  A set made to test the MIDI import (importers/): exported as one MIDI file, it sends the mod
  wheel, volume and the sustain pedal, which the import's lanes take first, and CC 74, which takes
  a lane left over.
  The mod wheel slides up and back down within a pattern and across the end of a pass, volume steps
  between values, the pedal goes down and up, a scene of rests carries a change of volume, and a
  second track sends its own volume while the first slides, so that a slide never ramps a lane it
  shouldn't. Imported again, every CC it brings in should hold the same value at every moment. It
  is test data, not music.
scales:
  C Major: { root: C, type: major }
patterns:
  swell:
    steps: 16
    degree: [1, ~, ~, ~, 3, ~, ~, ~, 5, ~, ~, ~, 3, ~, ~, ~]
    cc1: [0, ~, ~, ~, 100, ~, ~, ~, ~, ~, ~, ~, 20, ~, ~, ~]
    cc2: [100, ~, ~, ~, ~, ~, ~, ~, 90, ~, ~, ~, ~, ~, ~, ~]
    cc3: [127, ~, ~, ~, ~, ~, ~, 0, 127, ~, ~, ~, ~, ~, ~, 0]
    slide: [false, false, false, false, true, false, false, false, false, false, false, false, false, false, false, false]
  climb:
    steps: 8
    degree: [1, 2, 3, 4, 5, 6, 7, 1]
    octave: [5, 5, 5, 5, 5, 5, 5, 6]
    cc1: [10, ~, ~, ~, ~, ~, ~, 120]
    slide: [true, false, false, false, false, false, false, false]
  hush:
