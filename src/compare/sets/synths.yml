version: 1.1.1
title: Synths
description: "the documents' screenshots of the built-in synths: an instrument on each engine, and a lead using every part"
real_time: true

instruments:
  - { name: basic, kind: built_in, role: normal, sound: { engine: basic } }
  - { name: sid, kind: built_in, role: normal, sound: { engine: sid } }
  - { name: pocket, kind: built_in, role: normal, sound: { engine: pocket } }
  - { name: oh3, kind: built_in, role: normal, sound: { engine: oh3 } }
  - { name: asheville, kind: built_in, role: normal, sound: { engine: asheville } }
  - { name: mechadrum, kind: built_in, role: percussion, sound: { engine: drum } }
  - name: wobble lead
    kind: built_in
    role: normal
    sound:
      engine: basic
      volume: 60
      voices: 4
      glide: 40
      oscillators: { type: basic, oscillators: [{ waveform: saw, detune: -7 }, { waveform: pulse, detune: 7, level: 80 }, { waveform: sine, level: 50 }] }
      envelopes: [{ type: adsr, attack: 5, decay: 300, sustain: 60, release: 200 }, { type: vactrol }, { type: ar, attack: 0, release: 80 }]
      filter: { type: ladder, cutoff: 1200, resonance: 40, env_amount: 50, key_track: 50 }
      lfos: [{ "on": true, shape: triangle, speed: medium, rate_percent: 77, restart: each_note }, { "on": true, shape: sample_and_hold, speed: high, rate_percent: 80, restart: each_note }]
      matrix: [{ source: lfo1, via: none, destination: pitch, amount: 2 }, { source: lfo2, via: cc1, destination: cutoff, amount: 30 }, { source: env3, via: none, destination: pulse_width, amount: 25 }]
      effects: [{ effect: drive, curve: warm, amount: 40, mix: 70 }, { effect: bitcrush, bits: 10, rate: 16000, mix: 40 }]

  - { name: env adsr, kind: built_in, role: normal, sound: { engine: basic, envelopes: [{ type: adsr }] } }
  - { name: env ar, kind: built_in, role: normal, sound: { engine: basic, envelopes: [{ type: ar }] } }
  - { name: env asr, kind: built_in, role: normal, sound: { engine: basic, envelopes: [{ type: asr }] } }
  - { name: env sid adsr, kind: built_in, role: normal, sound: { engine: basic, envelopes: [{ type: sid_adsr }] } }
  - { name: env vactrol, kind: built_in, role: normal, sound: { engine: basic, envelopes: [{ type: vactrol }] } }
  - { name: env acid gate, kind: built_in, role: normal, sound: { engine: basic, envelopes: [{ type: acid_gate }] } }
  - { name: env chip steps, kind: built_in, role: normal, sound: { engine: basic, envelopes: [{ type: chip_steps }] } }
  - { name: filter ladder, kind: built_in, role: normal, sound: { engine: basic, filter: { type: ladder } } }
  - { name: filter multimode, kind: built_in, role: normal, sound: { engine: basic, filter: { type: multimode } } }
  - { name: filter sallen key, kind: built_in, role: normal, sound: { engine: basic, filter: { type: sallen_key } } }
  - { name: filter diode, kind: built_in, role: normal, sound: { engine: basic, filter: { type: diode } } }
  - { name: filter ota, kind: built_in, role: normal, sound: { engine: basic, filter: { type: ota } } }
  - { name: filter low pass gate, kind: built_in, role: normal, sound: { engine: basic, filter: { type: low_pass_gate } } }

songs:
  - name: synths
    tempo: 120
    tracks:
      - { name: lead, instrument: wobble lead }
    scenes:
      - name: scene-1
