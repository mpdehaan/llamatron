# A style template: soul and funk. The MacroComposer's arranger reads it (src/llamatron/macro_composer/arranger.py).
#
# templates   the kinds of blues: each a set of picks to start from, any of which a song may change.
# traits      what a song picks. Each trait lists its values; share is roughly how many songs in a hundred use the value, so
#             the commonest is the one recommended; needs says what another trait must be for the value to fit.
#             A drum value holds its bar, each drum's hits: loud, soft or none. A value a player plays holds its sound and
#             its figure, bars of notes written over chord one, which a Progression moves through the song's chords.
# roles       the band in track order, the chords first, then the lead and the backing, the bass, and the drums last: which
#             trait each plays, how high and how loud.
# sections    what plays in each kind of section, and the plan of its tune: which line returns and who plays each.
#             intensity is the most each instrument's player may open up there, 1 to 4, so that a player starts plainly and
#             saves the most for a chorus or a solo; crash is a crash on the section's first beat; picks are picks the
#             section changes, such as the cymbal the drummer rides.
# players     who each instrument's player is in this style, by complexity from 1 (plain) to 4 (the most advanced): what the
#             player says for people, and how the player decorates the kind's own parts, never replacing them: a drummer's
#             hits added to every bar (adds) or to some bars of each four-bar phrase (varies), the fill and how often it comes, timing (a
#             rush or a drag, in hundredths of a step), how uneven the hits are, a strum's width, a lead's range.
#             A player of a figure, such as the bass, varies bars of each four-bar phrase by ending them with notes
#             of their own (ends), written on a grid of so many steps to the bar and left out where the figure's grid differs.
# melody      the habits a tune is sketched by when a song gives none: the notes used, rhythm cells, how far it ranges.
#             smart holds the smart melody style's seven gauges, each from 1 to 8.
# Sixteen steps to a bar, sixteenths; twelve in 12/8. No band, label, artist or work is named or followed.

name: soul_funk
title: Soul and Funk
genre: Funk
feel: backbeat
phrase_bars: 4
# A song has a hook unless it says otherwise: the lines its sections mark as a hook are made as one.
hook: true
loudness: {drums: 100, kick: 110, snare: 108, hat: 74, open: 84, ride: 76, crash: 98, tom high: 98, tom low: 100, tamb: 72, cowbell: 78, conga high: 78, conga low: 80, rim: 86}

