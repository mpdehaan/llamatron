players:
  drums:
    1:
      says: 'A small kit. The beat by the book, the same every bar, with one fill before every eighth bar.'
      fill_every: 8
      uneven: 2
    2:
      says: 'A small kit. A little behind the beat, a soft kick before every fourth bar, and a short snare roll into each turn.'
      fill_every: 4
      varies: [{bars: [4], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, soft: [15]}}}]}]
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, loud: [4, 12, 14, 15]}}}]
      timing: {snare: {drag: 12}}
      uneven: 5
    3:
      says: 'A kit with two toms. Quiet snare notes between the loud ones, an open hat in the second bar, a kick added in the third, and the toms at each turn.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, ghost: [3, 9]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 16, loud: [14]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [11]}}}]}
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, loud: [4], soft: [7]}, tom high: {steps: 16, loud: [8, 9, 11]}, tom low: {steps: 16, loud: [12, 13, 15]}}}]
      timing: {snare: {drag: 8}}
      uneven: 8
    4:
      says: 'A kit with congas beside it. Quiet snare notes and soft congas in every bar, a small change to the kick or the hat in the second, third and fourth bars, and fills that run a whole bar. Holds back until the song opens up.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, ghost: [3, 9]}, conga high: {steps: 16, soft: [2, 10]}, conga low: {steps: 16, soft: [6, 14]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [13]}, open: {steps: 16, loud: [14]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [7]}, snare: {steps: 16, ghost: [15]}}}]}
        - {bars: [4], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 16, loud: [6]}}}]}
      fill: [{needs: {meter: 4/4}, silences: [hat, open], bar: {kick: {steps: 16, loud: [0, 10]}, snare: {steps: 16, loud: [0, 3, 4, 6], soft: [1, 5]}, tom high: {steps: 16, loud: [8, 9]}, tom mid: {steps: 16, loud: [11, 12]}, tom low: {steps: 16, loud: [13, 14, 15]}}}]
      timing: {snare: {drag: 14}, hat: {drag: 4}}
      uneven: 10
  bass:
    1: {says: 'Plays the bass part exactly as written, on the beat.'}
    2:
      says: 'Plays the bass part with two notes walking up into each turn.'
      varies:
        - {bars: [4], needs: {meter: 4/4}, grid: 16, ends: [{degree: 5, steps: 2}, {degree: 6, steps: 2}]}
        - {bars: [4], needs: {meter: 12/8}, grid: 12, ends: [{degree: 5, steps: 1}, {degree: 6, steps: 1}]}
    3:
      says: 'Pops an octave at the end of the second bar, and climbs to the octave into each turn.'
      varies:
