sections:
  intro:
    intensity: {drums: 1, bass: 2, rhythm: 2, keys: 2}
    bars: 4
    plays: [drums, bass, guitar, keys]
    plan: []
  # What the band plays after the last tune, where a song ends in stages: the intro's figure again.
  outro:
    intensity: {drums: 1, bass: 2, rhythm: 2, keys: 2}
    bars: 4
    plays: [drums, bass, guitar, keys]
    plan: []
  verse:
    intensity: {drums: 2, bass: 3, rhythm: 3, keys: 2, lead: 3}
    bars: 8
    plays: [drums, bass, guitar, keys, lead]
    plan: [{line: a}, {line: a, varied: true}, {line: a}, {line: b, higher: true}]
  chorus:
    intensity: {drums: 3, bass: 3, rhythm: 3, keys: 3, lead: 4}
    crash: true
    bars: 8
    plays: [drums, bass, guitar, keys, horns, voices, lead]
    plan: [{line: hook, hook: true, higher: true}, {line: hook, hook: true, higher: true}, {line: hook, hook: true, higher: true, varied: true}, {line: close}]
  bridge:
    intensity: {drums: 3, bass: 4, rhythm: 3, keys: 3, lead: 3}
    crash: true
    bars: 8
    plays: [drums, bass, guitar, keys, horns, lead]
    plan: [{line: m}, {line: m, varied: true}, {line: n, higher: true}, {line: n, higher: true, varied: true}]
  solo:
    crash: true
    bars: 8
    plays: [drums, bass, guitar, keys, solo]
    plan: [{line: s1, answer: true}, {line: s2, answer: true, higher: true}, {line: s1, answer: true, varied: true}, {line: s3, answer: true, higher: true}]
  ending: {held: true, plays: [bass, guitar, keys, horns]}

# The forms a song may take when it gives none, each with how common it is; a longer form has more sections, never the same form twice over.
# What the player beside the tune does in each kind of section, with a plan of its own for some subgenres, and how busy, from 0 to 20; a kind
# the plan leaves out is waited through.
interplay:
  busy: 8
  plan: {verse: fills between lines, chorus: answers every line, bridge: fills between lines}

forms:
  usual:
    - {name: with a bridge and a solo, share: 45, sections: [intro, verse, chorus, verse, chorus, bridge, solo, chorus, chorus, ending]}
    - {name: with a solo, share: 30, sections: [intro, verse, verse, chorus, verse, chorus, solo, chorus, ending]}
    - {name: short, share: 25, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
  # Each kind has the shapes its records took: verses that climb with no chorus, a groove said again and again, a long dance form.
  sixties soul:
    - {name: with a solo, share: 50, sections: [intro, verse, chorus, verse, chorus, solo, chorus, chorus, chorus, ending]}
    - {name: with a bridge, share: 30, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
    - {name: short, share: 20, sections: [intro, verse, chorus, verse, chorus, chorus, ending]}
  southern soul:
    - {name: verses with a bridge and a solo, share: 50, sections: [intro, verse, verse, bridge, verse, solo, verse, verse, ending]}
    - {name: with a chorus, share: 30, sections: [intro, verse, chorus, verse, chorus, solo, chorus, chorus, ending]}
    - {name: verses and a bridge, share: 20, sections: [intro, verse, verse, bridge, verse, verse, ending]}
  soul ballad:
    - {name: verses and a bridge twice, share: 60, sections: [intro, verse, verse, bridge, verse, bridge, verse, ending]}
    - {name: with a solo, share: 40, sections: [intro, verse, verse, bridge, verse, solo, bridge, verse, ending]}
  new orleans:
    - {name: with a solo, share: 60, sections: [intro, verse, verse, chorus, verse, solo, chorus, chorus, ending]}
    - {name: verses in a row, share: 40, sections: [intro, verse, verse, solo, verse, verse, ending]}
  funk:
    - {name: grooves with a bridge and a solo, share: 45, sections: [intro, verse, verse, bridge, verse, solo, verse, verse, ending]}
    - {name: grooves with a bridge, share: 35, sections: [intro, verse, verse, bridge, verse, verse, ending]}
    - {name: with a chorus, share: 20, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
  disco:
    - {name: with a break, share: 60, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
    - {name: long, share: 40, sections: [intro, intro, verse, chorus, verse, chorus, bridge, bridge, chorus, chorus, outro, ending]}

# What a song that asks for a plan is planned by, as rock's is: soul climbs a little, funk stays level and grows by who plays,
# the ballad climbs furthest, and the horns and the backup singers come in from an Energy up.
song_plan:
  energy: {intro: 5, outro: 6, verse: 5, chorus: 7, bridge: 6, solo: 7, ending: 7}
  growth: 1
  last_chorus: 9
  rising: []
  levels: {drums: [1, 4, 7, 9], bass: [1, 5, 7, 10], rhythm: [1, 4, 7, 10], keys: [1, 5, 7, 9], lead: [1, 3, 6, 9], session: [1, 5, 7, 9]}
  comes_in: {horns: 6, voices: 6}
  fills: {small: a snare before the bar, medium: snare sixteenths on four, big: toms down}
  tails:
    usual: [stops]
    disco: [build]

# What a kind says differently from soul and funk as a whole: how long its sections are, a refrain or a chant as the hook where
# its songs have no chorus, and its plan's numbers.
by_subgenre:
  sixties soul:
    sections: {verse: {bars: 16}}
  southern soul:
    sections: {verse: {plan: [{line: a}, {line: a, varied: true}, {line: b, higher: true}, {line: hook, hook: true}]}}
    song_plan: {energy: {intro: 3, verse: 3, chorus: 5, bridge: 5, solo: 6}, growth: 1, comes_in: {horns: 4, voices: 5}}
  soul ballad:
    # A ballad leans on its first beat and a little on its third.
    beat_loudness: [6, 0, 4, 0]
    sections: {verse: {plan: [{line: a}, {line: a, varied: true}, {line: b, higher: true}, {line: hook, hook: true}]}}
    song_plan: {energy: {intro: 2, verse: 2, bridge: 5, solo: 6}, growth: 2, comes_in: {horns: 5, voices: 5}}
  new orleans:
    sections: {verse: {bars: 12}, solo: {bars: 12}}
  funk:
    sections: {verse: {bars: 16, plan: [{line: a}, {line: hook, hook: true}, {line: a, varied: true}, {line: hook, hook: true}]}}
    # Everybody lands on the one: the drums' strokes on the first beat are louder.
    beat_loudness: [10, 0, 0, 0]
    song_plan: {energy: {intro: 6, verse: 7, chorus: 7, bridge: 8, solo: 6}, growth: 0, last_chorus: 8, fills: {small: a snare before the bar, medium: a snare before the bar, big: snare sixteenths on four}}
  disco:
    sections: {intro: {bars: 8}, verse: {bars: 16}, chorus: {bars: 16}, bridge: {bars: 16}}
    song_plan: {energy: {intro: 4, verse: 6, chorus: 8, bridge: 3}, growth: 1, rising: [bridge]}

