players:
  drums:
    1:
      says: 'Kick, snare, hats and one crash. Plays the beat by the book, the same every bar, with one extra snare before every eighth bar.'
      fill_every: 8
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 8, loud: [2, 6, 7]}}}]
      uneven: 2
    2:
      says: 'A small kit with two toms. A little behind the beat, the hat opening at the end of every second bar, a kick added in the fourth, and two toms into each turn.'
      fill_every: 4
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 8, loud: [7]}}}]}
        - {bars: [4], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}}}]}
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 8, loud: [2]}, tom high: {steps: 8, loud: [6]}, tom low: {steps: 8, loud: [7]}}}]
      timing: {snare: {drag: 10}}
      uneven: 5
    3:
      says: 'A larger kit with three toms. One quiet snare note in every bar, an extra kick in the second bar and the third, an open hat, and half a bar down the toms at each turn.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, soft: [7]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [11]}, open: {steps: 8, loud: [7]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}}}]}
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, loud: [4, 8, 10, 11]}, tom high: {steps: 16, loud: [12, 13]}, tom low: {steps: 16, loud: [14, 15]}}}]
      timing: {kick: {drag: 6}, snare: {drag: 14}}
      uneven: 6
    4:
      says: 'A very large kit. Quiet snare notes in every bar, a kick that differs in the second, third and fourth bars, open hats, and a whole bar across the toms at each turn. Holds back until the song opens up.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, soft: [7, 9]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [10]}, open: {steps: 8, loud: [7]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [3]}, snare: {steps: 16, soft: [15]}}}]}
        - {bars: [4], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 8, loud: [3]}}}]}
      fill: [{needs: {meter: 4/4}, silences: [hat, open, ride], bar: {kick: {steps: 16, loud: [0, 8]}, snare: {steps: 16, loud: [0, 2, 3], soft: [4]}, tom high: {steps: 16, loud: [5, 6, 7]}, tom mid: {steps: 16, loud: [9, 10, 11]}, tom low: {steps: 16, loud: [12, 13, 14, 15]}, splash: {steps: 16, loud: [8]}}}]
      timing: {hat: {rush: 6}, snare: {rush: 3}}
      uneven: 8
  bass:
    1: {says: 'Plays the bass part exactly as written, on the beat.'}
    2:
      says: 'Plays the bass part leaning back a little, with two notes walking up into each turn.'
      timing: {drag: 6}
      varies:
        - {bars: [4], grid: 8, ends: [{degree: 5, steps: 1}, {degree: 6, steps: 1}]}
    3:
      says: 'Pushes ahead of the beat, jumps an octave at the end of the second bar, and walks three notes up into each turn.'
      timing: {rush: 8}
      varies:
        - {bars: [2], grid: 8, ends: [{degree: 1, octave: 1, steps: 1}]}
        - {bars: [4], grid: 8, ends: [{degree: 3, steps: 1}, {degree: 5, steps: 1}, {degree: 6, steps: 1}]}
    4:
      says: 'Ends the second and third bars with notes of their own, and runs down from the octave through half of the fourth.'
      varies:
        - {bars: [2], grid: 8, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 5, steps: 1}]}
        - {bars: [3], grid: 8, ends: [{degree: 6, steps: 1}]}
        - {bars: [4], grid: 8, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 6, steps: 1}, {degree: 5, steps: 1}, {degree: 3, steps: 1}]}
  rhythm:
    1: {says: 'Plays the part exactly as written, tight and even.', guitarify: {spread: 4}}
    2: {says: 'Plays the part with a wider, slightly loose stroke.', guitarify: {spread: 14, loose_timing: 6}}
    3: {says: 'Plays the part loosely, each stroke spread across the strings.', guitarify: {spread: 10, loose_timing: 14}}
    4: {says: 'Plays the part with the widest and loosest stroke.'}
  lead:
    1: {says: 'Few notes, close together, each one sung.', span: 2}
    2: {says: 'Phrases that leave room, a little behind the beat.', span: 3, timing: {drag: 8}}
    3: {says: 'Busy lines over a wide range.', span: 4, busy: true}
    4: {says: 'The widest range and the most notes, ahead of the beat.', span: 5, busy: true, timing: {rush: 6}}
  keys:
    1: {says: 'Plays the part exactly as written.'}
    2: {says: 'Plays the part as written.'}
    3: {says: 'Plays the part pushing ahead of the beat.', timing: {rush: 8}}
    4: {says: 'Plays the part leaning far back.', timing: {drag: 14}}

