# A style template: rock. The MacroComposer's arranger reads it (src/llamatron/macro_composer/arranger.py).
#
# templates   the kinds of blues: each a set of picks to start from, any of which a song may change.
# traits      what a song picks. Each trait lists its values; share is roughly how many songs in a hundred use the value, so
#             the commonest is the one recommended; needs says what another trait must be for the value to fit.
#             A drum value holds its bar, each drum's hits: loud, soft or none. A value a player plays holds its sound and
#             its figure, bars of notes written over chord one, which a Progression moves through the song's chords.
# roles       the band in track order, the chords first, then the lead and the backing, the bass, and the drums last: which
#             trait each plays, how high and how loud.
# sections    what plays in each kind of section, and the plan of its tune: which line returns and who plays each.
#             intensity is the most each instrument's player may open up there, 1 to 4, so that a player starts plainly and
#             saves the most for a chorus or a solo; crash is a crash on the section's first beat; picks are picks the
#             section changes, such as the cymbal the drummer rides.
# players     who each instrument's player is in this style, by complexity from 1 (plain) to 4 (the most advanced): what the
#             player says for people, and how the player decorates the kind's own parts, never replacing them: a drummer's
#             hits added to every bar (adds) or to some bars of each four-bar phrase (varies), the fill and how often it comes, timing (a
#             rush or a drag, in hundredths of a step), how uneven the hits are, a strum's width, a lead's range.
#             A player of a figure, such as the bass, varies bars of each four-bar phrase by ending them with notes
#             of their own (ends), written on a grid of so many steps to the bar and left out where the figure's grid differs.
# melody      the habits a tune is sketched by when a song gives none: the notes used, rhythm cells, how far it ranges.
#             smart holds the smart melody style's seven gauges, each from 1 to 8.

# Eight steps to a bar in 4/4, eighths; six in 6/8. No band, artist or work is named or followed.

name: rock
title: Rock
genre: Rock
feel: backbeat
phrase_bars: 4
# A song has a hook unless it says otherwise: the lines its sections mark as a hook are made as one.
hook: true
loudness: {drums: 104, kick: 112, snare: 110, hat: 78, open: 84, ride: 82, crash: 102, tom high: 102, tom low: 104, tamb: 70, clap: 88, cowbell: 80}

templates:
  rock and roll: {meter: 4/4, tempo: 164, kick: one and three, snare: two and four, cymbal: ride eighths, percussion: none, bass: walking boogie, guitar: boogie, keys: piano eighths, voices: none, chords: twelve bar, lead: voice, solo: saxophone}
  british invasion:    {meter: 4/4, tempo: 138, kick: one three and the and of three, snare: two and four, cymbal: hat eighths, percussion: tambourine, bass: roots and fifths, guitar: strummed, keys: none, voices: harmony, chords: four chord, lead: voice, solo: guitar}
  folk rock:     {meter: 4/4, tempo: 120, kick: one the and of two and three, snare: two and four, cymbal: hat eighths, percussion: tambourine, bass: roots and fifths, guitar: chiming arpeggio, keys: none, voices: harmony, chords: borrowed flat seven, lead: voice, solo: guitar}
  hard rock:     {meter: 4/4, tempo: 126, kick: one and the ands of two and four, snare: two and four, cymbal: half open quarters, percussion: none, bass: roots in eighths, guitar: held power chords, keys: none, voices: none, chords: riff on one, lead: voice, solo: guitar}
  arena rock:    {meter: 4/4, tempo: 124, kick: one three and the and of three, snare: two and four, cymbal: hat eighths, percussion: none, bass: roots in eighths, guitar: downstrokes, keys: organ held, voices: harmony, chords: one five six four, lead: voice, solo: guitar}
  punk:          {meter: 4/4, tempo: 184, kick: one three and the and of three, snare: two and four, cymbal: hat eighths, percussion: none, bass: roots in eighths, guitar: downstrokes, keys: none, voices: none, chords: three chord, lead: voice, solo: none}
  new wave:      {meter: 4/4, tempo: 144, kick: every beat, snare: two and four, cymbal: hat eighths, percussion: handclaps, bass: roots in eighths, guitar: clipped offbeats, keys: organ held, voices: none, chords: four chord, lead: voice, solo: organ}
  rock ballad:   {meter: 4/4, tempo: 70, kick: one and three, snare: two and four, cymbal: hat eighths, percussion: none, bass: roots held, guitar: chiming arpeggio, keys: organ held, voices: harmony, chords: one five six four, lead: voice, solo: guitar}
  six-eight ballad: {meter: 6/8, tempo: 62, kick: one in six, snare: four in six, cymbal: hat in six, percussion: none, bass: roots in six, guitar: arpeggio in six, keys: organ held, voices: harmony, chords: four chord, lead: voice, solo: guitar}

# The harmonic family of each kind of rock, which says how common each progression is there: roots (three chords and sevenths), pop
# (the sixth chord and a borrowed flat seven), flat seven (borrowed majors and minor keys) and sixth (loops through the sixth chord).
families: {rock and roll: roots, british invasion: pop, folk rock: pop, hard rock: flat seven, arena rock: pop, punk: sixth, new wave: pop, rock ballad: pop, six-eight ballad: pop}

