# What a kind of rock says differently from rock as a whole: how long its sections are, and its plan's numbers. A fast song's verse
# is sixteen bars, rock and roll's is twelve, and each kind has its own distance between a verse and a chorus.
by_subgenre:
  rock and roll:
    # The title line that ends each verse is the hook, since most of its songs have no chorus.
    sections: {verse: {bars: 12, plan: [{line: a}, {line: b}, {line: a, varied: true}, {line: hook, hook: true}]}, solo: {bars: 12}}
    song_plan: {energy: {intro: 6, verse: 7, chorus: 8, bridge: 7, solo: 9}, last_chorus: 9}
  british invasion:
    song_plan: {energy: {verse: 5, chorus: 7, bridge: 5, solo: 7}, last_chorus: 8}
  folk rock:
    sections: {intro: {bars: 8}, verse: {bars: 16}}
    song_plan: {energy: {intro: 3, verse: 4, chorus: 6, bridge: 4, solo: 6}, last_chorus: 7}
  hard rock:
    # Hard rock is built on a riff: the guitar's chords on its accents with the low root short between them, the bass under the guitar, the kick
    # on the accents; over the home chord only, every other chord held; the first bar's second half left for the voice.
    riff: {roles: [guitar, bass], notes: chords on the accents, with chords: stays on the home chord, under the tune: leaves a gap}
    sections: {verse: {bars: 16}, solo: {bars: 16}}
    song_plan: {energy: {intro: 6, verse: 6, chorus: 8, bridge: 5, solo: 9}, last_chorus: 10}
  arena rock:
    sections: {intro: {bars: 8}, solo: {bars: 16}}
    song_plan: {energy: {verse: 3, pre-chorus: 6, chorus: 8, bridge: 4, solo: 8}, last_chorus: 10}
  punk:
    sections: {verse: {bars: 16}}
    song_plan: {energy: {intro: 7, verse: 7, chorus: 9, bridge: 6, solo: 8}, growth: 0, last_chorus: 9}
  new wave:
    sections: {intro: {bars: 8}, verse: {bars: 16}}
    song_plan: {energy: {verse: 5, chorus: 7, bridge: 5, solo: 7}, last_chorus: 8}
  rock ballad:
    # A ballad leans on its first beat and a little on its third.
    beat_loudness: [6, 0, 4, 0]
    sections: {solo: {bars: 16}}
    song_plan: {energy: {intro: 2, verse: 3, chorus: 7, bridge: 4, solo: 9}, last_chorus: 10}
  six-eight ballad:
    song_plan: {energy: {intro: 2, verse: 3, chorus: 7, bridge: 4, solo: 9}, last_chorus: 10}

