# What stands in for a player whose own sound General MIDI plays poorly, by subgenre: the singer's hummed voice gives way to a
# sound that carries a tune, heavier where the music is. The player stays the singer. Hard rock and punk keep the voice, so
# that the tune is heard apart from their two distorted guitars.
stand_ins:
  lead: {rock and roll: overdriven guitar, british invasion: clean guitar, folk rock: clean guitar, arena rock: overdriven guitar, new wave: square lead, rock ballad: clean guitar}

sounds: {square lead: 81, bass: 34, picked bass: 35, guitar: 26, clean guitar: 28, overdriven guitar: 30, distortion guitar: 31, lead guitar: 31, piano: 1, organ: 19, saxophone: 67, voice: 54, voices: 53}

sections:
  intro:
    intensity: {drums: 1, bass: 1, rhythm: 2, keys: 1, lead: 2}
    bars: 4
    plays: [drums, bass, guitar]
    plan: []
  # What the band plays after the last tune, where a song ends in stages: the intro's figure again.
  outro:
    intensity: {drums: 1, bass: 1, rhythm: 2, keys: 1, lead: 2}
    bars: 4
    plays: [drums, bass, guitar]
    plan: []
  verse:
    intensity: {drums: 2, bass: 2, rhythm: 2, keys: 2, lead: 3}
    bars: 8
    plays: [drums, bass, guitar, lead]
    plan: [{line: a}, {line: b}, {line: a, varied: true}, {line: c}]
  chorus:
    intensity: {drums: 3, bass: 3, rhythm: 3, keys: 3, lead: 3}
    crash: true
    picks: {cymbal: ride eighths}
    bars: 8
    plays: [drums, bass, guitar, keys, voices, lead]
    plan: [{line: hook, hook: true, higher: true}, {line: hook, hook: true, higher: true, varied: true}, {line: hook, hook: true, higher: true}, {line: close}]
  # A short ramp into the chorus: chords that keep away from home and end wanting it, the tune climbing.
  pre-chorus:
    intensity: {drums: 3, bass: 2, rhythm: 3, keys: 2, lead: 3}
    picks: {cymbal: hat half open}
    bars: 4
    chords: [4, 4, 5, 5]
    plays: [drums, bass, guitar, keys, lead]
    plan: [{line: p}, {line: p, higher: true, varied: true}]
    # Other shapes a pre-chorus may take, each a plan of its lines, chosen for a section by name.
    shapes:
      holds back: [{line: p}, {line: p, varied: true}]
      two ideas: [{line: p}, {line: q, higher: true}]
  bridge:
    intensity: {drums: 3, bass: 3, rhythm: 3, keys: 3, lead: 3}
    crash: true
    picks: {cymbal: hat quarters}
    bars: 8
    plays: [drums, bass, guitar, keys, lead]
    plan: [{line: m}, {line: m, varied: true}, {line: n, higher: true}, {line: n, higher: true, varied: true}]
    shapes:
      one idea climbing: [{line: m}, {line: m, varied: true}, {line: m, higher: true}, {line: m, higher: true, varied: true}]
      four ideas: [{line: m}, {line: n}, {line: o, higher: true}, {line: r, higher: true}]
      around the hook: [{line: m}, {line: hook, hook: true}, {line: m, varied: true}, {line: n, higher: true}]
  solo:
    crash: true
    picks: {cymbal: hat half open}
    bars: 8
    plays: [drums, bass, guitar, keys, solo]
    plan: [{line: s1, answer: true}, {line: s2, answer: true, higher: true}, {line: s1, answer: true, varied: true}, {line: s3, answer: true, higher: true}]
    # Other shapes a solo may take: one idea worked over, a climb with a new idea each line, and a solo that starts from the song's hook.
    shapes:
      theme and variations: [{line: s1, answer: true}, {line: s1, answer: true, varied: true}, {line: s1, answer: true, higher: true}, {line: s1, answer: true, higher: true, varied: true}]
      climbs: [{line: s1, answer: true}, {line: s2, answer: true}, {line: s3, answer: true, higher: true}, {line: s4, answer: true, higher: true}]
      starts from the hook: [{line: hook, hook: true, answer: true}, {line: s1, answer: true, higher: true}, {line: hook, hook: true, answer: true, varied: true}, {line: s2, answer: true, higher: true}]
      a repeated figure: [{line: r1, answer: true}, {line: r1, answer: true}, {line: r1, answer: true, higher: true}, {line: r1, answer: true, higher: true, varied: true}]
      at the peak: [{line: p1, answer: true, higher: true}, {line: p1, answer: true, higher: true, varied: true}, {line: p2, answer: true, higher: true}, {line: p2, answer: true, higher: true, varied: true}]
    # A solo is staged: each solo after a song's first takes the next of these shapes, with ideas of its own, so that no two solos are alike.
    staged: true
  # The drummer alone: a theme, the theme moved round the kit, a build, a peak, and a last bar that plays the band back in.
  drum solo: {bars: 8, plays: [drums], drum_solo: true, plan: []}
  ending: {held: true, plays: [bass, guitar, keys]}

# What a song that asks for a plan is planned by. Each kind of section has an Energy from 1 to 10, a kind that returns gaining
# a little each time and the last chorus taking the most; a rising kind grows louder through its bars and leaves with a build.
# Each player reaches the next level of their own playing at Energies of their own, so that the band never changes all at once,
# and some players come in only from an Energy up. The cymbal goes from fewer closed strokes to open ones and then to the ride.
# The fills are sized by how far the Energy rises into the next section. The tails are what a subgenre's band does together in a
# last bar, and a subgenre named under no_setup never has its last bar's chord changed to lead into the next section.
song_plan:
  energy: {intro: 4, outro: 5, verse: 4, pre-chorus: 6, chorus: 8, bridge: 5, solo: 8, drum solo: 7, ending: 8}
  growth: 1
  last_chorus: 10
  rising: [pre-chorus]
  levels: {drums: [1, 4, 7, 9], bass: [1, 5, 7, 10], rhythm: [1, 4, 6, 9], keys: [1, 6, 8, 10], lead: [1, 3, 6, 9], session: [1, 5, 8, 10]}
  comes_in: {keys: 5, voices: 8}
  cymbal: [[1, hat quarters], [4, hat eighths], [7, hat half open], [9, ride eighths]]
  fills: {small: toms on four, medium: snare and toms, big: snare on every eighth of the last half}
  # A marker ends a phrase inside a section where no fill is played: a stroke or two laid over the bar.
  marker: {tom low: [none, none, none, none, none, none, none, soft]}
  tails:
    usual: [drop-out, stops, build]
    punk: [stops]
    new wave: [build]
    rock and roll: [stops]
  no_setup: [punk]

# The forms a song may take when it gives none, each with how common it is; a longer form has more sections, never the same form twice over.
# What the player beside the tune does in each kind of section, with a plan of its own for some subgenres, and how busy, from 0 to 20; a kind
# the plan leaves out is waited through.
interplay:
  busy: 8
  plan: {verse: fills between lines, chorus: plays the hook with the tune, bridge: answers every line}
  by_subgenre:
    hard rock: {verse: plays a riff under the tune, chorus: plays a riff under the tune, bridge: fills between lines}
    folk rock: {verse: waits, chorus: fills between lines, bridge: fills between lines}

