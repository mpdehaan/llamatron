# A band with one guitarist, who plays the chords and takes the solo: the player of the chords, the player of the solo and the
# way the solo is then played. The chords stop where the solo plays.
one_guitarist: {chords: guitar, solo: solo, way: guitar, title: guitar}

players:
  drums:
    1:
      says: 'A small kit. The beat by the book, the same every bar, with one fill before every eighth bar.'
      fill_every: 8
      uneven: 2
    2:
      says: 'A small kit. A little behind the beat, a kick added before every fourth bar, and two snares into each turn.'
      fill_every: 4
      varies: [{bars: [4], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}}}]}]
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 8, loud: [2, 6, 7]}}}]
      timing: {snare: {drag: 10}}
      uneven: 5
    3:
      says: 'A kit with two toms. A quiet snare note before the third beat, an open hat in the second bar, a kick added in the third, and the toms at each turn.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, ghost: [7]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 8, loud: [7]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}}}]}
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 8, loud: [2, 4, 5]}, tom high: {steps: 8, loud: [6]}, tom low: {steps: 8, loud: [7]}}}]
      uneven: 6
    4:
      says: 'A kit with three toms. A quiet snare note in every bar, a small change to the kick or the hat in the second, third and fourth bars, and a whole bar down the toms at each turn, pushing ahead. Holds back until the song opens up.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, ghost: [7]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [10]}, open: {steps: 8, loud: [7]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}, snare: {steps: 16, ghost: [11]}}}]}
        - {bars: [4], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 8, loud: [3]}}}]}
      fill: [{needs: {meter: 4/4}, silences: [hat, ride], bar: {kick: {steps: 16, loud: [0, 8]}, snare: {steps: 16, loud: [0, 2, 3, 4]}, tom high: {steps: 16, loud: [6, 7, 8]}, tom mid: {steps: 16, loud: [10, 11]}, tom low: {steps: 16, loud: [12, 14, 15]}}}]
      timing: {hat: {rush: 6}}
      uneven: 8
  bass:
    1: {says: 'Plays the bass part exactly as written, on the beat.'}
    2:
      says: 'Plays the bass part with two notes walking up into each turn.'
      varies:
        - {bars: [4], needs: {meter: 4/4}, grid: 8, ends: [{degree: 5, steps: 1}, {degree: 6, steps: 1}]}
        - {bars: [4], needs: {meter: 3/4}, grid: 6, ends: [{degree: 5, steps: 1}, {degree: 6, steps: 1}]}
    3:
      says: 'Ends the second bar with two notes of their own, and walks three notes up into each turn.'
      varies:
        - {bars: [2], needs: {meter: 4/4}, grid: 8, ends: [{degree: 3, steps: 1}, {degree: 5, steps: 1}]}
        - {bars: [4], needs: {meter: 4/4}, grid: 8, ends: [{degree: 3, steps: 1}, {degree: 5, steps: 1}, {degree: 6, steps: 1}]}
        - {bars: [2], needs: {meter: 3/4}, grid: 6, ends: [{degree: 1, octave: 1, steps: 1}]}
        - {bars: [4], needs: {meter: 3/4}, grid: 6, ends: [{degree: 3, steps: 1}, {degree: 5, steps: 1}, {degree: 6, steps: 1}]}
    4:
      says: 'A little ahead of the beat. Ends the second and third bars with notes of their own, and runs down from the octave through half of the fourth.'
      timing: {rush: 4}
      varies:
        - {bars: [2], needs: {meter: 4/4}, grid: 8, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 6, steps: 1}]}
        - {bars: [3], needs: {meter: 4/4}, grid: 8, ends: [{degree: 5, steps: 1}, {degree: 3, steps: 1}]}
        - {bars: [4], needs: {meter: 4/4}, grid: 8, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 6, steps: 1}, {degree: 5, steps: 1}, {degree: 3, steps: 1}]}
        - {bars: [2], needs: {meter: 3/4}, grid: 6, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 5, steps: 1}]}
        - {bars: [3], needs: {meter: 3/4}, grid: 6, ends: [{degree: 6, steps: 1}, {degree: 5, steps: 1}]}
        - {bars: [4], needs: {meter: 3/4}, grid: 6, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 6, steps: 1}, {degree: 5, steps: 1}, {degree: 3, steps: 1}, {degree: 2, steps: 1}, {degree: 1, steps: 1}]}
  rhythm:
    1: {says: 'Plays the part exactly as written, tight and even.', guitarify: {spread: 4}}
    2:
      says: 'Plays the part with a wider, slightly loose stroke, and adds two strokes into each turn.'
      guitarify: {spread: 12, loose_timing: 6}
      varies:
        - {bars: [4], needs: {meter: 4/4}, grid: 8, ends: [{degree: 1, chord: '3', steps: 1}, {degree: 1, chord: '3', steps: 1}]}
        - {bars: [4], needs: {meter: 3/4}, grid: 6, ends: [{degree: 1, chord: '3', steps: 1}, {degree: 1, chord: '3', steps: 1}]}
    3:
      says: 'Plays the part loosely, each stroke spread across the strings, with a stroke pushed in at the end of the second bar and a run of strokes into each turn.'
      guitarify: {spread: 24, loose_timing: 16}
      varies:
        - {bars: [2], needs: {meter: 4/4}, grid: 8, ends: [{degree: 1, chord: '3', steps: 1}]}
