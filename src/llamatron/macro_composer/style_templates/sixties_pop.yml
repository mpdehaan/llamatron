  baroque:      {meter: 4/4, tempo: 100, drums: restrained, percussion: none, bass: roots and fifths, guitar: none, keys: harpsichord broken, colour: strings, voices: block harmony, chords: falling bass, lead: voice, solo: oboe}
  soul pop:     {meter: 4/4, tempo: 122, drums: snare on every beat, percussion: tambourine on two and four, bass: melodic and busy, guitar: chops on two and four, keys: piano eighths, colour: horns, voices: answering, chords: one and four, lead: voice, solo: saxophone}
  big studio:   {meter: 4/4, tempo: 112, drums: baion, percussion: tambourine in eighths, bass: roots and fifths, guitar: strummed, keys: piano eighths, colour: strings, voices: block harmony, chords: doo-wop, lead: voice, solo: saxophone}
  bubblegum:    {meter: 4/4, tempo: 132, drums: bouncing, percussion: handclaps, bass: roots in eighths, guitar: strummed, keys: organ stabs, colour: none, voices: answering, chords: three chord, lead: voice, solo: organ}
  folk pop:     {meter: 4/4, tempo: 118, drums: gentle, percussion: tambourine in eighths, bass: roots and fifths, guitar: chiming arpeggio, keys: none, colour: none, voices: block harmony, chords: modal, lead: voice, solo: harmonica}
  waltz ballad: {meter: 3/4, tempo: 96, drums: waltz, percussion: none, bass: root then rest, guitar: none, keys: harpsichord in three, colour: strings, voices: block harmony, chords: falling bass, lead: voice, solo: oboe}

