    - {value: bouncing, share: 8, needs: {meter: 4/4}, bar: {kick: [loud, none, none, none, loud, loud, none, none], snare: [none, none, loud, none, none, none, loud, none], hat: [loud, soft, loud, soft, loud, soft, loud, soft]}}
