      share: 32
      sound: bass
      figure:
        - [{degree: 1, steps: 3}, {degree: 1, steps: 1}, {degree: 5, steps: 3}, {degree: 5, steps: 1}]
      # A verse leaves space, on the root and the fifth alone; a chorus moves, with the octave at the bar's end and a walk in every second bar.
      by_section:
        verse:
          figure:
            - [{degree: 1, steps: 3}, {rest: 1}, {degree: 5, steps: 3}, {rest: 1}]
        chorus:
          figure:
            - [{degree: 1, steps: 3}, {degree: 1, steps: 1}, {degree: 5, steps: 2}, {degree: 5, steps: 1}, {degree: 1, octave: 1, steps: 1}]
            - [{degree: 1, steps: 3}, {degree: 1, steps: 1}, {degree: 5, steps: 2}, {degree: 6, steps: 1}, {degree: 7, steps: 1}]
    - value: walking down
