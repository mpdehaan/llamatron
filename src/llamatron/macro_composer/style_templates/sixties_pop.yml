    - {value: baion, share: 12, needs: {meter: 4/4}, bar: {kick: [loud, none, none, loud, loud, none, none, none], snare: [none, none, none, none, none, none, loud, none], hat: [loud, none, loud, none, loud, none, loud, none]}}
