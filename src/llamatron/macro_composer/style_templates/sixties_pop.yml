sections:
  intro:
    intensity: {drums: 1, bass: 1, rhythm: 2, keys: 2, lead: 2}
    bars: 4
    plays: [drums, bass, guitar, keys, colour]
    plan: []
  # What the band plays after the last tune, where a song ends in stages: the intro's figure again.
  outro:
    intensity: {drums: 1, bass: 1, rhythm: 2, keys: 2, lead: 2}
    bars: 4
    plays: [drums, bass, guitar, keys, colour]
    plan: []
  verse:
    intensity: {drums: 2, bass: 2, rhythm: 2, keys: 2, lead: 3}
    bars: 8
    plays: [drums, bass, guitar, keys, lead]
    plan: [{line: a}, {line: a, varied: true}, {line: b, higher: true}, {line: a, varied: true}]
  chorus:
    intensity: {drums: 3, bass: 3, rhythm: 3, keys: 3, lead: 4}
    crash: true
    bars: 8
    plays: [drums, bass, guitar, keys, colour, voices, lead]
    plan: [{line: hook, hook: true, higher: true}, {line: hook, hook: true, higher: true, varied: true}, {line: hook, hook: true, higher: true}, {line: close}]
  bridge:
    intensity: {drums: 2, bass: 3, rhythm: 2, keys: 3, lead: 3}
    bars: 8
    plays: [drums, bass, keys, colour, lead]
    plan: [{line: m}, {line: m, varied: true}, {line: n, higher: true}, {line: o}]
  solo:
    crash: true
    bars: 8
    plays: [drums, bass, guitar, keys, solo]
    plan: [{line: s1, answer: true}, {line: s1, answer: true, varied: true}, {line: s2, answer: true, higher: true}, {line: s1, answer: true, varied: true}]
    shapes:
      theme and variations: [{line: s1, answer: true}, {line: s1, answer: true, varied: true}, {line: s1, answer: true, higher: true}, {line: s1, answer: true, higher: true, varied: true}]
      climbs: [{line: s1, answer: true}, {line: s2, answer: true}, {line: s3, answer: true, higher: true}, {line: s4, answer: true, higher: true}]
      a repeated figure: [{line: r1, answer: true}, {line: r1, answer: true}, {line: r1, answer: true, higher: true}, {line: r1, answer: true, higher: true, varied: true}]
      at the peak: [{line: p1, answer: true, higher: true}, {line: p1, answer: true, higher: true, varied: true}, {line: p2, answer: true, higher: true}, {line: p2, answer: true, higher: true, varied: true}]
    # A solo is staged: each solo after a song's first takes the next of these shapes, with ideas of its own, so that no two solos are alike.
    staged: true
  ending: {held: true, plays: [bass, guitar, keys, colour, voices]}

# The forms a song may take when it gives none, each with how common it is; a longer form has more sections, never the same form twice over.
# What the player beside the tune does in each kind of section, with a plan of its own for some subgenres, and how busy, from 0 to 20; a kind
# the plan leaves out is waited through.
interplay:
  busy: 6
  plan: {verse: fills between lines, chorus: plays the hook with the tune, bridge: answers every line}

forms:
  usual:
    - {name: with a bridge and a break, share: 45, sections: [intro, verse, chorus, verse, chorus, bridge, solo, chorus, chorus, ending]}
    - {name: with a break, share: 30, sections: [intro, verse, verse, chorus, verse, chorus, solo, chorus, ending]}
    - {name: short, share: 25, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
  # Each kind has the shapes its records took: short songs, a break of the colour instrument, and the chorus again to close.
  sunshine:
    - {name: with a bridge and a break, share: 50, sections: [intro, verse, chorus, verse, chorus, bridge, solo, chorus, chorus, ending]}
    - {name: with a bridge, share: 30, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
    - {name: with a break, share: 20, sections: [intro, verse, chorus, verse, chorus, solo, chorus, chorus, ending]}
  baroque:
    - {name: verses and a bridge twice, share: 55, sections: [intro, verse, verse, bridge, verse, solo, bridge, verse, outro, ending]}
    - {name: with a chorus, share: 25, sections: [intro, verse, chorus, verse, chorus, solo, chorus, outro, ending]}
    - {name: verses and a bridge, share: 20, sections: [intro, verse, verse, bridge, verse, outro, ending]}
  soul pop:
    - {name: with a break, share: 50, sections: [intro, verse, chorus, verse, chorus, solo, chorus, chorus, chorus, ending]}
    - {name: with a bridge, share: 30, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
    - {name: short, share: 20, sections: [intro, verse, chorus, verse, chorus, chorus, ending]}
  big studio:
    - {name: two verses first and a break, share: 50, sections: [intro, verse, verse, chorus, verse, chorus, solo, chorus, chorus, ending]}
    - {name: with a bridge, share: 30, sections: [intro, verse, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
    - {name: short, share: 20, sections: [intro, verse, chorus, verse, chorus, chorus, ending]}
  bubblegum:
    - {name: chorus first with a break, share: 50, sections: [intro, chorus, verse, chorus, verse, chorus, solo, chorus, chorus, ending]}
    - {name: with a break, share: 30, sections: [intro, verse, chorus, verse, chorus, solo, chorus, chorus, ending]}
    - {name: chorus first, share: 20, sections: [intro, chorus, verse, chorus, verse, chorus, chorus, ending]}
  folk pop:
    - {name: with a break, share: 45, sections: [intro, verse, chorus, verse, chorus, solo, verse, chorus, outro, ending]}
    - {name: verse and chorus, share: 35, sections: [intro, verse, chorus, verse, chorus, chorus, ending]}
    - {name: with a bridge, share: 20, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, ending]}
  waltz ballad:
    - {name: verses and a bridge twice, share: 50, sections: [intro, verse, verse, bridge, verse, solo, bridge, verse, ending]}
    - {name: verses and a bridge, share: 50, sections: [intro, verse, verse, bridge, verse, ending]}

# What a song that asks for a plan is planned by, as rock's is: a narrower range than rock's, short fills, and stops as the one
# thing the band does together in a last bar.
song_plan:
  energy: {intro: 4, outro: 5, verse: 4, chorus: 7, bridge: 5, solo: 6, ending: 6}
  growth: 1
  last_chorus: 8
  rising: []
  levels: {drums: [1, 4, 7, 10], bass: [1, 4, 6, 9], rhythm: [1, 4, 6, 9], keys: [1, 5, 7, 9], lead: [1, 3, 6, 9], session: [1, 5, 7, 9]}
  comes_in: {voices: 5, colour: 6}
  fills: {small: two snares before the bar, medium: two snares before the bar, big: snare and toms}
  # A marker ends a phrase inside a section where no fill is played: a stroke or two laid over the bar.
  marker: {snare: [none, none, none, none, none, none, none, soft]}
  tails:
    usual: [stops]
    big studio: [stops, build]

# What a kind says differently from sixties pop as a whole: how long its sections are, and its plan's numbers.
by_subgenre:
  soul pop:
    sections: {verse: {bars: 16}}
  folk pop:
    sections: {verse: {bars: 16}}
  big studio:
    song_plan: {energy: {verse: 4, chorus: 8, solo: 5}, last_chorus: 10}
  # A kind whose songs seldom have a chorus says its hook as the refrain that ends each verse, and a kind that stays quiet
  # reaches each player's busier playing at lower Energies, so that its narrow range still spans them.
  baroque:
    sections: {verse: {plan: [{line: a}, {line: a, varied: true}, {line: b, higher: true}, {line: hook, hook: true}]}, bridge: {plays: [drums, bass, keys, colour, voices, lead]}}
    song_plan: {energy: {verse: 3, chorus: 5, bridge: 5, solo: 5}, last_chorus: 6, levels: {drums: [1, 3, 5, 6], bass: [1, 3, 4, 6], rhythm: [1, 3, 4, 6], keys: [1, 3, 5, 6], lead: [1, 3, 4, 6], session: [1, 3, 5, 6]}}
  waltz ballad:
    sections: {verse: {bars: 16, plan: [{line: a}, {line: a, varied: true}, {line: b, higher: true}, {line: hook, hook: true}]}, bridge: {plays: [drums, bass, keys, colour, voices, lead]}}
    song_plan: {energy: {verse: 3, chorus: 5, bridge: 5, solo: 5}, last_chorus: 6, levels: {drums: [1, 3, 5, 6], bass: [1, 3, 4, 6], rhythm: [1, 3, 4, 6], keys: [1, 3, 5, 6], lead: [1, 3, 4, 6], session: [1, 3, 5, 6]}}
  # Bubblegum and sunshine pop bounce on their eighths.
  bubblegum:
    groove: 8th swing 58
    song_plan: {energy: {verse: 6, chorus: 8}, growth: 0}
  sunshine:
    groove: 8th swing 58

