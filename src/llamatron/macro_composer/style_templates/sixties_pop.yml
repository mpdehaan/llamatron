  soul pop:     {meter: 4/4, tempo: 122, drums: snare on every beat, percussion: tambourine on two and four, bass: melodic and busy, guitar: chops on two and four, keys: piano eighths, colour: horns, voices: answering, chords: doo-wop, lead: voice, solo: saxophone}
