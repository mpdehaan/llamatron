  - {role: keys, player: keys, trait: keys, octave: 4, velocity: 76}
  - {role: colour, player: session, trait: colour, octave: 5, velocity: 78}
  - {role: lead, player: lead, trait: lead, octave: 4, velocity: 106}
  - {role: voices, player: session, trait: voices, octave: 4, velocity: 82}
  - {role: solo, player: session, trait: solo, octave: 5, velocity: 100, answers: true}
  - {role: bass, player: bass, trait: bass, octave: 2, velocity: 102}
  - {role: drums, player: drums, drums: [drums, percussion]}

players:
  drums:
    1:
      says: 'A small kit. The beat by the book, the same every bar, with one fill before every eighth bar.'
      fill_every: 8
      uneven: 2
    2:
      says: 'A small kit. A little behind the beat, a kick added before every fourth bar, and two snares into each turn.'
      fill_every: 4
      varies: [{bars: [4], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}}}]}]
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 8, loud: [2, 6, 7]}}}]
      timing: {snare: {drag: 10}}
      uneven: 5
    3:
      says: 'A kit with two toms. A quiet snare note before the third beat, an open hat in the second bar, a kick added in the third, and the toms at each turn.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, soft: [7]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 8, loud: [7]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}}}]}
      fill: [{needs: {meter: 4/4}, bar: {snare: {steps: 8, loud: [2, 4, 5]}, tom high: {steps: 8, loud: [6]}, tom low: {steps: 8, loud: [7]}}}]
      uneven: 6
    4:
      says: 'A kit with three toms. A quiet snare note in every bar, a small change to the kick or the hat in the second, third and fourth bars, and a whole bar down the toms at each turn, pushing ahead. Holds back until the song opens up.'
      fill_every: 4
      adds: [{needs: {meter: 4/4}, bar: {snare: {steps: 16, soft: [7]}}}]
      varies:
        - {bars: [2], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 16, loud: [10]}, open: {steps: 8, loud: [7]}}}]}
        - {bars: [3], choices: [{needs: {meter: 4/4}, bar: {kick: {steps: 8, loud: [7]}, snare: {steps: 16, soft: [11]}}}]}
        - {bars: [4], choices: [{needs: {meter: 4/4}, bar: {open: {steps: 8, loud: [3]}}}]}
      fill: [{needs: {meter: 4/4}, silences: [hat, ride], bar: {kick: {steps: 16, loud: [0, 8]}, snare: {steps: 16, loud: [0, 2, 3, 4]}, tom high: {steps: 16, loud: [6, 7, 8]}, tom mid: {steps: 16, loud: [10, 11]}, tom low: {steps: 16, loud: [12, 14, 15]}}}]
      timing: {hat: {rush: 6}}
      uneven: 8
  bass:
    1: {says: 'Plays the bass part exactly as written, on the beat.'}
    2:
      says: 'Plays the bass part with two notes walking up into each turn.'
      varies:
        - {bars: [4], grid: 8, ends: [{degree: 5, steps: 1}, {degree: 6, steps: 1}]}
    3:
      says: 'Ends the second bar with two notes of their own, and walks three notes up into each turn.'
      varies:
        - {bars: [2], grid: 8, ends: [{degree: 3, steps: 1}, {degree: 5, steps: 1}]}
        - {bars: [4], grid: 8, ends: [{degree: 3, steps: 1}, {degree: 5, steps: 1}, {degree: 6, steps: 1}]}
    4:
      says: 'A little ahead of the beat. Ends the second and third bars with notes of their own, and runs down from the octave through half of the fourth.'
      timing: {rush: 4}
      varies:
        - {bars: [2], grid: 8, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 6, steps: 1}]}
        - {bars: [3], grid: 8, ends: [{degree: 5, steps: 1}, {degree: 3, steps: 1}]}
        - {bars: [4], grid: 8, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 6, steps: 1}, {degree: 5, steps: 1}, {degree: 3, steps: 1}]}
  rhythm:
    1: {says: 'Plays the part exactly as written, tight and even.', guitarify: {spread: 4}}
    2: {says: 'Plays the part with a wider, slightly loose stroke.', guitarify: {spread: 12, loose_timing: 6}}
    3: {says: 'Plays the part loosely, each stroke spread across the strings.', guitarify: {spread: 24, loose_timing: 16}}
    4: {says: 'Plays the part with the widest and loosest stroke.'}
  lead:
    1: {says: 'Few notes, close together.', span: 2}
    2: {says: 'A tune that leaves room, a little behind the beat.', span: 4, timing: {drag: 6}}
    3: {says: 'A tune over a wide range.', span: 4}
    4: {says: 'The widest range and the most notes.', span: 5, busy: true}
  keys:
    1: {says: 'Plays the part exactly as written.'}
    2: {says: 'Plays the part as written.'}
    3: {says: 'Plays the part pushing ahead of the beat.'}
    4: {says: 'Plays the part leaning far back.'}

sounds: {bass: 34, picked bass: 35, guitar: 26, clean guitar: 28, solo guitar: 28, organ: 19, solo organ: 17, piano: 1, harpsichord: 7, strings: 49, horns: 62, flute: 74, solo flute: 75, oboe: 69, harmonica: 23, saxophone: 67, voice: 54, voices: 53}

sections:
  intro:
    intensity: {drums: 1, bass: 1, rhythm: 2, keys: 2, lead: 2}
    bars: 4
    plays: [drums, bass, guitar, keys, colour]
    plan: []
  verse:
    intensity: {drums: 2, bass: 2, rhythm: 2, keys: 2, lead: 3}
    bars: 8
    plays: [drums, bass, guitar, keys, lead]
    plan: [{line: a}, {line: a, varied: true}, {line: b, higher: true}, {line: a, varied: true}]
  chorus:
    intensity: {drums: 3, bass: 3, rhythm: 3, keys: 3, lead: 4}
    crash: true
    bars: 8
    plays: [drums, bass, guitar, keys, colour, voices, lead]
    plan: [{line: hook, higher: true}, {line: hook, higher: true, varied: true}, {line: hook, higher: true}, {line: close}]
  bridge:
    intensity: {drums: 2, bass: 3, rhythm: 2, keys: 3, lead: 3}
    bars: 8
    plays: [drums, bass, keys, colour, lead]
    plan: [{line: m}, {line: m, varied: true}, {line: n, higher: true}, {line: o}]
  solo:
    crash: true
    bars: 8
    plays: [drums, bass, guitar, keys, solo]
    plan: [{line: s1, answer: true}, {line: s1, answer: true, varied: true}, {line: s2, answer: true, higher: true}, {line: s1, answer: true, varied: true}]
  ending: {held: true, plays: [bass, guitar, keys, colour, voices]}

# The forms a song may take when it gives none, each with how common it is; a longer form has more sections, never the same form twice over.
forms:
  usual:
    - {name: with a bridge and a solo, share: 45, sections: [intro, verse, verse, chorus, verse, chorus, bridge, solo, chorus, chorus, ending]}
    - {name: with a solo, share: 30, sections: [intro, verse, verse, chorus, verse, chorus, solo, chorus, ending]}
    - {name: short, share: 15, sections: [intro, verse, chorus, verse, chorus, bridge, chorus, chorus, ending]}
    - {name: long with two solos, share: 10, sections: [intro, verse, verse, chorus, verse, chorus, solo, solo, bridge, chorus, chorus, ending]}

melody:
  4/4:
    grid: 8
    line_bars: 2
    span: 5
    home: {degree: 3}
    ladder: [{degree: 1}, {degree: 2}, {degree: 3}, {degree: 4}, {degree: 5}, {degree: 6}, {degree: 7}]
    rhythms:
      - [{steps: 2}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 2}, {steps: 2}, {steps: 2}, {steps: 3}, {rest: 1}]
      - [{rest: 1}, {steps: 1}, {steps: 1}, {steps: 1}, {steps: 3}, {steps: 1}, {steps: 2}, {steps: 2}, {steps: 3}, {rest: 1}]
      - [{steps: 3}, {steps: 1}, {steps: 2}, {steps: 2}, {steps: 3}, {steps: 1}, {steps: 2}, {rest: 2}]
      - [{rest: 2}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 2}, {steps: 4}, {steps: 2}, {rest: 2}]
      - [{steps: 1}, {steps: 1}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 2}, {steps: 6}, {rest: 2}]
    answer_rhythms:
      - [{steps: 1}, {steps: 1}, {steps: 2}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 3}, {rest: 1}]
      - [{steps: 2}, {steps: 1}, {steps: 1}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 4}, {steps: 2}, {rest: 2}]
  3/4:
    grid: 6
    line_bars: 2
    span: 5
    home: {degree: 3}
    ladder: [{degree: 1}, {degree: 2}, {degree: 3}, {degree: 4}, {degree: 5}, {degree: 6}, {degree: 7}]
    rhythms:
      - [{steps: 2}, {steps: 2}, {steps: 2}, {steps: 4}, {rest: 2}]
      - [{steps: 4}, {steps: 1}, {steps: 1}, {steps: 4}, {rest: 2}]
      - [{rest: 2}, {steps: 2}, {steps: 2}, {steps: 2}, {steps: 2}, {steps: 2}]
    answer_rhythms:
      - [{steps: 1}, {steps: 1}, {steps: 2}, {steps: 2}, {steps: 2}, {steps: 2}, {rest: 2}]
      - [{steps: 2}, {steps: 1}, {steps: 1}, {steps: 2}, {steps: 4}, {rest: 2}]
