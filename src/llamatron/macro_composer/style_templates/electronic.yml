# forms       the layouts a song of each kind may take, each with how common it is; usual serves a kind that lists none. A song
#             names one, or says how long it should last and takes the nearest, or takes the commonest. A longer form is written
#             with more themes and changes (a second theme over other chords, a strip-down, another breakdown), never repeats alone.
forms:
  usual:
    - {name: one breakdown, share: 40, sections: [intro, groove, breakdown, build, groove, outro, ending]}
    - {name: two breakdowns, share: 35, sections: [intro, groove, breakdown, build, groove, breakdown, build, groove, outro, ending]}
    - {name: with a second theme, share: 25, sections: [intro, bassline, groove, breakdown, build, second, strip, groove, breakdown, build, groove, outro, ending]}
  techno:
    - {name: layers in and out, share: 40, sections: [beat, bassline, groove, strip, groove, outro, ending]}
    - {name: one breakdown, share: 35, sections: [beat, bassline, groove, breakdown, build, groove, strip, groove, outro, ending]}
    - {name: long with a second theme, share: 25, sections: [beat, bassline, groove, strip, second, breakdown, build, groove, strip, second, groove, outro, ending]}
  minimal techno:
    - {name: slow build, share: 40, sections: [beat, bassline, strip, groove, strip, groove, outro, ending]}
    - {name: thinning out and back, share: 35, sections: [beat, bassline, strip, groove, thin, bassline, second, strip, groove, outro, ending]}
    - {name: long and patient, share: 25, sections: [beat, bassline, strip, groove, thin, bassline, second, strip, groove, breakdown, bassline, second, groove, outro, ending]}
  trance:
    - {name: short, share: 25, sections: [intro, groove, breakdown, build, groove, outro, ending]}
    - {name: long breakdown, share: 45, sections: [beat, bassline, groove, strip, breakdown, pads, build, second, groove, outro, ending]}
    - {name: two climaxes, share: 30, sections: [beat, bassline, groove, strip, breakdown, pads, build, second, groove, breakdown, build, second, strip, outro, ending]}
  drum and bass:
    - {name: one drop, share: 30, sections: [pads, build, groove, strip, groove, outro, ending]}
    - {name: two drops, share: 45, sections: [pads, drift, build, groove, strip, breakdown, build, second, groove, outro, ending]}
    - {name: long with a switch, share: 25, sections: [pads, drift, build, groove, strip, second, breakdown, pads, build, groove, strip, second, groove, outro, ending]}
  dubstep:
    - {name: two drops, share: 50, sections: [pads, drift, build, groove, breakdown, build, groove, outro, ending]}
    - {name: second drop switched, share: 30, sections: [pads, drift, build, groove, strip, breakdown, build, second, groove, outro, ending]}
    - {name: long, share: 20, sections: [pads, drift, build, groove, strip, breakdown, pads, build, second, strip, breakdown, build, groove, outro, ending]}
  ambient:
    - {name: one theme, share: 30, sections: [pads, drift, theme, pads, ending]}
    - {name: theme and return, share: 45, sections: [pads, drift, theme, thin, theme, pads, ending]}
    - {name: two themes, share: 25, sections: [pads, drift, theme, thin, other, drift, theme, pads, ending]}
  downtempo:
    - {name: short, share: 25, sections: [beat, groove, breakdown, groove, ending]}
    - {name: one breakdown, share: 45, sections: [pads, beat, groove, breakdown, groove, outro, ending]}
    - {name: two themes, share: 30, sections: [pads, beat, bassline, groove, thin, second, breakdown, groove, outro, ending]}

