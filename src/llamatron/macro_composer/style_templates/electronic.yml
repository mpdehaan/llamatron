  drum and bass: {tempo: 172, kick: one and the and of three, backbeat: snare, hat: eighths, percussion: shaker, bass: long low notes, chords: held pad, arp: none, lead: none, harmony: minor two chord}
  big beat:      {tempo: 104, break: driving break, break_cut: 2, kick: breakbeat, backbeat: snare with quiet notes, hat: eighths, percussion: shaker, fills: toms, bass: gritty riff, chords: held pad, arp: sixteenths up, lead: voice hook, harmony: one chord}
  minimal techno: {tempo: 126, kick: every beat, backbeat: none, hat: offbeats, percussion: rim late, fills: the kick drops out, bass: two notes with gaps, chords: one stab off the beat, arp: none, lead: none, harmony: one chord}
  dubstep:       {tempo: 140, kick: half time, backbeat: snare on three, hat: eighths, percussion: none, bass: wobble, chords: held pad, arp: none, lead: none, harmony: minor two chord}
  ambient:       {tempo: 80, kick: none, backbeat: none, hat: none, percussion: none, fills: none, bass: long low notes, chords: held pad, arp: eighths up and down, lead: synth line, harmony: minor four chord}
  downtempo:     {tempo: 90, break: lazy break, kick: breakbeat, backbeat: snare with quiet notes, hat: eighths, percussion: shaker, fills: none, bass: long low notes, chords: held pad, arp: eighths up and down, lead: synth line, harmony: minor two chord}
  chiptune:      {tempo: 150, kick: one and three, backbeat: snare, hat: eighths, percussion: none, bass: octaves in eighths, chords: none, arp: fast chord arpeggio, lead: square line, harmony: four chord}

