chord_trait: harmony

players:
  drums:
    1:
      says: 'A drum machine running one bar, dead on the grid, with no fills.'
      fill_every: 0
    2:
      says: 'A drum machine. An open hat added before every fourth bar, the clap a touch late, and the kick dropping out before every eighth bar.'
      fill_every: 8
      varies: [{bars: [4], choices: [{bar: {open: {steps: 16, loud: [14]}}}]}]
      fill: [{bar: {kick: {steps: 16, loud: [0, 4]}}}]
      timing: {clap: {drag: 8}, snare: {drag: 8}}
      uneven: 3
    3:
      says: 'A drum machine. A soft extra clap, an open hat in the second bar, a kick pickup in the fourth, and a snare roll that speeds up before every eighth bar.'
      fill_every: 8
      adds: [{bar: {clap: {steps: 16, soft: [15]}}}]
      varies:
        - {bars: [2], choices: [{bar: {open: {steps: 16, loud: [14]}}}]}
        - {bars: [4], choices: [{bar: {kick: {steps: 16, loud: [14]}}}]}
      fill: [{bar: {snare: {steps: 16, loud: [0, 4, 8, 10, 12, 13, 14, 15]}}}]
      timing: {hat: {rush: 4}}
      uneven: 5
    4:
      says: 'A drum machine programmed bar by bar. A soft rim in every bar, a different small change in the second, third and fourth bars, and toms into every fourth bar. Holds back until the track opens up.'
      fill_every: 4
      adds: [{bar: {rim: {steps: 16, soft: [3, 9]}}}]
      varies:
        - {bars: [2], choices: [{bar: {kick: {steps: 16, loud: [14]}, rim: {steps: 16, soft: [6, 12]}}}]}
        - {bars: [3], choices: [{bar: {cowbell: {steps: 16, loud: [2, 10]}}}]}
        - {bars: [4], choices: [{bar: {kick: {steps: 16, loud: [7]}, open: {steps: 16, loud: [14]}}}]}
      fill: [{bar: {tom high: {steps: 16, loud: [8, 9, 11]}, tom mid: {steps: 16, loud: [12]}, tom low: {steps: 16, loud: [13, 14, 15]}, snare: {steps: 16, loud: [4], soft: [6, 7]}}}]
      timing: {clap: {drag: 12}, snare: {drag: 12}}
      uneven: 7
  bass:
    1: {says: 'A sequenced bass, the same in every bar.'}
    2:
      says: 'A sequenced bass with one note an octave up at the end of every fourth bar.'
      varies:
        - {bars: [4], grid: 16, ends: [{degree: 1, octave: 1, steps: 2}]}
    3:
      says: 'A sequenced bass that jumps an octave at the end of the second bar and twice at the end of the fourth.'
      varies:
        - {bars: [2], grid: 16, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 1, steps: 1}]}
        - {bars: [4], grid: 16, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 1, steps: 1}, {degree: 1, octave: 1, steps: 1}, {degree: 1, steps: 1}]}
    4:
      says: 'A sequenced bass programmed bar by bar: the second and third bars end with notes of their own, and the fourth climbs to the octave.'
      varies:
        - {bars: [2], grid: 16, ends: [{degree: 1, octave: 1, steps: 1}, {degree: 5, steps: 1}]}
        - {bars: [3], grid: 16, ends: [{degree: 5, steps: 2}]}
        - {bars: [4], grid: 16, ends: [{degree: 1, steps: 1}, {degree: 3, steps: 1}, {degree: 5, steps: 1}, {degree: 1, octave: 1, steps: 1}]}
  rhythm:
    1: {says: 'A sequenced part, the same in every bar.'}
    2:
      says: 'A sequenced part that jumps an octave on the last beat of every fourth bar.'
      varies:
        - {bars: [4], grid: 16, ends: [{degree: 1, chord: '3', octave: 1, steps: 4}]}
    3:
      says: 'A sequenced part that jumps an octave at the end of the second bar and through the last two beats of the fourth.'
      varies:
        - {bars: [2], grid: 16, ends: [{degree: 1, chord: '3', octave: 1, steps: 4}]}
        - {bars: [4], grid: 16, ends: [{degree: 1, chord: '3', octave: 1, steps: 8}]}
    4:
      says: 'A part programmed bar by bar: an octave jump ending the second bar, a flicker ending the third, and the octave traded back and forth into each turn.'
      varies:
        - {bars: [2], grid: 16, ends: [{degree: 1, chord: '3', octave: 1, steps: 4}]}
        - {bars: [3], grid: 16, ends: [{degree: 1, chord: '3', octave: 1, steps: 2}, {degree: 1, chord: '3', steps: 2}]}
        - {bars: [4], grid: 16, ends: [{degree: 1, chord: '3', octave: 1, steps: 2}, {degree: 1, chord: '3', steps: 2}, {degree: 1, chord: '3', octave: 1, steps: 2}, {degree: 1, chord: '3', steps: 2}]}
  lead:
    1: {says: 'Few notes, close together.', span: 2}
    2: {says: 'A hook that leaves room.', span: 3}
    3: {says: 'A line over a wider range.', span: 4}
    4: {says: 'The widest range.', span: 5}
  keys:
    1: {says: 'Plays the part exactly as written.'}
    2:
      says: 'Plays the part as written, and strikes the chord again on the last beat of every fourth bar.'
      varies:
        - {bars: [4], grid: 16, ends: [{degree: 1, chord: '3', steps: 4}]}
    3:
      says: 'Ends the second bar with two quick chords, and runs up the chord into each turn.'
      varies:
        - {bars: [2], grid: 16, ends: [{degree: 1, chord: '3', steps: 2}, {degree: 1, chord: '3', steps: 2}]}
        - {bars: [4], grid: 16, ends: [{degree: 1, steps: 2}, {degree: 3, steps: 2}, {degree: 5, steps: 2}, {degree: 1, octave: 1, steps: 2}]}
    4:
      says: 'Ends the second bar with two quick chords and the third with one off the beat, and runs down from the octave into each turn.'
      varies:
        - {bars: [2], grid: 16, ends: [{degree: 1, chord: '3', steps: 2}, {degree: 1, chord: '3', steps: 2}]}
        - {bars: [3], grid: 16, ends: [{degree: 1, chord: '3', steps: 2}]}
        - {bars: [4], grid: 16, ends: [{degree: 1, octave: 1, steps: 2}, {degree: 6, steps: 2}, {degree: 5, steps: 2}, {degree: 3, steps: 2}]}

