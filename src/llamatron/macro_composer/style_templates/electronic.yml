  synth-pop:     {tempo: 120, kick: one and three, backbeat: snare, hat: eighths, percussion: none, bass: octaves in eighths, chords: held pad, arp: eighths up and down, lead: synth line, harmony: four chord}
  hi-nrg:        {tempo: 127, kick: every beat, backbeat: clap, hat: offbeats, percussion: none, bass: octaves in sixteenths, chords: held pad, arp: sixteenths up, lead: synth line, harmony: four chord}
