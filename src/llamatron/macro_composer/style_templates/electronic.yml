genre: Electronic
feel: four
phrase_bars: 4
loudness: {drums: 100, kick: 116, snare: 106, clap: 100, hat: 70, open: 82, ride: 72, crash: 98, tom high: 96, tom low: 98, shaker: 60, rim: 80, cowbell: 76}

