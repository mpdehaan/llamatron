#
# llamatron's native code, one crate a layer, mirroring the Python packages (.claude/rules/RUST.md): a crate may use only
# the crates its manifest names, so the compiler keeps the layering tests/rules/test_layers.py keeps for the Python.
[workspace]
resolver = "2"
members = ["names", "checks", "backend", "math", "strings", "model", "engine", "exporters", "importers", "tracker", "compare"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1

# The synths and the spectrum they are measured by are compiled optimized even in the quick build the tests use, since
# their tests play hundreds of notes and unoptimized audio code runs about ten times slower; the rest stays quick to
# compile.
[profile.dev.package.llamatron-backend]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

