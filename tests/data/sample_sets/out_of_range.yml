version: 1.0.591
title: out of range
step_size: 8
default_octave: -3
octave_labels: roman

scales:
  - { name: C Major, root: C, type: major }

patterns:
  - name: tune
    steps: 16
    direction: sideways
    degree: [1, 2, 3, ~, 5, 4, 3, ~, 1, 2, 3, ~, 5, 4, 3, ~]
    gate: [1/4, ~, ~, ~, 9, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
    velocity: [200, 200, 200, ~, 200, 200, 200, ~, 200, 200, 200, ~, 200, 200, 200, ~]
    cc1: [0, 64, 127, 300, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]

generators:
  - { name: up, kind: arp, step: 1/8, octave_range: 9, order: sideways }
  - { name: rise, kind: chain, generators: [{ name: up }] }

grooves:
  - { name: shuffle, cells: [0, 80, 0, -90], cell_length: 2 }

songs:
  - name: verse
    tempo: 120
    scale: C Major

    registers:
      AX: { maximum: 500 }

    tracks:
      - { name: lead, transpose: 99, highest_octave: 40 }

    scenes:
      - name: one
        repeat: 0
        clips:
          - { track: lead, pattern: tune, generators: [{ name: rise }], repeat: -3, direction: up }
