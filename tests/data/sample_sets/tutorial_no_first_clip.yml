version: 1.0.591
title: Tutorial target with an empty first cell
description: "a set made to test that the video tutorial's plan deletes a clip"
notes: |
  A set made to test tutorial/plan.py: its first track plays nothing in its first scene, where a new
  set holds a clip, so that the plan has to delete that clip. It is test data, not music.

scales:
  - { name: C Major, root: C, type: major }

patterns:
  - name: up
    steps: 4
    degree: [1, 2, 3, 4]

songs:
  - name: quiet_start
    scale: C Major

    tracks:
      - { name: lead }
      - { name: bass }

    scenes:
      - name: first
        clips:
          - { track: bass, pattern: up }
      - name: second
        clips:
          - { track: lead, pattern: up }
          - { track: bass, pattern: up }
