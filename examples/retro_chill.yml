version: 1.0.16
title: Retro Chill
description: |
  An original piece: warm, slow and nostalgic, like the theme of a 1980s television special
  played on synthesizers, in the spirit of late-1990s downtempo records.
  Run it with: llamatron examples/retro_chill.yml --to ableton --replace

  It's in D Mixolydian, so the home chord carries a flat seventh, and the same four chords run
  underneath everything: I for six beats, IV for two, v for three and the flat VII for five. The
  pad draws those chords with the Tie row rather than with gates, which lets a chord last longer
  than one step without working out its length, and the ending holds one chord for five bars the
  same way, over a bass note drawn with ties alone, longer than any gate could make it. The bells play the same chords
  through gates, which the arpeggiator then spreads out.

  Things come in one at a time and go out again. The pad swells in on its own, using register
  AX for its velocity, then the bass and bells, then the drums, whose ghost notes come and go by
  probability. The tune arrives in the fourth scene and morphs into its answer, and an echo
  track grabs whatever it last played, three eighths later, an octave up. The sixth scene moves
  to D Minor without changing a pattern, since every note is a scale degree, while the pad's
  filter opens across the scene with a CC slide. The last scenes come back to the Mixolydian,
  slow down with a tempo ramp, and end on D Major.

  The pad sends its filter on CC 74, so put a synth with a low-pass filter on that track.
tempo: 84
scale: D Mixolydian
seed: 7

scales:
  D Mixolydian: { root: D, type: mixolydian }
  D Minor: { root: D, type: minor }
  D Major: { root: D, type: major }

registers:
  AX: { maximum: 40 }

