    chord: [7]
  ending_chord_bells:
    steps: 1
    step_size: 4
    degree: [1]
    octave: [5]
    chord: [7]
  ending_tune:
    steps: 4
    step_size: 1
    degree: [3, 5, 1, ~]
    gate: [~, ~, 2, ~]
    octave: [3, 3, 4, ~]
  chords_4:
    steps: 2
    step_size: 2
    degree: [1, 4]
    octave: [5, 4]
    chord: [7, 7]
  breath_chords:
    steps: 8
    step_size: 1
    degree: [5, 4, 1, 4, 6, 4, 1, 1]
    octave: [2, 2, 2, 2, 2, 2, 2, 2]
