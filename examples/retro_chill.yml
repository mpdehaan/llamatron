tracks:
  kick: { drum: true }
  snare: { drum: true }
  hat: { drum: true }
  bass: {}
  pad: { cc: [74, ~, ~, ~] }
  bells: {}
  keys: {}
  echo: { transpose: 7 }

arps:
  bells: { step: 1/8, order: up_down }
  bright_bells: { step: 1/16, order: up_down, octave_range: 2, octave_jump: after_chord }

chains:
  bells:
    - arp: bells
  bright_bells:
    - arp: bright_bells

scenes:
  - name: dawn
    tracks:
      pad: { pattern: pad_rise }
  - name: haze
    tracks:
      bass: { pattern: bass, repeat: 2 }
      pad: { pattern: pad, loop: true }
      bells: { pattern: bells, chain: bells, loop: true }
  - name: tape
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: pad, loop: true }
      bells: { pattern: bells, chain: bells, loop: true }
  - name: kids
    tracks:
      kick: { pattern: kick, repeat: 8 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: pad, loop: true }
      keys: { pattern: tune, loop: true }
  - name: answer
    tracks:
      kick: { pattern: kick, repeat: 8 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: pad, loop: true }
      bells: { pattern: bells, chain: bells, loop: true }
      keys: { pattern: tune, repeat: 2, morph_to: answer, morph_style: right }
      echo: { pattern: echo, grab_track: keys, loop: true }
  - name: shade
    scale: D Minor
    tracks:
      hat: { pattern: hat, repeat: 8 }
      bass: { pattern: bass, loop: true }
      pad: { pattern: pad_sweep, loop: true }
      keys: { pattern: answer, direction: reverse_b, loop: true }
      echo: { pattern: echo, grab_track: keys, loop: true }
  - name: bloom
    tracks:
      kick: { pattern: kick, repeat: 8 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: pad, loop: true }
      bells: { pattern: bells, chain: bright_bells, loop: true }
      keys: { pattern: answer, loop: true }
      echo: { pattern: echo, grab_track: keys, loop: true }
  - name: slow
    repeat: 2
    tempo_start: 84
    tempo_end: 72
    tracks:
      bass: { pattern: bass }
      pad: { pattern: pad, loop: true }
      bells: { pattern: bells, chain: bells, loop: true }
  - name: home
    scale: D Major
    tempo: 72
    tracks:
      bass: { pattern: bass_end }
      pad: { pattern: pad_end, loop: true }
      bells: { pattern: bells_end, chain: bells, loop: true }
      keys: { pattern: tune_end, loop: true }
