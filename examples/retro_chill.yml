# Retro chill: uplifting and nostalgic, a sunlit music box over a gentle beat, with a tune that keeps climbing.
# It takes a breath in the middle, rises a whole step to G major, and comes home on the first chord.
# Run it with: llamatron examples/retro_chill.yml --to ableton --replace
# It suits soft, slightly detuned sounds: a bell or music box for the bells, and a warm pad.

tempo: 96
scale: F Major

scales:
  F Major: { root: F, type: major }
  G Major: { root: G, type: major }

patterns:
  chords:
    steps: 6
    degree: [1, 4, 6, 5, 4, 5]
    duration: [2, 2, 1, 1, 1, 1]
    octave: [5, 4, 4, 4, 4, 4]
    chord: [7, 7, 7, 3, 7, 3]
  chords_pad:
    steps: 6
    degree: [1, 4, 6, 5, 4, 5]
    duration: [2, 2, 1, 1, 1, 1]
    octave: [2, 1, 1, 1, 1, 1]
    chord: [7, 7, 7, 3, 7, 3]
  chords_tune:
    steps: 6
    degree: [1, 4, 6, 5, 4, 5]
    duration: [2, 2, 1, 1, 1, 1]
    octave: [3, 2, 2, 2, 2, 2]
    chord: [7, 7, 7, 3, 7, 3]
  bass:
    steps: 9
    degree: [1, 3, 4, 5, 6, 5, 4, 5, 7]
    duration: [7/4, 1/4, 7/4, 1/4, 1, 1, 1, 3/4, 1/4]
    octave: [1, 1, 1, 1, 1, 1, 1, 1, 0]
  kick:
    steps: 10
    drum: true
    degree: [C, ~, C, ~, C, ~, C, ~, C, ~]
    duration: [1/16, 5/16, 1/16, 9/16, 1/16, 5/16, 1/16, 3/16, 1/16, 5/16]
    octave: [1, ~, 1, ~, 1, ~, 1, ~, 1, ~]
  snare:
    steps: 6
    drum: true
    degree: [~, D, ~, ~, D, ~]
    duration: [1/4, 1/16, 3/16, 1/4, 1/16, 3/16]
    octave: [~, 1, ~, ~, 1, ~]
  hat:
    steps: 2
    drum: true
    degree: [F, ~]
    duration: [1/16, 1/16]
    accidental: ["#", ~]
    octave: [1, ~]
  tune:
    steps: 19
    degree: [3, 5, 6, 5, 6, 1, 6, 5, 4, 6, 6, 1, 7, 5, 6, 1, 2, 7, 5]
    duration: [3/4, 1/8, 1/8, 1/2, 1/4, 1/4, 3/4, 1/4, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/4, 1/4]
    octave: [3, 3, 3, 3, 3, 4, 3, 3, 3, 3, 3, 4, 3, 3, 3, 4, 4, 3, 3]
  tune2:
    steps: 19
    degree: [3, 5, 6, 1, 6, 1, 3, 1, 6, 1, 1, 3, 2, 7, 1, 3, 2, 3, 5]
    duration: [3/4, 1/8, 1/8, 1/2, 1/4, 1/4, 3/4, 1/4, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/4, 1/4, 1/2]
    octave: [3, 3, 3, 4, 3, 4, 4, 4, 3, 4, 4, 4, 4, 3, 4, 4, 4, 4, 4]
  ending_bass:
    steps: 1
    degree: [1]
    duration: [4]
    octave: [1]
  ending_chord:
    steps: 1
    degree: [1]
    duration: [4]
    octave: [2]
    chord: [7]
  ending_chord_bells:
    steps: 1
    degree: [1]
    duration: [4]
    octave: [5]
    chord: [7]
  ending_tune:
    steps: 3
    degree: [3, 5, 1]
    duration: [1, 1, 2]
    octave: [3, 3, 4]
  answer_time:
    steps: 4
    degree: [~, 1, 1, 1]
    duration: [2, 1/2, 1/2, 1]
    octave: [~, 3, 3, 3]
  chords_4:
    steps: 2
    degree: [1, 4]
    duration: [2, 2]
    octave: [5, 4]
    chord: [7, 7]
  breath_chords:
    steps: 8
    degree: [5, 4, 1, 4, 6, 4, 1, 1]
    duration: [1, 1, 1, 1, 1, 1, 1, 1]
    octave: [2, 2, 2, 2, 2, 2, 2, 2]
    chord: [3, 3, 3, 3, 3, 3, 3, 3]
  tune2_busy:
    steps: 19
    degree: [3, 5, 6, 1, 6, 1, 3, 1, 6, 1, 1, 3, 2, 7, 1, 3, 2, 3, 5]
    duration: [3/4, 1/8, 1/8, 1/2, 1/4, 1/4, 3/4, 1/4, 1/2, 1/2, 1/2, 1/2, 1/4, 1/4, 1/2, 1/2, 1/4, 1/4, 1/2]
    octave: [3, 3, 3, 4, 3, 4, 4, 4, 3, 4, 4, 4, 4, 3, 4, 4, 4, 4, 4]
    ratchet: [~, ~, ~, 2, ~, ~, 3, ~, 2, ~, ~, 2, ~, ~, 2, ~, ~, ~, 2]
    ratchet_offset: [~, ~, ~, 1, ~, ~, -1, ~, 1, ~, ~, -1, ~, ~, 1, ~, ~, ~, -1]

tracks:
  kick: { drum: true }
  snare: { drum: true }
  hat: { drum: true }
  bass: {}
  pad: {}
  tune: {}
  answer: {}
  bells: {}

arps:
  bells: { step: 1/8, order: up }
  bright_bells: { step: 1/16, order: up_down, octave_range: 2, octave_jump: after_each_note, offsets: [-7, -7, ~, -9, -7, ~] }

chains:
  bells:
    - arp: bells
  bright_bells:
    - arp: bright_bells

scenes:
  - name: bells
    tracks:
      bells: { pattern: chords_4, chain: bells }
  - name: warm
    tracks:
      bass: { pattern: bass }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
  - name: nod
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
  - name: tune
    tracks:
      kick: { pattern: kick, repeat: 12 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
      tune: { pattern: tune, repeat: 3, morph_to: tune2, morph_style: middle }
  - name: breath
    tracks:
      hat: { pattern: hat, repeat: 64 }
      bass: { pattern: bass, loop: true }
      pad: { pattern: breath_chords, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
      tune: { pattern: tune, direction: reverse_b, loop: true }
  - name: rise
    scale: G Major
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bright_bells, loop: true }
      tune: { pattern: tune2, loop: true }
  - name: sun
    scale: G Major
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, loop: true }
      hat: { pattern: hat, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bright_bells, loop: true }
      tune: { pattern: tune2_busy, loop: true }
      answer: { pattern: tune2, rhythm_from: answer_time, loop: true }
  - name: home
    scale: G Major
    tracks:
      bass: { pattern: ending_bass }
      pad: { pattern: ending_chord, loop: true }
      bells: { pattern: ending_chord_bells, chain: bells, loop: true }
      tune: { pattern: ending_tune, loop: true }
