# Retro chill: uplifting and nostalgic, a sunlit music box over a gentle beat, with a tune that keeps climbing.
# It takes a breath in the middle, rises a whole step to G major, and comes home on the first chord.
# Run it with: .venv/bin/python -m src.cli examples/retro_chill.yml --replace
# It suits soft, slightly detuned sounds: a bell or music box for the bells, and a warm pad.

tempo: 96
scale: F Major

scales:
  F Major: { root: F, type: major }
  G Major: { root: G, type: major }

patterns:
  chords:
    steps: 6
    degree: [1, 4, 6, 5, 4, 5]
    duration: [2, 2, 1, 1, 1, 1]
    octave: [5, 4, 4, 4, 4, 4]
    chord: [7, 7, 7, 3, 7, 3]
  chords_pad:
    steps: 6
    degree: [1, 4, 6, 5, 4, 5]
    duration: [2, 2, 1, 1, 1, 1]
    octave: [2, 1, 1, 1, 1, 1]
    chord: [7, 7, 7, 3, 7, 3]
  chords_tune:
    steps: 6
    degree: [1, 4, 6, 5, 4, 5]
    duration: [2, 2, 1, 1, 1, 1]
    octave: [3, 2, 2, 2, 2, 2]
    chord: [7, 7, 7, 3, 7, 3]
  bass:
    steps: 9
    degree: [1, 3, 4, 5, 6, 5, 4, 5, 7]
    duration: [7/4, 1/4, 7/4, 1/4, 1, 1, 1, 3/4, 1/4]
    octave: [1, 1, 1, 1, 1, 1, 1, 1, 0]
  kick:
    steps: 10
    drum: true
    degree: [C, ~, C, ~, C, ~, C, ~, C, ~]
    duration: [1/16, 5/16, 1/16, 9/16, 1/16, 5/16, 1/16, 3/16, 1/16, 5/16]
    octave: [1, ~, 1, ~, 1, ~, 1, ~, 1, ~]
  snare:
    steps: 6
    drum: true
    degree: [~, D, ~, ~, D, ~]
    duration: [1/4, 1/16, 3/16, 1/4, 1/16, 3/16]
    octave: [~, 1, ~, ~, 1, ~]
  hat:
    steps: 2
    drum: true
    degree: [F, ~]
    duration: [1/16, 1/16]
    accidental: ["#", ~]
    octave: [1, ~]
  tune:
    steps: 19
    degree: [3, 5, 6, 5, 6, 1, 6, 5, 4, 6, 6, 1, 7, 5, 6, 1, 2, 7, 5]
    duration: [3/4, 1/8, 1/8, 1/2, 1/4, 1/4, 3/4, 1/4, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/4, 1/4]
    octave: [3, 3, 3, 3, 3, 4, 3, 3, 3, 3, 3, 4, 3, 3, 3, 4, 4, 3, 3]
  tune2:
    steps: 19
    degree: [3, 5, 6, 1, 6, 1, 3, 1, 6, 1, 1, 3, 2, 7, 1, 3, 2, 3, 5]
    duration: [3/4, 1/8, 1/8, 1/2, 1/4, 1/4, 3/4, 1/4, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/2, 1/4, 1/4, 1/2]
    octave: [3, 3, 3, 4, 3, 4, 4, 4, 3, 4, 4, 4, 4, 3, 4, 4, 4, 4, 4]
  ending_bass:
    steps: 1
    degree: [1]
    duration: [4]
    octave: [1]
  ending_chord:
    steps: 1
    degree: [1]
    duration: [4]
    octave: [2]
    chord: [7]
  ending_chord_bells:
    steps: 1
    degree: [1]
    duration: [4]
    octave: [5]
    chord: [7]
  ending_tune:
    steps: 3
    degree: [3, 5, 1]
    duration: [1, 1, 2]
    octave: [3, 3, 4]
  answer_time:
    steps: 4
    degree: [~, 1, 1, 1]
    duration: [2, 1/2, 1/2, 1]
    octave: [~, 3, 3, 3]
  chords_4:
    steps: 2
    degree: [1, 4]
    duration: [2, 2]
    octave: [5, 4]
    chord: [7, 7]
  breath_chords:
    steps: 8
    degree: [5, 4, 1, 4, 6, 4, 1, 1]
    duration: [1, 1, 1, 1, 1, 1, 1, 1]
    octave: [2, 2, 2, 2, 2, 2, 2, 2]
    chord: [3, 3, 3, 3, 3, 3, 3, 3]

tracks: [kick, snare, hat, bass, pad, tune, answer, bells]

chains:
  bells:
    - arp: { step: 1/8, order: up }
    - duration_change: { factors: [0.5, 1, 0.5, 0.75] }
  bright_bells:
    - arp: { step: 1/16, order: up_down }
    - duration_change: { factors: [0.75, 1] }
  opening_up:
    - hold: { length_start: 0, length_end: 1/32, every: 1 }
  late_snare:
    - delay: { amount: 1/64 }
  swung_hats:
    - delay: { amount: 1/48, every: 2 }
  wander:
    - blend: { to: tune2, style: middle }
  fit_to_chords:
    - smoother: { chords: chords_tune }
  backwards:
    - reverse: {}
  more_notes:
    - duration_change: { factors: [0.5] }
    - backfill: { probabilities: [1, 0, 0, 1, 0] }
  answering:
    - take_rhythm: { rhythm: answer_time }

scenes:
  - name: bells
    tracks:
      bells: { pattern: chords_4, chain: bells }
  - name: warm
    tracks:
      bass: { pattern: bass }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
  - name: nod
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, chain: late_snare, loop: true }
      hat: { pattern: hat, chain: swung_hats, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
  - name: tune
    repeat: 3
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, chain: late_snare, loop: true }
      hat: { pattern: hat, chain: swung_hats, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
      tune: { pattern: tune, chain: wander, loop: true }
  - name: breath
    tracks:
      hat: { pattern: hat, chain: swung_hats, repeat: 64 }
      bass: { pattern: bass, loop: true }
      pad: { pattern: breath_chords, loop: true }
      bells: { pattern: chords, chain: bells, loop: true }
      tune: { pattern: tune, chain: backwards, loop: true }
  - name: rise
    scale: G Major
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, chain: late_snare, loop: true }
      hat: { pattern: hat, chain: swung_hats, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bright_bells, loop: true }
      tune: { pattern: tune2, loop: true }
  - name: sun
    scale: G Major
    tracks:
      kick: { pattern: kick, repeat: 4 }
      snare: { pattern: snare, chain: late_snare, loop: true }
      hat: { pattern: hat, chain: swung_hats, loop: true }
      bass: { pattern: bass, loop: true }
      pad: { pattern: chords_pad, loop: true }
      bells: { pattern: chords, chain: bright_bells, loop: true }
      tune: { pattern: tune2, chain: more_notes, loop: true }
      answer: { pattern: tune2, chain: answering, loop: true }
  - name: home
    scale: G Major
    tracks:
      bass: { pattern: ending_bass }
      pad: { pattern: ending_chord, loop: true }
      bells: { pattern: ending_chord_bells, chain: bells, loop: true }
      tune: { pattern: ending_tune, loop: true }

paint:
  - { chain: opening_up, tracks: [bells], scenes: [2, 3, 4, 5, 6] }
  - { chain: fit_to_chords, tracks: [tune], scenes: [4, 5, 6, 7] }
  - { chain: fit_to_chords, tracks: [tune, answer], scenes: [8, 9] }
