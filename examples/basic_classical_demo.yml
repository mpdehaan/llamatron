version: 1.0.14
title: Basic classical demo
description: |
  Basic classical demo: the opening of Pachelbel's Canon in D, with only patterns and scenes.
  Run it with: llamatron examples/basic_classical_demo.yml --to ableton --replace

  This uses no chains, grabs or ratchets: just named patterns on four tracks, the way you
  might copy a score in. The notes and the tempo of 44 come from the flutetunes.com
  transcription, and the last scene slows to 36, as that transcription does at the end.
  Put string sounds on the tracks.

  A canon is one line played by several voices, each starting later. So the three violin
  tracks share the same three patterns, and each scene moves every pattern down one violin:
  violin 2 plays in each scene what violin 1 played in the scene before. Every scene is two
  bars, one pass of the ground bass that the cello repeats under everything. Because every
  line fits over the ground bass, the lines can keep rotating, which is how the Canon goes on.

  When changing this demo:
  Keep it to patterns, tracks and scenes, with no chains, grabs or ratchets. Pattern names
  say what each part does. It was meant to be Ravel's Bolero, but no transcription of its
  melody could be checked, so it's the Canon instead until one can.
tempo: 44
scale: D Major
seed: 1
default_octave: 3
default_drum_octave: 1

scales:
  D Major: { root: D, type: major }

patterns:
  ground_bass:
    steps: 8
    step_size: 1/4
    degree: [1, 5, 6, 3, 4, 1, 4, 5]
    octave: [2, 1, 1, 1, 1, 1, 1, 1]
  canon_falling_quarters:
    steps: 8
    step_size: 1/4
    degree: [3, 2, 1, 7, 6, 5, 6, 7]
    octave: [4, 4, 4, 3, 3, 3, 3, 3]
  canon_answering_quarters:
    steps: 8
    step_size: 1/4
    degree: [1, 7, 6, 5, 4, 3, 4, 2]
    octave: [4, 3, 3, 3, 3, 3, 3, 3]
  canon_flowing_eighths:
    steps: 16
    step_size: 1/8
    degree: [1, 3, 5, 4, 3, 1, 3, 2, 1, 6, 1, 5, 4, 6, 5, 4]
    octave: [3, 3, 3, 3, 3, 3, 3, 3, 3, 2, 3, 3, 3, 3, 3, 3]
  ending_bass:
    steps: 1
    step_size: 2
    degree: [1]
    octave: [1]
  ending_top:
    steps: 1
    step_size: 2
    degree: [1]
    octave: [4]
  ending_middle:
    steps: 1
    step_size: 2
    degree: [5]
    octave: [3]
  ending_low:
    steps: 1
    step_size: 2
    degree: [3]
    octave: [3]

tracks:
  violin 1: {}
  violin 2: {}
  violin 3: {}
  cello: {}

scenes:
  - name: Ground bass alone
    tracks:
      cello: { pattern: ground_bass }
  - name: Violin 1 enters
    tracks:
      cello: { pattern: ground_bass }
      violin 1: { pattern: canon_falling_quarters }
  - name: Violin 2 follows in canon
    tracks:
      cello: { pattern: ground_bass }
      violin 1: { pattern: canon_answering_quarters }
      violin 2: { pattern: canon_falling_quarters }
  - name: Violin 3 follows in canon
    tracks:
      cello: { pattern: ground_bass }
      violin 1: { pattern: canon_flowing_eighths }
      violin 2: { pattern: canon_answering_quarters }
      violin 3: { pattern: canon_falling_quarters }
  - name: The three lines rotate
    tracks:
      cello: { pattern: ground_bass }
      violin 1: { pattern: canon_falling_quarters }
      violin 2: { pattern: canon_flowing_eighths }
      violin 3: { pattern: canon_answering_quarters }
  - name: The lines rotate again
    tracks:
      cello: { pattern: ground_bass }
      violin 1: { pattern: canon_answering_quarters }
      violin 2: { pattern: canon_falling_quarters }
      violin 3: { pattern: canon_flowing_eighths }
  - name: "Final chord, slower"
    tempo: 36
    tracks:
      violin 1: { pattern: ending_top }
      violin 2: { pattern: ending_middle }
      violin 3: { pattern: ending_low }
      cello: { pattern: ending_bass }
