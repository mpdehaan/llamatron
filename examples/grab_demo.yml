tracks:
  SILENT melody: { mute: true }
  voice 1: {}
  voice 2: {}
  voice 3: {}
  voice 4: {}

scenes:
  - name: "Verse: SILENT melody only (unmute it)"
    tracks:
      SILENT melody: { pattern: melody_verse }
  - name: "Chorus: voice 1 alone"
    tracks:
      SILENT melody: { pattern: melody_chorus }
      voice 1: { pattern: voice_1_chorus, grab_track: SILENT melody }
  - name: "Verse: voices 1 and 2"
    tracks:
      SILENT melody: { pattern: melody_verse }
      voice 1: { pattern: voice_1_verse, grab_track: SILENT melody }
      voice 2: { pattern: voice_2_verse, grab_track: SILENT melody }
  - name: "Chorus: voices 1 to 3"
    tracks:
      SILENT melody: { pattern: melody_chorus }
      voice 1: { pattern: voice_1_chorus, grab_track: SILENT melody }
      voice 2: { pattern: voice_2_chorus, grab_track: SILENT melody }
      voice 3: { pattern: voice_3_chorus, grab_track: SILENT melody }
  - name: "Verse: all four voices"
    tracks:
      SILENT melody: { pattern: melody_verse }
      voice 1: { pattern: voice_1_verse, grab_track: SILENT melody }
      voice 2: { pattern: voice_2_verse, grab_track: SILENT melody }
      voice 3: { pattern: voice_3_verse, grab_track: SILENT melody }
      voice 4: { pattern: voice_4_verse, grab_track: SILENT melody }
  - name: "Chorus: all four voices"
    tracks:
      SILENT melody: { pattern: melody_chorus }
      voice 1: { pattern: voice_1_chorus, grab_track: SILENT melody }
      voice 2: { pattern: voice_2_chorus, grab_track: SILENT melody }
      voice 3: { pattern: voice_3_chorus, grab_track: SILENT melody }
      voice 4: { pattern: voice_4_chorus, grab_track: SILENT melody }
  - name: "Verse: voices 2 and 4"
    tracks:
      SILENT melody: { pattern: melody_verse }
      voice 2: { pattern: voice_2_verse, grab_track: SILENT melody }
      voice 4: { pattern: voice_4_verse, grab_track: SILENT melody }
