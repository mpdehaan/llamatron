tracks:
  gifts: {}

arps:
  octave_sparkle: { step: 1/16, order: up, octave_range: 2 }
  trill_in_thirds: { step: 1/16, order: up, offsets: [0, 2] }
  triad_up: { step: 1/16, order: up }
  triad_wide: { step: 1/16, order: up_down, octave_range: 2 }
  synth_arp: { step: 1/16, order: up, octave_range: 2, octave_jump: after_chord }
  synth_arp_wide: { step: 1/16, order: down_up, octave_range: 3 }
  shred_up: { step: 1/32, order: up, offsets: [0, 2, 4, 7] }
  shred_down: { step: 1/32, order: up, offsets: [7, 4, 2, 0] }
  octave_pedal: { step: 1/16, order: up, offsets: [0, 0, 7, 0] }
  answer_a_fifth_up: { step: 1/32, order: up, offsets: [0, 4] }

auto_ratchets:
  double: { counts: [2] }
  chug: { counts: [4] }
  chug_with_fills: { counts: [4, 4, 4, 8] }
  stutter: { counts: [1, 1, 1, 1, 1, 1, 1, 3] }

chains:
  octave_sparkle:
    - arp: octave_sparkle
  trill_in_thirds:
    - arp: trill_in_thirds
  double:
    - auto_ratchet: double
  shred:
    - arp: shred_up
  triad_up:
    - arp: triad_up
  triad_wide:
    - arp: triad_wide
  triad_up_then_stutter:
    - arp: triad_up
    - auto_ratchet: stutter
  synth_arp:
    - arp: synth_arp
  synth_arp_then_stutter:
    - arp: synth_arp
    - auto_ratchet: stutter
  stutter_then_synth_arp:
    - auto_ratchet: stutter
    - arp: synth_arp
  synth_arp_then_answer:
    - arp: synth_arp
    - arp: answer_a_fifth_up
  synth_arp_wide:
    - arp: synth_arp_wide
  chug:
    - auto_ratchet: chug
  chug_with_fills:
    - auto_ratchet: chug_with_fills
  double_then_shred_down:
    - auto_ratchet: double
    - arp: shred_down
  finale:
    - arp: octave_pedal
    - auto_ratchet: stutter

scenes:
  - name: Tune
    tracks:
      gifts: { pattern: tune }
  - name: "Tune: octave sparkle"
    tracks:
      gifts: { pattern: tune, chain: octave_sparkle }
  - name: "Tune: trill in thirds"
    tracks:
      gifts: { pattern: tune, chain: trill_in_thirds }
  - name: "Tune: doubled"
    tracks:
      gifts: { pattern: tune, chain: double }
  - name: "Tune: shred up"
    tracks:
      gifts: { pattern: tune, chain: shred }
  - name: "Hymn: tune in triads"
    tracks:
      gifts: { pattern: tune_in_triads }
  - name: "Hymn: triads arpeggiated"
    tracks:
      gifts: { pattern: tune_in_triads, chain: triad_up }
  - name: "Hymn: triads two octaves"
    tracks:
      gifts: { pattern: tune_in_triads, chain: triad_wide }
  - name: "Hymn: arp then stutter"
    tracks:
      gifts: { pattern: tune_in_triads, chain: triad_up_then_stutter }
  - name: "Synthwave: seventh chords"
    tracks:
      gifts: { pattern: changes_sevenths }
  - name: "Synthwave: arp"
    tracks:
      gifts: { pattern: changes_sevenths, chain: synth_arp }
  - name: "Synthwave: arp then stutter"
    tracks:
      gifts: { pattern: changes_sevenths, chain: synth_arp_then_stutter }
  - name: "Synthwave: stutter then arp"
    tracks:
      gifts: { pattern: changes_sevenths, chain: stutter_then_synth_arp }
  - name: "Synthwave: arp of an arp"
    tracks:
      gifts: { pattern: changes_sevenths, chain: synth_arp_then_answer }
  - name: "Synthwave: three octaves"
    tracks:
      gifts: { pattern: changes_sevenths, chain: synth_arp_wide }
  - name: "Metal: power chords"
    tracks:
      gifts: { pattern: changes_power_chords }
  - name: "Metal: chug"
    tracks:
      gifts: { pattern: changes_power_chords, chain: chug }
  - name: "Metal: chug with fills"
    tracks:
      gifts: { pattern: changes_power_chords, chain: chug_with_fills }
  - name: "Metal: tune in power chords"
    tracks:
      gifts: { pattern: tune_in_power_chords }
  - name: "Metal: power tune doubled"
    tracks:
      gifts: { pattern: tune_in_power_chords, chain: double }
  - name: "Metal: double then shred down"
    tracks:
      gifts: { pattern: tune, chain: double_then_shred_down }
  - name: "Finale: octave pedal, stutter"
    tracks:
      gifts: { pattern: tune_in_power_chords, chain: finale }
