    bar: [down, nothing, nothing, nothing]
    accents: [false, false, false, false]
    cell: 1/4
    tuning: drop_d
    single_notes: power_chord
    let_ring: true
    spread: 2
    fade: 0
  - { name: quiet loud, kind: guitarify, bar: [bass, string_3, string_2, string_1, string_2, string_3, string_2, string_1, bass, string_3, string_2, string_1, string_2, string_3, string_2, string_1, down, nothing, down, up, nothing, up, down, up, down, nothing, down, up, nothing, up, down, up], accents: [false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, true, false, true, false, false, false, true, false, true, false, true, false, false, false, true, false], cell: 1/8, let_ring: true }
  - { name: shuffle, kind: guitarify, bar: [down, nothing, down, down, nothing, down, down, nothing, down, down, nothing, down], accents: [false, false, false, true, false, false, false, false, false, true, false, false], cell: 1/12, strings: 4, spread: 4 }
  - { name: last chord, kind: guitarify, bar: [down, nothing, down, up, nothing, up, down, up, down, nothing, down, up, nothing, up, down, up, down, nothing, down, up, nothing, up, down, up, bass, string_4, string_3, string_2, string_1, nothing, nothing, nothing], accents: [true, false, false, false, false, false, true, false, true, false, false, false, false, false, true, false, true, false, false, false, false, false, true, false, false, false, false, false, false, false, false, false], cell: 1/8, let_ring: true }
