    step_size: 1/2
    degree: [1, 1, 4, 4, 1, 5, 1, 1]
    octave: [3, 3, 3, 3, 3, 3, 3, 3]
    chord: [3, 3, 3, 3, 3, 3, 3, 3]
  - name: four to the bar
    steps: 4
    step_size: 1
    degree: [2, 5, 1, 6]
    octave: [3, 3, 3, 3]
    chord: [7, 7, 7, dom7]
  - name: open g
    steps: 4
    step_size: 1
    degree: [1, 4, 1, 5]
    octave: [3, 3, 3, 3]
    chord: [dom7, dom7, dom7, dom7]
  - name: boogie
    steps: 4
    step_size: 1
    degree: [1, 4, 1, 5]
    octave: [2, 2, 2, 2]
  - name: tremolo
    steps: 4
    step_size: 1
    degree: [1, 7, 6, 5]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, M]
  - name: campfire
    steps: 4
    step_size: 1
    degree: [1, 6, 4, 5]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, 3]
  - name: chime
    steps: 4
    step_size: 1
    degree: [1, 7, 4, 1]
    accidental: [~, b, ~, ~]
    octave: [3, 3, 3, 3]
    chord: [3, M, 3, 3]
  - name: backbeat
    steps: 4
    step_size: 1
    degree: [1, 4, 2, 5]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, 3]
  - name: scratch
    steps: 4
    step_size: 1
    degree: [1, 1, 1, 1]
    octave: [3, 3, 3, 3]
    chord: [dom9, dom9, dom9, dom9]
  - name: harp
    steps: 4
    step_size: 1
    degree: [1, 5, 6, 4]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, 3]
    inversion: [~, 1, ~, ~]
  - name: arena
    steps: 4
    step_size: 1
    degree: [1, 3, 4, 1]
    accidental: [~, b, ~, ~]
    octave: [2, 2, 2, 2]
  - name: three chords loud
    steps: 4
    step_size: 1
    degree: [1, 4, 5, 4]
    octave: [2, 2, 2, 2]
  - name: gallop
    steps: 4
    step_size: 1
    degree: [1, 1, 6, 7]
    octave: [2, 2, 2, 2]
  - name: thrash
    steps: 8
    step_size: 1/2
    degree: [1, 1, 2, 2, 1, 1, 3, 2]
    accidental: [~, ~, b, b, ~, ~, ~, b]
    octave: [2, 2, 2, 2, 2, 2, 2, 2]
  - name: low and slow
    steps: 4
    step_size: 1
    degree: [1, 1, 3, 5]
    accidental: [~, ~, ~, b]
    octave: [2, 2, 2, 2]
  - name: quiet loud
    steps: 4
    step_size: 1
    degree: [1, 3, 7, 4]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, M]
  - name: shuffle
    steps: 12
    step_size: 1
    degree: [1, 1, 1, 1, 4, 4, 1, 1, 5, 4, 1, 5]
    octave: [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3]
    chord: [dom7, dom7, dom7, dom7, dom7, dom7, dom7, dom7, dom7, dom7, dom7, dom7]
  - name: last chord
    steps: 4
    step_size: 1
    degree: [1, 4, 5, 1]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, 3]

generators:
  - name: porch
    kind: guitarify
    # the ready-made bar: boom chick
    bar: [bass, nothing, down, nothing, alt_bass, nothing, down, nothing]
    accents: [true, false, false, false, true, false, false, false]
    cell: 1/8
  - name: thumb and fingers
    kind: guitarify
    # the ready-made bar: travis pick
    bar: [bass, string_2, alt_bass, string_1, bass, string_3, alt_bass, string_2]
    accents: [false, false, false, false, false, false, false, false]
    cell: 1/8
    let_ring: true
  - name: crosspick
    kind: guitarify
    # the ready-made bar: crosspick
    bar: [string_3, string_2, string_1, string_3, string_2, string_1, string_3, string_2]
    accents: [true, false, false, true, false, false, true, false]
    cell: 1/8
    let_ring: true
  - name: four to the bar
    kind: guitarify
    # the ready-made bar: four to the bar
    bar: [down, down, down, down]
    accents: [false, true, false, true]
    cell: 1/4
    position: 3
    strings: 4
    spread: 4
  - name: open g
    kind: guitarify
    # the ready-made bar: folk strum
    bar: [down, nothing, down, up, nothing, up, down, up]
    accents: [true, false, false, false, false, false, true, false]
    cell: 1/8
    tuning: open_g
    let_ring: true
    spread: 14
  - name: boogie
    kind: guitarify
    # the ready-made bar: boogie
    bar: [down, down, down, down, down, down, down, down]
    accents: [false, false, true, false, false, false, true, false]
    cell: 1/8
    single_notes: power_chord
    spread: 2
  - name: tremolo
    kind: guitarify
    # the ready-made bar: tremolo
    bar: [string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1, string_1]
    accents: [true, false, false, false, true, false, false, false, true, false, false, false, true, false, false, false]
    cell: 1/16
    position: 5
  - name: campfire
    kind: guitarify
    # the ready-made bar: folk strum
    bar: [down, nothing, down, up, nothing, up, down, up]
    accents: [true, false, false, false, false, false, true, false]
    cell: 1/8
  - name: chime
    kind: guitarify
    # the ready-made bar: chime
    bar: [string_4, string_2, string_1, string_3, string_2, string_1, string_3, string_2]
    accents: [false, false, false, false, false, false, false, false]
    cell: 1/8
    let_ring: true
  - name: backbeat
    kind: guitarify
    # the ready-made bar: backbeat
    bar: [nothing, nothing, stab, nothing, nothing, nothing, stab, nothing]
    accents: [false, false, true, false, false, false, true, false]
    cell: 1/8
    position: 4
    strings: 4
    spread: 3
  - name: scratch
    kind: guitarify
    # the ready-made bar: scratch
    bar: [down, mute, mute, up, mute, mute, down, mute, mute, up, down, mute, mute, up, mute, mute]
    accents: [true, false, false, false, false, false, true, false, false, false, true, false, false, false, false, false]
    cell: 1/16
    position: 6
    strings: 4
    spread: 2
  - name: harp
    kind: guitarify
    # the ready-made bar: roll up
    bar: [bass, string_4, string_3, string_2, string_1, nothing, nothing, nothing]
    accents: [false, false, false, false, false, false, false, false]
    cell: 1/8
    let_ring: true
  - { name: arena, kind: guitarify, bar: [down, nothing, nothing, down, nothing, down, nothing, nothing], accents: [true, false, false, false, false, false, false, false], cell: 1/8, single_notes: power_chord, let_ring: true, spread: 2 }
  - name: three chords loud
    kind: guitarify
    # the ready-made bar: all down
    bar: [down, down, down, down, down, down, down, down]
    accents: [false, false, false, false, false, false, false, false]
    cell: 1/8
    single_notes: power_chord
    spread: 2
    fade: 0
  - name: gallop
    kind: guitarify
    # the ready-made bar: gallop
    bar: [muted_bass, nothing, muted_bass, muted_bass, muted_bass, nothing, muted_bass, muted_bass, muted_bass, nothing, muted_bass, muted_bass, down, nothing, muted_bass, muted_bass]
    accents: [true, false, false, false, true, false, false, false, true, false, false, false, true, false, false, false]
