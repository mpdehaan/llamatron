version: 1.0.591
title: Guitarify
description: "twenty short scenes, each a way a guitar is played, from a porch to an arena, on guitars alone"
notes: |
  Guitarify: an original tour of guitar playing, twenty scenes by genre, each four bars (the
  shuffle its full twelve), on seven General MIDI guitars and nothing else, one guitar a scene.
  Run it with: llamatron examples/learning/23_guitarify.yml

  Every pattern here is only a row of chords or low notes, one a bar or two a bar. The playing
  is the Guitarify generator's, one for each scene. Its Shape half holds each chord as a hand
  would, one note a string, in the scene's tuning and position, and makes a single low note a
  power chord in the loud scenes. Its Strokes half plays a bar of strokes on whatever sounds:
  strums down and up, muted strums, the bass string, the alternate bass and single strings.

  Scenes 1 and 2: country. A bass note and a strum, then thumb and fingers picking with Let ring.
  Scene 3: bluegrass crosspicking. Scene 4: jazz, four strums to the bar on four strings.
  Scene 5: blues in open G tuning. Scene 6: rock and roll, power chords in eighths.
  Scene 7: surf, one string picked fast. Scene 8: the folk strum. Scene 9: folk rock, ringing.
  Scene 10: soul, the chord on the backbeat. Scene 11: funk, sixteenths mostly muted.
  Scene 12: a singer's rolled chords, each string heard. Scenes 13 and 14: hard rock and punk.
  Scenes 15 to 17: metal, galloping, thrashing, then slow in drop D.
  Scene 18: alternative, two bars picked quietly and two strummed hard, one bar of 32 strokes.
  Scene 19: a twelve bar blues shuffle, the bar in triplets. Scene 20: the last chord, rolled.

  When changing this demo:
  - Keep it guitars only, one guitar a scene, and every scene its own Guitarify.
  - Keep the patterns plain chords, so that everything heard between them is the generator's.
  - Each scene is an original progression: none is taken from an existing song.
real_time: true
protected: true

scales:
  - { name: G Major, root: G, type: major }
  - { name: C Major, root: C, type: major }
  - { name: A Major, root: A, type: major }
  - { name: A Minor, root: A, type: minor }
  - { name: D Major, root: D, type: major }
  - { name: E Major, root: E, type: major }
  - { name: E Minor, root: E, type: minor }
  - { name: D Minor, root: D, type: minor }

