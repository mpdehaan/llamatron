version: 1.0.468
title: Phrasing
description: a tune heard as written and then breathing, its lines ending early as a singer stops for air
notes: |
  Phrasing: a slow ballad at 64 beats a minute in A minor whose tune is heard twice, first as
  written and then through the Phrasing generator called breath, which ends each line early
  for a breath, as a singer stops for air. The tune's patterns are the same both times.
  Run it with: llamatron examples/learning/25_phrasing.yml --to ableton --replace

  Scene 1, the verse as written: four lines of two bars, each ending on a note held for a bar,
  with no room for air between them.
  Scene 2, the verse breathing: the same pattern with the chain sung on its clip. The first and
  third lines stop three eighths early, the second and fourth five, and in the second and fourth
  the held note comes an eighth early.
  Scene 3, the chorus as written. Its first and third lines are the hook.
  Scene 4, the chorus breathing: the scene's Section is chorus, and the generator's By Section
  table gives a chorus a long breath and no early notes. Every step of the hook is marked in the
  pattern's No Breath row, under Band, so the hook's held note plays whole while the lines
  between stop early.
  Scenes 5 and 6: the verse and the chorus again, breathing.

  Try it: open the generator breath and set Breath to off, or open the pattern chorus tune and
  take the No Breath marks off the hook, and hear the difference.

  When changing this demo:
  - Keep each tune the same pattern in its scene as written and its scene breathing.
  - Keep the hook's steps marked in the No Breath row.
real_time: true
protected: true

