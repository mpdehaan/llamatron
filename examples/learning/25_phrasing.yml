version: 1.0.468
title: Phrasing
description: a tune heard as written, then with each setting of Phrasing changed in turn, then sung with them together
notes: |
  Phrasing: a slow ballad at 68 beats a minute in A minor. One tune is heard again and again, each
  time through a Phrasing generator that changes one thing, so that each setting can be heard
  alone. The tune's pattern is the same in scenes 1 to 4 and 7: only the chain on its clip differs.
  Run it with: llamatron examples/learning/25_phrasing.yml --to ableton --replace

  Scene 1, as written: four lines of two bars, each ending on a note held for a bar. Every note
  is as loud as the next and there is no room for air between the lines.
  Scene 2, a deep breath: each line's last note stops a quarter note early. No note is left out.
  Scene 3, rise and fall: each line starts softer, grows to its held note and no further.
  Scene 4, choppy: every note is short, with space after it.
  Scene 5, short notes: the same tune written with its moving notes an eighth long and a gap
  after each, with no Phrasing.
  Scene 6, flowing: scene 5's pattern with each note held until the next, so the gaps close.
  Flowing changes nothing in a tune whose notes already touch.
  Scene 7, the verse sung: a quick breath, a little rise and fall, notes as written, which is
  what a new Phrasing starts with.
  Scene 8, the chorus sung: a deep breath, a lot of rise and fall, flowing.

  Try it: open the generator called sung and change one list at a time while scene 7 plays.

  When changing this demo:
  - Keep the tune the same pattern in scenes 1 to 4 and 7, and verse tune short the same notes with gaps.
  - Keep scenes 2, 3, 4 and 6 changing one setting each.
real_time: true
protected: true

