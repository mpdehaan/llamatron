phrasings:
  deep breath: { breath: deep, rise_and_fall: none }
  rise and fall: { breath: none, rise_and_fall: a lot }
  choppy: { breath: none, rise_and_fall: none, notes: choppy }
  flowing: { breath: none, rise_and_fall: none, notes: flowing }
  sung: {}
  sung chorus: { breath: deep, rise_and_fall: a lot, notes: flowing }

chains:
  deep breath:
    - phrasing: deep breath
  rise and fall:
    - phrasing: rise and fall
  choppy:
    - phrasing: choppy
  flowing:
    - phrasing: flowing
  sung:
    - phrasing: sung
  sung chorus:
    - phrasing: sung chorus

