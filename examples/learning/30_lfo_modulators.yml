    octave: [3, ~, ~, 3, 3, ~, ~, ~, 3, ~, 3, ~, 3, ~, ~, ~]
    velocity: [120, ~, ~, 120, 120, ~, ~, ~, 120, ~, 120, ~, 120, ~, ~, ~]
    wmod_velocity: [-1, 0, 0, -1, -1, 0, 0, 0, -1, 0, -1, 0, -1, 0, 0, 0]
  - name: hat
    steps: 16
    drum: true
    step_size: 1/16
    degree: [F, F, F, F, F, F, F, F, F, F, F, F, F, F, F, F]
    accidental: ["#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#"]
