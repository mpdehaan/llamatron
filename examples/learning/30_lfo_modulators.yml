    gate: [~, ~, 1/16, ~, ~, ~, 1/16, ~, ~, ~, 1/16, ~, ~, ~, 1/16, ~]
    octave: [~, ~, 4, ~, ~, ~, 4, ~, ~, ~, 4, ~, ~, ~, 4, ~]
