version: 1.0.598
title: LFO Modulators
description: "sparse techno in F minor whose bass, stabs, hats and lead are moved by four modulators, on two sides of different waves"
notes: |
  Modulators: weird techno in F minor, in two songs, side A and side B, which share every
  pattern and differ only in their four modulators, XMod, WMod, YMod and ZMod. A modulator is a
  value that moves by itself like a synthesizer's LFO.
  Run it with: llamatron examples/learning/30_lfo_modulators.yml --to ableton --replace

  Who reads what, on both sides:
  - WMod adds a little to the velocity of every note of the hats, the clap, the bass, the stabs
    and the lead, and takes a little from the kick, a gentle breathing under the beat.
  - XMod moves one bass note and one lead note far along the scale, up to seven degrees.
  - YMod moves the stabs' second chord up, and the lead's last note down, up to five degrees.
  - ZMod holds a random value, and scattered steps of the lead, the last track, mute themselves
    whenever it is high, so its notes drop out unpredictably.
  - In the last scene, the lead's pattern sets XMod back to 0 at the top of every bar.

  Side A: XMod a sine over 2 bars, from 0 to 7; WMod a triangle at 0.3 Hz, from 0 to 12;
  YMod a square over 1 bar, from 0 to 5; ZMod a sample and hold at 3 Hz, from 0 to 10.
  Side B: XMod a saw over 1 bar, from 0 to 7; WMod a reverse saw at 0.4 Hz, from 0 to 12;
  YMod an inverted sine over 4 bars, from 0 to 5; ZMod a sample and hold every quarter bar.

  Each side's first scene ramps the tempo up from 90 to 120 over its 16 bars. The modulators
  counted in bars speed up with it; the ones in Hz keep their pace.

  Try it: on the main screen press M for the Modulators page, and change a shape or a rate.

  When changing this demo:
  - Keep it audible: the velocity breathes gently, one note of each pattern swings its pitch
    widely, and only the last track mutes.
  - Keep the two sides on the same patterns, so that only the modulators differ.
  - Keep one modulator in Hz and one in bars on each side, to hear the difference as the tempo ramps.
real_time: true
protected: true

scales:
  - { name: F Minor, root: F, type: minor }

