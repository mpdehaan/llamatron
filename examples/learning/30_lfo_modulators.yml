    steps: 16
    drum: true
    step_size: 1/16
    degree: [F, F, F, F, F, F, F, F, F, F, F, F, F, F, F, F]
    accidental: ["#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#"]
