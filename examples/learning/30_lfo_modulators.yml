instruments:
  - { name: drum kit, device: "*FluidSynth" }
  - { name: synth bass, device: "*FluidSynth", gm_sound: 39 }
  - { name: synth strings, device: "*FluidSynth", gm_sound: 51 }
  - { name: square lead, device: "*FluidSynth", gm_sound: 81 }

songs:
  - name: side A
    tempo: 120
    scale: F Minor
    genre: Electronic

    modulators:
      XMod: { shape: sine, bars: "2", maximum: 7 }
      WMod: { shape: triangle, rate_in: hertz, hertz: 0.3, maximum: 12 }
      YMod: { shape: square, bars: "1", maximum: 5 }
      ZMod: { shape: sample_and_hold, rate_in: hertz, hertz: 3, maximum: 10 }

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: hat, drum: true, instrument: drum kit }
      - { name: clap, drum: true, instrument: drum kit }
      - { name: bass, instrument: synth bass }
      - { name: stab, instrument: synth strings }
      - { name: lead, instrument: square lead }

    scenes:
      - name: low end
        tempo: 90
        tempo_in_end: 120
        tempo_in_over: 16
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
      - name: stabs
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: stab, pattern: stab, loop: true }
      - name: lead
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: stab, pattern: stab, loop: true }
          - { track: lead, pattern: lead, loop: true }
      - name: weird
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: stab, pattern: stab, loop: true }
          - { track: lead, pattern: lead from the top, loop: true }

  - name: side B
    tempo: 120
    scale: F Minor
    genre: Electronic

    modulators:
      XMod: { shape: saw, bars: "1", maximum: 7 }
      WMod: { shape: reverse_saw, rate_in: hertz, hertz: 0.4, start: 12, maximum: 12 }
      YMod: { shape: sine, invert: true, bars: "4", start: 5, maximum: 5 }
      ZMod: { shape: sample_and_hold, bars: 1/4, maximum: 10 }

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: hat, drum: true, instrument: drum kit }
      - { name: clap, drum: true, instrument: drum kit }
      - { name: bass, instrument: synth bass }
      - { name: stab, instrument: synth strings }
      - { name: lead, instrument: square lead }

    scenes:
      - name: low end
        tempo: 90
        tempo_in_end: 120
        tempo_in_over: 16
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
      - name: stabs
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: stab, pattern: stab, loop: true }
      - name: lead
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: stab, pattern: stab, loop: true }
          - { track: lead, pattern: lead, loop: true }
      - name: weird
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: hat, pattern: hat, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: stab, pattern: stab, loop: true }
          - { track: lead, pattern: lead from the top, loop: true }
