    gate: [1/16, ~, 1/16, ~, 1/16, ~, 1/16, ~, 1/16, ~, 1/16, ~, 1/16, ~, 1/16, ~]
    velocity: [25, ~, 25, ~, 25, ~, 25, ~, 25, ~, 25, ~, 25, ~, 25, ~]
