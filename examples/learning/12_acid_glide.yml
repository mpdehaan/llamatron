version: 1.0.591
title: Acid glide
description: "one acid line whose slides and short notes move with rows of 5, 7 and 3 steps"
notes: |
  Acid glide: fluid acid techno at 128 beats a minute in A minor, one sixteen-note acid line from
  start to finish, and Timing generators putting its slides and its short notes
  somewhere new each time round. Play it on a synth with glide, or portamento, turned on: a gliding note runs into
  the next one, and the synth slides between the two.
  Run it with: llamatron examples/learning/12_acid_glide.yml --to ableton --replace

  A Timing generator's Glide is a row of steps, each on or off, running from each clip's start at its
  own step: a note starting on a step that's on glides into the next. Its Shorten is the same, a note
  starting on a step that's on playing short. Each Timing generator here pairs a Glide with a Shorten
  of the same length. A row shorter than the line, 5 or 7 or 3 steps over 16, lands somewhere new every bar,
  so the slides move through the line though the line never changes.

  Scene 1: the kick and the line, no glide.
  Scene 2: hats, and rows of 5 steps, gliding on the first and fourth, short on the fifth.
  Scene 3: claps, and rows of 7 steps, gliding on the first and fourth, short on the second and
  seventh.
  Scene 4: rows of 3 steps, gliding on the first, short on the third, the tightest cycle.
  Scene 5: breakdown: the 5-step rows with a long glide of a 32nd, slow slides.
  Scene 6: build: the 7-step rows running in eighth notes, half as fast.
  Scene 7: drop: everything, the 7-step rows again, and the drums loosened: a Rush pulls some hats
  early and Drags lay other hats and the claps back, the rows of a Timing generator that move notes in
  time rather than change them.
  Scene 8: outro: the 3-step rows over the kick.

  When changing this demo:
  - Keep the one acid line, its notes as written, so that every slide is a Glide's and every short
    note a Shorten's.
  - Keep the rows of 5, 7 and 3 steps, which never line up with the line's 16.
  - Keep the Rush and the Drags on the drums in the drop, the demo of those two.
real_time: true
protected: true

scales:
  - { name: A Minor, root: A, type: minor }

patterns:
  - name: acid
    steps: 16
    group: acid
    step_size: 1/16
    degree: [1, 1, 1, 1, 3, 1, 5, 1, 1, 7, 1, 4, 1, 3, 1, 5]
    octave: [2, 2, 3, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 3, 2]
    velocity: [110, 85, 85, 85, 110, 85, 85, 85, 110, 85, 85, 85, 110, 85, 85, 85]
  - name: kick
    steps: 4
    drum: true
    group: kick
    step_size: 1/4
    degree: [C, C, C, C]
    octave: [3, 3, 3, 3]
  - name: hats
    steps: 4
    drum: true
    group: hats
    step_size: 1/8
    degree: [~, F, ~, F]
    accidental: [~, "#", ~, "#"]
    octave: [~, 3, ~, 3]
  - name: clap
    steps: 4
    drum: true
    group: clap
    step_size: 1/4
    degree: [~, D, ~, D]
    accidental: [~, "#", ~, "#"]
    octave: [~, 3, ~, 3]

instruments:
  - { name: synth bass, device: "*FluidSynth", gm_sound: 39 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: acid_glide
    tempo: 128
    scale: A Minor
    genre: Electronic

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: hats, drum: true, instrument: drum kit }
      - { name: clap, drum: true, instrument: drum kit }
      - { name: acid, instrument: synth bass }

    scenes:
      - name: no glide
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: acid, pattern: acid, repeat: 12 }
      - name: five steps
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: acid, pattern: acid, repeat: 12, built_in: { timing: { enabled: true, shorten_steps: [false, false, false, false, true], glide_steps: [true, false, false, true, false] } } }
      - name: seven steps
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: acid, pattern: acid, repeat: 12, built_in: { timing: { enabled: true, shorten_steps: [false, true, false, false, false, false, true], glide_steps: [true, false, false, true, false, false, false] } } }
      - name: three steps
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: acid, pattern: acid, repeat: 12, built_in: { timing: { enabled: true, shorten_steps: [false, false, true], glide_steps: [true, false, false] } } }
      - name: "breakdown, long slides"
        clips:
          - { track: acid, pattern: acid, repeat: 12, built_in: { timing: { enabled: true, shorten_steps: [false, false, false, false, true], glide_steps: [true, false, false, true, false], glide_amount: 1/32 } } }
      - name: "build, eighth notes"
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: acid, pattern: acid, repeat: 12, built_in: { timing: { enabled: true, shorten_steps: [false, true, false, false, false, false, true], shorten_step: 1/8, glide_steps: [true, false, false, true, false, false, false], glide_step: 1/8 } } }
      - name: drop
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: hats, pattern: hats, loop: true, built_in: { timing: { enabled: true, rush_steps: [true, false, false, false, false], rush_step: 1/8, drag_steps: [false, false, true, false, true], drag_step: 1/8 } } }
          - { track: clap, pattern: clap, loop: true, built_in: { timing: { enabled: true, drag_steps: [false, true, true], drag_step: 1/4, drag_amount: 25 } } }
          - { track: acid, pattern: acid, repeat: 12, built_in: { timing: { enabled: true, shorten_steps: [false, true, false, false, false, false, true], glide_steps: [true, false, false, true, false, false, false] } } }
      - name: outro
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: acid, pattern: acid, repeat: 12, built_in: { timing: { enabled: true, shorten_steps: [false, false, true], glide_steps: [true, false, false] } } }
