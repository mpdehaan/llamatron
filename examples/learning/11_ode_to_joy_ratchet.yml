  - { name: three ratchet, kind: chain, generators: [{ name: three }] }
  - { name: one_then_three ratchet, kind: chain, generators: [{ name: one_then_three }] }

instruments:
  - { name: sawtooth lead, device: "*FluidSynth", gm_sound: 82 }

songs:
  - name: ode_to_joy_ratchet
    tempo: 144
    scale: D Major
    genre: Electronic

    tracks:
      - { name: tune, instrument: sawtooth lead }

    scenes:
      - name: Long notes
        clips:
          - { track: tune, pattern: long_notes }
      - name: Ratchet 2
        clips:
          - { track: tune, pattern: ratchet_2 }
      - name: Ratchet 3
        clips:
          - { track: tune, pattern: ratchet_3 }
      - name: Ratchet 4
        clips:
          - { track: tune, pattern: ratchet_4 }
      - name: "Ratchet 1 2 3 4, step by step"
        clips:
          - { track: tune, pattern: ratchet_mixed }
      - name: Ratchet building up to 16
        clips:
          - { track: tune, pattern: ratchet_building }
      - name: Ratchet 2 on chords
        clips:
          - { track: tune, pattern: ratchet_chords }
      - name: "Ratchet offset +1 (climbing)"
        clips:
          - { track: tune, pattern: ratchet_offset_up }
      - name: "Ratchet offset -1 (falling)"
        clips:
          - { track: tune, pattern: ratchet_offset_down }
      - name: "Ratchet offset +2 (thirds)"
        clips:
          - { track: tune, pattern: ratchet_offset_thirds }
      - name: "Ratchet 4 at 60% probability"
        clips:
          - { track: tune, pattern: ratchet_probability }
      - name: "AutoRatchet 2, same as Ratchet 2"
        clips:
          - { track: tune, pattern: long_notes, generators: [{ name: two ratchet }] }
      - name: AutoRatchet 4 3 2 1
        clips:
          - { track: tune, pattern: long_notes, generators: [{ name: four_three_two_one ratchet }] }
      - name: AutoRatchet 1 1 1 4
        clips:
          - { track: tune, pattern: long_notes, generators: [{ name: every_fourth_note_rolls ratchet }] }
      - name: "AutoRatchet 1 4, rests skipped"
        clips:
          - { track: tune, pattern: long_notes_with_rests, generators: [{ name: one_then_four ratchet }] }
      - name: AutoRatchet 3 on chords
        clips:
          - { track: tune, pattern: long_chords, generators: [{ name: three ratchet }] }
      - name: AutoRatchet 1 3 over Ratchet 2
        clips:
          - { track: tune, pattern: ratchet_2, generators: [{ name: one_then_three ratchet }] }
      - name: AutoRatchet 2 over Ratchet offset
        clips:
          - { track: tune, pattern: ratchet_offset_up, generators: [{ name: two ratchet }] }
