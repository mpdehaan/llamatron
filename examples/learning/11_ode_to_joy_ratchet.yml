  - { name: four_three_two_one, kind: auto_ratchet, counts: [4, 3, 2, 1] }
  - { name: every_fourth_note_rolls, kind: auto_ratchet, counts: [1, 1, 1, 4] }
  - { name: one_then_four, kind: auto_ratchet, counts: [1, 4] }
  - { name: three, kind: auto_ratchet, counts: [3] }
  - { name: one_then_three, kind: auto_ratchet, counts: [1, 3] }
  - { name: two ratchet, kind: chain, generators: [{ name: two }] }
  - { name: four_three_two_one ratchet, kind: chain, generators: [{ name: four_three_two_one }] }
  - { name: every_fourth_note_rolls ratchet, kind: chain, generators: [{ name: every_fourth_note_rolls }] }
