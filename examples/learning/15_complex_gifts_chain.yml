version: 1.0.591
title: Chain demo
description: Simple Gifts
notes: |
  Chain demo: Simple Gifts on one track, turned from a plain tune into ornaments and arpeggiated triads by chains.
  Run it with: llamatron examples/learning/15_complex_gifts_chain.yml --to ableton --replace

  The tune is the first strain of Simple Gifts, the Shaker song by Joseph Brackett from 1848,
  in A major at 120 BPM as the flutetunes.com transcription has it, with its two-note pickup
  moved to the front so that the pattern loops. Everything plays on a single track, so a
  scene changes only the pattern and the chain.

  There are three patterns: the tune, the tune with every note a Ratchet of 2, and the tune in
  triads. The first scenes paint the tune with one generator each, "doubled" playing the
  ratcheted tune instead; the triad scenes arpeggiate its chords; the last scene plays the tune
  once more as it is written, so that every change can be heard against it.

  When changing this demo:
  Keep it to one track, with chains doing the work, a plain workout of the feature rather
  than a song that leaves the tune. Morphing and directions have their own demos, so they
  don't belong here.
step_size: 1/16
default_octave: 5
default_drum_octave: 3
octave_labels: live
real_time: true
protected: false

scales:
  - { name: A Major, root: A, type: major }

