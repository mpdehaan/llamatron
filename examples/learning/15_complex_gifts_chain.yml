generators:
  - { name: octave_sparkle, kind: arp, step: 1/16, order: up, octave_range: 2 }
  - { name: trill_in_thirds, kind: arp, step: 1/16, order: up, offsets: [0, 2] }
  - { name: triad_up, kind: arp, step: 1/16, order: up }
  - { name: triad_wide, kind: arp, step: 1/16, order: up_down, octave_range: 2 }
  - { name: shred_up, kind: arp, step: 1/32, order: up, offsets: [0, 2, 4, 7] }
  - { name: octave_sparkle arp, kind: chain, generators: [{ name: octave_sparkle }] }
  - { name: trill_in_thirds arp, kind: chain, generators: [{ name: trill_in_thirds }] }
  - { name: shred, kind: chain, generators: [{ name: shred_up }] }
  - { name: triad_up arp, kind: chain, generators: [{ name: triad_up }] }
  - { name: triad_wide arp, kind: chain, generators: [{ name: triad_wide }] }

instruments:
  - { name: flute, device: "*FluidSynth", gm_sound: 74 }

songs:
  - name: complex_gifts_chain
    tempo: 120
    scale: A Major
    genre: Folk

    tracks:
      - { name: gifts, instrument: flute }

    scenes:
      - name: Tune
        clips:
          - { track: gifts, pattern: tune }
      - name: "Tune: octave sparkle"
        clips:
          - { track: gifts, pattern: tune, generators: [{ name: octave_sparkle arp }] }
      - name: "Tune: trill in thirds"
        clips:
          - { track: gifts, pattern: tune, generators: [{ name: trill_in_thirds arp }] }
      - name: "Tune: doubled"
        clips:
          - { track: gifts, pattern: tune_doubled }
      - name: "Tune: shred up"
        clips:
          - { track: gifts, pattern: tune, generators: [{ name: shred }] }
      - name: "Triads: tune in triads"
        clips:
          - { track: gifts, pattern: tune_in_triads }
      - name: "Triads: arpeggiated"
        clips:
          - { track: gifts, pattern: tune_in_triads, generators: [{ name: triad_up arp }] }
      - name: "Triads: two octaves"
        clips:
          - { track: gifts, pattern: tune_in_triads, generators: [{ name: triad_wide arp }] }
      - name: "Tune: reprise"
        clips:
          - { track: gifts, pattern: tune }
