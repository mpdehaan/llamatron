version: 1.0.207
title: Hocket demo
description: a hocketed melody
notes: |
  Hocket demo: voices take turns playing a melody that a silent track holds, one note each,
  called hocketing.
  Run it with: llamatron examples/learning/19_hocket_shanty.yml --to ableton --replace

  The tune is The Wellerman, a New Zealand whaling song from the 19th century, in A minor as
  the sung setting on thesession.org (tune 20383, setting 8) has it, an octave higher. No
  tempo is known from the original, so 100 BPM is an estimate of how it's commonly sung.

  The SILENT melody track plays the verse or the chorus, but its Mute is on, so it isn't
  heard: unmute it on its track editor to hear the tune itself. The Hocket called trade names
  it as its source, and every voice clip runs trade in its chain, over a pattern of rests.
  The voices playing in a scene take turns at the melody's notes, left to right: with one
  voice it plays every note, with two they alternate, and with four each plays every fourth
  note, starting again with the first voice at each scene. Put a different sound on each
  voice, or four patches of one synth, to hear the tune pass between them. Changing a note in
  melody_verse or melody_chorus changes it for whichever voice plays it.

  When changing this demo:
  Keep the voices on patterns of rests, so that every note they play is the Hocket's, and
  add or take away voices scene by scene to show the turns. The muted track has SILENT in
  its name, which a test checks.
real_time: true
protected: true

scales:
  A Minor: { root: A, type: minor }

