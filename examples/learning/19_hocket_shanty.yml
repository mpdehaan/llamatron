hockets:
  trade: { source: SILENT melody }

chains:
  trade:
    - hocket: trade

instruments:
  flute: { device: "*FluidSynth", gm_sound: 74 }
  clarinet: { device: "*FluidSynth", gm_sound: 72 }
  oboe: { device: "*FluidSynth", gm_sound: 69 }
  violin: { device: "*FluidSynth", gm_sound: 41 }

songs:
  hocket_shanty:
    tempo: 100
    scale: A Minor
    genre: Folk

    tracks:
      SILENT melody: { mute: true }
      voice 1: { instrument: flute }
      voice 2: { instrument: clarinet }
      voice 3: { instrument: oboe }
      voice 4: { instrument: violin }

    scenes:
      - name: "Verse: voice 1 alone plays every note"
        tracks:
          SILENT melody: { pattern: melody_verse }
          voice 1: { pattern: turns_verse, chains: [trade] }
      - name: "Chorus: voices 1 and 2 trade notes"
        tracks:
          SILENT melody: { pattern: melody_chorus }
          voice 1: { pattern: turns_chorus, chains: [trade] }
          voice 2: { pattern: turns_chorus, chains: [trade] }
      - name: "Verse: voices 1 to 3"
        tracks:
          SILENT melody: { pattern: melody_verse }
          voice 1: { pattern: turns_verse, chains: [trade] }
          voice 2: { pattern: turns_verse, chains: [trade] }
          voice 3: { pattern: turns_verse, chains: [trade] }
      - name: "Chorus: all four voices"
        tracks:
          SILENT melody: { pattern: melody_chorus }
          voice 1: { pattern: turns_chorus, chains: [trade] }
          voice 2: { pattern: turns_chorus, chains: [trade] }
          voice 3: { pattern: turns_chorus, chains: [trade] }
          voice 4: { pattern: turns_chorus, chains: [trade] }
      - name: "Verse: all four voices"
        tracks:
          SILENT melody: { pattern: melody_verse }
          voice 1: { pattern: turns_verse, chains: [trade] }
          voice 2: { pattern: turns_verse, chains: [trade] }
          voice 3: { pattern: turns_verse, chains: [trade] }
          voice 4: { pattern: turns_verse, chains: [trade] }
      - name: "Chorus: voices 2 and 4"
        tracks:
          SILENT melody: { pattern: melody_chorus }
          voice 2: { pattern: turns_chorus, chains: [trade] }
          voice 4: { pattern: turns_chorus, chains: [trade] }
      - name: "Verse: voices 3 and 4"
        tracks:
          SILENT melody: { pattern: melody_verse }
          voice 3: { pattern: turns_verse, chains: [trade] }
          voice 4: { pattern: turns_verse, chains: [trade] }
