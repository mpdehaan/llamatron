version: 1.0.591
title: Voice leading
description: "block chords on the piano in root position, inverted by hand and voice-led"
notes: |
  Voice leading: an original piece for piano at 96 beats a minute in D major, block chords over
  a bass, where three progressions are each played three ways, back to back, so that you hear
  what voicing does: in root position, every chord jumping up from its root; with the chord
  editor's Inv. row set by hand; and through a Chords generator's Voice leading, which plays each chord
  in the inversion and octave nearest the chord before.
  Run it with: llamatron examples/learning/05_voice_leading.yml --to ableton --replace

  The chords are one pattern, a triad on degree 1 twice a bar, moved by a progression; the bass
  plays the roots, which voice leading leaves alone, since one note has no inversion. The chains
  named "smooth" add the voice leading called smooth after the progression.

  Scenes 1 to 3: Pop, I-V-vi-IV, in root position, by hand (V and IV inverted), and voice-led.
  Scenes 4 to 6: Pachelbel's eight chords, the same three ways.
  Scenes 7 to 9: the circle, vi-ii-V-I, the same three ways, the last voice-led with the root
  kept in the bass, so that the right hand moves above the bass's roots.

  When changing this demo:
  - Keep one chord pattern for every scene, so that only the voicing changes.
  - Keep each progression's three scenes together, in root position, by hand and voice-led.
real_time: true
protected: true

scales:
  - { name: D Major, root: D, type: major }

patterns:
  - name: chords
    steps: 4
    step_size: 1/4
    degree: [1, ~, 1, ~]
    octave: [4, ~, 4, ~]
    chord: [3, ~, 3, ~]
    velocity: [80, ~, 70, ~]
    tie: [false, true, false, true]
  - name: bass
    steps: 4
    step_size: 1/4
    degree: [1, ~, ~, ~]
    octave: [3, ~, ~, ~]
    velocity: [90, ~, ~, ~]
    tie: [false, true, true, true]

generators:
  - { name: pop, kind: chords, mode: progression, chords: [1, 5, 6, 4] }
  - { name: pop by hand, kind: chords, mode: progression, chords: [1, 5, 6, 4], inversions: [~, 1, ~, 2] }
  - { name: pachelbel, kind: chords, mode: progression, chords: [1, 5, 6, 3, 4, 1, 4, 5] }
  - { name: pachelbel by hand, kind: chords, mode: progression, chords: [1, 5, 6, 3, 4, 1, 4, 5], inversions: [~, 1, ~, 1, 2, ~, 2, 1] }
  - { name: circle, kind: chords, mode: progression, chords: [6, 2, 5, 1] }
  - { name: circle by hand, kind: chords, mode: progression, chords: [6, 2, 5, 1], inversions: [~, 2, 1, ~] }
  - { name: smooth, kind: chords }
  - { name: over the bass, kind: chords, root_in_bass: true }
  - { name: pop chords, kind: chain, generators: [{ name: pop }] }
  - { name: pop by hand chords, kind: chain, generators: [{ name: pop by hand }] }
  - { name: pop smooth, kind: chain, generators: [{ name: pop }, { name: smooth }] }
  - { name: pachelbel chords, kind: chain, generators: [{ name: pachelbel }] }
  - { name: pachelbel by hand chords, kind: chain, generators: [{ name: pachelbel by hand }] }
  - { name: pachelbel smooth, kind: chain, generators: [{ name: pachelbel }, { name: smooth }] }
  - { name: circle chords, kind: chain, generators: [{ name: circle }] }
  - { name: circle by hand chords, kind: chain, generators: [{ name: circle by hand }] }
  - { name: circle over the bass, kind: chain, generators: [{ name: circle }, { name: over the bass }] }

instruments:
  - { name: piano, device: "*FluidSynth", gm_sound: 1 }

songs:
  - name: voice_leading
    tempo: 96
    scale: D Major
    genre: Classical

    tracks:
      - { name: right hand, instrument: piano }
      - { name: left hand, instrument: piano }

    scenes:
      - name: "pop, root position"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: pop chords }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: pop chords }], repeat: 8 }
      - name: "pop, by hand"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: pop by hand chords }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: pop chords }], repeat: 8 }
      - name: "pop, voice-led"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: pop smooth }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: pop chords }], repeat: 8 }
      - name: "pachelbel, root position"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: pachelbel chords }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: pachelbel chords }], repeat: 8 }
      - name: "pachelbel, by hand"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: pachelbel by hand chords }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: pachelbel chords }], repeat: 8 }
      - name: "pachelbel, voice-led"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: pachelbel smooth }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: pachelbel chords }], repeat: 8 }
      - name: "circle, root position"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: circle chords }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: circle chords }], repeat: 8 }
      - name: "circle, by hand"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: circle by hand chords }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: circle chords }], repeat: 8 }
      - name: "circle, over the bass"
        clips:
          - { track: right hand, pattern: chords, generators: [{ name: circle over the bass }], repeat: 8 }
          - { track: left hand, pattern: bass, generators: [{ name: circle chords }], repeat: 8 }
