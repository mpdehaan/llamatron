version: 1.0.591
title: Follow Chords
description: "a band stuck on one chord, then following chords written once on a muted track, one player at a time"
notes: |
  Follow Chords: a song at 96 beats a minute in A minor. The bass, the pad and the arpeggio each
  play one bar, written over chord I. The song's chords are written in one place, the muted track
  called SILENT Chords, and the Chords generator called follow, in Follow Progression mode, moves a player's notes to
  whatever chord that track plays at that moment in the same scene.
  Run it with: llamatron examples/learning/22_follow_chords.yml --to ableton --replace

  Scene 1, the chords, heard: Am, F, C and G, a bar each, played plainly by the pad so that the
  chords the band will follow are known.
  Scene 2, the band, not following: the three one-bar patterns as written. Everyone stays on A
  minor and the band sounds stuck.
  Scene 3, the bass follows: the chain follow is on the bass alone. The bass moves with the chords
  while the pad and the arpeggio stay where they were.
  Scene 4, everyone follows.
  Scene 5, with a tune: a lead written note by note over the same chords, with the band under it.
  Scene 6, new chords, same patterns: only the SILENT Chords track's pattern differs, C, G, Am, F.
  Scene 7, two chords a bar: Am, G, F and E, half a bar each. The E is a major chord, from outside
  A minor, and the tracks that follow take its G sharp.
  The pad holds one chord a bar, so the pad takes the first chord of each bar.
  Scene 8, chords from a progression: the SILENT Chords track's pattern holds one chord, and a
  Progression in that clip's chain makes Am, G, F and G of it. What follows reads the chords as
  they come out of the SILENT Chords track, so it never matters how they were written.

  Try it: open the pattern chords written, change a step's degree, and hear the bass, the pad and
  the arpeggio all move.

  When changing this demo:
  - Keep the SILENT Chords track muted, and keep every chord of a scene on that track alone, but
    for scene 1, where the pad plays the same pattern to be heard.
  - Keep the three figures one bar long, written over chord I.
  - Keep scene 2 without the chain and scene 3 with the chain on the bass alone.
real_time: true
protected: true

scales:
  - { name: A Minor, root: A, type: minor }

patterns:
  - name: chords written
    steps: 4
    step_size: 1
    degree: [1, 6, 3, 7]
    octave: [4, 4, 4, 4]
    chord: [3, 3, 3, 3]
  - name: chords brighter
    steps: 4
    step_size: 1
    degree: [3, 7, 1, 6]
    octave: [4, 4, 4, 4]
    chord: [3, 3, 3, 3]
  - name: chords by halves
    steps: 4
    step_size: 1/2
    degree: [1, 7, 6, 5]
    octave: [4, 4, 4, 4]
    chord: [3, 3, 3, M]
  - name: tune
    steps: 32
    step_size: 1/8
    degree: [5, ~, 3, 4, 5, ~, ~, ~, 6, ~, 5, 3, 3, ~, ~, ~, 7, ~, 1, 7, 5, ~, ~, ~, 4, ~, 3, 2, 2, ~, ~, ~]
    octave: [5, ~, 5, 5, 5, ~, ~, ~, 5, ~, 5, 5, 5, ~, ~, ~, 5, ~, 6, 5, 5, ~, ~, ~, 5, ~, 5, 5, 5, ~, ~, ~]
    tie: [false, true, false, false, false, true, true, true, false, true, false, false, false, true, true, true, false, true, false, false, false, true, true, true, false, true, false, false, false, true, true, true]
  - name: one chord
    steps: 1
    step_size: 1
    degree: [1]
    octave: [4]
    chord: [3]
  - name: arpeggio
    steps: 8
    step_size: 1/8
    degree: [1, 3, 5, 1, 5, 3, 5, 3]
    octave: [5, 5, 5, 6, 5, 5, 5, 5]
    velocity: [96, 70, 80, 90, 70, 80, 70, 80]
  - name: bass
    steps: 8
    step_size: 1/8
    degree: [1, ~, 1, ~, 5, ~, 1, 5]
    octave: [3, ~, 3, ~, 3, ~, 3, 3]
  - name: pad
    steps: 4
    step_size: 1/4
    degree: [1, ~, ~, ~]
    octave: [4, ~, ~, ~]
    chord: [3, ~, ~, ~]
    velocity: [70, ~, ~, ~]
    tie: [false, true, true, true]
  - name: kick
    steps: 4
    drum: true
    step_size: 1/4
    degree: [C, ~, C, ~]
    octave: [3, ~, 3, ~]
  - name: snare
    steps: 4
    drum: true
    step_size: 1/4
    degree: [~, D, ~, D]
    octave: [~, 3, ~, 3]
  - name: hats
    steps: 8
    drum: true
    step_size: 1/8
    degree: [F, F, F, F, F, F, F, F]
    accidental: ["#", "#", "#", "#", "#", "#", "#", "#"]
    octave: [3, 3, 3, 3, 3, 3, 3, 3]
    velocity: [90, 60, 80, 60, 90, 60, 80, 60]

generators:
  - { name: down and back, kind: chords, mode: progression, chords: [1, 7, 6, 7] }
  - { name: follow, kind: chords, mode: follow_progression, chords_from: SILENT Chords }
  - { name: follow chords followed, kind: chain, generators: [{ name: follow }] }
  - { name: down and back chords, kind: chain, generators: [{ name: down and back }] }

instruments:
  - { name: finger bass, device: "*FluidSynth", gm_sound: 34 }
  - { name: warm pad, device: "*FluidSynth", gm_sound: 90 }
  - { name: electric piano, device: "*FluidSynth", gm_sound: 5 }
  - { name: flute, device: "*FluidSynth", gm_sound: 74 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: follow_chords
    tempo: 96
    scale: A Minor
    genre: Pop

    tracks:
      - { name: SILENT Chords, mute: true, instrument: warm pad }
      - { name: kick, drum: true, instrument: drum kit }
      - { name: snare, drum: true, instrument: drum kit }
      - { name: hats, drum: true, instrument: drum kit }
      - { name: bass, instrument: finger bass }
      - { name: pad, instrument: warm pad }
      - { name: arpeggio, instrument: electric piano }
      - { name: lead, instrument: flute }

    scenes:
      - name: "the chords, heard"
        clips:
          - { track: SILENT Chords, pattern: chords written, repeat: 2 }
          - { track: pad, pattern: chords written, repeat: 2 }
      - name: "the band, not following"
        clips:
          - { track: SILENT Chords, pattern: chords written, repeat: 2 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: bass, repeat: 8 }
          - { track: pad, pattern: pad, repeat: 8 }
          - { track: arpeggio, pattern: arpeggio, repeat: 8 }
      - name: the bass follows
        clips:
          - { track: SILENT Chords, pattern: chords written, repeat: 2 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: pad, pattern: pad, repeat: 8 }
          - { track: arpeggio, pattern: arpeggio, repeat: 8 }
      - name: everyone follows
        clips:
          - { track: SILENT Chords, pattern: chords written, repeat: 2 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: pad, pattern: pad, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: arpeggio, pattern: arpeggio, generators: [{ name: follow chords followed }], repeat: 8 }
      - name: with a tune
        clips:
          - { track: SILENT Chords, pattern: chords written, repeat: 2 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: pad, pattern: pad, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: arpeggio, pattern: arpeggio, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: lead, pattern: tune, repeat: 2 }
      - name: "new chords, same patterns"
        clips:
          - { track: SILENT Chords, pattern: chords brighter, repeat: 2 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: pad, pattern: pad, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: arpeggio, pattern: arpeggio, generators: [{ name: follow chords followed }], repeat: 8 }
      - name: two chords a bar
        clips:
          - { track: SILENT Chords, pattern: chords by halves, repeat: 4 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: pad, pattern: pad, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: arpeggio, pattern: arpeggio, generators: [{ name: follow chords followed }], repeat: 8 }
      - name: chords from a Progression
        clips:
          - { track: SILENT Chords, pattern: one chord, generators: [{ name: down and back chords }], repeat: 8 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: pad, pattern: pad, generators: [{ name: follow chords followed }], repeat: 8 }
          - { track: arpeggio, pattern: arpeggio, generators: [{ name: follow chords followed }], repeat: 8 }
