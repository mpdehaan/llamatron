follow_chords:
  follow: { chords_from: SILENT Chords }

musicians:
  rhythm guitar:
    instrument: rhythm guitarist
    chords_from: SILENT Chords
    tune_from: tune
    accents: backbeat
    by_section:
      verse: { played: softer }
      breakdown: { played: muted }
  bass:
    instrument: bassist
    chords_from: SILENT Chords
    by_section:
      breakdown: { played: hits }
  organ:
    instrument: backing organ
    chords_from: SILENT Chords
    tune_from: tune
    by_section:
      verse: { plays: false }
      breakdown: { plays: false }
  lead guitar:
    instrument: lead guitarist
    chords_from: SILENT Chords
    tune_from: tune
    by_section:
      breakdown: { plays: false }
  hats:
    instrument: drummer
    looseness: 1
    by_section:
      verse: { played: thinned }
      breakdown: { plays: false }
  snare:
    instrument: drummer
    by_section:
      breakdown: { plays: false }

chains:
  follow:
    - follow_chords: follow
  rhythm guitar:
    - musician: rhythm guitar
  bass:
    - musician: bass
  organ:
    - musician: organ
  lead guitar:
    - musician: lead guitar
  hats:
    - musician: hats
  snare:
    - musician: snare

