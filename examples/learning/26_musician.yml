version: 1.0.487
title: Musician
description: a band that plays its patterns as written, then the same patterns played by musicians who know a verse from a chorus and leave room for the tune
notes: |
  Musician: a band at 104 beats a minute in G major. Every player has one bar, written over chord
  I, and the song's chords are written once, on the muted track called SILENT Chords. The patterns
  are the same in every scene: only who plays them differs.
  Run it with: llamatron examples/learning/26_musician.yml --to ableton --replace

  Scene 1, as written: each pattern goes through a Follow Chords generator and nothing else. Every
  player plays every note all the time, the lead guitar on top of the tune.
  Scene 2, a verse: each clip is played by a Musician instead. The rhythm guitar plays softer, the
  hi-hat keeps to the beats, the organ sits out, and the lead guitar plays only where the tune
  rests, since a lead guitarist plays in the gaps.
  Scene 3, a chorus: everyone plays the part whole. The organ comes in and holds each chord into
  the next, as an organ does, and the rhythm guitar still backs off a little under the tune.
  Scenes 4 and 5, the second verse and chorus: the same players, who know which is which.
  Scene 6, a breakdown: the bass plays a hit at the start of each bar, the rhythm guitar is
  muted, and the snare and the hi-hat sit out.
  Scene 7, the last chorus.

  Try it: open the generator called rhythm guitar, open the heading In a verse, and change Played
  while scene 2 plays. Then change Gives way on the generator called lead guitar to not at all.

  When changing this demo:
  - Keep every pattern the same in all seven scenes, and scene 1 without a Musician.
  - Keep the SILENT Chords track muted and every scene's kind of section set.
real_time: true
protected: true

