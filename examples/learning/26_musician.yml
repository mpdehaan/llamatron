    velocity: [76, ~, 70, ~]
  bass:
    steps: 8
    step_size: 1/8
    degree: [1, ~, 1, 1, 5, ~, 1, 5]
    octave: [3, ~, 3, 3, 3, ~, 3, 3]
    velocity: [104, ~, 88, 92, 96, ~, 88, 92]
  kick:
    steps: 8
    drum: true
    step_size: 1/8
    degree: [C, ~, ~, C, C, ~, ~, ~]
    octave: [3, ~, ~, 3, 3, ~, ~, ~]
  snare:
