version: 1.0.591
title: Blues chords
description: a twelve-bar shuffle blues in G from one-bar patterns
notes: |
  Blues chords: a shuffle blues at 96 beats a minute in G, six choruses of twelve bars, where
  the walking bass, the comping chords and the riff are each one bar long, written over chord I
  and played through a twelve-bar Progression.
  Run it with: llamatron examples/learning/07_blues_chords.yml --to ableton --replace

  A blues needs a dominant seventh on I, IV and V, which no scale's own chords give. The comp
  writes its chord as dom7 on G, G B D F, and the F, which isn't in G major, keeps its distance
  from the scale note below it as the progression moves it: on IV the chord plays C E G Bb, C7,
  and on V D F# A C, D7. The riff's blue note, Bb, a flat third, moves the same way, to Eb over
  C and F over D. The song shuffles with the factory groove 8th swing 66.

  Scene 1: the drums, the bass and the comp, through the twelve-bar blues,
  I I I I - IV IV I I - V IV I V.
  Scene 2: the riff joins.
  Scene 3: the quick-change blues, which goes to IV in the second bar: I IV I I - IV IV I I - V IV I V.
  Scene 4: the riff an octave up, on a track transposed up seven scale steps.
  Scene 5: the twelve-bar blues again, everything playing.
  Scene 6: the last chorus, its progression ending on I instead of the turnaround's V.

  When changing this demo:
  - Keep the bass, the comp and the riff one bar long, written over chord I.
  - Keep the comp's chord a dom7, so that every chord of the blues is a dominant seventh.
real_time: true
protected: true

scales:
  - { name: G Major, root: G, type: major }

patterns:
  - name: walk
    steps: 4
    step_size: 1/4
    degree: [1, 3, 5, 6]
    octave: [2, 2, 2, 2]
  - name: comp
    steps: 8
    step_size: 1/8
    degree: [~, ~, 1, ~, ~, ~, 1, ~]
    octave: [~, ~, 4, ~, ~, ~, 4, ~]
    chord: [~, ~, dom7, ~, ~, ~, dom7, ~]
    velocity: [~, ~, 90, ~, ~, ~, 80, ~]
  - name: riff
    steps: 8
    step_size: 1/8
    degree: [1, 3, 3, 5, 6, 5, 3, ~]
    accidental: [~, b, ~, ~, ~, ~, b, ~]
    octave: [5, 5, 5, 5, 5, 5, 5, ~]
    velocity: [100, 80, 90, 80, 95, 80, 85, ~]
  - name: kick
    steps: 4
    drum: true
    step_size: 1/4
    degree: [C, ~, C, ~]
    octave: [3, ~, 3, ~]
  - name: snare
    steps: 4
    drum: true
    step_size: 1/4
    degree: [~, D, ~, D]
    octave: [~, 3, ~, 3]
  - name: hats
    steps: 8
    drum: true
    step_size: 1/8
    degree: [F, F, F, F, F, F, F, F]
    accidental: ["#", "#", "#", "#", "#", "#", "#", "#"]
    octave: [3, 3, 3, 3, 3, 3, 3, 3]
    velocity: [90, 60, 80, 60, 90, 60, 80, 60]

generators:
  - { name: twelve bar, kind: chords, mode: progression, chords: [1, 1, 1, 1, 4, 4, 1, 1, 5, 4, 1, 5] }
  - { name: quick change, kind: chords, mode: progression, chords: [1, 4, 1, 1, 4, 4, 1, 1, 5, 4, 1, 5] }
  - { name: ending, kind: chords, mode: progression, chords: [1, 1, 1, 1, 4, 4, 1, 1, 5, 4, 1, 1] }
  - { name: twelve bar chords, kind: chain, generators: [{ name: twelve bar }] }
  - { name: quick change chords, kind: chain, generators: [{ name: quick change }] }
  - { name: ending chords, kind: chain, generators: [{ name: ending }] }

instruments:
  - { name: finger bass, device: "*FluidSynth", gm_sound: 34 }
  - { name: electric piano, device: "*FluidSynth", gm_sound: 5 }
  - { name: clean guitar, device: "*FluidSynth", gm_sound: 28 }
  - { name: harmonica, device: "*FluidSynth", gm_sound: 23 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: blues_chords
    tempo: 96
    scale: G Major
    groove: 8th swing 66
    genre: Blues

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: snare, drum: true, instrument: drum kit }
      - { name: hats, drum: true, instrument: drum kit }
      - { name: bass, instrument: finger bass }
      - { name: comp, instrument: electric piano }
      - { name: riff, instrument: clean guitar }
      - { name: riff high, transpose: 7, instrument: harmonica }

    scenes:
      - name: twelve bar
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: walk, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: comp, pattern: comp, generators: [{ name: twelve bar chords }], repeat: 12 }
      - name: the riff
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: walk, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: comp, pattern: comp, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: riff, pattern: riff, generators: [{ name: twelve bar chords }], repeat: 12 }
      - name: quick change
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: walk, generators: [{ name: quick change chords }], repeat: 12 }
          - { track: comp, pattern: comp, generators: [{ name: quick change chords }], repeat: 12 }
          - { track: riff, pattern: riff, generators: [{ name: quick change chords }], repeat: 12 }
      - name: riff up an octave
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: walk, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: comp, pattern: comp, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: riff high, pattern: riff, generators: [{ name: twelve bar chords }], repeat: 12 }
      - name: everything
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: walk, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: comp, pattern: comp, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: riff, pattern: riff, generators: [{ name: twelve bar chords }], repeat: 12 }
          - { track: riff high, pattern: riff, generators: [{ name: twelve bar chords }], repeat: 12 }
      - name: last chorus
        clips:
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: bass, pattern: walk, generators: [{ name: ending chords }], repeat: 12 }
          - { track: comp, pattern: comp, generators: [{ name: ending chords }], repeat: 12 }
          - { track: riff, pattern: riff, generators: [{ name: ending chords }], repeat: 12 }
