version: 1.0.521
title: Accents
description: one funk groove played flat, then with accents switched on a part at a time
notes: |
  Accents: a funk groove at 100 beats a minute in E minor, written with no velocity typed on any
  step. Every part plays at the Default velocity of its track, and a step whose Accent switch is
  on plays louder by the Accent of the track.
  Run it with: llamatron examples/learning/28_accents.yml --to ableton --replace

  Scene 1, no accents: four bars of the groove with every Accent switch off. Each part plays at
  one loudness, and the groove sounds typed.
  Scene 2, hats on the beat: the hats accent the first sixteenth of every beat.
  Scene 3, hats off the beat: the same hats accent the "and" of every beat, and the groove leans
  the other way.
  Scene 4, backbeat and ghost notes: the snare's track has a Default velocity of 38 and an Accent
  of 75, so its notes are ghost notes but for beats 2 and 4, which are accented.
  Scene 5, the bass and the keys: the bass accents its syncopations and the keys two of their stabs.
  Scene 6, hats in threes: the hats accent every third sixteenth, across the beat.
  Scene 7, no accents again: the first scene once more, to hear what the switches did.

  The bass has no Default velocity of its own: the track editor shows the value of its
  instrument, finger bass. The bass track's Accent is added to that instrument's Accent.

  Try it: open the track editor of the hats and raise Accent, or open the pattern hats on the beat
  and move the switches on the Accent row.

  When changing this demo:
  - Type no velocity on any step: loudness comes from Default velocity and Accent alone.
  - Keep the first scene and the last with no accents, four bars each; the scenes between are ten bars.
real_time: true
protected: true

