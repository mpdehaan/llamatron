instruments:
  finger bass: { device: "*FluidSynth", gm_sound: 34, default_velocity: 84, accent: 10 }
  clavinet: { device: "*FluidSynth", gm_sound: 8 }
  drum kit: { device: "*FluidSynth" }

songs:
  accents:
    tempo: 100
    scale: E Minor
    genre: Exercise

    tracks:
      kick: { drum: true, instrument: drum kit, default_velocity: 110 }
      snare: { drum: true, instrument: drum kit, default_velocity: 38, accent: 75 }
      hats: { drum: true, instrument: drum kit, default_velocity: 58, accent: 40 }
      bass: { instrument: finger bass, accent: 25 }
      keys: { instrument: clavinet, default_velocity: 66, accent: 40 }

    scenes:
      - name: "no accents"
        tracks:
          kick: { pattern: kick, repeat: 4 }
          snare: { pattern: snare plain, repeat: 4 }
          hats: { pattern: hats plain, repeat: 4 }
          bass: { pattern: bass plain, repeat: 4 }
          keys: { pattern: keys plain, repeat: 4 }
      - name: "hats on the beat"
        tracks:
          kick: { pattern: kick, repeat: 10 }
          snare: { pattern: snare plain, repeat: 10 }
          hats: { pattern: hats on the beat, repeat: 10 }
          bass: { pattern: bass plain, repeat: 10 }
          keys: { pattern: keys plain, repeat: 10 }
      - name: "hats off the beat"
        tracks:
          kick: { pattern: kick, repeat: 10 }
          snare: { pattern: snare plain, repeat: 10 }
          hats: { pattern: hats off the beat, repeat: 10 }
          bass: { pattern: bass plain, repeat: 10 }
          keys: { pattern: keys plain, repeat: 10 }
      - name: "backbeat and ghost notes"
        tracks:
          kick: { pattern: kick, repeat: 10 }
          snare: { pattern: snare backbeat, repeat: 10 }
          hats: { pattern: hats on the beat, repeat: 10 }
          bass: { pattern: bass plain, repeat: 10 }
          keys: { pattern: keys plain, repeat: 10 }
      - name: "the bass and the keys"
        tracks:
          kick: { pattern: kick, repeat: 10 }
          snare: { pattern: snare backbeat, repeat: 10 }
          hats: { pattern: hats on the beat, repeat: 10 }
          bass: { pattern: bass accented, repeat: 10 }
          keys: { pattern: keys accented, repeat: 10 }
      - name: "hats in threes"
        tracks:
          kick: { pattern: kick, repeat: 10 }
          snare: { pattern: snare backbeat, repeat: 10 }
          hats: { pattern: hats in threes, repeat: 10 }
          bass: { pattern: bass accented, repeat: 10 }
          keys: { pattern: keys accented, repeat: 10 }
      - name: "no accents again"
        tracks:
          kick: { pattern: kick, repeat: 4 }
          snare: { pattern: snare plain, repeat: 4 }
          hats: { pattern: hats plain, repeat: 4 }
          bass: { pattern: bass plain, repeat: 4 }
          keys: { pattern: keys plain, repeat: 4 }
