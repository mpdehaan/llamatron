swells:
  hits: { start: 100, end: 100, accent: 30 }

chains:
  hits:
    - swell: hits

instruments:
  flute: { device: "*FluidSynth", gm_sound: 74 }
  clarinet: { device: "*FluidSynth", gm_sound: 72 }
  strings: { device: "*FluidSynth", gm_sound: 49 }
  contrabass: { device: "*FluidSynth", gm_sound: 44 }
  brass: { device: "*FluidSynth", gm_sound: 62 }
  timpani: { device: "*FluidSynth", gm_sound: 48 }
  drum kit: { device: "*FluidSynth" }

songs:
  bolero_swell:
    tempo: 72
    time_signature: 3/4
    scale: C Major
    genre: Classical

    tracks:
      snare: { drum: true, instrument: drum kit }
      flute: { instrument: flute }
      clarinet: { transpose: -7, instrument: clarinet }
      strings: { instrument: strings }
      bass: { instrument: contrabass }
      brass: { instrument: brass }
      timpani: { instrument: timpani }

    scenes:
      - name: the snare alone
        swell_start: 35
        swell_end: 40
        tracks:
          snare: { pattern: snare, repeat: 4 }
      - name: the flute
        swell_start: 40
        swell_end: 46
        tracks:
          snare: { pattern: snare, repeat: 4 }
          flute: { pattern: tune, loop: true }
      - name: louder
        swell_start: 46
        swell_end: 52
        tracks:
          snare: { pattern: snare, repeat: 4 }
          flute: { pattern: tune, loop: true }
      - name: the bass
        swell_start: 52
        swell_end: 59
        tracks:
          snare: { pattern: snare, repeat: 4 }
          flute: { pattern: tune, loop: true }
          bass: { pattern: bass, loop: true }
      - name: the clarinet
        swell_start: 59
        swell_end: 67
        tracks:
          snare: { pattern: snare, repeat: 4 }
          clarinet: { pattern: tune, loop: true }
          bass: { pattern: bass, loop: true }
      - name: strings
        swell_start: 67
        swell_end: 76
        tracks:
          snare: { pattern: snare, repeat: 4 }
          clarinet: { pattern: tune, loop: true }
          strings: { pattern: tune, loop: true }
          bass: { pattern: bass, loop: true }
      - name: brass
        swell_start: 76
        swell_end: 87
        tracks:
          snare: { pattern: snare, repeat: 4 }
          clarinet: { pattern: tune, loop: true }
          strings: { pattern: tune, loop: true }
          bass: { pattern: bass, loop: true }
          brass: { pattern: chords, loop: true }
      - name: everyone
        swell_start: 87
        swell_end: 100
        tracks:
          snare: { pattern: snare, repeat: 4 }
          flute: { pattern: tune, loop: true }
          clarinet: { pattern: tune, loop: true }
          strings: { pattern: tune, loop: true }
          bass: { pattern: bass, loop: true }
          brass: { pattern: chords, loop: true }
      - name: the final chords
        swell_start: 100
        swell_end: 100
        tracks:
          snare: { pattern: final_snare, repeat: 1 }
          strings: { pattern: final_chords, loop: true }
          brass: { pattern: final_chords, loop: true }
          bass: { pattern: final_bass, loop: true }
          timpani: { pattern: timpani, chains: [hits], loop: true }
