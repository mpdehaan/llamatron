arps:
  bubble: { step: 1/16, order: up, octave_range: 2 }

auto_ratchets:
  stutter: { counts: [2] }

chains:
  bubble:
    - arp: bubble
  bubble and stutter:
    - arp: bubble
    - auto_ratchet: stutter

grooves:
  behind the beat: { cells: [12, 44], cell_length: 1/8 }
  hard shuffle: { cells: [0, 44], cell_length: 1/8 }

instruments:
  tenor sax: { device: "*FluidSynth", gm_sound: 67 }
  acoustic bass: { device: "*FluidSynth", gm_sound: 33 }
  drawbar organ: { device: "*FluidSynth", gm_sound: 17 }
  drum kit: { device: "*FluidSynth" }

songs:
  groove:
    tempo: 130
    scale: G Minor
    groove: 8th swing 66
    genre: Blues

    tracks:
      lead: { instrument: tenor sax }
      pedals: { groove: 8th swing 58, instrument: acoustic bass }
      pads: { groove: swing 62, instrument: drawbar organ }
      drums: { drum: true, groove: false, instrument: drum kit }
      hats: { drum: true, instrument: drum kit }

    scenes:
      - name: The shuffle
        tracks:
          lead: { pattern: lick }
          pedals: { pattern: pedals }
          pads: { pattern: changes, chains: [bubble] }
          drums: { pattern: kick_snare, loop: true }
          hats: { pattern: hats, loop: true }
      - name: Straight
        groove: false
        tracks:
          lead: { pattern: lick }
          pedals: { pattern: pedals }
          pads: { pattern: changes, chains: [bubble] }
          drums: { pattern: kick_snare, loop: true }
          hats: { pattern: hats, loop: true }
      - name: Behind the beat
        groove: behind the beat
        tracks:
          lead: { pattern: lick }
          pedals: { pattern: pedals }
          pads: { pattern: changes, chains: [bubble] }
          drums: { pattern: kick_snare, loop: true }
          hats: { pattern: hats, loop: true }
      - name: Hard shuffle
        groove: hard shuffle
        tracks:
          lead: { pattern: lick }
          pedals: { pattern: pedals }
          pads: { pattern: changes, chains: [bubble] }
          drums: { pattern: kick_snare, loop: true }
          hats: { pattern: hats, loop: true }
      - name: Bubbling pads
        tracks:
          lead: { pattern: lick }
          pedals: { pattern: pedals }
          pads: { pattern: changes, chains: [bubble and stutter] }
          drums: { pattern: kick_snare, loop: true }
          hats: { pattern: hats, loop: true }
