version: 1.0.591
title: Direction demo
description: one theme in every step direction
notes: |
  Direction demo: one theme played in each of llamatron's step directions.
  Run it with: llamatron examples/learning/10_mtn_king_direction.yml --to ableton --replace

  The theme is the opening of Grieg's In the Hall of the Mountain King (1875), in B minor at
  138 BPM as the flutetunes.com transcription has it, with its short detached notes written
  as plain eighths. Its F and C naturals use the Accidental row. A pedal bass loops under it.

  Each scene plays the theme twice. A direction changes the order the steps play in, but
  never how long a pass lasts: the last step is cut to fit, so every scene is the same
  length. Positions carry on from the first pass into the second, which you can hear in
  pendulum, random and brownian. Random directions choose differently each render unless the
  song sets a seed.

  A direction can be set on a pattern, like theme_pendulum, or on a clip, and a clip's
  direction overrides its pattern's, which the last scenes show. So "Pattern direction:
  pendulum" sounds like "Clip direction: pendulum", and "Clip forward overrides pattern"
  sounds like "Clip direction: forward", on purpose. The last scene reverses the pedal too.

  When changing this demo:
  Two pairs of scenes sound alike on purpose: a direction set on the pattern and the same
  one on the clip, and a clip's forward overriding a pendulum pattern.
real_time: true
protected: true

scales:
  - { name: B Minor, root: B, type: minor }

patterns:
  - name: theme
    steps: 32
    step_size: 1/8
    degree: [1, 2, 3, 4, 5, 3, 5, ~, 5, 2, 5, ~, 4, 2, 4, ~, 1, 2, 3, 4, 5, 3, 5, 1, 7, 5, 3, 5, 7, ~, ~, ~]
    gate: [~, ~, ~, ~, ~, ~, 1/4, ~, ~, ~, 1/4, ~, ~, ~, 1/4, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, 1/2, ~, ~, ~]
    accidental: [~, ~, ~, ~, ~, ~, ~, ~, b, ~, b, ~, ~, b, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
    octave: [4, 4, 4, 4, 4, 4, 4, ~, 4, 4, 4, ~, 4, 4, 4, ~, 4, 4, 4, 4, 4, 4, 4, 5, 4, 4, 4, 4, 4, ~, ~, ~]
  - name: theme_pendulum
    steps: 32
    step_size: 1/8
    direction: pendulum
    degree: [1, 2, 3, 4, 5, 3, 5, ~, 5, 2, 5, ~, 4, 2, 4, ~, 1, 2, 3, 4, 5, 3, 5, 1, 7, 5, 3, 5, 7, ~, ~, ~]
    gate: [~, ~, ~, ~, ~, ~, 1/4, ~, ~, ~, 1/4, ~, ~, ~, 1/4, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, 1/2, ~, ~, ~]
    accidental: [~, ~, ~, ~, ~, ~, ~, ~, b, ~, b, ~, ~, b, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
    octave: [4, 4, 4, 4, 4, 4, 4, ~, 4, 4, 4, ~, 4, 4, 4, ~, 4, 4, 4, 4, 4, 4, 4, 5, 4, 4, 4, 4, 4, ~, ~, ~]
  - name: pedal
    steps: 4
    step_size: 1/4
    degree: [1, 3, 5, 7]
    octave: [3, 3, 2, 2]

instruments:
  - { name: marimba, device: "*FluidSynth", gm_sound: 13 }
  - { name: cello, device: "*FluidSynth", gm_sound: 43 }

songs:
  - name: mtn_king_direction
    tempo: 138
    scale: B Minor
    genre: Electronic

    tracks:
      - { name: theme, instrument: marimba }
      - { name: pedal, instrument: cello }

    scenes:
      - name: "Clip direction: forward"
        clips:
          - { track: theme, pattern: theme, repeat: 2 }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Clip direction: reverse_a"
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: reverse_a }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Clip direction: reverse_b"
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: reverse_b }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Clip direction: alternate"
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: alternate }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Clip direction: pendulum"
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: pendulum }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Clip direction: random"
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: random }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Clip direction: brownian"
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: brownian }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Clip direction: eitherway"
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: eitherway }
          - { track: pedal, pattern: pedal, loop: true }
      - name: "Pattern direction: pendulum"
        clips:
          - { track: theme, pattern: theme_pendulum, repeat: 2 }
          - { track: pedal, pattern: pedal, loop: true }
      - name: Clip forward overrides pattern
        clips:
          - { track: theme, pattern: theme_pendulum, repeat: 2, direction: forward }
          - { track: pedal, pattern: pedal, loop: true }
      - name: Theme and pedal both reverse_a
        clips:
          - { track: theme, pattern: theme, repeat: 2, direction: reverse_a }
          - { track: pedal, pattern: pedal, loop: true, direction: reverse_a }
