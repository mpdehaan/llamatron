instruments:
  - { name: synth bass, device: "*FluidSynth", gm_sound: 39 }
  - { name: warm pad, device: "*FluidSynth", gm_sound: 90 }
  - { name: glockenspiel, device: "*FluidSynth", gm_sound: 10 }
  - { name: electric piano, device: "*FluidSynth", gm_sound: 5 }
  - { name: vibraphone, device: "*FluidSynth", gm_sound: 12 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: tie
    tempo: 84
    scale: D Mixolydian
    genre: Electronic

    draws:
      AD: { slots: [8, 16, 24, 32] }

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: snare, drum: true, instrument: drum kit }
      - { name: hat, drum: true, instrument: drum kit }
      - { name: bass, instrument: synth bass }
      - { name: pad, cc: [74, ~, ~, ~], instrument: warm pad }
      - { name: bells, instrument: glockenspiel }
      - { name: keys, instrument: electric piano }
      - { name: echo, transpose: 7, instrument: vibraphone }

    scenes:
      - name: dawn
        clips:
          - { track: pad, pattern: pad_rise }
      - name: haze
        clips:
          - { track: bass, pattern: bass, repeat: 2 }
          - { track: pad, pattern: pad, loop: true }
          - { track: bells, pattern: bells, loop: true, built_in: { arp: { enabled: true, step: 1/8, order: up_down } } }
      - name: tape
        clips:
          - { track: kick, pattern: kick, repeat: 4 }
          - { track: snare, pattern: snare, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: pad, pattern: pad, loop: true }
          - { track: bells, pattern: bells, loop: true, built_in: { arp: { enabled: true, step: 1/8, order: up_down } } }
      - name: kids
        clips:
          - { track: kick, pattern: kick, repeat: 8 }
          - { track: snare, pattern: snare, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: pad, pattern: pad, loop: true }
          - { track: keys, pattern: tune, loop: true }
      - name: answer
        clips:
          - { track: kick, pattern: kick, repeat: 8 }
          - { track: snare, pattern: snare, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: pad, pattern: pad, loop: true }
          - { track: bells, pattern: bells, loop: true, built_in: { arp: { enabled: true, step: 1/8, order: up_down } } }
          - { track: keys, pattern: tune, repeat: 2, morph_to: answer, morph_style: right }
          - { track: echo, pattern: echo, loop: true, grab_track: keys }
      - name: shade
        scale: D Minor
        clips:
          - { track: hat, pattern: hat, repeat: 8 }
          - { track: bass, pattern: bass, loop: true }
          - { track: pad, pattern: pad_sweep, loop: true }
          - { track: keys, pattern: answer, loop: true, direction: reverse_b }
          - { track: echo, pattern: echo, loop: true, grab_track: keys }
      - name: bloom
        clips:
          - { track: kick, pattern: kick, repeat: 8 }
          - { track: snare, pattern: snare, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: pad, pattern: pad, loop: true }
          - { track: bells, pattern: bells, loop: true, built_in: { arp: { enabled: true, step: 1/16, order: up_down, octave_range: 2, octave_jump: after_chord } } }
          - { track: keys, pattern: answer, loop: true }
          - { track: echo, pattern: echo, loop: true, grab_track: keys }
      - name: slow
        repeat: 2
        tempo_in_end: 72
        tempo_in_over: 8
        clips:
          - { track: bass, pattern: bass }
          - { track: pad, pattern: pad, loop: true }
          - { track: bells, pattern: bells, loop: true, built_in: { arp: { enabled: true, step: 1/8, order: up_down } } }
      - name: home
        scale: D Major
        tempo: 72
        clips:
          - { track: bass, pattern: bass_end }
          - { track: pad, pattern: pad_end, loop: true }
          - { track: bells, pattern: bells_end, loop: true, built_in: { arp: { enabled: true, step: 1/8, order: up_down } } }
          - { track: keys, pattern: tune_end, loop: true }
