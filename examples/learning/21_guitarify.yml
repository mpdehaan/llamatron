    group: steel
    step_size: 1
    degree: [1, 6, 4, 5]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, 3]
  - name: chime
    steps: 4
    group: clean
    step_size: 1
    degree: [1, 7, 4, 1]
    accidental: [~, b, ~, ~]
    octave: [3, 3, 3, 3]
    chord: [3, M, 3, 3]
  - name: backbeat
