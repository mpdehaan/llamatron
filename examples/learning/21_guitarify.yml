  - { name: steel guitar, device: "*FluidSynth", gm_sound: 26 }
  - { name: jazz guitar, device: "*FluidSynth", gm_sound: 27 }
  - { name: clean guitar, device: "*FluidSynth", gm_sound: 28 }
  - { name: muted guitar, device: "*FluidSynth", gm_sound: 29 }
  - { name: overdriven guitar, device: "*FluidSynth", gm_sound: 30 }
  - { name: distortion guitar, device: "*FluidSynth", gm_sound: 31 }

songs:
  - name: guitarify
    tempo: 104
    scale: G Major
    genre: Exercise

    tracks:
      - { name: nylon, instrument: nylon guitar }
      - { name: steel, instrument: steel guitar }
      - { name: jazz, instrument: jazz guitar }
      - { name: clean, instrument: clean guitar }
      - { name: muted, instrument: muted guitar }
      - { name: overdriven, instrument: overdriven guitar }
      - { name: distortion, instrument: distortion guitar }

    scenes:
      - name: "strum: as written"
        scale: G Major
