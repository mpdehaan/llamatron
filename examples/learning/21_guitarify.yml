    step_size: 1
    degree: [1, 4, 1, 5]
    octave: [3, 3, 3, 3]
    chord: [dom7, dom7, dom7, dom7]
  - name: boogie
    steps: 4
    group: clean
    step_size: 1
    degree: [1, 4, 1, 5]
    octave: [2, 2, 2, 2]
  - name: tremolo
    steps: 4
    group: clean
    step_size: 1
    degree: [1, 7, 6, 5]
    octave: [3, 3, 3, 3]
    chord: [3, 3, 3, M]
  - name: campfire
