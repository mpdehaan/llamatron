instruments:
  - { name: finger bass, device: "*FluidSynth", gm_sound: 34, default_velocity: 84, accent: 10 }
  - { name: clavinet, device: "*FluidSynth", gm_sound: 8 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: accents
    tempo: 100
    scale: E Minor
    genre: Exercise

    tracks:
      - { name: kick, drum: true, instrument: drum kit, default_velocity: 110 }
      - { name: snare, drum: true, instrument: drum kit, default_velocity: 38, accent: 75 }
      - { name: hats, drum: true, instrument: drum kit, default_velocity: 58, accent: 40 }
      - { name: bass, instrument: finger bass, accent: 25 }
      - { name: keys, instrument: clavinet, default_velocity: 66, accent: 40 }

    scenes:
      - name: no accents
        clips:
          - { track: kick, pattern: kick, repeat: 4 }
          - { track: snare, pattern: snare plain, repeat: 4 }
          - { track: hats, pattern: hats plain, repeat: 4 }
          - { track: bass, pattern: bass plain, repeat: 4 }
          - { track: keys, pattern: keys plain, repeat: 4 }
      - name: hats on the beat
        clips:
          - { track: kick, pattern: kick, repeat: 10 }
          - { track: snare, pattern: snare plain, repeat: 10 }
          - { track: hats, pattern: hats on the beat, repeat: 10 }
          - { track: bass, pattern: bass plain, repeat: 10 }
          - { track: keys, pattern: keys plain, repeat: 10 }
      - name: hats off the beat
        clips:
          - { track: kick, pattern: kick, repeat: 10 }
          - { track: snare, pattern: snare plain, repeat: 10 }
          - { track: hats, pattern: hats off the beat, repeat: 10 }
          - { track: bass, pattern: bass plain, repeat: 10 }
          - { track: keys, pattern: keys plain, repeat: 10 }
      - name: backbeat and ghost notes
        clips:
          - { track: kick, pattern: kick, repeat: 10 }
          - { track: snare, pattern: snare backbeat, repeat: 10 }
          - { track: hats, pattern: hats on the beat, repeat: 10 }
          - { track: bass, pattern: bass plain, repeat: 10 }
          - { track: keys, pattern: keys plain, repeat: 10 }
      - name: the bass and the keys
        clips:
          - { track: kick, pattern: kick, repeat: 10 }
          - { track: snare, pattern: snare backbeat, repeat: 10 }
          - { track: hats, pattern: hats on the beat, repeat: 10 }
          - { track: bass, pattern: bass accented, repeat: 10 }
          - { track: keys, pattern: keys accented, repeat: 10 }
      - name: hats in threes
        clips:
          - { track: kick, pattern: kick, repeat: 10 }
          - { track: snare, pattern: snare backbeat, repeat: 10 }
          - { track: hats, pattern: hats in threes, repeat: 10 }
          - { track: bass, pattern: bass accented, repeat: 10 }
          - { track: keys, pattern: keys accented, repeat: 10 }
      - name: no accents again
        clips:
          - { track: kick, pattern: kick, repeat: 4 }
          - { track: snare, pattern: snare plain, repeat: 4 }
          - { track: hats, pattern: hats plain, repeat: 4 }
          - { track: bass, pattern: bass plain, repeat: 4 }
          - { track: keys, pattern: keys plain, repeat: 4 }
