    dx_velocity: [true, false, false, true, false, false, true, false, false, false, true, false, false, true, false, false]
    dx_add: [~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, -18]

tracks:
  kick: { drum: true }
  hat: { drum: true }
  acid: {}

registers:
  AX: { maximum: 3, wrap: true }
  BX: { maximum: 5, wrap: true }
  CX: { minimum: -4, maximum: 0, wrap: true }
  DX: { minimum: -90, maximum: 0 }

scenes:
  - name: AX moves the third note
    reset: [AX]
    tracks:
      kick: { pattern: kick, loop: true }
      hat: { pattern: hat, loop: true }
      acid: { pattern: riff_ax, repeat: 8 }
  - name: BX moves the fifth note
    reset: [BX]
    tracks:
      kick: { pattern: kick, loop: true }
      hat: { pattern: hat, loop: true }
      acid: { pattern: riff_bx, repeat: 12 }
  - name: CX moves the second note down
    reset: [CX]
    tracks:
      kick: { pattern: kick, loop: true }
      hat: { pattern: hat, loop: true }
      acid: { pattern: riff_cx, repeat: 10 }
  - name: "AX, BX and CX together"
    reset: [AX, BX, CX]
    tracks:
      kick: { pattern: kick, loop: true }
      hat: { pattern: hat, loop: true }
      acid: { pattern: riff_abc, repeat: 16 }
  - name: DX fades out
    repeat: 6
    reset: [DX]
    tracks:
      kick: { pattern: kick, loop: true }
      hat: { pattern: hat, loop: true }
      acid: { pattern: riff_fade }
