songs:
  - name: cartridge_quest
    tempo: 150
    scale: D Minor
    genre: Electronic

    tracks:
      - { name: lead, instrument: pulse lead }
      - { name: bell, instrument: ring bell }
      - { name: arpeggio, instrument: arpeggio }
      - { name: bright, instrument: bright arpeggio }
      - { name: bass, instrument: triangle bass }
      - { name: kick, instrument: chip kick }
      - { name: noise, instrument: chip noise }

    scenes:
      - name: intro
        clips:
          - { track: arpeggio, pattern: intro chords }
          - { track: noise, patterns: [rest, pickup] }
      - name: verse
        clips:
          - { track: lead, pattern: verse lead, built_in: { phrasing: { enabled: true, line_bars: 2, breath: quick, rise_and_fall: a little, notes: flowing } } }
          - { track: arpeggio, pattern: verse chords, loop: true }
          - { track: bass, pattern: verse bass, loop: true }
          - { track: kick, pattern: verse kick, loop: true }
          - { track: noise, pattern: verse noise, loop: true }
