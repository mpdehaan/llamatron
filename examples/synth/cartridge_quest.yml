instruments:
  - name: pulse lead
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 26
      voices: 1
      oscillators: { type: sid, wave: pulse, pulse_width: 40, modulation: "off", interval: 7, arpeggio: [] }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 8, sustain: 10, release: 6 }, { type: none }, { type: none }]
      filter: { type: none }
      lfos: [{ "on": true, shape: triangle, rate: 3, retrigger: false }, { "on": true, shape: sine, rate: 55, retrigger: true }]
      matrix: [{ source: lfo1, via: none, destination: pulse_width, amount: 60 }, { source: lfo2, via: none, destination: pitch, amount: 1 }]
  - name: arpeggio
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 26
      voices: 1
      oscillators: { type: sid, wave: pulse, pulse_width: 25, modulation: "off", interval: 7, arpeggio: [0, 7, 12] }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 9, sustain: 8, release: 6 }, { type: none }, { type: none }]
      filter: { type: multimode, mode: low, cutoff: 3200, resonance: 30, env_amount: 0, key_track: 50 }
  - name: triangle bass
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 32
      voices: 1
      oscillators: { type: sid, wave: triangle, pulse_width: 50, modulation: "off", interval: 7, arpeggio: [] }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 6, sustain: 9, release: 3 }, { type: none }, { type: none }]
      filter: { type: none }
  - name: ring bell
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 15
      voices: 1
      oscillators: { type: sid, wave: triangle, pulse_width: 50, modulation: ring, interval: 7, arpeggio: [] }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 10, sustain: 0, release: 10 }, { type: none }, { type: none }]
      filter: { type: none }
  - name: chip kick
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 40
      voices: 1
      oscillators: { type: sid, wave: triangle, pulse_width: 50, modulation: "off", interval: 7, arpeggio: [], pitch_env: 24 }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 5, sustain: 0, release: 4 }, { type: none }, { type: adsr, attack: 0, hold: 0, decay: 60, snap: 0, sustain: 0, release: 60 }]
      filter: { type: none }
  - name: chip noise
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 22
      voices: 1
      oscillators: { type: sid, wave: noise, pulse_width: 50, modulation: "off", interval: 7, arpeggio: [] }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 4, sustain: 0, release: 4 }, { type: none }, { type: none }]
      filter: { type: none }
      matrix: [{ source: velocity, via: none, destination: amp, amount: 40 }]

songs:
  - name: cartridge_quest
    tempo: 150
    scale: D Minor
    genre: Electronic

    tracks:
      - { name: lead, instrument: pulse lead }
      - { name: bell, instrument: ring bell }
      - { name: arpeggio, instrument: arpeggio }
      - { name: bass, instrument: triangle bass }
      - { name: kick, instrument: chip kick }
      - { name: noise, instrument: chip noise }

    scenes:
      - name: intro
        clips:
          - { track: arpeggio, pattern: chords, repeat: 2 }
      - name: theme
        clips:
          - { track: lead, pattern: lead, repeat: 2 }
          - { track: arpeggio, pattern: chords, loop: true }
          - { track: bass, pattern: bass, loop: true }
      - name: theme drums
        clips:
          - { track: lead, pattern: lead, repeat: 2 }
          - { track: arpeggio, pattern: chords, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: noise, pattern: noise, loop: true }
      - name: bridge
        clips:
          - { track: lead, pattern: lead bridge, repeat: 2 }
          - { track: bell, pattern: bell, loop: true }
          - { track: arpeggio, pattern: chords bridge, loop: true }
          - { track: bass, pattern: bass bridge, loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: noise, pattern: noise, loop: true }
      - name: theme again
        clips:
          - { track: lead, pattern: lead, repeat: 2 }
          - { track: arpeggio, pattern: chords, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: noise, pattern: noise, loop: true }
      - name: outro
        clips:
          - { track: arpeggio, pattern: chords, repeat: 1 }
          - { track: bass, pattern: bass, repeat: 1 }
