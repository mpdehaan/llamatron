version: 1.1.1
title: Cartridge quest
description: "a chip adventure theme on the SID engine: a verse and a soaring chorus, a sweeping pulse lead, a fast arpeggio, a triangle bass and noise drums, on the built-in synths"
notes: |
  Cartridge quest: a home-computer adventure theme at 150 beats a minute in D minor, every sound on the SID engine, as a
  single sound chip of the 1980s played it, three voices and a noise channel. The lead is a pulse wave whose width an LFO
  sweeps slowly through the Mod Matrix, the hollow-to-reedy shimmer of the chip; a second LFO adds vibrato. The arpeggio
  plays each chord as one note, the oscillator's Arpeggio stepping root, fifth and octave fifty times a second, the chip
  composer's way of sounding a chord on one voice. The bass is a triangle, the drums the chip's noise wave and a triangle
  with a falling pitch for the kick, and a ring-modulated triangle is a bell that answers the lead.

  The verse and the chorus differ in every way a chip can make them differ. The verse sits low, in octave 5, on a two-bar
  motif stated four times with its ending changed, its chords two bars each (D minor, B flat, D minor, C), the bass on the
  beat with an octave pickup, a kick and soft noise and no snare, the arpeggio filtered dark, quiet and rising through each
  phrase. The pre-chorus climbs a step a bar over G minor, B flat, C and A, the bass pumping on A and a noise snare
  rolling faster into the chorus. The chorus jumps an octave to its hook: one rhythm stated, sequenced a step up, peaked
  on its high A and resolved, a chord a bar starting on B flat for the lift, the bass in octave eighths, a backbeat, the
  arpeggio bright, and loud. The bridge drops the drums and the bass for the hook at half speed, then builds back.

  The lead is phrased by the Phrasing generator on each of its clips, as a player breathes: two-bar lines in the verse and
  the chorus, each growing toward its long note and falling away with a quick breath after it, one-bar lines in the
  pre-chorus, whose shrinking units build, and the bridge's slow hook in four-bar lines with a deep breath.

  Form: a two-bar intro, verse, pre-chorus, chorus, a second verse with the bell's counter-line, pre-chorus, chorus, the
  bridge and its build, the last chorus, and a two-bar ending.

  Run it with: llamatron examples/synth/cartridge_quest.yml

  When changing this demo:
  - Keep every sound on the SID engine, the drums included.
  - Keep the arpeggio's chords as single notes for the oscillator's Arpeggio to spread.
  - Keep the lead's pulse width moving through the Mod Matrix; it is the chip's signature.
  - Keep the verse and chorus apart: register, rhythm, harmony rate, drums and loudness.
real_time: true
protected: true

