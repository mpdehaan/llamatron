version: 1.1.1
title: Cartridge quest
description: "a chip adventure theme on the SID engine: a sweeping pulse lead, a fast arpeggio, a triangle bass and noise drums, on the built-in synths"
notes: |
  Cartridge quest: a home-computer adventure theme at 150 beats a minute in D minor, every sound on the SID engine, as a
  single sound chip of the 1980s played it, three voices and a noise channel. The lead is a pulse wave whose width an LFO
  sweeps slowly through the Mod Matrix, the hollow-to-reedy shimmer of the chip; a second LFO adds vibrato. The arpeggio
  plays each chord as one note, the oscillator's Arpeggio stepping root, fifth and octave fifty times a second, the chip
  composer's way of sounding a chord on one voice. The bass is a triangle, and the drums are the chip's noise wave for the
  snare and hats and a triangle with a falling pitch for the kick. The bridge brings in a ring-modulated triangle, a bell
  answering the lead.

  The harmony is D minor, B flat, F and C, the falling minor loop of adventure music, and the bridge climbs G minor, B flat
  and A to set up the return. The arpeggio's root, fifth and octave leave out the third, so the one Arpeggio fits every
  chord, the A major of the bridge included.

  Form: intro (arpeggio alone), the theme, the theme with the drums, the bridge with the bell, the theme again, an outro.

  Run it with: llamatron examples/synth/cartridge_quest.yml

  When changing this demo:
  - Keep every sound on the SID engine, the drums included.
  - Keep the arpeggio's chords as single notes for the oscillator's Arpeggio to spread.
  - Keep the lead's pulse width moving through the Mod Matrix; it is the chip's signature.
real_time: true
protected: true

