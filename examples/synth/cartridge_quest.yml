instruments:
  - name: pulse lead
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 26
      voices: 1
      oscillators: { type: sid, wave: pulse, pulse_width: 40, interval: 7, arpeggio: [] }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 8, sustain: 10, release: 6 }, { type: none }, { type: none }]
      filter: { type: none }
      lfos: [{ "on": true, shape: triangle, speed: medium, rate_percent: 21, restart: on_play }, { "on": true, shape: sine, speed: medium, rate_percent: 76, restart: each_note }]
      matrix: [{ source: lfo1, via: none, destination: pulse_width, amount: 60 }, { source: lfo2, via: none, destination: pitch, amount: 1 }]
  - name: arpeggio
    kind: built_in
    role: normal
    sound:
      engine: sid
      volume: 21
      voices: 1
      oscillators: { type: sid, wave: pulse, pulse_width: 25, interval: 7, arpeggio: [0, 7, 12] }
      envelopes: [{ type: sid_adsr, attack: 0, decay: 9, sustain: 8, release: 6 }, { type: none }, { type: none }]
