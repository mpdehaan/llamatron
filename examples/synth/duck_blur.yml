version: 1.0.660
title: Duck blur
description: "an 8-bit game theme in the manner of the DuckTales theme (Mark Mueller), on the built-in synths"
notes: |
  Duck blur: an 8-bit game theme in the manner of the DuckTales theme (Mark Mueller), as the NES game played it,
  every part on the built-in synths. This is a homage to the DuckTales theme (Mark Mueller): its chords, form and drive
  follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 2: each part's phrasing
  follows the theme's shape as the user gave it, its words never used: a verse of long lines answered by short punchy tags,
  a lift of two parallel lines rising, a chorus of a two-note hook and its answer then a long running line, twice, and a
  tag, a bridge that stutters four quick hits into a held note and trades calls and answers, and a last line before the
  final hook; the chorus driven, the form grown to about two minutes.

  The chords were taken from what chord charts' search results report (the key of E, the chorus's C and D up to the E of
  its hook, a full chart in F of F, Eb, G, Gm, C and Bb), since the charts' sites forbid automated reading, and set here in
  G: the verse I, bVII and IV, the lift ii and V, the chorus I, bVI, bVII and I, the Mixolydian brass of a cartoon
  adventure.

  Subgenre: an 8-bit console game's title theme. Drums: a noise-channel beat, the verse's kick on one and the and of two
  and three, the chorus's pushed, a snare on two and four that builds through the lift, hats in eighths, in sixteenths when
  it drives. Tempo 156, straight. Bass: the triangle bouncing octaves on each chord, pumping straight eighths in the
  chorus. Builds: the lift climbs and its snare rolls into the chorus. Sounds: a square lead with a little vibrato, a
  two-oscillator chord stab, a triangle bass, drum machine drums. Melody manner: a busy patter of repeated notes in the
  verse answered by short tags, a lift of two parallel lines, two punchy notes and a high answer opening each half of the
  chorus before a running line, a stuttering bridge of calls and answers. Form: intro, verse, lift, chorus, verse, lift,
  chorus, bridge, chorus, chorus, ending.

  Band and song: the theme is known as a bright, fast cartoon march, its verse long lines answered by short punchy tags,
  its chorus a shouted two-syllable hook answered by a sung "oo" before a long running line, its bridge a stutter and calls
  answered by a chorus of voices, and the game for its music.

  Checklist: it is good and memorable because its borrowed chords, bVI and bVII to I, sound like adventure arriving under
  a hook anyone can shout. The hook is the chorus's two punchy notes and their high answer, on the lead; the emotion is
  cheerful daring; the lift is the chorus, the lead up an octave over the bVI and bVII, the bass driving, the hats doubled;
  the contrast is the patter of the verse against the shout of the chorus; the sounds are a square lead, pulse and saw
  chords and a triangle bass.

  Run it with: llamatron examples/synth/duck_blur.yml

  When changing this demo:
  - Keep every part on the built-in synths, the drums on MechaDrum.
  - Keep the verse's long lines and short tags, and the chorus's hook short and shouted, its answer high.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

