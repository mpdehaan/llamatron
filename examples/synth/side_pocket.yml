version: 1.1.1
title: Side pocket
description: "chip funk on the Pocket engine, its filters, resonance and vibrato played by CC lanes through the Mod Matrix, on the built-in synths"
notes: |
  Side pocket: chip funk at 108 beats a minute in E dorian with an eighth-note swing, every sound on the Pocket engine, a
  handheld game console's sound chip: two pulse channels, a wave channel and a noise channel. Its point is the Mod Matrix's
  MIDI CC sources. Each pattern carries CC rows its track sends as CC 74, CC 71 and CC 1, and each Pocket instrument routes
  them: CC 74 to the filter's cutoff, CC 71 to its resonance, and CC 1 through an LFO to the pitch, as a mod wheel adds
  vibrato. The notes repeat; the CCs play the arrangement, as a player riding the knobs would.

  The bass is the wave channel playing a saw through a ladder filter, its cutoff opened over the first scene, pumped on
  every beat in the next, squelched against a rising resonance in the break, and closed at the end. The lead is the pulse
  channel at a quarter duty through a low-pass, swept open, then a wah on every eighth, then a singing line whose vibrato
  grows with CC 1 on each held note. The kick is a pulse whose frequency sweep falls, the chip's own kick, and the noise
  channel plays the snare long and the hats short; a rising sweep zaps into the solo.

  Form: intro (bass opening, drums), the groove, the wah, a break of the bass squelching, the solo, an outro closing the
  bass.

  Run it with: llamatron examples/synth/side_pocket.yml

  When changing this demo:
  - Keep every sound on the Pocket engine.
  - Keep the CC rows moving in every scene: the CCs are the arrangement.
  - Keep each instrument's CC routes in its Mod Matrix, CC 74 to Cutoff, CC 71 to Resonance and CC 1 as the vibrato's Via.
real_time: true
protected: true

