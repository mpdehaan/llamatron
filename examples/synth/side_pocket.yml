version: 1.1.1
title: Side pocket
description: "chip funk on the Pocket engine: a tight groove of short notes and rests, guide-tone stabs wah'd by a CC lane, a horn-like hook, on the built-in synths"
notes: |
  Side pocket: chip funk at 104 beats a minute in E dorian, every sound on the Pocket engine, a handheld game console's
  sound chip: two pulse channels, a wave channel and a noise channel. Funk is in what is left out: everyone hits the one
  hard, every part is short and mostly rests, each fitting into the others' holes, and the sixteenths are nearly straight,
  a light swing (swing 54) on everything alike.

  The drums are the chip's own: a pulse whose frequency sweep falls for the kick, which leaves out beat three; the long
  noise for the snare, its backbeat answered by ghost notes at a third of its level; the short noise for the hats, loud,
  ghost, medium, ghost through every beat. The bass is the wave channel, short notes around rests: the one, an octave pop,
  the flat seventh into the one again, the fifth with the kick, a pickup leading back, and a dead note. The two pulse
  channels play the chords as a dyad of guide tones, G and D over E minor seven and G and C sharp over A seven, the D
  falling a half step, in very short stabs, mostly ghosts; a CC lane, sent as CC 74, rides their cutoff through every
  beat, a wah. The hook, on one pulse channel, is a horn-like phrase on the minor pentatonic starting on the one, a bar
  of silence after it for the stab to answer, and in the solo the mod wheel, CC 1, brings vibrato in late on each held
  note, as a player does.

  Form: a two-bar intro of drums and bass, the groove with the stabs, the hook, a stop-time break, the bridge on A seven
  and B minor seven, the hook with a solo, and a tag with a hard stop on the one.

  Run it with: llamatron examples/synth/side_pocket.yml

  When changing this demo:
  - Keep every sound on the Pocket engine.
  - Keep the notes short and the rests many; keep the one hard and beat three free of the kick.
  - Keep the CC routes in each instrument's Mod Matrix: CC 74 to Cutoff, CC 71 to Resonance, CC 1 as the vibrato's Via.
real_time: true
protected: true

