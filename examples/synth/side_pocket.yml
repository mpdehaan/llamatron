instruments:
  - name: pulse lead
    kind: built_in
    role: normal
    sound:
      engine: pocket
      volume: 17
      voices: 1
      oscillators: { type: pocket, chip_voice: pulse, duty: quarter, sweep_pace: 0 }
      envelopes: [{ type: chip_steps, start_level: 13, level_pace: 3, level_direction: down }, { type: none }, { type: none }]
      filter: { type: multimode, mode: low, cutoff: 500, resonance: 20, env_amount: 0, key_track: 50 }
      lfos: [{ "on": true, shape: sine, speed: medium, rate_percent: 76, retrigger: true }]
      matrix: [{ source: cc74, via: none, destination: cutoff, amount: 75 }, { source: cc71, via: none, destination: resonance, amount: 70 }, { source: lfo1, via: cc1, destination: pitch, amount: 2 }]
  - name: wave bass
    kind: built_in
    role: normal
    sound:
      engine: pocket
      volume: 34
      voices: 1
      oscillators: { type: pocket, chip_voice: wave, wave_shape: saw, sweep_pace: 0 }
      envelopes: [{ type: chip_steps, start_level: 15, level_pace: 0, level_direction: down }, { type: none }, { type: none }]
      filter: { type: ladder, cutoff: 200, resonance: 30, env_amount: 0, key_track: 30, drive: 10, slope: 24 }
      matrix: [{ source: cc74, via: none, destination: cutoff, amount: 85 }, { source: cc71, via: none, destination: resonance, amount: 65 }]
  - name: stab
    kind: built_in
    role: normal
    sound:
      engine: pocket
      volume: 12
      voices: 1
      oscillators: { type: pocket, chip_voice: pulse, duty: half, sweep_pace: 0 }
      envelopes: [{ type: chip_steps, start_level: 12, level_pace: 1, level_direction: down }, { type: none }, { type: none }]
      filter: { type: multimode, mode: low, cutoff: 700, resonance: 35, env_amount: 0, key_track: 50 }
      matrix: [{ source: cc74, via: none, destination: cutoff, amount: 70 }]
  - name: chip kick
    kind: built_in
    role: normal
    sound:
      engine: pocket
      volume: 20
      voices: 1
      oscillators: { type: pocket, chip_voice: pulse, duty: half, sweep_pace: 1, sweep_direction: down, sweep_step: 2 }
      envelopes: [{ type: chip_steps, start_level: 15, level_pace: 1, level_direction: down }, { type: none }, { type: none }]
      filter: { type: none }
  - name: long noise
    kind: built_in
    role: normal
    sound:
      engine: pocket
      volume: 24
      voices: 1
      oscillators: { type: pocket, chip_voice: noise, noise: long, sweep_pace: 0 }
      envelopes: [{ type: chip_steps, start_level: 14, level_pace: 2, level_direction: down }, { type: none }, { type: none }]
      filter: { type: none }
  - name: short noise
    kind: built_in
    role: normal
    sound:
      engine: pocket
      volume: 14
      voices: 1
      oscillators: { type: pocket, chip_voice: noise, noise: short, sweep_pace: 0 }
      envelopes: [{ type: chip_steps, start_level: 12, level_pace: 1, level_direction: down }, { type: none }, { type: none }]
      filter: { type: none }

songs:
  - name: side_pocket
    tempo: 104
    scale: E Dorian
    genre: Electronic
    groove: swing 54

    tracks:
      - { name: lead, cc: [74, 71, 1, ~], instrument: pulse lead }
      - { name: stab, cc: [74, ~, ~, ~], instrument: stab }
      - { name: stab 2, cc: [74, ~, ~, ~], instrument: stab }
      - { name: bass, cc: [74, 71, ~, ~], instrument: wave bass }
      - { name: kick, instrument: chip kick }
      - { name: snare, instrument: long noise }
      - { name: hats, instrument: short noise }

    scenes:
      - name: intro
        clips:
          - { track: bass, pattern: bass }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: groove
        clips:
          - { track: bass, pattern: bass opening }
          - { track: stab, pattern: stab low, loop: true }
          - { track: stab 2, pattern: stab high, loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: hook
        clips:
          - { track: lead, pattern: hook, repeat: 2 }
          - { track: stab, pattern: stab low, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: break
        clips:
          - { track: kick, pattern: hit kick }
          - { track: snare, pattern: hit snare }
          - { track: stab, pattern: hit stab }
          - { track: bass, pattern: bass, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: bridge
        clips:
          - { track: bass, patterns: [bass in a, bass in a, bass in b, bass in a] }
          - { track: stab, patterns: [stab low a, stab low a, stab low b, stab low a], loop: true }
          - { track: stab 2, patterns: [stab high a, stab high a, stab high b, stab high a], loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: hook and solo
        clips:
          - { track: lead, patterns: [hook, solo] }
          - { track: stab, pattern: stab low, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: tag
        clips:
          - { track: lead, pattern: hook }
          - { track: stab, pattern: stab low, loop: true }
          - { track: bass, pattern: bass, loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: stop
        clips:
          - { track: kick, pattern: hit kick }
          - { track: snare, pattern: hit snare }
          - { track: stab, pattern: hit stab }
          - { track: bass, pattern: hit bass }
