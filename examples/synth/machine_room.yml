songs:
  - name: machine_room
    tempo: 122
    scale: C Minor
    genre: Electronic
    groove: swing 58

    tracks:
      - { name: kick, drum: true, instrument: kick }
      - { name: hard kick, drum: true, instrument: hard kick }
      - { name: electro, drum: true, instrument: electro kick }
      - { name: boom, drum: true, instrument: synth kick }
      - { name: snare, drum: true, instrument: snare }
      - { name: clap, drum: true, instrument: clap }
      - { name: rim, drum: true, instrument: rim }
      - { name: closed hats, drum: true, instrument: closed hats }
      - { name: open hats, drum: true, instrument: open hats }
      - { name: cowbell, drum: true, instrument: cowbell }
      - { name: toms, drum: true, instrument: acoustic tom }
      - { name: conga, drum: true, instrument: karplus drum }

    scenes:
      - name: intro
        clips:
          - { track: kick, pattern: kick, repeat: 2 }
          - { track: hard kick, pattern: hard layer, loop: true }
          - { track: closed hats, pattern: closed hats, loop: true }
      - name: groove
        clips:
          - { track: kick, pattern: kick, repeat: 8 }
          - { track: hard kick, pattern: hard layer, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: rim, pattern: rim clave, loop: true }
          - { track: closed hats, pattern: closed hats, loop: true }
          - { track: open hats, pattern: open hats, loop: true }
          - { track: toms, patterns: [tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom fill] }
      - name: groove b
        clips:
          - { track: kick, pattern: kick b, repeat: 8 }
          - { track: hard kick, pattern: hard layer b, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: rim, pattern: rim clave, loop: true }
          - { track: closed hats, pattern: closed hats, loop: true }
          - { track: open hats, pattern: open hats, loop: true }
          - { track: cowbell, pattern: cowbell, loop: true }
          - { track: conga, pattern: conga, loop: true }
          - { track: toms, patterns: [tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom fill] }
      - name: break
        clips:
          - { track: boom, pattern: boom, repeat: 4 }
          - { track: clap, pattern: clap, loop: true }
          - { track: conga, pattern: conga, loop: true }
          - { track: toms, patterns: [tom rest, tom rest, tom rest, tom fill] }
      - name: drop
        clips:
          - { track: electro, pattern: hard electro, repeat: 16 }
          - { track: snare, pattern: snare drop, loop: true }
          - { track: clap, pattern: clap drop, loop: true }
          - { track: rim, pattern: rim clave, loop: true }
          - { track: closed hats, pattern: closed hats, loop: true }
          - { track: open hats, pattern: open hats, loop: true }
          - { track: cowbell, pattern: cowbell, loop: true }
          - { track: conga, pattern: conga, loop: true }
          - { track: toms, patterns: [tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom fill], loop: true }
      - name: breakdown
        clips:
          - { track: closed hats, pattern: closed hats, repeat: 2 }
          - { track: open hats, pattern: open hats, loop: true }
          - { track: rim, pattern: rim clave, loop: true }
          - { track: conga, pattern: conga, loop: true }
      - name: final
        clips:
          - { track: kick, pattern: kick b, repeat: 8 }
          - { track: hard kick, pattern: hard layer b, loop: true }
          - { track: snare, pattern: snare drop, loop: true }
          - { track: clap, pattern: clap, loop: true }
          - { track: rim, pattern: rim clave, loop: true }
          - { track: closed hats, pattern: closed hats, loop: true }
          - { track: open hats, pattern: open hats, loop: true }
          - { track: cowbell, pattern: cowbell, loop: true }
          - { track: conga, pattern: conga, loop: true }
          - { track: toms, patterns: [tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom rest, tom fill] }
      - name: last hit
        clips:
          - { track: hard kick, pattern: hard layer, repeat: 1 }
          - { track: kick, pattern: hard layer, repeat: 1 }
