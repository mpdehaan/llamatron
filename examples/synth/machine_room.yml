version: 1.1.1
title: Machine room
description: "a drum machine jam that brings in every MechaDrum machine in turn, on the built-in synths"
notes: |
  Machine room: a drum machine jam at 122 beats a minute, every sound on MechaDrum, the built-in drum machine, each of its
  ten machines heard in turn. The kick and closed hats start; the snare, rim and open hats join, the open hats in the
  closed hats' choke group, so each closed hit cuts the open one short, as one cymbal pair would; then the cowbell and a
  Karplus Drum line in C minor pentatonic, the plucked drum tuned by its notes. The break drops to the Synth Kick's long
  boom under the clap and a fill on the Acoustic Tom, tuned down G, F, E flat. The drop swaps the kick for the Hard Kick's
  broken electro pattern and layers the clap on the snare.

  Every machine is set by its five knobs, Pitch, Decay, Color, Shape and Sweep: the closed and open hats are one machine
  with a short and a long Decay, and the Synth Kick's high Decay and Sweep make its boom.

  Form: intro, the room, the cowbell and Karplus line, the break, the drop, an outro and a last tom fill.

  Run it with: llamatron examples/synth/machine_room.yml

  When changing this demo:
  - Keep every sound on MechaDrum, and every machine heard at least once.
  - Keep the closed and open hats in one choke group.
real_time: true
protected: true

