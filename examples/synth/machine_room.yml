version: 1.1.1
title: Machine room
description: "a drum machine jam that brings in every MechaDrum machine, swung, accented and layered with a hard kick, on the built-in synths"
notes: |
  Machine room: a drum machine jam at 122 beats a minute, every sound on MechaDrum, the built-in drum machine, each of its
  ten machines heard. There is no lead and no chords: the groove is the music. The whole song swings its sixteenths a
  little (swing 58), so the hats, the rim and the snare's ghost notes shuffle while the kick on the beat stays put.

  The groove lives in its loud and quiet notes. The kick is loudest on the one, and a Hard Kick is layered under it there,
  and on the "and" of beat three in the second groove. The snare's backbeat is answered by ghost notes at a third of its
  level. The closed hats go loud, ghost, medium, ghost through each beat, and the open hats, in the closed hats' choke
  group, hiss on the off-beats until the next closed hit cuts them, as one cymbal pair would. The rim plays a clave over
  two bars, the cowbell alternates loud and soft, and the Karplus Drum plays a conga part on the root and the fifth only.

  The Acoustic Tom fills only the last bar of each eight, so a fill stays a fill. The break drops to the Synth Kick's long
  boom under the clap and the conga; the drop swaps the four-on-the-floor kick for the Hard Kick's broken electro pattern,
  with the clap on both backbeats; a two-bar breakdown of hats and clave sets up the final groove and its last hard kick.

  Form: a two-bar intro, the first groove, the second groove, the break, the drop, the breakdown, the final groove, and a
  last hit.

  Run it with: llamatron examples/synth/machine_room.yml

  When changing this demo:
  - Keep every sound on MechaDrum, and every machine heard at least once.
  - Keep it a drum piece: no lead and no chords; the Karplus Drum plays the root and fifth as a conga.
  - Keep the closed and open hats in one choke group, and the tom fill to the last bar of a phrase.
real_time: true
protected: true

