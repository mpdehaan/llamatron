version: 1.1.1
title: Acid rain
description: "acid house on Oh3, a squelching acid bass and a lead two octaves over it, over MechaDrum, on the built-in synths"
notes: |
  Acid rain: acid house at 126 beats a minute in A minor, every part on the built-in synths. The squelch is Oh3's
  saw through its Diode filter, deep and resonant, its Acid gate Modded so that a run of accents climbs higher; the lead is
  Oh3's square on its Stock circuit, two octaves over the squelch, and an octave higher still at the peak, to show the
  instrument's whole range. The drums are MechaDrum's synth kick, snare, hats and cowbell.

  An acid line is a few pitches made interesting by which steps are loud and which slide, and the marks are rare: two
  accents a bar, off the beat and after a rest, and one slide a bar, aimed at the octave jump. On Oh3 a step at
  velocity 110 or more is an accent, so every other step stays below it. The line changes by its marks, not its notes:
  every second bar moves its accents and adds a slide, and the last bar of each eight climbs through three accents, the
  turnaround, once a phrase rather than every bar. The lead is a call and its answer, two bars, its long note the peak.

  Form: a two-bar intro of kick and hats, the squelch alone, the build with its turns and the snare, the lead, a break of
  the lead over the hats with the squelch returning, the second drop a fourth up with the cowbell, the peak with the lead
  an octave up, and an outro.

  Run it with: llamatron examples/synth/acid_rain.yml

  When changing this demo:
  - Keep every part on the built-in synths, the acid lines on Oh3 and the drums on MechaDrum.
  - Keep the marks rare: accents off the beat at 110 and over, every other step below it; one slide a bar into a jump.
  - Keep the lead about two octaves over the squelch, and the intro short.
real_time: true
protected: true

