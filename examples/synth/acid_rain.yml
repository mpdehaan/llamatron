instruments:
  - name: squelch
    kind: built_in
    role: normal
    sound:
      engine: oh3
      volume: 24
      oscillators: { type: acid, acid_wave: saw, circuit: stock }
      envelopes: [{ type: acid_gate, circuit: modded, accent: 70, accent_sweep: 70, accent_decay: 180, amp_decay: 1200, soft_attack: 30 }, { type: adsr, attack: 0, hold: 0, decay: 320, snap: 0, sustain: 0, release: 320 }, { type: none }]
      filter: { type: diode, circuit: stock, cutoff: 360, resonance: 78, env_amount: 70, key_track: 0, drive: 10 }
      effects: [{ effect: drive, curve: soft, amount: 12 }]
  - name: lead
    kind: built_in
    role: normal
    sound:
      engine: oh3
      volume: 18
      oscillators: { type: acid, acid_wave: square, circuit: stock }
      envelopes: [{ type: acid_gate, circuit: stock, accent: 50 }, { type: adsr, attack: 0, hold: 0, decay: 400, snap: 0, sustain: 0, release: 400 }, { type: none }]
      filter: { type: diode, circuit: stock, cutoff: 1300, resonance: 45, env_amount: 45, key_track: 50, drive: 0 }
  - { name: kick, kind: built_in, role: percussion, sound: { engine: drum, volume: 62, oscillators: { type: drum, machine: synth_kick } } }
  - { name: snare, kind: built_in, role: percussion, sound: { engine: drum, volume: 36, oscillators: { type: drum, machine: snare } } }
  - { name: hats, kind: built_in, role: percussion, sound: { engine: drum, volume: 40, oscillators: { type: drum, machine: hats } } }
  - { name: cowbell, kind: built_in, role: percussion, sound: { engine: drum, volume: 34, oscillators: { type: drum, machine: cowbell } } }

songs:
  - name: acid_rain
    tempo: 126
    scale: A Minor
    genre: Electronic

    tracks:
      - { name: lead, instrument: lead }
      - { name: squelch, instrument: squelch }
      - { name: kick, drum: true, instrument: kick }
      - { name: snare, drum: true, instrument: snare }
      - { name: hats, drum: true, instrument: hats }
      - { name: cowbell, drum: true, instrument: cowbell }

    scenes:
      - name: intro
        clips:
          - { track: kick, pattern: kick, repeat: 2 }
          - { track: hats, pattern: hats, loop: true }
      - name: squelch
        clips:
          - { track: squelch, patterns: [squelch, squelch, squelch, squelch, squelch, squelch, squelch, squelch climb] }
          - { track: kick, pattern: kick, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: build
        clips:
          - { track: squelch, patterns: [squelch, squelch turn, squelch, squelch turn, squelch, squelch turn, squelch, squelch climb] }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: lead
        clips:
          - { track: lead, patterns: [lead, lead open], loop: true }
          - { track: squelch, patterns: [squelch, squelch turn, squelch, squelch turn, squelch, squelch turn, squelch, squelch climb], repeat: 2 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: break
        clips:
          - { track: lead, patterns: [lead, lead open] }
          - { track: hats, pattern: hats, loop: true }
      - name: return
        clips:
          - { track: lead, patterns: [lead, lead open] }
          - { track: squelch, pattern: squelch, loop: true }
          - { track: hats, pattern: hats, loop: true }
      - name: drop up
        clips:
          - { track: lead, patterns: [lead up, lead open up], loop: true }
          - { track: squelch, patterns: [squelch up, squelch up turn, squelch up, squelch up turn, squelch up, squelch up turn, squelch up, squelch up climb], repeat: 2 }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: cowbell, pattern: cowbell, loop: true }
      - name: peak
        clips:
          - { track: lead, patterns: [lead high, lead open high], loop: true }
          - { track: squelch, patterns: [squelch, squelch turn, squelch, squelch turn, squelch, squelch turn, squelch, squelch climb] }
          - { track: kick, pattern: kick, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: hats, pattern: hats, loop: true }
          - { track: cowbell, pattern: cowbell, loop: true }
      - name: outro
        clips:
          - { track: squelch, patterns: [squelch, squelch, squelch, squelch climb] }
          - { track: kick, pattern: kick, repeat: 4 }
