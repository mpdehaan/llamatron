version: 1.0.17
title: Arrangement demo
description: |
  Arrangement demo: eight parts of The Wellerman built from four note patterns.
  Run it with: llamatron examples/arrangement_demo.yml --to ableton --replace

  The tune is the same sung setting of The Wellerman as grab_demo.yml uses, in A minor at an
  estimated 100 BPM. The point here is how few patterns an arrangement needs. Only four
  patterns hold notes: melody_verse, melody_chorus, chords_verse and chords_chorus. Every
  other part reuses them, either directly with a track setting, or by grabbing them:

  - lead plays the melody patterns as written.
  - harmony plays the same melody patterns, with transpose: 2 on its track, so it follows
    the lead a third higher, moving along the scale rather than by a fixed interval.
  - pad plays the chord patterns as written.
  - pluck plays the same chord patterns through an arpeggiator chain, transposed an octave up.
  - bass has a one-bar rhythm, bass_rhythm, with Grab on every step. It grabs from the pad,
    which gives the lowest note of each chord, the root, and transpose: -7 puts it an octave
    lower. It loops, so it lasts as long as the scene, and it follows any chord change.
  - counter has its own short rhythm that grabs from the lead, so it samples the melody
    in a simpler rhythm, a sixth lower (transpose: -5).
  - stomp and clap are one-bar drum patterns that loop.

  So to change the tune, edit melody_verse or melody_chorus, and the lead, harmony and
  counter all change. To change the harmony, edit a chord pattern, and the pad, pluck and
  bass all follow. Each scene is a verse or a chorus and adds or swaps a part.

  When changing this demo:
  The point is how few patterns it needs, so add parts by reusing the four note patterns
  with a track setting, a chain or a grab, rather than with new note patterns.
tempo: 100
scale: A Minor

scales:
  A Minor: { root: A, type: minor }

patterns:
  melody_verse:
    steps: 64
    step_size: 1/8
    degree: [1, ~, 1, 1, 1, ~, 3, ~, 5, ~, 5, ~, 5, ~, 5, ~, 6, ~, 4, 4, 4, ~, 6, 6, 1, 1, 5, ~, 5, ~, 5, ~, 1, ~, 1, ~, 1, ~, 3, ~, 5, ~, 5, ~, 5, ~, 5, ~, 5, ~, 4, ~, 3, 3, 2, ~, 1, ~, ~, ~, ~, ~, ~, ~]
    gate: [1/4, ~, ~, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, ~, ~, 1/4, ~, ~, ~, ~, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, ~, ~, 1/4, ~, 1, ~, ~, ~, ~, ~, ~, ~]
    octave: [3, ~, 3, 3, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, 3, 3, ~, 3, 3, 4, 4, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, 3, 3, ~, 3, ~, ~, ~, ~, ~, ~, ~]
  melody_chorus:
    steps: 64
    step_size: 1/8
    degree: [1, ~, ~, ~, 1, ~, ~, 6, 7, 7, 5, ~, 5, ~, ~, 5, 6, ~, 4, ~, 4, 4, 6, ~, 1, ~, 5, ~, 5, ~, ~, ~, 1, ~, ~, ~, 1, ~, 7, 6, 7, 5, 5, ~, 5, ~, 5, ~, 6, ~, 4, ~, 3, ~, 2, ~, 1, ~, ~, ~, ~, ~, 5, ~]
    gate: [1/2, ~, ~, ~, 1/4, ~, ~, ~, ~, ~, 1/4, ~, 1/4, ~, ~, ~, 1/4, ~, 1/4, ~, ~, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/2, ~, ~, ~, 1/2, ~, ~, ~, 1/4, ~, ~, ~, ~, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/4, ~, 1/2, ~, ~, ~, ~, ~, 1/4, ~]
    dot: [~, ~, ~, ~, d, ~, ~, ~, ~, ~, ~, ~, d, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~, ~]
    octave: [4, ~, ~, ~, 4, ~, ~, 3, 3, 3, 3, ~, 3, ~, ~, 3, 3, ~, 3, ~, 3, 3, 3, ~, 4, ~, 3, ~, 3, ~, ~, ~, 4, ~, ~, ~, 4, ~, 3, 3, 3, 3, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, 3, ~, ~, ~, ~, ~, 3, ~]
  chords_verse:
    steps: 8
    step_size: 1
    degree: [1, ~, 4, 1, 1, ~, 5, 1]
    gate: [2, ~, ~, ~, 2, ~, ~, ~]
    octave: [2, ~, 2, 2, 2, ~, 1, 2]
    chord: [3, ~, 3, 3, 3, ~, dom7, 3]
  chords_chorus:
    steps: 8
    step_size: 1
    degree: [6, 3, 4, 1, 6, 3, 5, 1]
    octave: [1, 2, 2, 2, 1, 2, 1, 2]
    chord: [3, 3, 3, 3, 3, 3, dom7, 3]
  bass_rhythm:
    steps: 8
    step_size: 1/8
    degree: [1, 1, 1, 1, 1, 1, 1, 1]
    octave: [1, 1, 1, 1, 1, 1, 1, 1]
    velocity: [110, 70, 90, 70, 110, 70, 90, 70]
    grab: [true, true, true, true, true, true, true, true]
  counter_rhythm:
    steps: 4
    step_size: 1/8
    degree: [1, ~, ~, 1]
    gate: [1/4, ~, ~, ~]
    octave: [3, ~, ~, 3]
    velocity: [80, ~, 80, 80]
    grab: [true, false, true, true]
  stomp:
    steps: 2
    drum: true
    step_size: 1/4
    degree: [C, ~]
    octave: [1, ~]
  clap:
    steps: 2
    drum: true
    step_size: 1/4
    degree: [~, D]
    accidental: [~, "#"]
    octave: [~, 1]

tracks:
  lead: {}
  harmony: { transpose: 2 }
  counter: { transpose: -5 }
  pad: {}
  pluck: { transpose: 7 }
  bass: { transpose: -7 }
  stomp: { drum: true }
  clap: { drum: true }

arps:
  pluck: { step: 1/8, order: up_down }

chains:
  pluck:
    - arp: pluck

scenes:
  - name: "Verse: lead alone"
    tracks:
      lead: { pattern: melody_verse }
  - name: "Chorus: lead and pad"
    tracks:
      lead: { pattern: melody_chorus }
      pad: { pattern: chords_chorus }
  - name: "Verse: bass grabs the pad"
    tracks:
      lead: { pattern: melody_verse }
      pad: { pattern: chords_verse }
      bass: { pattern: bass_rhythm, grab_track: pad, loop: true }
  - name: "Chorus: stomp and clap"
    tracks:
      lead: { pattern: melody_chorus }
      pad: { pattern: chords_chorus }
      bass: { pattern: bass_rhythm, grab_track: pad, loop: true }
      stomp: { pattern: stomp, loop: true }
      clap: { pattern: clap, loop: true }
  - name: "Verse: harmony is the lead moved"
    tracks:
      lead: { pattern: melody_verse }
      harmony: { pattern: melody_verse }
      pad: { pattern: chords_verse }
      bass: { pattern: bass_rhythm, grab_track: pad, loop: true }
      stomp: { pattern: stomp, loop: true }
      clap: { pattern: clap, loop: true }
  - name: "Chorus: counter grabs the lead"
    tracks:
      lead: { pattern: melody_chorus }
      harmony: { pattern: melody_chorus }
      counter: { pattern: counter_rhythm, grab_track: lead, loop: true }
      pad: { pattern: chords_chorus }
      bass: { pattern: bass_rhythm, grab_track: pad, loop: true }
      stomp: { pattern: stomp, loop: true }
      clap: { pattern: clap, loop: true }
  - name: "Verse: pluck arpeggiates the pad"
    tracks:
      lead: { pattern: melody_verse }
      counter: { pattern: counter_rhythm, grab_track: lead, loop: true }
      pluck: { pattern: chords_verse, chain: pluck }
      bass: { pattern: bass_rhythm, grab_track: pad, loop: true }
      stomp: { pattern: stomp, loop: true }
      clap: { pattern: clap, loop: true }
  - name: "Chorus: everything"
    tracks:
      lead: { pattern: melody_chorus }
      harmony: { pattern: melody_chorus }
      counter: { pattern: counter_rhythm, grab_track: lead, loop: true }
      pad: { pattern: chords_chorus }
      pluck: { pattern: chords_chorus, chain: pluck }
      bass: { pattern: bass_rhythm, grab_track: pad, loop: true }
      stomp: { pattern: stomp, loop: true }
      clap: { pattern: clap, loop: true }
