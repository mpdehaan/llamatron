version: 1.0.365
title: Slow seventh
description: the Allegretto of the Seventh Symphony as doom metal
notes: |
  Slow seventh: the Allegretto of the Seventh Symphony as doom metal. The violas' theme and the melody
  they play against it at its second hearing, from the Allegretto of the Symphony No. 7 (Ludwig van
  Beethoven, 1812), are public domain and are played as written, read from the Mutopia Project's
  edition; the slow power chords, the bent licks with their flat fifths, the solos and the drums are
  new. Version 1.

  Subgenre: doom metal in the manner of the first heavy bands of 1970. Drums: very slow, the kick on
  one and before three, the snare on three alone, quarter notes on the hat, tom-toms falling at each
  phrase's end. Tempo 60. Bass: one long note a half bar, with the guitar. Sounds: two down-tuned
  guitars, one on the theme and one on power chords, a pick bass, a church organ.

  Band and song: the style is known for riffs slow enough to feel their weight, the flat fifth, and a
  funeral pace.

  Checklist: it works because the theme is a funeral march on one note, long, short, short, long,
  long, which is a doom riff already. The hook is that rhythm on a low guitar; the lift is the second
  melody joining over it; the contrast is the theme alone in the bass.

  Run it with: llamatron examples/mashups/metal/slow_seventh.yml

  Scene 1, riff, 4 bars.
  Scene 2, theme, 8 bars.
  Scene 3, second theme, 8 bars.
  Scene 4, half time, 8 bars.
  Scene 5, solo, 8 bars.
  Scene 6, last theme, 8 bars.
  Scene 7, ending, 2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
