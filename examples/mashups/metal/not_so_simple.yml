version: 1.0.365
title: Not so simple
description: "a mashup: the Shaker song Simple Gifts played as progressive metal in the manner of Dream Theater, plain, then far from plain, then plain again"
notes: |
  Not so simple: the Shaker song Simple Gifts (Joseph Brackett, 1848) played as progressive metal of
  the nineties, in the manner of Dream Theater. Both strains of the tune are Brackett's, note for
  note, in several keys and speeds; the riffs, the runs, the solos and the drums are new. Version 1.

  One clean guitar plays the tune plainly; a riff in threes turns it heavy; the second strain goes by
  twice as fast with guitar and keyboard in unison; the two trade fast solos over the tune's chords;
  the tune comes back a third higher in harmony over groups of seven, then grand and slow; runs fly
  over the tune in the bass; and one clean guitar ends it as it began.

  Subgenre: progressive metal of the nineties. Drums: a kit that follows the riff, the kick on its
  accents in threes and in sevens against a snare on two and four, both kick drums under the fastest
  bars, half time for the grand part, a fill at every turn. Tempo 96, then 132 and 144, 108 for the
  grand part, straight. Bass: with the guitar's riff, note for note. Builds: from one guitar to the
  full band, to its most tangled in the middle, and back down to one guitar. Sounds: a clean guitar, a
  distorted lead guitar, a low rhythm guitar on power chords, a synthesizer lead that doubles and
  answers the guitar, a piano, strings. Melody manner: a singing lead for the tune, guitar and
  keyboard in unison on fast runs, solos traded four bars, two bars and then one bar at a time. Form:
  plain tune, riff, tune over riff, unison, solos, new key, unison hits, grand reprise, runs, plain
  tune.

  Band and song: the band is known for guitar and keyboard playing fast lines in exact unison, for
  accents grouped in threes and sevens, for long solos traded between them, and for wide slow tunes
  after the storm. The other work is a Shaker dancing song about being simple, two plain strains of
  eight bars.

  Checklist: the metal is good because its hardest passages still sing, and remembered for the unison
  runs; the song is good because it is as plain as its words, and remembered because everyone can hum
  it. The hook is the tune's first strain on one clean guitar; the emotion is plainness tested and
  kept; the lift is the riff turning the tune heavy, then each faster section; the contrast is the
  single guitar at both ends against the tangle in the middle; the sounds are a clean guitar, a
  distortion guitar for the lead, a saw lead for the keyboard, a low distortion guitar and a picked
  bass.

  Run it with: llamatron examples/mashups/metal/not_so_simple.yml

  Scene 1, simple, 9 bars.
  Scene 2, second strain, 8 bars.
  Scene 3, the riff, 8 bars.
  Scene 4, the tune over the riff, 8 bars.
  Scene 5, twice as fast, 8 bars.
  Scene 6, guitar solo, keys solo, 8 bars.
  Scene 7, trading, 8 bars.
  Scene 8, in a new key, 8 bars.
  Scene 9, unison, 4 bars.
  Scene 10, grand, 8 bars.
  Scene 11, runs over the tune, 8 bars.
  Scene 12, simple again, 5 bars.

  When changing this demo:
  - Keep Bach's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the funk work's own tunes or riffs: the band's parts here are new.
