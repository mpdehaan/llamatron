version: 1.0.591
title: Got some strings
description: "the Ride of the Valkyries as eighties thrash metal, after Master of Puppets (Metallica)"
notes: |
  Got some strings: the Ride of the Valkyries as eighties thrash metal, after Master of Puppets
  (Metallica). The horn theme of the Ride of the Valkyries (Richard Wagner, 1856) is public domain and
  is played as written, in its key and its nine-eight time, from Claude's knowledge of the score; the
  chugging riffs, the chromatic licks, the solos and the drums are new, and nothing of the reference's
  own riffs is quoted. Version 2.

  Subgenre: thrash metal of the mid eighties. Drums: the kick in running eighths, the snare on the
  second and third beats of the bar, a half-time stretch on the ride. Tempo 172. Bass: eighths on the
  root, and the theme itself in the half-time stretch. Sounds: two distorted guitars, a rhythm guitar
  in muted power chords, a pick bass, a clean guitar in the quiet middle. Form: clean guitars open it
  before the gallop; palm-muted chugging stands alone between the themes; a half-time breakdown riff
  with the flat second; two bars of drums; double kick drums under the solo; and stop-time hits before
  the last theme.

  Band and song: the band is known for fast, precise, down-picked riffs, for chromatic notes a half
  step over the root, and for long songs with a clean, slow middle in harmony before the speed
  returns; this song keeps that shape.

  Checklist: it works because the theme is already a gallop, three beats of three. The hook is the
  horn call on a lead guitar, answered by chromatic bursts; the lift is the theme a step higher after
  the solo; the contrast is the quiet middle on a clean guitar.

  Run it with: llamatron examples/mashups/metal/got_some_strings.yml

  Scene 1, clean guitars, 9 bars.
  Scene 2, gallop, 9 bars.
  Scene 3, theme, 18 bars.
  Scene 4, chug, 9/2 bars.
  Scene 5, second theme, 18 bars.
  Scene 6, breakdown, 9 bars.
  Scene 7, drums, 9/4 bars.
  Scene 8, solo, 18 bars.
  Scene 9, quiet, 9 bars.
  Scene 10, build, 9/2 bars.
  Scene 11, stops, 9/4 bars.
  Scene 12, theme, higher, 18 bars.
  Scene 13, last gallop, 9/2 bars.
  Scene 14, ending, 9/4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
