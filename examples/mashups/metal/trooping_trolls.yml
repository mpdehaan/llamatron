version: 1.0.591
title: Trooping trolls
description: "a mashup: Grieg's In the Hall of the Mountain King played as galloping heavy metal in the manner of The Trooper (Iron Maiden), with Grieg's notes kept"
notes: |
  Trooping trolls: Grieg's In the Hall of the Mountain King played as galloping heavy metal of the
  early eighties, in the manner of The Trooper (Iron Maiden). The theme, its second phrase, its bass
  lines and its ending are Grieg's, note for note, moved by octaves to suit the guitars; the gallop,
  the twin-guitar line, the answering licks, the solos and the drums are new. Version 2.

  The theme creeps in on the bass alone, as Grieg has it; a guitar joins, the two lead guitars answer
  in the gaps; the band breaks into a gallop with a twin-guitar line; the guitars pass the theme
  between them and play it in thirds; they trade solos while the theme runs underneath; the last cycle
  strides over Grieg's falling bass, and his crashes end it with drum fills in the silences.

  Subgenre: British heavy metal of the early eighties. Drums: a kick that gallops on one and three, a
  hard snare on two and four, eighth hats, the ride for the fastest part, tom fills at every turn.
  Tempo 138 rising to 176, straight, as the piece itself speeds up. Bass: a gallop, an eighth and two
  sixteenths on each beat, loud enough to lead. Builds: the piece is one long build, a part more each
  phrase. Sounds: two lead guitars in harmony, a rhythm guitar on power chords, a picked bass. Melody
  manner: tunes in thirds on two guitars, short licks that answer each phrase, solos traded two bars
  at a time. Form: the theme three times, each bigger, with a gallop and solos between, and before the
  last a half-time breakdown riff answered by the two guitars and two bars of drums alone.

  Band and song: the band is known for galloping bass, two guitars in harmony and tunes a crowd can
  sing; the song for its gallop, its twin-guitar tune and the guitar answering every line of the
  verse. The other work is the most famous build in the repertoire: one creeping theme, repeated
  higher, louder and faster until it falls apart in crashes.

  Checklist: the metal is good because the gallop never rests, and remembered for the guitars in
  harmony; the Grieg is good because one small theme does everything, and remembered for how it creeps
  and then runs. The hook is Grieg's theme, first on the bass alone; the emotion is menace turning to
  a chase; the lift is the band breaking into the gallop, then each rise in tempo; the contrast is the
  bare bass at the start and the silences between the last crashes; the sounds are two overdriven lead
  guitars, a distortion guitar on power chords and a picked bass.

  Run it with: llamatron examples/mashups/metal/trooping_trolls.yml

  Scene 1, the call, 1 bars.
  Scene 2, bass alone, 4 bars.
  Scene 3, guitar joins, 4 bars.
  Scene 4, second phrase, 8 bars.
  Scene 5, theme again, 8 bars.
  Scene 6, gallop, 8 bars.
  Scene 7, theme at a gallop, 4 bars.
  Scene 8, guitars trade, 4 bars.
  Scene 9, second phrase at a gallop, 8 bars.
  Scene 10, theme in thirds, 8 bars.
  Scene 11, solos over the theme, 8 bars.
  Scene 12, solos over the second phrase, 8 bars.
  Scene 13, breakdown, 4 bars.
  Scene 14, drums, 2 bars.
  Scene 15, everything, 8 bars.
  Scene 16, second phrase, everything, 8 bars.
  Scene 17, theme over a pedal, 8 bars.
  Scene 18, crashes, 4 bars.
  Scene 19, crashes again, 4 bars.
  Scene 20, the end, 8 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
