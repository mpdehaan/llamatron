version: 1.0.365
title: Beach flick
description: "the Ride of the Valkyries as sixties surf rock, after Misirlou (Dick Dale and His Del-Tones)"
notes: |
  Beach flick: the Ride of the Valkyries as sixties surf rock, after Misirlou (Dick Dale and His Del-
  Tones). The horn theme of the Ride of the Valkyries (Richard Wagner, 1856) is public domain and is
  played as written, in its key and its nine-eight time, from Claude's knowledge of the score; the
  tremolo picking is how the guitar plays it, and the runs with their flat seconds, the trumpet's
  answers, the solos and the drums are new, with nothing of the reference's own tune quoted. Version
  1.

  Subgenre: instrumental surf rock of the early sixties. Drums: the surf beat, a kick on one and a
  snare that hits twice on the second beat and once on the third, a ride in eighths, floor tom-toms in
  the half-time stretch. Tempo 172. Bass: eighths, root and fifth. Sounds: a clean guitar picked as
  fast as the hand allows on its low strings, a trumpet, a muted rhythm guitar chopping the offbeats,
  an organ.

  Band and song: the guitarist is known for tremolo picking so fast a melody becomes a roar, for
  scales with a flat second, and for a trumpet that takes the tune over when the guitar steps back.

  Checklist: it works because the horn call's long notes are exactly what tremolo picking is for. The
  hook is the call roared on the low strings; the lift is the trumpet joining an octave above; the
  contrast is the stretch on floor tom-toms with the theme in the bass.

  Run it with: llamatron examples/mashups/rock/beach_flick.yml

  Scene 1, riff, 9 bars.
  Scene 2, theme, 9 bars.
  Scene 3, second theme, 9 bars.
  Scene 4, riff again, 9/2 bars.
  Scene 5, theme, traded, 9 bars.
  Scene 6, half time, 9 bars.
  Scene 7, quiet, 9 bars.
  Scene 8, build, 9/2 bars.
  Scene 9, solo, 18 bars.
  Scene 10, theme, higher, 9 bars.
  Scene 11, second theme, higher, 9 bars.
  Scene 12, riff once more, 9/2 bars.
  Scene 13, last theme, 9 bars.
  Scene 14, last second theme, 9 bars.
  Scene 15, ending, 9/2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
