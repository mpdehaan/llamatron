version: 1.0.365
title: Beach flick
description: the Hungarian Dance No
notes: |
  Beach flick: the Hungarian Dance No. 5 as sixties surf rock, after Misirlou (Dick Dale and His Del-
  Tones). The opening tune and its second strain from the Hungarian Dance No. 5 (Johannes Brahms,
  1869) are public domain and are played from Claude's knowledge of the score, an octave down on the
  guitar's low strings; the tremolo picking is how the guitar plays them, and the riff with its flat
  second, the saxophone's answers, the solos and the tom-tom breaks are new, with nothing of the
  reference's own tune quoted. Version 1.

  Subgenre: instrumental surf rock of the early sixties. Drums: the surf beat, a kick on one and
  three, a snare twice on two and once on four, a ride in eighths; it opens on floor tom-toms alone,
  which return for a break and for the half-time stretch. Tempo 160. Bass: eighths, the root and the
  flat second in the riff, root and fifth under the tune. Sounds: a clean guitar picked as fast as the
  hand allows on its low strings, a tenor saxophone, a muted rhythm guitar, an organ.

  Band and song: the guitarist is known for tremolo picking so fast a melody becomes a roar, for
  scales with a flat second, and for runs that slide down the low strings.

  Checklist: it works because the dance's long notes are what tremolo picking is for, and its minor
  key with a raised seventh is the surf sound already. The hook is the tune roared on the low strings;
  the lift is the saxophone joining and the solo; the contrast is the tom-toms alone and the theme in
  the bass.

  Run it with: llamatron examples/mashups/rock/beach_flick.yml

  Scene 1, tom-toms, 4 bars.
  Scene 2, riff, 8 bars.
  Scene 3, theme, 8 bars.
  Scene 4, second strain, 8 bars.
  Scene 5, riff, sax, 4 bars.
  Scene 6, theme on the sax, 8 bars.
  Scene 7, drums, 4 bars.
  Scene 8, half time, 8 bars.
  Scene 9, quiet, 8 bars.
  Scene 10, build, 4 bars.
  Scene 11, solo, 16 bars.
  Scene 12, theme, higher, 8 bars.
  Scene 13, second strain, higher, 8 bars.
  Scene 14, riff once more, 4 bars.
  Scene 15, last theme, 8 bars.
  Scene 16, last strain, 8 bars.
  Scene 17, ending, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
