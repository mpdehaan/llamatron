version: 1.0.365
title: Turkish surf
description: the Rondo alla Turca as sixties surf rock
notes: |
  Turkish surf: the Rondo alla Turca as sixties surf rock. The opening theme and the middle theme of
  the Rondo alla Turca from the Piano Sonata No. 11 (Wolfgang Amadeus Mozart, about 1783) are public
  domain and are played as written, an octave down on the guitar, from Claude's knowledge of the
  score; the runs with their flat seconds, the saxophone's answers, the solos and the drums are new.
  Version 2.

  Subgenre: instrumental surf rock of the early sixties. Drums: the surf beat, a kick on one and
  three, a snare twice on two and once on four, a ride in eighths, floor tom-toms in the half-time
  stretch. Tempo 150. Bass: eighths, root and fifth. Sounds: a clean guitar picking fast on its low
  strings, a tenor saxophone, a muted guitar on the offbeats, an organ. Form: floor tom-toms alone
  open it and return for a break; a riff on the root and the flat second stands between the themes,
  once under a honking saxophone; and the guitar solos for sixteen bars with runs sliding down the low
  strings.

  Band and song: the style is known for fast picking drenched in echo, for minor keys with an Eastern
  turn, and for a saxophone that honks the tune back.

  Checklist: it works because the rondo was written to imitate a Turkish band, and surf guitar
  borrowed the same Eastern colour. The hook is the running theme on the low strings; the lift is the
  middle theme in the major; the contrast is the floor tom-toms with the theme in the bass.

  Run it with: llamatron examples/mashups/rock/turkish_surf.yml

  Scene 1, tom-toms, 4 bars.
  Scene 2, riff, 4 bars.
  Scene 3, theme, 8 bars.
  Scene 4, middle theme, 8 bars.
  Scene 5, riff, saxophone, 8 bars.
  Scene 6, theme, both, 8 bars.
  Scene 7, drums, 4 bars.
  Scene 8, half time, 8 bars.
  Scene 9, quiet, 8 bars.
  Scene 10, build, 4 bars.
  Scene 11, solo, 16 bars.
  Scene 12, theme, higher, 8 bars.
  Scene 13, middle theme, higher, 8 bars.
  Scene 14, riff once more, 4 bars.
  Scene 15, last theme, 8 bars.
  Scene 16, ending, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
