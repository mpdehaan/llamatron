version: 1.0.365
title: Night On Synth Mountain
description: Night on Bald Mountain as the progressive rock of seventies Italian horror films
notes: |
  Night On Synth Mountain: Night on Bald Mountain as the progressive rock of seventies Italian horror films.
  The creeping bass figure and the low brass theme of Night on Bald Mountain (Modest Mussorgsky, 1867,
  as Rimsky-Korsakov arranged it) are public domain and are played as written, read from the Mutopia
  Project's piano edition; the synthesizer bass, the bells' arpeggios, the choir, the licks, the solos
  and the drums are new. Version 1.

  Subgenre: Italian progressive rock written for horror films in the middle seventies. Drums: tight
  and dry, the kick in a broken pattern, a snare on two and four, sixteenth hats, a bell in the quiet
  parts. Tempo 132. Bass: a synthesizer running sixteenths on the root, octave and flat seventh.
  Sounds: an organ and an overdriven guitar on the themes, a celesta turning a child's arpeggio over
  and over, a choir.

  Band and song: the style is known for a nursery-rhyme figure on bells against a relentless bass, a
  whispering choir, and a band that plays horror as a groove.

  Checklist: it works because the piece is a witches' sabbath and the genre scores witches. The hook
  is the creeping figure, a half step up and down; the lift is the brass theme on organ and guitar
  together; the contrast is the bells alone.

  Run it with: llamatron examples/mashups/rock/night_on_synth_mountain.yml

  Scene 1, riff, 4 bars.
  Scene 2, theme, 8 bars.
  Scene 3, second theme, 8 bars.
  Scene 4, riff again, 4 bars.
  Scene 5, theme, traded, 8 bars.
  Scene 6, half time, 8 bars.
  Scene 7, quiet, 8 bars.
  Scene 8, build, 4 bars.
  Scene 9, solo, 8 bars.
  Scene 10, theme, higher, 8 bars.
  Scene 11, second theme, higher, 8 bars.
  Scene 12, riff once more, 4 bars.
  Scene 13, last theme, 8 bars.
  Scene 14, last second theme, 8 bars.
  Scene 15, ending, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
