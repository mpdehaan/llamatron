version: 1.0.365
title: Magic colored smoke
description: "the Ride of the Valkyries as sixties psychedelic rock for a trio and an organ, after Purple Haze (the Jimi Hendrix Experience)"
notes: |
  Magic colored smoke: the Ride of the Valkyries as sixties psychedelic rock for a trio and an organ,
  after Purple Haze (the Jimi Hendrix Experience). The horn theme of the Ride of the Valkyries
  (Richard Wagner, 1856) is public domain and is played as written, in its key and its nine-eight
  time, from Claude's knowledge of the score; the heavy bass figure, the bent licks with their flat
  fifths, the solos and the loose drums are new, and nothing of the reference's own riff is quoted.
  Version 1.

  Subgenre: psychedelic hard rock of the late sixties. Drums: loose and busy, the kick pushing ahead
  of the beat, ghost notes on the snare, an open hat at the bar's end, tom-toms rolling into each
  section. Tempo 108, slow and heavy. Bass: a figure of root, octave and flat seventh. Sounds: a
  distorted lead guitar, seventh chords on a second guitar, a rock organ.

  Band and song: the guitarist is known for a tone on the edge of feedback, for the flat fifth, for
  seventh chords with a clashing note on top, and for a drummer who plays around the beat like a jazz
  player.

  Checklist: it works because the horn call, slowed, becomes a heavy blues riff. The hook is the call
  on a fuzz guitar an octave over the bass; the lift is the solo; the contrast is the quiet stretch,
  the guitar alone over the organ.

  Run it with: llamatron examples/mashups/rock/magic_colored_smoke.yml

  Scene 1, riff, 9/2 bars.
  Scene 2, theme, 9/2 bars.
  Scene 3, second theme, 9/2 bars.
  Scene 4, riff again, 9/2 bars.
  Scene 5, theme, traded, 9/2 bars.
  Scene 6, half time, 9 bars.
  Scene 7, quiet, 9 bars.
  Scene 8, build, 9/2 bars.
  Scene 9, solo, 9 bars.
  Scene 10, theme, higher, 9/2 bars.
  Scene 11, second theme, higher, 9/2 bars.
  Scene 12, last theme, 9 bars.
  Scene 13, last second theme, 9/2 bars.
  Scene 14, ending, 9/2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
