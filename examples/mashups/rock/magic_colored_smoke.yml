version: 1.0.365
title: Magic colored smoke
description: the Caprice No
notes: |
  Magic colored smoke: the Caprice No. 24 as psychedelic blues-rock, after Purple Haze (The Jimi
  Hendrix Experience). The theme of the Caprice No. 24 for solo violin (Niccolò Paganini, about 1817)
  is public domain and is played as written, both halves, read from the corpus's score; the riff, the
  bass, the organ, the jam, the solos and the drums are new, with nothing of the reference's own tune
  quoted. Version 1.

  Subgenre: psychedelic blues-rock of the late sixties, a trio with an organ. Drums: loose, a kick
  that pushes ahead of the beat, ghost notes on the snare, the ride in the jams, and a stretch of
  drums alone on the tom-toms. Tempo 132. Bass: a riff in unison with the guitar, with the flat fifth.
  Sounds: a distorted lead guitar, an overdriven rhythm guitar on seventh chords, a rock organ.

  Band and song: the guitarist is known for a tone on the edge of feedback, for the flat fifth, for
  seventh chords with a clashing note on top, and for a drummer who plays around the beat like a jazz
  player.

  Checklist: it works because the caprice was the showpiece of its day's wildest player, and its theme
  is a riff. The hook is the theme on a fuzz guitar; the lift is the jam and the solo; the contrast is
  the quiet stretch, the guitar alone over the organ.

  Run it with: llamatron examples/mashups/rock/magic_colored_smoke.yml

  Scene 1, riff, 4 bars.
  Scene 2, theme, 8 bars.
  Scene 3, theme, second half, 8 bars.
  Scene 4, riff again, 4 bars.
  Scene 5, theme on the organ, 8 bars.
  Scene 6, jam, 12 bars.
  Scene 7, drums, 4 bars.
  Scene 8, half time, 8 bars.
  Scene 9, quiet, 8 bars.
  Scene 10, build, 4 bars.
  Scene 11, solo, 12 bars.
  Scene 12, theme, higher, 8 bars.
  Scene 13, last theme, 8 bars.
  Scene 14, ending, 3 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
