version: 1.0.591
title: Three chord joy
description: the Ode to Joy as seventies punk rock
notes: |
  Three chord joy: the Ode to Joy as seventies punk rock. The tune of the Ode to Joy from the Ninth
  Symphony (Ludwig van Beethoven, 1824) is public domain and is played as written, from Claude's
  knowledge of the score; the downstroked chords, the octave licks, the solos and the drums are new.
  Version 2.

  Subgenre: New York punk rock of the middle seventies. Drums: fast and plain, the kick on one and
  pushing into three, a snare on two and four, hats in eighths, never a fill longer than half a bar.
  Tempo 190. Bass: eighths on the root, picked. Sounds: two guitars in barre chords, all downstrokes,
  a lead guitar, a pick bass. Form: four clicks of the sticks and the bass alone open it; a two-bar
  drum break comes before each new part; a stretch on the floor tom-tom has the bass and no guitars;
  and it ends on one chord.

  Band and song: the style is known for songs of three chords at one speed, guitars that never stop
  strumming, and tunes simple enough to shout.

  Checklist: it works because the tune moves by step over three chords, which is all a punk song asks.
  The hook is the tune on a lead guitar over the chords; the lift is the tune a step higher; the
  contrast is the half-time stretch, the tune in the bass.

  Run it with: llamatron examples/mashups/rock/three_chord_joy.yml

  Scene 1, count, 1 bars.
  Scene 2, bass alone, 4 bars.
  Scene 3, riff, 8 bars.
  Scene 4, theme, 16 bars.
  Scene 5, drum break, 2 bars.
  Scene 6, second theme, 16 bars.
  Scene 7, floor toms, no guitars, 8 bars.
  Scene 8, theme again, 16 bars.
  Scene 9, half time, 8 bars.
  Scene 10, drum break again, 2 bars.
  Scene 11, solo, 16 bars.
  Scene 12, riff again, 4 bars.
  Scene 13, theme, higher, 16 bars.
  Scene 14, second theme, higher, 16 bars.
  Scene 15, last theme, 8 bars.
  Scene 16, ending, 2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
