version: 1.0.591
title: Moonlight feedback
description: Clair de Lune as early nineties shoegaze
notes: |
  Moonlight feedback: Clair de Lune as early nineties shoegaze. The opening melody and the melody of
  the flowing middle of Clair de Lune from the Suite bergamasque (Claude Debussy, 1905) are public
  domain and are played as written, read from the Mutopia Project's edition, in their nine-eight time;
  the wall of strummed guitars, the answers, the bass and the drums are new. Version 2.

  Subgenre: shoegaze of the early nineties. Drums: slow and plain, a kick on one, a snare on the third
  beat, hats in eighths, half buried. Tempo 90. Bass: eighths on the root. Sounds: a wall of distorted
  guitar strumming every eighth, a soft voice singing the melody from inside it, a clean guitar, a
  pad. Form: a wall of strummed guitar on one chord opens it; the tune is buried under the wall and
  for eight bars leaves the chords to carry; a drop to the bass and a clean guitar; then the wall
  returns and ends in feedback.

  Band and song: the style is known for guitars layered until they blur, a voice mixed as one more
  instrument, and melodies that drift over one held chord.

  Checklist: it works because the piece is all haze and held harmony, which is what the style does
  with volume. The hook is the opening melody sung inside the guitars; the lift is the flowing middle;
  the contrast is the stretch without the wall.

  Run it with: llamatron examples/mashups/rock/moonlight_feedback.yml

  Scene 1, wall, 9/2 bars.
  Scene 2, drums arrive, 9/2 bars.
  Scene 3, tune, buried, 9 bars.
  Scene 4, the chords carry, 9 bars.
  Scene 5, tune, second part, 9 bars.
  Scene 6, drop, 27/4 bars.
  Scene 7, the wall returns, 9 bars.
  Scene 8, second part, louder, 9 bars.
  Scene 9, feedback, 27/4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
