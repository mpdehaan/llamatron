          - { track: hat, pattern: hat 2, loop: true }
          - { track: rim, pattern: rim 3, loop: true }
          - { track: crash, pattern: crash 2, loop: true }
      - name: "the break, out"
        clips:
          - { track: kick, pattern: kick 7, repeat: 1 }
          - { track: snare, pattern: snare 6, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
          - { track: rim, pattern: rim 2, loop: true }
