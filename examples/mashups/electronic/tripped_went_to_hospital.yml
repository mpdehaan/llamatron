version: 1.0.365
title: "Tripped, went to hospital"
description: St
notes: |
  Tripped, went to hospital: St. James Infirmary as nineties trip hop. The tune of St. James Infirmary
  (traditional) is public domain and is played as written, with its chords, read from the corpus's
  lead sheet; the slow breakbeat, the bass, the electric piano, the vibraphone's answers and the solos
  are new. Version 2.

  Subgenre: trip hop of the middle nineties. Drums: a slow, dusty breakbeat, the kick late, a snare on
  two and four with a ghost note before the bar turns. Tempo 80, lightly swung. Bass: an upright, one
  long note and two short. Sounds: a muted trumpet on the tune, a vibraphone, an electric piano
  holding seventh chords, strings. Form: the breakbeat alone opens and closes it; the bass joins
  before any tune; the tune's first two bars loop like a sample before it plays whole; drums and bass
  have stretches to themselves; and a dub passage strips it to one kick, a rim and an echoing
  vibraphone.

  Band and song: the style is known for hip-hop drums at a crawl under the sounds of old film scores
  and jazz records, sad and unhurried.

  Checklist: it works because the song is a slow minor lament, and the genre is made of those. The
  hook is the tune on a muted trumpet; the lift is the vibraphone taking it higher; the contrast is
  the stretch with the tune in the bass.

  Run it with: llamatron examples/mashups/electronic/tripped_went_to_hospital.yml

  Scene 1, the break, 4 bars.
  Scene 2, bass comes in, 4 bars.
  Scene 3, the sample, 4 bars.
  Scene 4, tune, 8 bars.
  Scene 5, drums and bass, 4 bars.
  Scene 6, second half, 8 bars.
  Scene 7, dub, 6 bars.
  Scene 8, tune in the bass, 8 bars.
  Scene 9, the break again, 2 bars.
  Scene 10, last tune, 8 bars.
  Scene 11, the break, out, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
