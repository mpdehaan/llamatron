instruments:
  muted trumpet: { device: "*FluidSynth", gm_sound: 60 }
  vibraphone: { device: "*FluidSynth", gm_sound: 12 }
  electric piano: { device: "*FluidSynth", gm_sound: 5 }
  acoustic bass: { device: "*FluidSynth", gm_sound: 33 }
  strings: { device: "*FluidSynth", gm_sound: 49 }
  drum kit: { device: "*FluidSynth" }

songs:
  tripped_went_to_hospital:
    tempo: 80
    scale: D Minor
    groove: 8th swing 58
    genre: Mashup
    subgenre: Electronic

    tracks:
      kick: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      rim: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      trumpet: { instrument: muted trumpet }
      vibes: { instrument: vibraphone }
      keys: { instrument: electric piano }
      bass: { instrument: acoustic bass }
      strings: { instrument: strings }

    scenes:
      - name: the break
        tracks:
          kick: { pattern: kick 1, repeat: 1 }
          snare: { pattern: snare 1, loop: true }
          hat: { pattern: hat 1, loop: true }
          rim: { pattern: rim 1, loop: true }
      - name: bass comes in
        tracks:
          vibes: { pattern: vibes 1, repeat: 1 }
          bass: { pattern: bass 1, loop: true }
          kick: { pattern: kick 2, loop: true }
          snare: { pattern: snare 2, loop: true }
          hat: { pattern: hat 1, loop: true }
          rim: { pattern: rim 2, loop: true }
          crash: { pattern: crash 1, loop: true }
      - name: the sample
        tracks:
          trumpet: { pattern: trumpet 1, repeat: 1 }
          bass: { pattern: bass 2, loop: true }
          kick: { pattern: kick 2, loop: true }
          snare: { pattern: snare 2, loop: true }
          hat: { pattern: hat 1, loop: true }
          rim: { pattern: rim 2, loop: true }
          crash: { pattern: crash 1, loop: true }
      - name: tune
        tracks:
          trumpet: { pattern: trumpet 2, repeat: 1 }
          vibes: { pattern: vibes 2, loop: true }
          keys: { pattern: keys 1, loop: true }
          bass: { pattern: bass 3, loop: true }
          kick: { pattern: kick 3, loop: true }
          snare: { pattern: snare 3, loop: true }
          hat: { pattern: hat 2, loop: true }
          rim: { pattern: rim 3, loop: true }
          crash: { pattern: crash 2, loop: true }
      - name: drums and bass
        tracks:
          bass: { pattern: bass 1, repeat: 1 }
          kick: { pattern: kick 2, loop: true }
          snare: { pattern: snare 2, loop: true }
          hat: { pattern: hat 1, loop: true }
          rim: { pattern: rim 2, loop: true }
          crash: { pattern: crash 1, loop: true }
      - name: second half
        tracks:
          trumpet: { pattern: trumpet 3, repeat: 1 }
          vibes: { pattern: vibes 3, loop: true }
          keys: { pattern: keys 1, loop: true }
          bass: { pattern: bass 3, loop: true }
          strings: { pattern: strings 1, loop: true }
          kick: { pattern: kick 3, loop: true }
          snare: { pattern: snare 3, loop: true }
          hat: { pattern: hat 2, loop: true }
          rim: { pattern: rim 3, loop: true }
          crash: { pattern: crash 2, loop: true }
      - name: dub
        tracks:
          vibes: { pattern: vibes 4, repeat: 1 }
          keys: { pattern: keys 2, loop: true }
          bass: { pattern: bass 4, loop: true }
          kick: { pattern: kick 4, loop: true }
          rim: { pattern: rim 4, loop: true }
          crash: { pattern: crash 3, loop: true }
      - name: tune in the bass
        tracks:
          trumpet: { pattern: trumpet 4, repeat: 1 }
          keys: { pattern: keys 1, loop: true }
          bass: { pattern: bass 5, loop: true }
          strings: { pattern: strings 1, loop: true }
          kick: { pattern: kick 5, loop: true }
          snare: { pattern: snare 4, loop: true }
          hat: { pattern: hat 3, loop: true }
          rim: { pattern: rim 5, loop: true }
          crash: { pattern: crash 2, loop: true }
      - name: the break again
        tracks:
          kick: { pattern: kick 6, repeat: 1 }
          snare: { pattern: snare 5, loop: true }
          hat: { pattern: hat 4, loop: true }
          rim: { pattern: rim 6, loop: true }
          crash: { pattern: crash 4, loop: true }
      - name: last tune
        tracks:
          trumpet: { pattern: trumpet 2, repeat: 1 }
          vibes: { pattern: vibes 5, loop: true }
          keys: { pattern: keys 1, loop: true }
          bass: { pattern: bass 3, loop: true }
          strings: { pattern: strings 1, loop: true }
          kick: { pattern: kick 3, loop: true }
          snare: { pattern: snare 3, loop: true }
          hat: { pattern: hat 2, loop: true }
          rim: { pattern: rim 3, loop: true }
          crash: { pattern: crash 2, loop: true }
      - name: "the break, out"
        tracks:
          kick: { pattern: kick 7, repeat: 1 }
          snare: { pattern: snare 6, loop: true }
          hat: { pattern: hat 1, loop: true }
          rim: { pattern: rim 2, loop: true }
