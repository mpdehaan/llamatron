  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: tripped_went_to_hospital
    tempo: 80
    scale: D Minor
    groove: 8th swing 58
    genre: Mashup
    subgenre: Electronic

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: snare, drum: true, instrument: drum kit }
      - { name: hat, drum: true, instrument: drum kit }
      - { name: rim, drum: true, instrument: drum kit }
      - { name: crash, drum: true, instrument: drum kit }
      - { name: trumpet, instrument: muted trumpet }
      - { name: vibes, instrument: vibraphone }
      - { name: keys, instrument: electric piano }
      - { name: bass, instrument: acoustic bass }
      - { name: strings, instrument: strings }

    scenes:
      - name: the break
        clips:
          - { track: kick, pattern: kick 1, repeat: 1 }
          - { track: snare, pattern: snare 1, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
          - { track: rim, pattern: rim 1, loop: true }
      - name: bass comes in
        clips:
          - { track: vibes, pattern: vibes 1, repeat: 1 }
          - { track: bass, pattern: bass 1, loop: true }
          - { track: kick, pattern: kick 2, loop: true }
          - { track: snare, pattern: snare 2, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
          - { track: rim, pattern: rim 2, loop: true }
          - { track: crash, pattern: crash 1, loop: true }
      - name: the sample
        clips:
          - { track: trumpet, pattern: trumpet 1, repeat: 1 }
          - { track: bass, pattern: bass 2, loop: true }
          - { track: kick, pattern: kick 2, loop: true }
          - { track: snare, pattern: snare 2, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
          - { track: rim, pattern: rim 2, loop: true }
          - { track: crash, pattern: crash 1, loop: true }
      - name: tune
        clips:
          - { track: trumpet, pattern: trumpet 2, repeat: 1 }
          - { track: vibes, pattern: vibes 2, loop: true }
          - { track: keys, pattern: keys 1, loop: true }
          - { track: bass, pattern: bass 3, loop: true }
          - { track: kick, pattern: kick 3, loop: true }
          - { track: snare, pattern: snare 3, loop: true }
          - { track: hat, pattern: hat 2, loop: true }
          - { track: rim, pattern: rim 3, loop: true }
          - { track: crash, pattern: crash 2, loop: true }
      - name: drums and bass
        clips:
          - { track: bass, pattern: bass 1, repeat: 1 }
          - { track: kick, pattern: kick 2, loop: true }
          - { track: snare, pattern: snare 2, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
          - { track: rim, pattern: rim 2, loop: true }
          - { track: crash, pattern: crash 1, loop: true }
      - name: second half
        clips:
          - { track: trumpet, pattern: trumpet 3, repeat: 1 }
          - { track: vibes, pattern: vibes 3, loop: true }
          - { track: keys, pattern: keys 1, loop: true }
          - { track: bass, pattern: bass 3, loop: true }
          - { track: strings, pattern: strings 1, loop: true }
          - { track: kick, pattern: kick 3, loop: true }
          - { track: snare, pattern: snare 3, loop: true }
          - { track: hat, pattern: hat 2, loop: true }
          - { track: rim, pattern: rim 3, loop: true }
          - { track: crash, pattern: crash 2, loop: true }
      - name: dub
        clips:
          - { track: vibes, pattern: vibes 4, repeat: 1 }
          - { track: keys, pattern: keys 2, loop: true }
          - { track: bass, pattern: bass 4, loop: true }
          - { track: kick, pattern: kick 4, loop: true }
          - { track: rim, pattern: rim 4, loop: true }
          - { track: crash, pattern: crash 3, loop: true }
      - name: tune in the bass
        clips:
          - { track: trumpet, pattern: trumpet 4, repeat: 1 }
          - { track: keys, pattern: keys 1, loop: true }
          - { track: bass, pattern: bass 5, loop: true }
          - { track: strings, pattern: strings 1, loop: true }
          - { track: kick, pattern: kick 5, loop: true }
          - { track: snare, pattern: snare 4, loop: true }
          - { track: hat, pattern: hat 3, loop: true }
          - { track: rim, pattern: rim 5, loop: true }
          - { track: crash, pattern: crash 2, loop: true }
      - name: the break again
        clips:
          - { track: kick, pattern: kick 6, repeat: 1 }
          - { track: snare, pattern: snare 5, loop: true }
          - { track: hat, pattern: hat 4, loop: true }
          - { track: rim, pattern: rim 6, loop: true }
          - { track: crash, pattern: crash 4, loop: true }
      - name: last tune
        clips:
          - { track: trumpet, pattern: trumpet 2, repeat: 1 }
          - { track: vibes, pattern: vibes 5, loop: true }
          - { track: keys, pattern: keys 1, loop: true }
          - { track: bass, pattern: bass 3, loop: true }
          - { track: strings, pattern: strings 1, loop: true }
          - { track: kick, pattern: kick 3, loop: true }
