version: 1.0.365
title: "Lion can't sleep"
description: the Ride of the Valkyries as nineties jungle
notes: |
  Lion can't sleep: the Ride of the Valkyries as nineties jungle. The horn theme of the Ride of the
  Valkyries (Richard Wagner, 1856) is public domain and is played as written, in its key and its nine-
  eight time, from Claude's knowledge of the score, on horns as if sampled from a record; the chopped
  breakbeats, the sub bass, the stabs and the arpeggios that answer are new. Version 1.

  Subgenre: jungle of the middle nineties. Drums: a chopped breakbeat, kicks in pairs, snares off the
  beat with ghost notes between, re-cut for the fills. Tempo 172. Bass: a sub bass in long notes under
  everything. Sounds: French horns playing the theme like a sample, a square lead that chops it short,
  orchestra-hit stabs, a pad.

  Band and song: the style is known for breakbeats sped up and cut apart, a bass felt more than heard,
  and samples of films and orchestras laid over both.

  Checklist: it works because jungle producers loved an orchestral sample, and this one is the most
  famous there is. The hook is the horn call over a breakbeat; the lift is each re-cut fill and the
  theme a step higher; the contrast is the quiet stretch, a pad and hats alone.

  Run it with: llamatron examples/mashups/electronic/lion_cant_sleep.yml

  Scene 1, riff, 9 bars.
  Scene 2, theme, 9 bars.
  Scene 3, second theme, 9 bars.
  Scene 4, riff again, 9/2 bars.
  Scene 5, theme, traded, 9 bars.
  Scene 6, half time, 9 bars.
  Scene 7, quiet, 9 bars.
  Scene 8, build, 9/2 bars.
  Scene 9, solo, 18 bars.
  Scene 10, theme, higher, 9 bars.
  Scene 11, second theme, higher, 9 bars.
  Scene 12, riff once more, 9/2 bars.
  Scene 13, last theme, 9 bars.
  Scene 14, last second theme, 9 bars.
  Scene 15, ending, 9/2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
