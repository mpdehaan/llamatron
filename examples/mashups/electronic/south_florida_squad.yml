version: 1.0.591
title: South Florida squad
description: "the storm of the Moonlight Sonata as an eighties cop show's theme, after the Miami Vice theme (Jan Hammer)"
notes: |
  South Florida squad: the storm of the Moonlight Sonata as an eighties cop show's theme, after the
  Miami Vice theme (Jan Hammer). The opening arpeggios and the second theme of the last movement of
  the Piano Sonata No. 14 (Ludwig van Beethoven, 1801) are public domain and are played as written,
  read from the corpus's score; the drum machine, the percussion, the bass, the brass stabs, the solos
  and the tom-tom breaks are new, with nothing of the reference's own tune quoted. Version 1.

  Subgenre: an eighties television theme for synthesizers. Drums: a drum machine, a kick on one and
  three with a push, a snare and clap on two and four, hats in sixteenths, and breaks of electronic
  tom-toms and timbales; it opens on percussion alone. Tempo 126. Bass: a synth bass in eighths
  jumping the octave, slapped in places. Sounds: a saw lead, a square lead, synth brass stabs, a pad.

  Band and song: the composer is known for a synthesizer played like a lead guitar, percussion breaks
  between phrases, and a pulse that never lets up.

  Checklist: it works because the movement's rising arpeggios are what a synthesizer's arpeggiator
  does. The hook is the arpeggios racing up to their two chords; the lift is the solo and the theme a
  step higher; the contrast is the quiet stretch, the second theme over a pad.

  Run it with: llamatron examples/mashups/electronic/south_florida_squad.yml

  Scene 1, percussion, 4 bars.
  Scene 2, groove, 4 bars.
  Scene 3, arpeggios, 8 bars.
  Scene 4, arpeggios, doubled, 8 bars.
  Scene 5, tom-toms, 2 bars.
  Scene 6, second theme, 8 bars.
  Scene 7, groove again, 4 bars.
  Scene 8, second theme, traded, 8 bars.
  Scene 9, half time, 8 bars.
  Scene 10, quiet, 8 bars.
  Scene 11, build, 4 bars.
  Scene 12, solo, 8 bars.
  Scene 13, tom-toms again, 2 bars.
  Scene 14, arpeggios, higher, 8 bars.
  Scene 15, last second theme, 8 bars.
  Scene 16, ending, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
