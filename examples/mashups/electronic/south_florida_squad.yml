version: 1.0.365
title: South Florida squad
description: "the Ride of the Valkyries as an eighties television action score for synthesizers, after the Miami Vice theme (Jan Hammer)"
notes: |
  South Florida squad: the Ride of the Valkyries as an eighties television action score for
  synthesizers, after the Miami Vice theme (Jan Hammer). The horn theme of the Ride of the Valkyries
  (Richard Wagner, 1856) is public domain and is played as written, in its key and its nine-eight
  time, from Claude's knowledge of the score; the sequenced bass, the stabs, the tom-tom runs, the
  licks and the solos are new, and nothing of the reference's own tune is quoted. Version 1.

  Subgenre: an electronic action theme of the mid eighties. Drums: a drum machine, the kick on one, a
  snare and a clap on the second and third beats, sixteenth hats, tom-toms running down at the end of
  each phrase, a cowbell and a timbale in the quiet parts. Tempo 150. Bass: a sequenced synthesizer in
  sixteenths, root and octave. Sounds: a singing saw lead that plays like a guitar, a square lead,
  brass stabs, a warm pad.

  Band and song: the composer is known for scoring a police drama with one man's synthesizers: a lead
  played like a rock guitar, a machine's tom-toms, and stabs that punctuate like gunshots.

  Checklist: it works because the horn call is a chase tune and the genre is chase music. The hook is
  the call on the saw lead over the running bass; the lift is the tom-tom run into each new section
  and the theme a step higher; the contrast is the quiet stretch over a cowbell.

  Run it with: llamatron examples/mashups/electronic/south_florida_squad.yml

  Scene 1, riff, 9/2 bars.
  Scene 2, theme, 9 bars.
  Scene 3, second theme, 9 bars.
  Scene 4, riff again, 9/2 bars.
  Scene 5, theme, traded, 9 bars.
  Scene 6, half time, 9 bars.
  Scene 7, quiet, 9 bars.
  Scene 8, build, 9/2 bars.
  Scene 9, solo, 9 bars.
  Scene 10, theme, higher, 9 bars.
  Scene 11, second theme, higher, 9 bars.
  Scene 12, riff once more, 9/2 bars.
  Scene 13, last theme, 9 bars.
  Scene 14, last second theme, 9 bars.
  Scene 15, ending, 9/2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
