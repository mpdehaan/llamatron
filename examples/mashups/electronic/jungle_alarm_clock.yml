instruments:
  flute: { device: "*FluidSynth", gm_sound: 73 }
  bright piano: { device: "*FluidSynth", gm_sound: 1 }
  sub bass: { device: "*FluidSynth", gm_sound: 39 }
  orchestra hit: { device: "*FluidSynth", gm_sound: 56 }
  warm pad: { device: "*FluidSynth", gm_sound: 90 }
  drum kit: { device: "*FluidSynth" }

songs:
  jungle_alarm_clock:
    tempo: 168
    scale: E Major
    genre: Electronic Mashup

    tracks:
      kick: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      ride: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      open: { drum: true, instrument: drum kit }
      flute: { instrument: flute }
      piano: { instrument: bright piano }
      stabs: { instrument: orchestra hit }
      bass: { instrument: sub bass }
      pad: { instrument: warm pad }

    scenes:
      - name: dawn
        tracks:
          flute: { pattern: flute 1, repeat: 1 }
          pad: { pattern: pad 1, loop: true }
      - name: the break arrives
        tracks:
          kick: { pattern: kick 1, repeat: 1 }
          snare: { pattern: snare 1, loop: true }
          hat: { pattern: hat 1, loop: true }
          open: { pattern: open 1, loop: true }
      - name: drop
        tracks:
          flute: { pattern: flute 2, repeat: 1 }
          piano: { pattern: piano 1, loop: true }
          stabs: { pattern: stabs 1, loop: true }
          bass: { pattern: bass 1, loop: true }
          kick: { pattern: kick 2, loop: true }
          snare: { pattern: snare 2, loop: true }
          hat: { pattern: hat 2, loop: true }
          crash: { pattern: crash 1, loop: true }
          open: { pattern: open 2, loop: true }
      - name: "break, re-cut"
        tracks:
          kick: { pattern: kick 3, repeat: 1 }
          snare: { pattern: snare 3, loop: true }
          ride: { pattern: ride 1, loop: true }
          crash: { pattern: crash 2, loop: true }
      - name: bass and breaks
        tracks:
          piano: { pattern: piano 2, repeat: 1 }
          stabs: { pattern: stabs 2, loop: true }
          bass: { pattern: bass 2, loop: true }
          kick: { pattern: kick 4, loop: true }
          snare: { pattern: snare 4, loop: true }
          hat: { pattern: hat 3, loop: true }
          ride: { pattern: ride 2, loop: true }
          crash: { pattern: crash 3, loop: true }
          open: { pattern: open 3, loop: true }
      - name: the tune a third higher
        tracks:
          flute: { pattern: flute 3, repeat: 1 }
          piano: { pattern: piano 3, loop: true }
          stabs: { pattern: stabs 3, loop: true }
          bass: { pattern: bass 3, loop: true }
          pad: { pattern: pad 2, loop: true }
          kick: { pattern: kick 2, loop: true }
          snare: { pattern: snare 2, loop: true }
          hat: { pattern: hat 2, loop: true }
          crash: { pattern: crash 1, loop: true }
          open: { pattern: open 2, loop: true }
      - name: breakdown
        tracks:
          piano: { pattern: piano 4, repeat: 1 }
          bass: { pattern: bass 4, loop: true }
          pad: { pattern: pad 1, loop: true }
      - name: snare roll
        tracks:
          kick: { pattern: kick 5, repeat: 1 }
          snare: { pattern: snare 5, loop: true }
          crash: { pattern: crash 2, loop: true }
      - name: second drop
        tracks:
          flute: { pattern: flute 2, repeat: 1 }
          piano: { pattern: piano 1, loop: true }
          stabs: { pattern: stabs 1, loop: true }
          bass: { pattern: bass 5, loop: true }
          kick: { pattern: kick 6, loop: true }
          snare: { pattern: snare 6, loop: true }
          hat: { pattern: hat 4, loop: true }
          ride: { pattern: ride 3, loop: true }
          crash: { pattern: crash 1, loop: true }
          open: { pattern: open 2, loop: true }
      - name: chopped
        tracks:
          piano: { pattern: piano 5, repeat: 1 }
          stabs: { pattern: stabs 2, loop: true }
          bass: { pattern: bass 6, loop: true }
          kick: { pattern: kick 7, loop: true }
          snare: { pattern: snare 7, loop: true }
          ride: { pattern: ride 4, loop: true }
          crash: { pattern: crash 3, loop: true }
      - name: higher
        tracks:
          flute: { pattern: flute 4, repeat: 1 }
          piano: { pattern: piano 6, loop: true }
          stabs: { pattern: stabs 4, loop: true }
          bass: { pattern: bass 7, loop: true }
          pad: { pattern: pad 3, loop: true }
          kick: { pattern: kick 2, loop: true }
          snare: { pattern: snare 2, loop: true }
          hat: { pattern: hat 2, loop: true }
          crash: { pattern: crash 1, loop: true }
          open: { pattern: open 2, loop: true }
      - name: drums alone
        tracks:
          kick: { pattern: kick 8, repeat: 1 }
          snare: { pattern: snare 8, loop: true }
          hat: { pattern: hat 5, loop: true }
          ride: { pattern: ride 5, loop: true }
          crash: { pattern: crash 2, loop: true }
          open: { pattern: open 1, loop: true }
      - name: last drop
        tracks:
          flute: { pattern: flute 1, repeat: 1 }
          piano: { pattern: piano 4, loop: true }
          stabs: { pattern: stabs 5, loop: true }
          bass: { pattern: bass 8, loop: true }
          kick: { pattern: kick 4, loop: true }
          snare: { pattern: snare 4, loop: true }
          hat: { pattern: hat 3, loop: true }
          ride: { pattern: ride 2, loop: true }
          crash: { pattern: crash 3, loop: true }
          open: { pattern: open 3, loop: true }
      - name: sunrise
        tracks:
          flute: { pattern: flute 1, repeat: 1 }
          bass: { pattern: bass 4, loop: true }
          pad: { pattern: pad 1, loop: true }
          hat: { pattern: hat 6, loop: true }
          ride: { pattern: ride 6, loop: true }
          crash: { pattern: crash 3, loop: true }
