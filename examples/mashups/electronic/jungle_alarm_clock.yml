version: 1.0.591
title: Jungle alarm clock
description: Morning Mood as nineties jungle
notes: |
  Jungle alarm clock: Morning Mood as nineties jungle. The opening tune of Morning Mood from Peer Gynt
  (Edvard Grieg, 1875) is public domain; its pitches are played in their order, from Claude's
  knowledge of the score, each bar's six notes spread over the breakbeat as three, three and two, and
  it comes back a third higher as the composer brings it back; the chopped breakbeats, the sub bass,
  the stabs, the piano's answers and the stretches of drums and bass alone are new. Version 1.

  Subgenre: jungle of the middle nineties. Drums: a chopped breakbeat, kicks in pairs, snares on two
  and four with ghost notes between, the fourth bar's snare late, re-cut into other orders for the
  breaks and rolled before a drop. Tempo 168. Bass: a sub bass in long notes, wobbling in the drops.
  Sounds: a flute playing the tune like a sample, a bright piano that stabs it short, orchestra hits,
  a pad.

  Band and song: the style is known for breakbeats sped up and cut apart, a bass felt more than heard,
  a calm melody floating at half the drums' speed, and a form of intro, drop, breakdown and second
  drop.

  Checklist: it works because a slow, bright tune over fast drums is the genre's favourite contrast.
  The hook is the flute's tune over the break; the lift is each drop after drums alone or a snare
  roll; the contrast is the breakdown, the piano and a pad with no drums.

  Run it with: llamatron examples/mashups/electronic/jungle_alarm_clock.yml

  Scene 1, dawn, 8 bars.
  Scene 2, the break arrives, 4 bars.
  Scene 3, drop, 16 bars.
  Scene 4, break, re-cut, 4 bars.
  Scene 5, bass and breaks, 8 bars.
  Scene 6, the tune a third higher, 16 bars.
  Scene 7, breakdown, 8 bars.
  Scene 8, snare roll, 4 bars.
  Scene 9, second drop, 16 bars.
  Scene 10, chopped, 8 bars.
  Scene 11, higher, 16 bars.
  Scene 12, drums alone, 4 bars.
  Scene 13, last drop, 8 bars.
  Scene 14, sunrise, 8 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
