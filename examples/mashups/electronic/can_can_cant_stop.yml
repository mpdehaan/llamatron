          strings: { pattern: strings 1, loop: true }
      - name: roll
        tracks:
          kick: { pattern: kick 3, repeat: 1 }
          snare: { pattern: snare 3, loop: true }
      - name: "roll, faster"
        tracks:
          kick: { pattern: kick 3, repeat: 1 }
          snare: { pattern: snare 4, loop: true }
      - name: drop
        tracks:
          lead: { pattern: lead 1, repeat: 1 }
