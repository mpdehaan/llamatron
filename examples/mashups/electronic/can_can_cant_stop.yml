version: 1.0.591
title: "Can-can can't stop"
description: the Can-Can as nineties happy hardcore
notes: |
  Can-can can't stop: the Can-Can as nineties happy hardcore. The galop from Orpheus in the Underworld
  (Jacques Offenbach, 1858) is public domain and is played as written, from Claude's knowledge of the
  score, in its key and then in the key a fifth above; the rave piano, the offbeat bass, the
  arpeggios, the solos and the drums are new. Version 2.

  Subgenre: happy hardcore of the middle nineties. Drums: a kick on every beat, an open hat on every
  offbeat, a breakbeat's snare and a clap on two and four, a snare roll into each drop. Tempo 172.
  Bass: a short note on every offbeat. Sounds: a bright piano stabbing chords in a broken rhythm, a
  saw lead, a square lead cutting the tune short, strings. Form: a kick and an offbeat bass alone open
  and close it, for a disc jockey to mix; the piano stabs before the tune; two breakdowns with no
  drums, each ended by a snare roll that doubles its speed into the drop.

  Band and song: the style is known for major keys at great speed, piano chords from house records,
  and tunes pitched up until they sound like toys.

  Checklist: it works because a galop is already dance music at a sprint. The hook is the galop on a
  saw lead over a kick on every beat; the lift is the snare roll and the tune a step higher; the
  contrast is the stretch without the kick, piano and strings alone.

  Run it with: llamatron examples/mashups/electronic/can_can_cant_stop.yml

  Scene 1, kick and bass, 8 bars.
  Scene 2, piano stabs, 8 bars.
  Scene 3, tune, 16 bars.
  Scene 4, piano breakdown, 8 bars.
  Scene 5, roll, 2 bars.
  Scene 6, roll, faster, 2 bars.
  Scene 7, drop, 16 bars.
  Scene 8, second tune, 16 bars.
  Scene 9, stabs alone, 8 bars.
  Scene 10, roll again, 2 bars.
  Scene 11, roll again, faster, 2 bars.
  Scene 12, tune, higher, 16 bars.
  Scene 13, second tune, higher, 8 bars.
  Scene 14, last tune, 8 bars.
  Scene 15, kick, out, 8 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
