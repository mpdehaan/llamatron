version: 1.0.591
title: Chipped jazz
description: the Maple Leaf Rag as a chiptune
notes: |
  Chipped jazz: the Maple Leaf Rag as a chiptune. The first two strains of the Maple Leaf Rag (Scott
  Joplin, 1899) are public domain and are played as written, read from the corpus's edition of the
  piano score; the arpeggios, the bass, the second voice's answers, the solos and the drums are new.
  Version 2.

  Subgenre: chiptune, the music of eight-bit game consoles. Drums: a noise channel, a kick on one and
  three, a snare on two and four, a tick on every eighth. Tempo 116. Bass: short notes bouncing
  between root, octave and fifth. Sounds: two square-wave voices, one on the rag and one answering, a
  third spinning each chord as a fast arpeggio, since the machine cannot play chords. Form: fast
  arpeggios stand in for chords and open it alone; a break on the noise channel and a rising jingle,
  as when a game changes level, come between the strains; and bass and arpeggios have eight bars with
  no tune.

  Band and song: the style is known for making three voices sound like a band: arpeggios so fast they
  blur into chords, and tunes with every note bitten off short.

  Checklist: it works because a rag is a machine of exact, busy notes, and so is a game console. The
  hook is the rag's opening on a square wave; the lift is the second strain with both voices; the
  contrast is the stretch where the arpeggio stops.

  Run it with: llamatron examples/mashups/electronic/chipped_jazz.yml

  Scene 1, arpeggios, 4 bars.
  Scene 2, bass joins, 4 bars.
  Scene 3, first strain, 16 bars.
  Scene 4, noise break, 2 bars.
  Scene 5, level up, 2 bars.
  Scene 6, second strain, 16 bars.
  Scene 7, bass and arpeggios, 8 bars.
  Scene 8, the bass has it, 8 bars.
  Scene 9, noise break again, 2 bars.
  Scene 10, level up again, 2 bars.
  Scene 11, first strain, higher, 16 bars.
  Scene 12, game over, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
