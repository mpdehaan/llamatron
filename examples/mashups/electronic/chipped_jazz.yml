instruments:
  - { name: square lead, device: "*FluidSynth", gm_sound: 81 }
  - { name: saw lead, device: "*FluidSynth", gm_sound: 82 }
  - { name: synth bass, device: "*FluidSynth", gm_sound: 39 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: chipped_jazz
    tempo: 116
    scale: Ab Major
    genre: Mashup
    subgenre: Electronic

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: snare, drum: true, instrument: drum kit }
      - { name: hat, drum: true, instrument: drum kit }
      - { name: pulse, instrument: square lead }
      - { name: second pulse, instrument: saw lead }
      - { name: arp, instrument: square lead }
      - { name: bass, instrument: synth bass }

    scenes:
      - name: arpeggios
        clips:
          - { track: arp, pattern: arp 1, repeat: 1 }
      - name: bass joins
        clips:
          - { track: arp, pattern: arp 1, repeat: 1 }
          - { track: bass, pattern: bass 1, loop: true }
      - name: first strain
        clips:
          - { track: pulse, pattern: pulse 1, repeat: 1 }
          - { track: arp, pattern: arp 2, loop: true }
          - { track: bass, pattern: bass 2, loop: true }
          - { track: kick, pattern: kick 1, loop: true }
          - { track: snare, pattern: snare 1, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
      - name: noise break
        clips:
          - { track: kick, pattern: kick 2, repeat: 1 }
          - { track: snare, pattern: snare 2, loop: true }
      - name: level up
        clips:
          - { track: pulse, pattern: pulse 2, repeat: 1 }
      - name: second strain
        clips:
          - { track: pulse, pattern: pulse 3, repeat: 1 }
          - { track: second pulse, pattern: second pulse 1, loop: true }
          - { track: arp, pattern: arp 3, loop: true }
          - { track: bass, pattern: bass 3, loop: true }
          - { track: kick, pattern: kick 1, loop: true }
          - { track: snare, pattern: snare 1, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
      - name: bass and arpeggios
        clips:
          - { track: second pulse, pattern: second pulse 2, repeat: 1 }
          - { track: arp, pattern: arp 4, loop: true }
          - { track: bass, pattern: bass 4, loop: true }
          - { track: kick, pattern: kick 3, loop: true }
          - { track: snare, pattern: snare 3, loop: true }
          - { track: hat, pattern: hat 2, loop: true }
      - name: the bass has it
        clips:
          - { track: pulse, pattern: pulse 4, repeat: 1 }
          - { track: arp, pattern: arp 5, loop: true }
          - { track: bass, pattern: bass 5, loop: true }
          - { track: kick, pattern: kick 4, loop: true }
          - { track: snare, pattern: snare 4, loop: true }
          - { track: hat, pattern: hat 3, loop: true }
      - name: noise break again
        clips:
          - { track: kick, pattern: kick 2, repeat: 1 }
          - { track: snare, pattern: snare 2, loop: true }
      - name: level up again
        clips:
          - { track: pulse, pattern: pulse 5, repeat: 1 }
      - name: "first strain, higher"
        clips:
          - { track: pulse, pattern: pulse 6, repeat: 1 }
          - { track: second pulse, pattern: second pulse 3, loop: true }
          - { track: arp, pattern: arp 6, loop: true }
          - { track: bass, pattern: bass 6, loop: true }
          - { track: kick, pattern: kick 1, loop: true }
          - { track: snare, pattern: snare 1, loop: true }
          - { track: hat, pattern: hat 1, loop: true }
      - name: game over
        clips:
          - { track: second pulse, pattern: second pulse 4, repeat: 1 }
          - { track: arp, pattern: arp 1, loop: true }
