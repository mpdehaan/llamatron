songs:
  house_entertainer:
    tempo: 124
    scale: C Major
    genre: Mashup
    subgenre: Electronic

    tracks:
      kick: { drum: true, instrument: drum kit }
      clap: { drum: true, instrument: drum kit }
      open: { drum: true, instrument: drum kit }
      shaker: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      piano: { instrument: bright piano }
      organ: { instrument: organ }
      chords: { instrument: piano }
      bass: { instrument: synth bass }
      strings: { instrument: strings }

    scenes:
      - name: kick
        tracks:
          kick: { pattern: kick 1, repeat: 1 }
          shaker: { pattern: shaker 1, loop: true }
      - name: hats and bass
        tracks:
          bass: { pattern: bass 1, repeat: 1 }
          kick: { pattern: kick 1, loop: true }
          open: { pattern: open 1, loop: true }
          shaker: { pattern: shaker 1, loop: true }
          crash: { pattern: crash 1, loop: true }
      - name: piano chords
        tracks:
