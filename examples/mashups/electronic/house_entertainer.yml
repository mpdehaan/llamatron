version: 1.0.365
title: House entertainer
description: The Entertainer as piano house
notes: |
  House entertainer: The Entertainer as piano house. The first two strains of The Entertainer (Scott
  Joplin, 1902) are public domain and are played as written, read from the corpus's edition of the
  piano score; the house chords, the bass, the organ's answers, the solos and the drums are new.
  Version 2.

  Subgenre: piano house of about 1990. Drums: a kick on every beat, a clap on two and four, an open
  hat on every offbeat, a shaker in sixteenths. Tempo 124. Bass: short notes off the beat. Sounds: a
  bright piano on the rag, a second piano stabbing seventh chords in a broken rhythm, an organ,
  strings. Form: a kick alone, then hats and bass, open it; the piano's chords stand alone twice; the
  rag plays in a breakdown with no kick, a snare roll builds, and the drop follows; bass and drums
  alone close it.

  Band and song: the style is known for gospel piano chords over a drum machine, and for dropping the
  kick away so that the piano carries the room.

  Checklist: it works because ragtime is syncopated piano over a steady beat, and so is piano house.
  The hook is the rag's first strain over a kick on every beat; the lift is the second strain with the
  organ answering; the contrast is the stretch without the kick.

  Run it with: llamatron examples/mashups/electronic/house_entertainer.yml

  Scene 1, kick, 4 bars.
  Scene 2, hats and bass, 4 bars.
  Scene 3, piano chords, 8 bars.
  Scene 4, rag, 16 bars.
  Scene 5, organ, 8 bars.
  Scene 6, breakdown, 8 bars.
  Scene 7, roll, 4 bars.
  Scene 8, drop, 16 bars.
  Scene 9, piano chords again, 8 bars.
  Scene 10, rag, higher, 8 bars.
  Scene 11, bass and drums, out, 8 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
