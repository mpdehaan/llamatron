          chords: { pattern: chords 2, loop: true }
          bass: { pattern: bass 3, loop: true }
          kick: { pattern: kick 3, loop: true }
          clap: { pattern: clap 2, loop: true }
          open: { pattern: open 3, loop: true }
          shaker: { pattern: shaker 3, loop: true }
          snare: { pattern: snare 2, loop: true }
          crash: { pattern: crash 3, loop: true }
      - name: organ
        tracks:
          organ: { pattern: organ 2, repeat: 1 }
          chords: { pattern: chords 1, loop: true }
          bass: { pattern: bass 2, loop: true }
          kick: { pattern: kick 2, loop: true }
          clap: { pattern: clap 1, loop: true }
          open: { pattern: open 2, loop: true }
          shaker: { pattern: shaker 2, loop: true }
          snare: { pattern: snare 1, loop: true }
          crash: { pattern: crash 2, loop: true }
      - name: breakdown
        tracks:
          piano: { pattern: piano 2, repeat: 1 }
          strings: { pattern: strings 1, loop: true }
      - name: roll
        tracks:
          chords: { pattern: chords 3, repeat: 1 }
          kick: { pattern: kick 1, loop: true }
          snare: { pattern: snare 3, loop: true }
          crash: { pattern: crash 1, loop: true }
      - name: drop
        tracks:
          piano: { pattern: piano 3, repeat: 1 }
          organ: { pattern: organ 3, loop: true }
          chords: { pattern: chords 4, loop: true }
          bass: { pattern: bass 4, loop: true }
          kick: { pattern: kick 3, loop: true }
