version: 1.0.365
title: Zap swing kapow
description: the Charleston as electro swing
notes: |
  Zap swing kapow: the Charleston as electro swing. The tune of the Charleston (James P. Johnson,
  1923) is public domain and is played as written, with its chords, read from the corpus's lead sheet;
  the dance beat, the bass, the piano's offbeats, the clarinet's and trumpet's answers and the solos
  are new. Version 2.

  Subgenre: electro swing of the two-thousands. Drums: a house kick on every beat and a clap on two
  and four, under swung hats. Tempo 126, swung. Bass: a synthesizer, root and fifth, two to the bar.
  Sounds: a clarinet and a muted trumpet as if lifted from an old record, a piano on the offbeats.
  Form: the tune plays alone with a piano, as from an old record, before the kick drops in; a break of
  chopped stabs over a synth bass; a breakdown and a build into the drop; and a solo each for the
  clarinet and the trumpet.

  Band and song: the style is known for laying the horns and the swing of the twenties over a club's
  kick drum.

  Checklist: it works because the tune's rhythm is a dance craze in two notes, and the genre exists to
  make old dances new. The hook is that two-note figure on the clarinet; the lift is the trumpet
  trading it; the contrast is the stretch without the kick.

  Run it with: llamatron examples/mashups/electronic/zap_swing_kapow.yml

  Scene 1, an old record, 8 bars.
  Scene 2, the kick drops, 4 bars.
  Scene 3, charleston, 16 bars.
  Scene 4, break, 4 bars.
  Scene 5, second strain, 16 bars.
  Scene 6, clarinet, 8 bars.
  Scene 7, breakdown, 8 bars.
  Scene 8, build, 4 bars.
  Scene 9, drop, 16 bars.
  Scene 10, trumpet, 8 bars.
  Scene 11, ending, 3 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
