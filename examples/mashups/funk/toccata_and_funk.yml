version: 1.0.365
title: Toccata and funk
description: "a mashup: Bach's Toccata and Fugue in D minor played as hard funk in the manner of The Pride (The Isley Brothers), with Bach's notes kept exact"
notes: |
  Toccata and funk: Bach's Toccata and Fugue in D minor (BWV 565) played by a funk band of the late
  seventies, in the manner of The Pride (The Isley Brothers, from Go for Your Guns). Every note of the
  organ, the lead guitars, the clavinet in the fugue and the bass under the pedal entries is Bach's,
  at Bach's pitch and place in the bar; the drums, the bass riff and the clavinet's chanks are new.
  Version 2.

  The first flourish is the organ alone, then the groove; the second and third flourishes land on the
  beat; a fuzz guitar takes the fugue's subject and the clavinet its countersubject; the pedal's solo
  entry is the bass alone over the kick; Bach's last chords end it.

  Subgenre: hard funk of the late seventies by a self-contained band. Drums: a heavy kick on one with
  pushes before three and four, a fat snare on two and four with ghost notes between, sixteenth hats
  that open before the bar line. Tempo 100, straight. Bass: a riff locked to the kick, low, with a
  chromatic climb to the fifth. Builds: parts enter one at a time over the groove; a break strips the
  band to bass and kick, and after the fugue's cadence the drums play two bars alone before the bass
  riff and the clavinet rejoin them. Sounds: a fuzz lead guitar with long sustain, a clavinet, an
  organ, an electric bass. Form: a vamp that grows, a tune over it, a break, the vamp again.

  Band and song: the band is known for a rhythm section of brothers under a lead guitar of singing
  fuzz; the song for its hard mid-tempo vamp, the bass and clavinet locked together, and the guitar
  over the top. The other work is the best-known organ piece there is: a free toccata of flourishes
  and piled chords, then a fugue whose subject circles a repeated A.

  Checklist: the funk is good because the groove never lets go, and remembered for the riff and the
  fuzz guitar; the Bach is good because one restless subject drives everything, and remembered for its
  first three notes. The hook is Bach's opening flourish, then the subject; the emotion is menace
  turned into strut; the lift is each new voice of the fugue joining the band; the contrast is the
  bass alone at the pedal's solo entry; the sounds are a fuzz guitar for the subject, a clavinet for
  the countersubject, an organ for the toccata and the last chords.

  Run it with: llamatron examples/mashups/funk/toccata_and_funk.yml

  Scene 1, toccata, 2 bars.
  Scene 2, count in, 1 bars.
  Scene 3, groove, 4 bars.
  Scene 4, groove and clavinet, 4 bars.
  Scene 5, flourishes, 4 bars.
  Scene 6, the chord, 4 bars.
  Scene 7, subject and answer, 4 bars.
  Scene 8, episode, 4 bars.
  Scene 9, third entry, 4 bars.
  Scene 10, sequence, 4 bars.
  Scene 11, counterpoint, 4 bars.
  Scene 12, pedal entry, 4 bars.
  Scene 13, cadence in F, 3 bars.
  Scene 14, give the drummer some, 2 bars.
  Scene 15, bass and clavinet, 2 bars.
  Scene 16, before the break, 2 bars.
  Scene 17, bass alone, 2 bars.
  Scene 18, the band again, 3 bars.
  Scene 19, over the pedal, 5 bars.
  Scene 20, pedal runs, 4 bars.
  Scene 21, to the cadence, 3 bars.
  Scene 22, false cadence, 1 bars.
  Scene 23, last chords, 4 bars.
  Scene 24, the end, 2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
