instruments:
  alto sax: { device: "*FluidSynth", gm_sound: 66 }
  trumpet: { device: "*FluidSynth", gm_sound: 57 }
  piano: { device: "*FluidSynth", gm_sound: 1 }
  acoustic bass: { device: "*FluidSynth", gm_sound: 33 }
  drum kit: { device: "*FluidSynth" }

songs:
  bop_invention:
    tempo: 200
    scale: A Minor
    groove: 8th swing 66
    genre: Jazz Mashup

    tracks:
      ride: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      kick: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      alto: { instrument: alto sax }
      trumpet: { instrument: trumpet }
      piano: { instrument: piano }
      bass: { instrument: acoustic bass }

    scenes:
      - name: drums
        tracks:
          ride: { pattern: ride 1, repeat: 1 }
          hat: { pattern: hat 1, loop: true }
          kick: { pattern: kick 1, loop: true }
          snare: { pattern: snare 1, loop: true }
      - name: head
        tracks:
          alto: { pattern: alto 1, repeat: 1 }
          trumpet: { pattern: trumpet 1, loop: true }
          piano: { pattern: piano 1, loop: true }
          bass: { pattern: bass 1, loop: true }
          ride: { pattern: ride 2, loop: true }
          hat: { pattern: hat 2, loop: true }
          kick: { pattern: kick 2, loop: true }
          snare: { pattern: snare 2, loop: true }
          crash: { pattern: crash 1, loop: true }
      - name: "head, second half"
        tracks:
          alto: { pattern: alto 2, repeat: 1 }
          trumpet: { pattern: trumpet 2, loop: true }
          piano: { pattern: piano 2, loop: true }
          bass: { pattern: bass 2, loop: true }
          ride: { pattern: ride 2, loop: true }
          hat: { pattern: hat 2, loop: true }
          kick: { pattern: kick 2, loop: true }
