version: 1.0.365
title: Bop invention
description: the Two-Part Invention in A minor as bebop
notes: |
  Bop invention: the Two-Part Invention in A minor as bebop. The upper voice of the Invention No. 13,
  BWV 784 (Johann Sebastian Bach, 1723) is public domain and is played as written, its sixteenths as
  swung eighths at a bebop tempo, read from a transcription in the corpus; the walking bass, the
  piano's chords, the answers, the solos and the drums are new. Version 1.

  Subgenre: bebop of the late forties, a quintet. Drums: the ride cymbal keeps the time, the hat
  closes on two and four, the kick and the snare only comment. Tempo 200, swung. Bass: walking, a note
  a beat, root, third, fifth and sixth. Sounds: an alto saxophone and a trumpet playing the line and
  trading it, a piano dropping seventh chords, a bass.

  Band and song: the style is known for long lines of eighth notes that outline the chords, played in
  unison by two horns and then traded in short turns.

  Checklist: it works because the invention is already a long line of running notes that spells out
  its chords. The hook is that line on the alto; the lift is the horns trading it two bars at a time;
  the contrast is the bass taking the line alone.

  Run it with: llamatron examples/mashups/jazz/bop_invention.yml

  Scene 1, riff, 8 bars.
  Scene 2, theme, 16 bars.
  Scene 3, second theme, 16 bars.
  Scene 4, riff again, 4 bars.
  Scene 5, theme, traded, 16 bars.
  Scene 6, half time, 8 bars.
  Scene 7, quiet, 8 bars.
  Scene 8, build, 4 bars.
  Scene 9, solo, 16 bars.
  Scene 10, theme, higher, 8 bars.
  Scene 11, second theme, higher, 8 bars.
  Scene 12, riff once more, 4 bars.
  Scene 13, last theme, 16 bars.
  Scene 14, last second theme, 8 bars.
  Scene 15, ending, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
real_time: true
