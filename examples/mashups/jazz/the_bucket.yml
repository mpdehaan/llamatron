version: 1.0.365
title: The bucket
description: "the Funeral March as a New Orleans brass band's funeral"
notes: |
  The bucket: the Funeral March as a New Orleans brass band's funeral. The march theme of the third
  movement of the Piano Sonata No. 2 (Frédéric Chopin, 1837) is public domain and is played as written
  at a walk, from Claude's knowledge of the score; then the band turns it into the major, which is
  this demo's own doing, and dances home. The sousaphone's lines, the saxophones' riffs, the shouts,
  the solos and the parade drums are new. Version 1.

  Subgenre: a New Orleans brass band at a funeral: a dirge to the graveyard, then the second line
  home. Drums: for the dirge a bass drum on one and a muffled snare on three with a short roll before;
  then the street beat, a snare rolling in sixteenths with accents off the beat, a bass drum pushing
  the fourth beat of every other bar, a cowbell and a tambourine. Tempo 60, then 152, swung. Bass: a
  sousaphone, long notes in the dirge, then a dancing riff. Sounds: a trumpet and a trombone, tenor
  saxophones riffing, trombones holding chords.

  Band and song: the tradition is known for mourning slowly on the way out and celebrating on the way
  back, for horns that answer each other, and for drums that make a crowd walk in time behind the
  band.

  Checklist: it works because this is what such a band does with a funeral march. The hook is the
  march on a trumpet over the muffled drum; the lift is the drums cutting loose and the tune turning
  major; the contrast is the stretch for drums and sousaphone, which plays the tune.

  Run it with: llamatron examples/mashups/jazz/the_bucket.yml

  Scene 1, drums to the graveyard, 2 bars.
  Scene 2, dirge, 8 bars.
  Scene 3, dirge, both horns, 4 bars.
  Scene 4, cut loose, 4 bars.
  Scene 5, second line, 8 bars.
  Scene 6, the march in the major, 16 bars.
  Scene 7, trumpet shouts, 8 bars.
  Scene 8, drums and sousaphone, 8 bars.
  Scene 9, trombone, 8 bars.
  Scene 10, everybody, 16 bars.
  Scene 11, street beat, 4 bars.
  Scene 12, out chorus, 8 bars.
  Scene 13, ending, 2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
