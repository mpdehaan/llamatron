version: 1.0.365
title: Valkyries on parade
description: the Ride of the Valkyries as a New Orleans brass band on the street
notes: |
  Valkyries on parade: the Ride of the Valkyries as a New Orleans brass band on the street. The horn
  theme of the Ride of the Valkyries (Richard Wagner, 1856) is public domain and is played as written,
  in its key and its nine-eight time, from Claude's knowledge of the score; the sousaphone's line, the
  saxophones' riff, the trumpet's and trombone's shouts, the solos and the parade drums are new.
  Version 1.

  Subgenre: a New Orleans brass band's second line. Drums: a bass drum on every beat with a push at
  the bar's end, a snare rolling in eighths with accents off the beat, a cowbell and a tambourine.
  Tempo 150. Bass: a sousaphone walking root, fifth, third and sixth. Sounds: a trumpet and a trombone
  trading the theme, tenor saxophones riffing, trombones holding chords.

  Band and song: the tradition is known for horns that answer each other, a sousaphone that dances,
  and drums that make a crowd walk in time behind the band.

  Checklist: it works because the theme was written for brass. The hook is the call on a trumpet,
  answered by a trombone; the lift is both together a step higher; the contrast is the stretch for the
  drums and the sousaphone, which plays the theme.

  Run it with: llamatron examples/mashups/jazz/valkyries_on_parade.yml

  Scene 1, riff, 9/2 bars.
  Scene 2, theme, 9 bars.
  Scene 3, second theme, 9 bars.
  Scene 4, riff again, 9/2 bars.
  Scene 5, theme, traded, 9 bars.
  Scene 6, half time, 9 bars.
  Scene 7, quiet, 9 bars.
  Scene 8, build, 9/2 bars.
  Scene 9, solo, 9 bars.
  Scene 10, theme, higher, 9 bars.
  Scene 11, second theme, higher, 9 bars.
  Scene 12, riff once more, 9/2 bars.
  Scene 13, last theme, 9 bars.
  Scene 14, last second theme, 9 bars.
  Scene 15, ending, 9/2 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
real_time: true
