version: 1.0.365
title: Cotton soul stew
description: the King Cotton march as sixties Memphis soul
notes: |
  Cotton soul stew: the King Cotton march as sixties Memphis soul. The first two strains of King
  Cotton (John Philip Sousa, 1895) are public domain and are played as written, read from the Mutopia
  Project's edition, in their six-eight time, slowed to a ballad's sway; the bass line, the guitar's
  chops and licks, the organ, the solos and the drums are new. Version 1.

  Subgenre: Memphis soul of the middle sixties, a house band in a converted cinema. Drums: dry and
  behind the beat, a kick on one, a snare on the backbeat, hats in eighths. Tempo 99, each bar two
  slow beats of three. Bass: root, fifth, octave and sixth, round and unhurried. Sounds: a tenor
  saxophone and a clean guitar trading the tune, a guitar chopping the backbeat, an organ.

  Band and song: the style is known for a rhythm section that leaves space, a guitar that says one
  thing and stops, and an organ that holds the room together.

  Checklist: it works because a march in six-eight, slowed down, is a soul ballad's sway. The hook is
  the first strain on the saxophone; the lift is the second strain traded with the guitar; the
  contrast is the stretch for bass and drums, the tune underneath.

  Run it with: llamatron examples/mashups/soul/cotton_soul_stew.yml

  Scene 1, riff, 3 bars.
  Scene 2, theme, 6 bars.
  Scene 3, second theme, 6 bars.
  Scene 4, riff again, 3 bars.
  Scene 5, theme, traded, 6 bars.
  Scene 6, half time, 6 bars.
  Scene 7, quiet, 6 bars.
  Scene 8, build, 3 bars.
  Scene 9, solo, 6 bars.
  Scene 10, theme, higher, 6 bars.
  Scene 11, second theme, higher, 6 bars.
  Scene 12, riff once more, 3 bars.
  Scene 13, last theme, 6 bars.
  Scene 14, last second theme, 6 bars.
  Scene 15, ending, 3 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
real_time: true
protected: true

