version: 1.0.365
title: Lagos fugue
description: the subject of the Little Fugue as seventies Afrobeat
notes: |
  Lagos fugue: the subject of the Little Fugue as seventies Afrobeat. The subject of the Fugue in G
  minor, BWV 578 (Johann Sebastian Bach, about 1707) is public domain and is played as written, from
  Claude's knowledge of the score, in its key and then a fourth lower, as a fugue's second voice
  answers; the bass figure, the guitar's line, the horn stabs, the solos and the drums are new.
  Version 1.

  Subgenre: Nigerian Afrobeat of the seventies. Drums: a kit that never plays the same bar twice, the
  kick off the beat, ghost notes on the snare, with a shaker, claves and congas locked around it.
  Tempo 116. Bass: one syncopated figure, repeated for minutes. Sounds: a trumpet and a tenor
  saxophone, a muted guitar picking one short line again and again, an organ.

  Band and song: the style is known for long songs over one groove, parts that lock together like
  gears, and horns that state a theme and then answer each other.

  Checklist: it works because a fugue is voices answering each other, and so is a horn section. The
  hook is the subject on a trumpet, answered by the saxophone a fourth lower; the lift is both
  together; the contrast is the stretch for percussion with the subject in the bass.

  Run it with: llamatron examples/mashups/world/lagos_fugue.yml

  Scene 1, riff, 4 bars.
  Scene 2, theme, 8 bars.
  Scene 3, second theme, 8 bars.
  Scene 4, theme, traded, 8 bars.
  Scene 5, half time, 8 bars.
  Scene 6, quiet, 8 bars.
  Scene 7, solo, 8 bars.
  Scene 8, theme, higher, 8 bars.
  Scene 9, second theme, higher, 8 bars.
  Scene 10, last theme, 8 bars.
  Scene 11, last second theme, 8 bars.
  Scene 12, ending, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
