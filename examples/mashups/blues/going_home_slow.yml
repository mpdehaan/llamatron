instruments:
  - { name: steel guitar, device: "*FluidSynth", gm_sound: 26 }
  - { name: harmonica, device: "*FluidSynth", gm_sound: 23 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: going_home_slow
    tempo: 86
    scale: D Major
    groove: 8th swing 66
    genre: Mashup
    subgenre: Blues

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: slide, instrument: steel guitar }
      - { name: harmonica, instrument: harmonica }
      - { name: strum, instrument: steel guitar }
      - { name: thumb, instrument: steel guitar }

    scenes:
      - name: foot and thumb
        clips:
          - { track: thumb, pattern: thumb 1, repeat: 1 }
          - { track: kick, pattern: kick 1, loop: true }
      - name: tune
        clips:
          - { track: slide, pattern: slide 1, repeat: 1 }
          - { track: harmonica, pattern: harmonica 1, loop: true }
          - { track: strum, pattern: strum 1, loop: true }
          - { track: thumb, pattern: thumb 2, loop: true }
          - { track: kick, pattern: kick 2, loop: true }
      - name: turnaround
        clips:
          - { track: slide, pattern: slide 2, repeat: 1 }
          - { track: strum, pattern: strum 2, loop: true }
          - { track: thumb, pattern: thumb 3, loop: true }
          - { track: kick, pattern: kick 1, loop: true }
      - name: tune on the harmonica
        clips:
          - { track: slide, pattern: slide 3, repeat: 1 }
          - { track: harmonica, pattern: harmonica 2, loop: true }
          - { track: strum, pattern: strum 1, loop: true }
          - { track: thumb, pattern: thumb 2, loop: true }
          - { track: kick, pattern: kick 2, loop: true }
      - name: "twelve bars, harmonica"
        clips:
          - { track: harmonica, pattern: harmonica 3, repeat: 1 }
          - { track: strum, pattern: strum 3, loop: true }
          - { track: thumb, pattern: thumb 4, loop: true }
          - { track: kick, pattern: kick 3, loop: true }
      - name: the thumb plays it
        clips:
          - { track: slide, pattern: slide 3, repeat: 1 }
          - { track: thumb, pattern: thumb 5, loop: true }
          - { track: kick, pattern: kick 2, loop: true }
      - name: "twelve bars, slide"
        clips:
          - { track: slide, pattern: slide 4, repeat: 1 }
          - { track: strum, pattern: strum 3, loop: true }
          - { track: thumb, pattern: thumb 4, loop: true }
          - { track: kick, pattern: kick 3, loop: true }
      - name: last tune
        clips:
          - { track: slide, pattern: slide 1, repeat: 1 }
          - { track: harmonica, pattern: harmonica 2, loop: true }
          - { track: strum, pattern: strum 1, loop: true }
          - { track: thumb, pattern: thumb 2, loop: true }
          - { track: kick, pattern: kick 2, loop: true }
      - name: ending
        clips:
          - { track: slide, pattern: slide 5, repeat: 1 }
          - { track: strum, pattern: strum 4, loop: true }
          - { track: thumb, pattern: thumb 6, loop: true }
          - { track: kick, pattern: kick 4, loop: true }
