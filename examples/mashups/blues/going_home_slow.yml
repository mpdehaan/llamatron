version: 1.0.365
title: Going home slow
description: the Largo of the New World Symphony as Delta slide blues
notes: |
  Going home slow: the Largo of the New World Symphony as Delta slide blues. The English horn's tune
  from the Largo of the Ninth Symphony (Antonin Dvorak, 1893) is public domain and is played as
  written but for its key, moved from D flat to D for the guitar, from Claude's knowledge of the
  score; the thumb's bass, the slide's answers, the harmonica and the solos are new. Version 1.

  Subgenre: Delta blues, one player. Drums: none; a foot on every beat. Tempo 86, a slow shuffle.
  Bass: the guitar's low strings under the thumb, root, fifth and octave. Sounds: one steel-string
  guitar doing three jobs, a slide on top, a strum between and the thumb below, and a harmonica.

  Band and song: the style is known for a slide that sings like a voice, for the flat third bent up to
  the major, and for one person sounding like a band.

  Checklist: it works because the tune was written to sound like a spiritual, five notes and long
  holds, which is what a slide does best. The hook is the tune on the slide; the lift is the harmonica
  taking it an octave up; the contrast is the stretch where the thumb plays the tune alone.

  Run it with: llamatron examples/mashups/blues/going_home_slow.yml

  Scene 1, riff, 2 bars.
  Scene 2, theme, 8 bars.
  Scene 3, riff again, 2 bars.
  Scene 4, theme, traded, 8 bars.
  Scene 5, half time, 8 bars.
  Scene 6, quiet, 8 bars.
  Scene 7, solo, 8 bars.
  Scene 8, theme, higher, 8 bars.
  Scene 9, last theme, 8 bars.
  Scene 10, ending, 4 bars.

  When changing this demo:
  - Keep the borrowed work's notes as written: their pitches and their places in the bar.
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook, the lift and the contrast.
  - Write nothing of the reference work's own tunes or riffs: the band's parts here are new.
