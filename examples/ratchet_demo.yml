tracks:
  tune: {}

auto_ratchets:
  two: { counts: [2] }
  four_three_two_one: { counts: [4, 3, 2, 1] }
  every_fourth_note_rolls: { counts: [1, 1, 1, 4] }
  one_then_four: { counts: [1, 4] }
  three: { counts: [3] }
  one_then_three: { counts: [1, 3] }

chains:
  two:
    - auto_ratchet: two
  four_three_two_one:
    - auto_ratchet: four_three_two_one
  every_fourth_note_rolls:
    - auto_ratchet: every_fourth_note_rolls
  one_then_four:
    - auto_ratchet: one_then_four
  three:
    - auto_ratchet: three
  one_then_three:
    - auto_ratchet: one_then_three

scenes:
  - name: Long notes
    tracks:
      tune: { pattern: long_notes }
  - name: Ratchet 2
    tracks:
      tune: { pattern: ratchet_2 }
  - name: Ratchet 3
    tracks:
      tune: { pattern: ratchet_3 }
  - name: Ratchet 4
    tracks:
      tune: { pattern: ratchet_4 }
  - name: "Ratchet 1 2 3 4, step by step"
    tracks:
      tune: { pattern: ratchet_mixed }
  - name: Ratchet building up to 16
    tracks:
      tune: { pattern: ratchet_building }
  - name: Ratchet 2 on chords
    tracks:
      tune: { pattern: ratchet_chords }
  - name: "Ratchet offset +1 (climbing)"
    tracks:
      tune: { pattern: ratchet_offset_up }
  - name: "Ratchet offset -1 (falling)"
    tracks:
      tune: { pattern: ratchet_offset_down }
  - name: "Ratchet offset +2 (thirds)"
    tracks:
      tune: { pattern: ratchet_offset_thirds }
  - name: "Ratchet 4 at 60% probability"
    tracks:
      tune: { pattern: ratchet_probability }
  - name: "AutoRatchet 2, same as Ratchet 2"
    tracks:
      tune: { pattern: long_notes, chain: two }
  - name: AutoRatchet 4 3 2 1
    tracks:
      tune: { pattern: long_notes, chain: four_three_two_one }
  - name: AutoRatchet 1 1 1 4
    tracks:
      tune: { pattern: long_notes, chain: every_fourth_note_rolls }
  - name: "AutoRatchet 1 4, rests skipped"
    tracks:
      tune: { pattern: long_notes_with_rests, chain: one_then_four }
  - name: AutoRatchet 3 on chords
    tracks:
      tune: { pattern: long_chords, chain: three }
  - name: AutoRatchet 1 3 over Ratchet 2
    tracks:
      tune: { pattern: ratchet_2, chain: one_then_three }
  - name: AutoRatchet 2 over Ratchet offset
    tracks:
      tune: { pattern: ratchet_offset_up, chain: two }
