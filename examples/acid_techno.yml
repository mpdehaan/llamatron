# Acid techno: a sliding bass riff over a four-on-the-floor kick, getting darker.
# Run it with: llamatron examples/acid_techno.yml --to ableton --replace
# Turn up the glide on your synth for the slides.

tempo: 138
scale: A Minor

scales:
  A Minor: { root: A, type: minor }
  A Phrygian: { root: A, type: phrygian }

patterns:
  kick:
    steps: 2
    drum: true
    degree: [C, ~]
    duration: [1/16, 3/16]
    octave: [1, ~]
  hat:
    steps: 2
    drum: true
    degree: [~, F]
    duration: [1/8, 1/8]
    accidental: [~, "#"]
    octave: [~, 1]
  hat_fast:
    steps: 4
    drum: true
    degree: [~, F, ~, F]
    duration: [1/16, 1/16, 1/16, 1/16]
    accidental: [~, "#", ~, "#"]
    octave: [~, 1, ~, 1]
  seed:
    steps: 9
    degree: [1, 1, 3, 1, 5, 1, 7, 1, 3]
    duration: [1/8, 1/16, 1/8, 1/8, 1/16, 1/8, 1/8, 1/16, 3/16]
    octave: [1, 1, 1, 1, 1, 1, 0, 1, 1]
    velocity: [127, 90, 110, 90, 127, 90, 110, 90, 100]
    glide: [~, true, ~, ~, true, ~, ~, true, ~]
  seed_rising:
    steps: 9
    accumulator_limit: 6
    degree: [1, 1, 3, 1, 5, 1, 7, 1, 3]
    duration: [1/8, 1/16, 1/8, 1/8, 1/16, 1/8, 1/8, 1/16, 3/16]
    octave: [1, 1, 1, 1, 1, 1, 0, 1, 1]
    glide: [~, true, ~, ~, true, ~, ~, true, ~]
    note_add: [~, ~, ~, ~, ~, ~, ~, ~, 1]
  seed2:
    steps: 9
    degree: [1, 1, 4, 3, 5, 6, 5, 3, 1]
    duration: [1/8, 1/16, 1/8, 1/8, 1/16, 1/8, 1/8, 1/16, 3/16]
    octave: [1, 1, 1, 1, 1, 1, 1, 1, 1]
    glide: [~, true, ~, true, ~, true, ~, true, ~]
    ratchet: [~, ~, ~, ~, ~, ~, ~, 2, ~]
  seed2_slow:
    steps: 9
    degree: [1, 1, 4, 3, 5, 6, 5, 3, 1]
    duration: [1/4, 1/8, 1/4, 1/4, 1/8, 1/4, 1/4, 1/8, 3/8]
    octave: [1, 1, 1, 1, 1, 1, 1, 1, 1]
    glide: [~, true, ~, true, ~, true, ~, true, ~]
  clap:
    steps: 6
    drum: true
    degree: [~, D, ~, ~, D, ~]
    duration: [1/4, 1/16, 3/16, 1/4, 1/16, 3/16]
    accidental: [~, "#", ~, ~, "#", ~]
    octave: [~, 1, ~, ~, 1, ~]
  roots:
    steps: 4
    degree: [1, 1, 6, 7]
    duration: [1, 1, 1, 1]
    octave: [3, 3, 2, 2]
    chord: [3, 3, 3, 3]
  stabs:
    steps: 8
    degree: [1, ~, 1, ~, 6, ~, 7, ~]
    duration: [1/8, 7/8, 1/8, 7/8, 1/8, 7/8, 1/8, 7/8]
    octave: [3, ~, 3, ~, 2, ~, 2, ~]
    chord: [3, ~, 3, ~, 3, ~, 3, ~]

tracks: [kick, hat, clap, acid, chords]

auto_ratchets:
  rolls: { counts: [1, 1, 1, 1, 1, 1, 1, 3] }

chains:
  rolling_hats:
    - auto_ratchet: rolls

scenes:
  - name: kick
    tracks:
      kick: { pattern: kick, repeat: 32 }
  - name: first_bass
    tracks:
      kick: { pattern: kick, repeat: 32 }
      hat: { pattern: hat, loop: true }
      acid: { pattern: seed, loop: true }
  - name: squelch
    tracks:
      kick: { pattern: kick, repeat: 128 }
      hat: { pattern: hat, chain: rolling_hats, loop: true }
      clap: { pattern: clap, loop: true }
      acid: { pattern: seed, repeat: 32, morph_to: seed2, morph_style: right }
      chords: { pattern: stabs, loop: true }
  - name: break
    scale: A Phrygian
    tracks:
      hat: { pattern: hat, repeat: 32 }
      chords: { pattern: roots, loop: true }
      acid: { pattern: seed2_slow, loop: true }
  - name: dark
    repeat: 4
    scale: A Phrygian
    tracks:
      kick: { pattern: kick, repeat: 32 }
      hat: { pattern: hat_fast, loop: true }
      clap: { pattern: clap, loop: true }
      acid: { pattern: seed2, direction: brownian, loop: true }
  - name: out
    scale: A Phrygian
    tracks:
      kick: { pattern: kick, repeat: 64 }
      hat: { pattern: hat_fast, loop: true }
      acid: { pattern: seed_rising, loop: true }
