version: 1.0.591
title: Forgot your name
description: "a warm piano sitcom theme in the manner of Cheers (Gary Portnoy), with a melody of its own"
notes: |
  Forgot your name: a warm piano sitcom theme in the manner of Cheers (Gary Portnoy), with a melody of
  its own. This is a homage to Cheers (Gary Portnoy): its chords, form, sounds and drums follow that
  work as Claude knows it, and every tune and rhythm here is new. Rebuild version 5.

  A piano alone under a quiet verse on I and V, then the band, strings and a choir for a chorus that
  opens out on I bVII IV V; a bridge, and the piano alone to end.

  Subgenre: soft-rock television theme of the early eighties, a piano ballad that opens out. Drums:
  none in the verse; a gentle rock beat with a full snare and a crash in the chorus. Tempo 92,
  straight. Bass: plain, on the roots. Builds: the chorus arrives with the whole band. Sounds: an
  acoustic piano, a voice, voices in harmony, strings. Melody manner: a quiet, narrow verse; a high,
  held chorus. Form: about a minute, as the theme ran on television, the tune first: piano, verse, chorus, piano ending.

  Band and song: the theme is known for a lonely verse at the piano and a chorus everyone joins.

  Checklist: it is good and memorable because the chorus feels like company arriving. The hook is the
  chorus; the emotion is lonely, then warm; the lift is the chorus, the tune an octave higher in
  harmony with band, strings and choir; the contrast is the piano alone; the sounds are a piano, a
  voice lead, a choir and strings.

  Phrasing: the verse's lines are short and lonely, each followed by more than a beat of silence at
  the piano; the chorus is lines of two bars, each begun on an accented note and ended with a breath,
  sung in two voices.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/tv_theme/forgot_your_name.yml

  Scene 1, piano, 4 bars.
  Scene 2, verse, 8 bars.
  Scene 3, verse again, 8 bars.
  Scene 4, chorus, 8 bars.
  Scene 5, verse 2, 8 bars.
  Scene 6, chorus 2, 8 bars.
  Scene 7, bridge, 8 bars.
  Scene 8, last chorus, 16 bars.
  Scene 9, piano ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
