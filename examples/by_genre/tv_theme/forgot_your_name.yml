version: 1.0.227
title: Forgot your name
description: "a warm piano sitcom theme in the manner of Cheers (Gary Portnoy), with a melody of its own"
notes: |
  Forgot your name: a warm sitcom theme at 108 beats a minute in E flat major, in the manner of the
  early eighties: a piano comping on the beats, a bass, soft drums with a side stick, and a
  clarinet singing the tune. The melody is its own.

  The piano and the bass are one bar each over chord I, moved by Progression: the verse goes
  I ii IV V, the chorus goes round I vi ii V, and the bridge IV V iii vi.

  Run it with: llamatron examples/by_genre/tv_theme/forgot_your_name.yml

  Scene 1, intro, 4 bars: the piano alone.
  Scene 2, verse, 16 bars: the verse.
  Scene 3, chorus, 16 bars: the chorus.
  Scene 4, verse 2, 16 bars: the second verse.
  Scene 5, chorus 2, 16 bars: the chorus again.
  Scene 6, bridge, 8 bars: the bridge.
  Scene 7, ending, 4 bars: the piano alone.

  When changing this demo:
  - Keep the piano and the bass one bar long over chord I.
  - Keep the melody original.
real_time: true
protected: true

