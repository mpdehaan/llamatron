version: 1.0.365
title: Laboratory mice
description: "a cartoon theme of the nineties for a chorus and a studio orchestra in the manner of the Pinky and the Brain theme (Richard Stone), with a tune of its own"
notes: |
  Laboratory mice: a cartoon theme of the nineties for a chorus and a studio orchestra in the manner
  of the Pinky and the Brain theme (Richard Stone), with a tune of its own. This is a homage to the
  Pinky and the Brain theme (Richard Stone): its chords, form, sounds and drums follow that work as
  Claude knows it, and every tune and rhythm here is new. Rebuild version 5.

  A minor march in two: a tuba and plucked strings, a patter tune for voices climbing a step a line on
  i, V, iv and V; a chant on i, iv, V and VI with four hits for the whole orchestra; the third verse
  and all after a half step up; a tag and a last squeak.

  Subgenre: a nineties cartoon theme written like an old stage patter song, a mock-sinister march in a
  minor key for a chorus and a full studio orchestra. Drums: a marching kick on one and three and a
  light snare on two and four with a ruff into the bar, a cymbal where everybody hits. Tempo 160,
  counted in two, straight. Bass: a tuba, root and fifth, oom to the strings' pah. Builds: the third
  verse a half step up; otherwise it is at full tilt from the second bar. Sounds: a chorus singing in
  unison, a tuba, plucked strings on the offbeats, a bassoon muttering between the lines, a xylophone
  doubling the tune an octave up, brass and timpani on the hits, a slide whistle for the last word.
  Melody manner: patter, a run of quick even notes that turns on itself and stops on three plain
  notes, each line the same shape a step higher than the last; then a chant, a short figure said twice
  and four hammered notes on one pitch for everybody. Form: about a minute, the tune first: two
  creeping bars, verse, verse, chant, verse a half step up, chant, tag, a squeak.

  Band and song: the composer is known for carrying on the sound of the classic studio cartoons, a
  real orchestra that comments on every joke; the theme for telling the show's whole premise in
  patter, for its mock-villain minor key, and for a title chant that hammers one word again and again.

  Checklist: it is good and memorable because it is a villain's march played for laughs, every line
  the same shape so that it can be sung at once, and the chant is four notes a child can shout. The
  hook is the patter line and the four hammered notes; the emotion is comic menace; the lift is the
  chant, with brass, timpani and a cymbal, and the half step up; the contrast is the bassoon alone
  between the lines and the squeak after the last chord; the sounds are a voice lead with a choir
  under the chant, a tuba, pizzicato strings, a bassoon, a xylophone, a brass section, timpani and a
  whistle.

  Run it with: llamatron examples/by_genre/tv_theme/laboratory_mice.yml

  Scene 1, creeping, 2 bars.
  Scene 2, verse, 8 bars.
  Scene 3, verse 2, 8 bars.
  Scene 4, chant, 8 bars.
  Scene 5, verse 3, 8 bars.
  Scene 6, chant 2, 8 bars.
  Scene 7, tag, 4 bars.
  Scene 8, squeak, 1 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
