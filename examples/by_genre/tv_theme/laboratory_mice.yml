version: 1.0.364
title: Laboratory mice
description: "a mock-sinister orchestral cartoon theme of the nineties in the manner of the theme of Pinky and the Brain (Richard Stone), with a tune of its own"
notes: |
  Laboratory mice: a mock-sinister orchestral cartoon theme of the nineties in the manner of the theme
  of Pinky and the Brain (Richard Stone), with a tune of its own. This is a homage to the theme of
  Pinky and the Brain (Richard Stone): its chords, form, sounds and drums follow that work as Claude
  knows it, and every tune and rhythm here is new. Rebuild version 1.

  A tuba and plucked strings in a swung two-beat; a bassoon creeping through a minor tune on i, V7 and
  iv; a grand refrain in the relative major for choir and brass; a sneaking stretch for plucked
  strings and a whistle.

  Subgenre: orchestral cartoon music of the nineties, a mock-horror march with a bounce. Drums: almost
  none, a soft kick and brushes, timpani and a cymbal where it turns grand. Tempo 126, swung. Bass: a
  tuba on one and three. Builds: the quiet creeping tune gives way to a pompous refrain. Sounds: a
  bassoon with the tune, a tuba, plucked strings on the offbeats, a xylophone, a wavering whistle like
  a theremin, a choir and brass for the refrain. Melody manner: a creeping, bouncing minor tune that
  leans on the raised seventh; a refrain in long notes, in the relative major. Form: tune, refrain,
  tune, a sneaking stretch, refrain.

  Band and song: the theme is known for sounding sinister and silly at once, a mad-scientist march
  with a choir that sings as though the plan could work.

  Checklist: it is good and memorable because it takes a ridiculous scheme entirely seriously. The
  hook is the creeping bassoon tune; the emotion is comic menace; the lift is the refrain, choir and
  brass in long notes over timpani; the contrast is the sneaking stretch, plucked and nearly silent
  under the whistle; the sounds are a bassoon, a tuba, pizzicato strings, a xylophone, a whistle, a
  choir, a brass section and timpani.

  Run it with: llamatron examples/by_genre/tv_theme/laboratory_mice.yml

  Scene 1, intro, 4 bars.
  Scene 2, tune, 16 bars.
  Scene 3, refrain, 8 bars.
  Scene 4, tune 2, 8 bars.
  Scene 5, sneaking, 8 bars.
  Scene 6, refrain 2, 8 bars.
  Scene 7, tune 3, 16 bars.
  Scene 8, last refrain, 16 bars.
  Scene 9, tag, 8 bars.
  Scene 10, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
