version: 1.0.365
title: Phoenix Foundation
description: "a mid-eighties action-show theme in the manner of MacGyver (Randy Edelman), with a melody of its own"
notes: |-
  Phoenix Foundation: an action-show theme at 130 beats a minute in A major, in the manner of the
  mid eighties: a synth brass melody over a pulsing synth bass, keys broken into sixteenths, an
  overdriven guitar and a rock beat. This is a homage to the theme from MacGyver by Randy Edelman:
  like that theme it is built on chords I, IV and V in a major key, and the melody, the order of
  the chords and every rhythm are its own.

  The guitar, the bass and the keys are one bar each over chord I. A Progression moves them,
  I IV V IV under the theme and vi IV V V in the rise. A Guitarify after it in the guitar's chain
  plays the chord: up strokes on the backbeat, four strings wide, under the theme, eight down
  strokes a bar of power chords in the rise, a muted chug in the guitar's own scene and one held
  chord a bar at the end. An arpeggiator called sparkle, after the Progression in the keys' chain,
  breaks the keys' chord into sixteenths over two octaves.

  Run it with: llamatron examples/by_genre/tv_theme/phoenix_foundation.yml

  Scene 1, intro, 8 bars: the bass, the keys and the beat.
  Scene 2, theme, 16 bars: the brass with the theme, the guitar on the backbeat.
  Scene 3, rise, 8 bars: the rise over power chords.
  Scene 4, theme 2, 16 bars: the theme again.
  Scene 5, guitar, 16 bars: the guitar chugging, with no melody.
  Scene 6, rise 2, 8 bars: the rise again.
  Scene 7, last theme, 16 bars: the theme with crashes.
  Scene 8, outro, 8 bars: held chords over the bass and the keys.

  When changing this demo:
  - Keep the guitar, the bass and the keys one bar each, moved by a Progression.
  - Keep the melody its own: nothing of the theme's melody is used.
  - Keep it out of G major, the theme's key. Form: about a minute, as the theme ran on television, the tune first: theme, rise, outro.
real_time: true
protected: true

