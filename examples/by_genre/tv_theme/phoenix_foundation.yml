songs:
  phoenix_foundation:
    tempo: 130
    scale: A Major
    genre: TV Theme

    tracks:
      kick: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      toms: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      bass: { instrument: synth bass }
      guitar: { instrument: overdriven guitar }
      keys: { instrument: polysynth }
      lead: { instrument: synth brass }
      horns: { instrument: brass }

    scenes:
      - name: pulse
        tracks:
          hat: { pattern: hat, repeat: 4 }
          toms: { pattern: toms, loop: true }
          bass: { pattern: bass, chains: [close], loop: true }
          keys: { pattern: broken, chains: [close], loop: true }
      - name: theme
        tracks:
          kick: { pattern: kick, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bass, chains: [tune], loop: true }
          keys: { pattern: broken, chains: [tune], loop: true }
          guitar: { pattern: chords, chains: [tune], loop: true }
          lead: { pattern: tune, loop: true }
          crash: { pattern: crash, loop: true }
      - name: "theme, answered"
        tracks:
          kick: { pattern: kick, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bass, chains: [tune], loop: true }
          keys: { pattern: broken, chains: [tune], loop: true }
          guitar: { pattern: chords, chains: [tune], loop: true }
          lead: { pattern: tune, loop: true }
          horns: { pattern: horns, loop: true }
          toms: { pattern: toms, loop: true }
      - name: rise
        tracks:
          kick: { pattern: kick, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bass, chains: [middle], loop: true }
          keys: { pattern: broken, chains: [middle], loop: true }
          guitar: { pattern: chords, chains: [middle], loop: true }
          lead: { pattern: middle, loop: true }
          crash: { pattern: crash, loop: true }
          toms: { pattern: toms, loop: true }
      - name: outro
        tracks:
          kick: { pattern: kick, repeat: 4 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bass, chains: [close], loop: true }
          keys: { pattern: broken, chains: [close], loop: true }
          guitar: { pattern: chords, chains: [close], loop: true }
          lead: { pattern: half tune, loop: true }
          horns: { pattern: half tune, loop: true }
          crash: { pattern: crash, loop: true }
