version: 1.0.365
title: Phoenix Foundation
description: "a mid-eighties action-show theme in the manner of MacGyver (Randy Edelman), with a melody of its own"
notes: |
  Phoenix Foundation: a mid-eighties action-show theme in the manner of MacGyver (Randy Edelman), with
  a melody of its own. This is a homage to MacGyver (Randy Edelman): its chords, form, sounds and
  drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 2.

  Four bars of pulse and hits, the tune on I, IV and V, the tune again with a second brass answering,
  a climbing middle part and the tune's first half to close, in about a minute.

  Subgenre: an action-adventure television theme of the middle eighties, a synthesizer band playing a
  hero's tune. Drums: a rock beat, a kick on one and three with a push, a snare on two and four, hats
  in eighths, tom-toms into each section. Tempo 130. Bass: a synth bass pulsing eighths on the root.
  Sounds: synth brass with the tune, keys broken into sixteenths, an overdriven guitar holding chords,
  a second brass answering at the ends of phrases. Melody manner: a dotted call that leaps up and
  lands on a long note, as a fanfare for someone resourceful rather than strong; then a middle part
  that climbs by steps.

  Band and song: the theme is known for sounding optimistic and busy at once, a bright major tune over
  a motor of eighths, and for getting from its opening pulse to its tune within seconds.

  Checklist: it is good and memorable because the tune is a fanfare anyone can whistle, and the pulse
  under it never rests. The hook is the first two bars of the tune, heard after four bars of pulse;
  the emotion is bright confidence; the lift is the middle part on IV and V, climbing; the contrast is
  the pulse alone at the opening; the sounds are synth brass, a polysynth, a synth bass and an
  overdriven guitar.

  Run it with: llamatron examples/by_genre/tv_theme/phoenix_foundation.yml

  Scene 1, pulse, 4 bars.
  Scene 2, theme, 8 bars.
  Scene 3, theme, answered, 8 bars.
  Scene 4, rise, 8 bars.
  Scene 5, outro, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

