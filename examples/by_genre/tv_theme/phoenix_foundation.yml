arps:
  sparkle: { step: 1/16, order: up, octave_range: 2 }

progressions:
  a: { chords: [1, 4, 5, 4] }
  b: { chords: [6, 4, 5, 5] }

guitarifies:
  backbeat: { bar: [nothing, nothing, up, mute, nothing, nothing, up, mute], accents: [false, false, true, false, false, false, true, false], cell: 1/8, position: 4, strings: 4, spread: 3 }
  all down: { bar: [down, down, down, down, down, down, down, down], accents: [true, false, false, false, true, false, false, false], cell: 1/8, single_notes: power_chord, spread: 2, fade: 0 }
  chug: { bar: [mute, mute, down, mute, mute, mute, down, mute], accents: [false, false, true, false, false, false, true, false], cell: 1/8, single_notes: power_chord, spread: 2, fade: 0 }
  held: { bar: [down, nothing, nothing, nothing], accents: [false, false, false, false], cell: 1/4, let_ring: true, single_notes: power_chord, spread: 2, fade: 0 }

chains:
  a:
    - progression: a
  b:
    - progression: b
  a backbeat:
    - progression: a
    - guitarify: backbeat
  a chug:
    - progression: a
    - guitarify: chug
  a held:
    - progression: a
    - guitarify: held
  b all down:
    - progression: b
    - guitarify: all down
  a sparkle:
    - progression: a
    - arp: sparkle
  b sparkle:
    - progression: b
    - arp: sparkle

instruments:
  synth bass: { device: "*FluidSynth", gm_sound: 39 }
  overdriven guitar: { device: "*FluidSynth", gm_sound: 30 }
  polysynth: { device: "*FluidSynth", gm_sound: 91 }
  synth brass: { device: "*FluidSynth", gm_sound: 63 }
  drum kit: { device: "*FluidSynth" }

songs:
  phoenix_foundation:
    tempo: 130
    scale: A Major
    genre: TV theme

    tracks:
      kick: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      bass: { instrument: synth bass }
      guitar: { instrument: overdriven guitar }
      keys: { instrument: polysynth }
      lead: { instrument: synth brass }

    scenes:
      - name: theme
        tracks:
          kick: { pattern: kick, loop: true }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bass, chains: [a], loop: true }
          guitar: { pattern: chord, chains: [a backbeat], repeat: 16 }
          keys: { pattern: keys, chains: [a sparkle], loop: true }
          lead: { pattern: theme, loop: true }
      - name: rise
        tracks:
          kick: { pattern: kick, loop: true }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          crash: { pattern: crash, loop: true }
          bass: { pattern: bass, chains: [b], loop: true }
          guitar: { pattern: root, chains: [b all down], repeat: 8 }
          keys: { pattern: keys, chains: [b sparkle], loop: true }
          lead: { pattern: rise, loop: true }
      - name: outro
        tracks:
          kick: { pattern: kick, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bass, chains: [a], loop: true }
          guitar: { pattern: root, chains: [a held], repeat: 8 }
          keys: { pattern: keys, chains: [a sparkle], loop: true }
