version: 1.0.227
title: Phoenix Foundation
description: "a mid-eighties action-show theme in the manner of MacGyver (Randy Edelman), with a melody of its own"
notes: |
  Phoenix Foundation: an action-show theme at 130 beats a minute in G major, in the manner of the
  mid-eighties: a synth brass melody, rock guitar chords, a pulsing synth bass in sixteenths and
  sparkling keys. The melody is its own.

  The keys play a held chord, and an arpeggiator called sparkle, in the keys' chains, breaks it
  into sixteenths over two octaves. The bass, the guitar and the keys are one bar each over
  chord I, moved by Progression: the A part goes I IV V IV and the B part vi IV I V.

  Run it with: llamatron examples/by_genre/tv_theme/phoenix_foundation.yml

  Scene 1, intro, 8 bars: the bass, the keys and the drums.
  Scene 2, theme, 16 bars: the theme.
  Scene 3, rise, 8 bars: the second part.
  Scene 4, theme 2, 16 bars: the theme again.
  Scene 5, guitar, 16 bars: the band without the melody.
  Scene 6, rise 2, 8 bars: the second part again.
  Scene 7, last theme, 16 bars: the theme to the end.
  Scene 8, outro, 8 bars: the band plays out.

  When changing this demo:
  - Keep the keys a held chord broken up by the sparkle arpeggiator.
  - Keep the bass, guitar and keys one bar long over chord I.
  - Keep the melody original.
real_time: true
protected: true

