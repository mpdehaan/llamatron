      - name: pulse
        clips:
          - { track: hat, pattern: hat, repeat: 4 }
          - { track: toms, pattern: toms, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: close chords }], loop: true }
          - { track: keys, pattern: broken, generators: [{ name: close chords }], loop: true }
