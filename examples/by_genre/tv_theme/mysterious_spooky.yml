  - { name: harpsichord, device: "*FluidSynth", gm_sound: 7 }
  - { name: reed organ, device: "*FluidSynth", gm_sound: 21 }
  - { name: bass clarinet, device: "*FluidSynth", gm_sound: 72 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: mysterious_spooky
    tempo: 132
    scale: G Major
    genre: TV Theme

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: snare, drum: true, instrument: drum kit }
      - { name: clicks, drum: true, instrument: drum kit }
      - { name: bass, instrument: tuba }
      - { name: harpsichord, instrument: harpsichord }
      - { name: lead, instrument: harpsichord }
      - { name: organ, instrument: reed organ }

    scenes:
      - name: snaps
        clips:
          - { track: harpsichord, pattern: motif, generators: [{ name: motif chords }], repeat: 8 }
          - { track: clicks, pattern: clicks, loop: true }
          - { track: bass, pattern: tuba short, generators: [{ name: motif chords }], loop: true }
      - name: theme
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: snare, pattern: brush, loop: true }
          - { track: bass, pattern: tuba, generators: [{ name: theme chords }], loop: true }
          - { track: harpsichord, pattern: offbeat, generators: [{ name: theme chords }], loop: true }
          - { track: lead, pattern: theme, loop: true }
      - name: middle
        clips:
          - { track: kick, pattern: kick, repeat: 8 }
          - { track: snare, pattern: brush, loop: true }
          - { track: bass, pattern: tuba, generators: [{ name: middle chords }], loop: true }
          - { track: harpsichord, pattern: offbeat, generators: [{ name: middle chords }], loop: true }
          - { track: lead, pattern: middle, loop: true }
      - name: ending
        clips:
          - { track: kick, pattern: kick, repeat: 4 }
          - { track: snare, pattern: brush, loop: true }
          - { track: bass, pattern: tuba, generators: [{ name: theme chords }], loop: true }
          - { track: harpsichord, pattern: offbeat, generators: [{ name: theme chords }], loop: true }
          - { track: organ, pattern: held, generators: [{ name: theme chords }], loop: true }
