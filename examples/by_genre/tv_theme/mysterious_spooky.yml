version: 1.0.227
title: Mysterious and spooky
description: "a creepy, kooky harpsichord theme in the manner of The Addams Family (Vic Mizzy), with a tune of its own"
notes: |
  Mysterious and spooky: a playful theme at 132 beats a minute in F major, in the manner of the mid
  sixties: a harpsichord with a chromatic, creeping tune, finger snaps (claves here) on two and
  four, a tuba-like bass and a church organ. The tune is its own.

  The bass and the harpsichord's chords are one bar each over chord I, moved by Progression
  through ii V I I and then iii vi ii V; the tune creeps up in half steps with accidentals.

  Run it with: llamatron examples/by_genre/tv_theme/mysterious_spooky.yml

  Scene 1, snaps, 4 bars: the snaps alone.
  Scene 2, theme, 16 bars: the harpsichord tune.
  Scene 3, snaps and bass, 8 bars: the snaps and the bass.
  Scene 4, theme 2, 16 bars: the tune again.
  Scene 5, organ, 16 bars: the church organ takes the tune.
  Scene 6, theme 3, 16 bars: the harpsichord and the organ together.
  Scene 7, snaps 2, 8 bars: the snaps and the bass again.
  Scene 8, last theme, 16 bars: the tune to the end.

  When changing this demo:
  - Keep the snaps on two and four.
  - Keep the tune original.
