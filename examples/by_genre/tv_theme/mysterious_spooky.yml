version: 1.0.365
title: Mysterious spooky
description: "a creepy, kooky harpsichord theme in the manner of The Addams Family (Vic Mizzy), with a tune of its own"
notes: |
  Mysterious spooky: a creepy, kooky harpsichord theme in the manner of The Addams Family (Vic Mizzy),
  with a tune of its own. This is a homage to The Addams Family (Vic Mizzy): its chords, form, sounds
  and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 4.

  A short, low harpsichord figure answered by two snaps, played on one chord and then a step higher; a
  bouncing tune over a tuba, with a dominant chord on II; a reed organ takes the tune in the middle.

  Subgenre: comic television theme of the sixties. Drums: almost none, a soft kick, brushes and
  clicks. Tempo 132, straight. Bass: a tuba on one and three. Builds: none. Sounds: a harpsichord,
  clicks, a reed organ. Melody manner: a short figure and two clicks; a bouncing dotted tune. Form: about a minute, as the theme ran on television, the tune first: snaps, theme, middle, ending.

  Band and song: the theme is known for its harpsichord, for the two clicks everyone joins in, and for
  being creepy and funny at once.

  Checklist: it is good and memorable because the listener plays the clicks. The hook is the figure
  and its two clicks; the emotion is macabre fun; the lift is the last theme with organ and clarinet;
  the contrast is the organ alone with the tune; the sounds are a harpsichord, a tuba, claves and a
  reed organ.

  Run it with: llamatron examples/by_genre/tv_theme/mysterious_spooky.yml

  Scene 1, snaps, 8 bars.
  Scene 2, theme, 16 bars.
  Scene 3, snaps 2, 4 bars.
  Scene 4, middle, 8 bars.
  Scene 5, theme 2, 8 bars.
  Scene 6, organ, 16 bars.
  Scene 7, snaps 3, 4 bars.
  Scene 8, middle 2, 8 bars.
  Scene 9, theme 3, 16 bars.
  Scene 10, snaps 4, 8 bars.
  Scene 11, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
