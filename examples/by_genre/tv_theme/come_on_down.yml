version: 1.0.591
title: Come on down
description: "a bright seventies game-show theme in the manner of The Price Is Right theme (Edd Kalehoff), with a tune of its own"
notes: |
  Come on down: a bright seventies game-show theme in the manner of The Price Is Right theme (Edd
  Kalehoff), with a tune of its own. This is a homage to The Price Is Right theme (Edd Kalehoff): its
  chords, form, sounds and drums follow that work as Claude knows it, and every tune and rhythm here
  is new. Rebuild version 4.

  A brass section and a synthesizer in unison on a leaping tune, a clavinet chopping sixteenths, funky
  bass octaves and a busy drum kit with a tambourine; a bridge, a flute chorus and a drum break.

  Subgenre: big-band funk-pop for a game show of the seventies. Drums: a busy, bright beat, kick on
  one, the and of two, three and the and of four, snare on two and four, sixteenth hats with an open
  hat before each bar, a tambourine. Tempo 126, straight. Bass: funky octaves in eighths. Builds:
  none; it is at full brightness throughout. Sounds: a brass section and an early synthesizer lead on
  the tune together, a clavinet chopping sixteenths, brass hits, a flute. Melody manner: a bouncing
  tune of leaps upward with gaps for the band. Form: about a minute, as the theme ran on television, the tune first: A, B, A 2, tag.

  Band and song: the theme is known for relentless cheer: brass and a synthesizer in unison on a
  leaping tune over a funky rhythm section, and dominant and suspended chords that never settle.

  Checklist: it is good and memorable because it sounds like winning. The hook is the leaping brass
  tune; the emotion is excitement; the lift is the tune returning after the drum break; the contrast
  is the bridge and the flute chorus; the sounds are a brass section, a square synth lead, a clavinet,
  a flute and an electric bass.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/tv_theme/come_on_down.yml

  Scene 1, intro, 4 bars.
  Scene 2, A, 16 bars.
  Scene 3, B, 8 bars.
  Scene 4, A 2, 8 bars.
  Scene 5, flute, 16 bars.
  Scene 6, B 2, 8 bars.
  Scene 7, A 3, 16 bars.
  Scene 8, drum break, 4 bars.
  Scene 9, A 4, 8 bars.
  Scene 10, tag, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

