version: 1.0.364
title: Uphill cops
description: "a gentle piano theme in the manner of Hill Street Blues (Mike Post), its chords voice-led, with a melody of its own"
notes: |
  Uphill cops: a gentle piano theme in the manner of Hill Street Blues (Mike Post), its chords voice-
  led, with a melody of its own. This is a homage to Hill Street Blues (Mike Post): its chords, form,
  sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 2.

  An electric piano rolls each chord gently, I and IV in turn, under a plain piano tune of long notes;
  a soft rhythm section, a clean guitar that fills the gaps and strings join; a second strain climbs
  through IV V iii vi.

  Subgenre: gentle soft-rock television theme of the early eighties. Drums: very soft, a kick and a
  side stick. Tempo 76, straight. Bass: fretless, plain. Builds: instruments join gently. Sounds: an
  electric piano rolling chords, an acoustic piano with the tune, a clean guitar, strings. Melody
  manner: long plain notes. Form: theme, second strain, theme.

  Band and song: the theme is known for being tender where its show was hard, a few piano notes over
  two chords.

  Checklist: it is good and memorable because it is calm and unhurried. The hook is the piano tune
  over I and IV; the emotion is tenderness; the lift is the strings; the contrast is the quiet middle;
  the sounds are an electric piano, a piano, a clean guitar and strings.

  Run it with: llamatron examples/by_genre/tv_theme/uphill_cops.yml

  Scene 1, intro, 4 bars.
  Scene 2, theme, 8 bars.
  Scene 3, theme with the band, 8 bars.
  Scene 4, second strain, 8 bars.
  Scene 5, theme with strings, 8 bars.
  Scene 6, quiet, 4 bars.
  Scene 7, second strain 2, 8 bars.
  Scene 8, last theme, 8 bars.
  Scene 9, outro, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
