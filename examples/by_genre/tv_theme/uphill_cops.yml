version: 1.0.227
title: Uphill cops
description: "a gentle piano theme in the manner of Hill Street Blues (Mike Post), its chords voice-led, with a melody of its own"
notes: |
  Uphill cops: a gentle theme at 76 beats a minute in D major, in the manner of the early eighties
  police dramas: a solo piano with the tune, an electric piano with the chords, a fretless bass,
  strings and soft drums. The melody is its own.

  The electric piano and the strings hold one chord a bar, which a Progression moves through
  I iii IV V vi IV ii V, and a Voice leading generator called smooth, after the progression in
  the chains, voices each chord nearest the one before, between octaves 4 and 5, so the chords
  glide rather than jump.

  Run it with: llamatron examples/by_genre/tv_theme/uphill_cops.yml

  Scene 1, intro, 8 bars: the chords and the bass.
  Scene 2, theme, 16 bars: the piano with the tune, soft drums.
  Scene 3, strings, 16 bars: the strings join.
  Scene 4, quiet, 8 bars: the tune over the chords alone.
  Scene 5, outro, 8 bars: the chords and the strings.

  When changing this demo:
  - Keep the chords voice-led by smooth after the progression.
  - Keep the melody original.
real_time: true
protected: true

