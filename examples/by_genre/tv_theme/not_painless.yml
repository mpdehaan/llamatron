version: 1.0.365
title: Not painless
description: "a gentle, wistful guitar theme in the manner of M*A*S*H (Johnny Mandel), with a melody of its own"
notes: |
  Not painless: a gentle, wistful guitar theme in the manner of M*A*S*H (Johnny Mandel), with a melody
  of its own. This is a homage to M*A*S*H (Johnny Mandel): its chords, form, sounds and drums follow
  that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 3.

  A verse on iv VII III i, twice, a Progression moving one bar of picking; a refrain on VI VII v i, iv
  VII i; the tune's lines each answered; about a minute, as a theme runs.

  Subgenre: a folk ballad of about 1970 used as a television theme, played without its words. Drums:
  almost none, a side stick on two and four, a shaker, a soft kick on one. Tempo 90. Bass: an acoustic
  bass, a long root and a fifth. Sounds: two acoustic guitars, one picking broken chords and one
  strumming softly, a flute with the tune, a second flute answering. Melody manner: short lines that
  each start after the beat and fall, one answering the last a step lower, then a refrain of long
  notes.

  Band and song: the theme is known for sounding gentle while it is sad, a campfire tune over
  helicopters, and for its chords, which walk down by fourths under a melody that keeps sighing.

  Checklist: it is good and memorable because every line is the same sigh a step lower, so the ear
  knows where it goes. The hook is the verse's first line; the emotion is wistful and resigned; the
  lift is the refrain's long high notes; the contrast is the second flute's answers, and the guitars
  alone at each end; the sounds are two nylon guitars, an acoustic bass and flutes.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/tv_theme/not_painless.yml

  Scene 1, theme, 8 bars.
  Scene 2, refrain, 8 bars.
  Scene 3, theme again, 4 bars.
  Scene 4, outro, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
