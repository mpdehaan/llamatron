progressions:
  circle: { chords: [1, 4, 7, 3, 6, 2, 5, 1] }

guitarifies:
  roll: { bar: [bass, string_4, string_3, string_2, string_1, nothing, nothing, nothing], accents: [false, false, false, false, false, false, false, false], cell: 1/8, let_ring: true }
  travis: { bar: [bass, string_2, alt_bass, string_1, bass, string_3, alt_bass, string_2], accents: [true, false, false, false, true, false, false, false], cell: 1/8, let_ring: true }
  soft strum: { bar: [down, nothing, down, up, nothing, up, down, up], accents: [true, false, false, false, false, false, true, false], cell: 1/8, let_ring: true, spread: 18, fade: 30 }
  high chime: { bar: [string_4, string_2, string_1, string_3, string_2, string_1, string_3, string_2], accents: [false, false, false, false, false, false, false, false], cell: 1/8, let_ring: true, position: 7, strings: 4 }
  high crosspick: { bar: [string_3, string_2, string_1, string_3, string_2, string_1, string_3, string_2], accents: [true, false, false, true, false, false, true, false], cell: 1/8, let_ring: true, position: 5, strings: 4 }

chains:
  circle:
    - progression: circle
  roll:
    - progression: circle
    - guitarify: roll
  travis:
    - progression: circle
    - guitarify: travis
  soft strum:
    - progression: circle
    - guitarify: soft strum
  high chime:
    - progression: circle
    - guitarify: high chime
  high crosspick:
    - progression: circle
    - guitarify: high crosspick

instruments:
  nylon guitar: { device: "*FluidSynth", gm_sound: 25 }
  steel guitar: { device: "*FluidSynth", gm_sound: 26 }
  acoustic bass: { device: "*FluidSynth", gm_sound: 33 }
  choir: { device: "*FluidSynth", gm_sound: 53 }
  flute: { device: "*FluidSynth", gm_sound: 74 }
  drum kit: { device: "*FluidSynth" }

songs:
  not_painless:
    tempo: 90
    scale: G Minor
    genre: TV theme

    tracks:
      stick: { drum: true, instrument: drum kit }
      shaker: { drum: true, instrument: drum kit }
      kick: { drum: true, instrument: drum kit }
      guitar: { instrument: nylon guitar }
      guitar 2: { instrument: steel guitar }
      bass: { instrument: acoustic bass }
      choir: { instrument: choir }
      lead: { instrument: flute }

    scenes:
      - name: intro
        tracks:
          guitar: { pattern: guitar, chains: [roll], repeat: 4 }
      - name: theme
        tracks:
          stick: { pattern: stick, loop: true }
          shaker: { pattern: shaker, loop: true }
          guitar: { pattern: guitar, chains: [travis], repeat: 16 }
          bass: { pattern: bass, chains: [circle], loop: true }
          lead: { pattern: tune, loop: true }
      - name: choir
        tracks:
          stick: { pattern: stick, loop: true }
          shaker: { pattern: shaker, loop: true }
          kick: { pattern: kick, loop: true }
          guitar: { pattern: guitar, chains: [soft strum], repeat: 16 }
          guitar 2: { pattern: guitar high, chains: [high chime], loop: true }
          bass: { pattern: bass walk, chains: [circle], loop: true }
          choir: { pattern: choir, chains: [circle], loop: true }
          lead: { pattern: air, loop: true }
      - name: interlude
        tracks:
          shaker: { pattern: shaker, loop: true }
          guitar: { pattern: guitar, chains: [travis], repeat: 8 }
          guitar 2: { pattern: guitar high, chains: [high crosspick], loop: true }
          bass: { pattern: bass, chains: [circle], loop: true }
          choir: { pattern: choir, chains: [circle], loop: true }
      - name: theme 2
        tracks:
          stick: { pattern: stick, loop: true }
          shaker: { pattern: shaker, loop: true }
          kick: { pattern: kick, loop: true }
          guitar: { pattern: guitar, chains: [travis], repeat: 16 }
          guitar 2: { pattern: guitar high, chains: [high chime], loop: true }
          bass: { pattern: bass walk, chains: [circle], loop: true }
          choir: { pattern: choir, chains: [circle], loop: true }
          lead: { pattern: tune, loop: true }
      - name: outro
        tracks:
          guitar: { pattern: guitar, chains: [roll], repeat: 8 }
          bass: { pattern: bass, chains: [circle], loop: true }
