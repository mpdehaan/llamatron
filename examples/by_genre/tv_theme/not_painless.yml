version: 1.0.362
title: Not painless
description: "a gentle, wistful guitar theme in the manner of M*A*S*H (Johnny Mandel), with a melody of its own"
notes: |
  Not painless: a gentle theme at 90 beats a minute in G minor, in the manner of the early seventies:
  two acoustic guitars, a bass, a side stick, a shaker and a soft kick, a choir in the second half
  and a flute with the tune. This is a homage to Suicide Is Painless, the theme from M*A*S*H, by
  Johnny Mandel: the mood, the tempo and the instruments are after that theme, and the chords and
  the melody are its own.

  The guitar's pattern is one held chord a bar. A Progression moves that chord round the circle of
  fifths in minor, i iv VII III VI ii v i, and a Guitarify after it in the same chain plays the
  chord as a guitarist would: rolled from the bass string up in the intro and the outro, picked
  with the thumb and fingers under the tune, and strummed softly under the choir. A second, steel
  guitar plays the same chord four strings wide, high up the neck, string by string.

  Run it with: llamatron examples/by_genre/tv_theme/not_painless.yml

  Scene 1, intro, 4 bars: the guitar alone, rolling each chord.
  Scene 2, theme, 16 bars: the flute with the tune over the picked guitar.
  Scene 3, choir, 16 bars: the choir joins, the guitar strums and the second guitar chimes.
  Scene 4, interlude, 8 bars: the two guitars and the choir.
  Scene 5, theme 2, 16 bars: the tune again, with everything.
  Scene 6, outro, 8 bars: the guitar and the bass.

  When changing this demo:
  - Keep the guitars one held chord a bar, moved by the Progression and played by a Guitarify.
  - Keep the melody its own: nothing of the theme's melody is used.
  - Keep it gentle: no snare, no loud strum.
real_time: true
protected: true

