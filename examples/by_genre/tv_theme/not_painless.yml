version: 1.0.227
title: Not painless
description: "a gentle, wistful guitar theme in the manner of M*A*S*H (Johnny Mandel), with a melody of its own"
notes: |
  Not painless: a gentle theme at 90 beats a minute in G minor, in the manner of the early seventies:
  a nylon guitar picking its chords, a bass, a side stick and a shaker, a choir in the second
  half and a flute with the tune. The melody is its own.

  The guitar holds one chord a bar, which an arpeggiator called picking, in the guitar's chains,
  plays in eighths up and down. The chords go round the circle of fifths in minor,
  i iv VII III VI ii v i, from a Progression.

  Run it with: llamatron examples/by_genre/tv_theme/not_painless.yml

  Scene 1, intro, 4 bars: the guitar alone.
  Scene 2, theme, 16 bars: the flute with the tune.
  Scene 3, choir, 16 bars: the choir joins.
  Scene 4, interlude, 8 bars: the guitar and the choir.
  Scene 5, theme 2, 16 bars: the tune again.
  Scene 6, outro, 8 bars: the guitar alone.

  When changing this demo:
  - Keep the guitar a held chord picked by the arpeggiator.
  - Keep the melody original.
real_time: true
protected: true

