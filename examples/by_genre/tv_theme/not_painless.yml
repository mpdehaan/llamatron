  drum kit: { device: "*FluidSynth" }

songs:
  not_painless:
    tempo: 90
    scale: G Minor
    genre: TV Theme

    tracks:
      rim: { drum: true, instrument: drum kit }
      shaker: { drum: true, instrument: drum kit }
      kick: { drum: true, instrument: drum kit }
      guitar: { instrument: nylon guitar }
      guitar 2: { instrument: nylon guitar }
      bass: { instrument: acoustic bass }
      lead: { instrument: flute }
      answer: { instrument: flute }

    scenes:
      - name: theme
        tracks:
          guitar: { pattern: pick, chains: [verse], repeat: 8 }
          guitar 2: { pattern: strum, chains: [verse strum], loop: true }
          lead: { pattern: verse, loop: true }
      - name: refrain
        tracks:
          guitar: { pattern: pick, chains: [refrain], repeat: 8 }
          guitar 2: { pattern: strum, chains: [refrain strum], loop: true }
          rim: { pattern: rim, loop: true }
          shaker: { pattern: shaker, loop: true }
          kick: { pattern: kick, loop: true }
          bass: { pattern: bass, chains: [refrain], loop: true }
          lead: { pattern: refrain, loop: true }
          answer: { pattern: echo, loop: true }
      - name: theme again
        tracks:
          guitar: { pattern: pick, chains: [verse], repeat: 4 }
          guitar 2: { pattern: strum, chains: [verse strum], loop: true }
          rim: { pattern: rim, loop: true }
          shaker: { pattern: shaker, loop: true }
          kick: { pattern: kick, loop: true }
          bass: { pattern: bass, chains: [verse], loop: true }
          lead: { pattern: first line, loop: true }
      - name: outro
        tracks:
          guitar: { pattern: pick, chains: [verse], repeat: 4 }
          guitar 2: { pattern: strum, chains: [verse strum], loop: true }
          answer: { pattern: first line, loop: true }
