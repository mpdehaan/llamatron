version: 1.0.365
title: UK butler
description: "a saloon-piano ragtime sitcom theme in the manner of the Mr. Belvedere theme (Judy Hart-Angelo and Gary Portnoy, as Leon Redbone sang it), with a tune of its own"
notes: |
  UK butler: a saloon-piano ragtime sitcom theme in the manner of the Mr. Belvedere theme (Judy Hart-
  Angelo and Gary Portnoy, as Leon Redbone sang it), with a tune of its own. This is a homage to the
  Mr. Belvedere theme (Judy Hart-Angelo and Gary Portnoy, as Leon Redbone sang it): its chords, form,
  sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 3.

  A honky-tonk piano opens alone with a rag figure over a low note and a chord by turns; a lazy tune
  over ragtime chords, the piano filling each gap; the piano takes a chorus in octaves; a scatted tag
  on a muted trumpet.

  Subgenre: a ragtime pastiche of the mid eighties, written for television by songwriters of sitcom
  themes: a saloon piano of the turn of the century under a crooner out of the twenties. Drums:
  brushes and a soft kick in two, nothing more. Tempo 120, swung. Bass: the piano's left hand, a low
  note on one and three, with a tuba under it. Builds: none, the piano only fills more. Sounds: an
  out-of-tune upright piano doing everything, a low note and a chord by turns in the left hand and a
  syncopated figure in the right, a lazy low voice, a clarinet, a muted trumpet for the scat. Melody
  manner: a relaxed croon that lags, with chromatic steps into chord notes; a scatted ending. Form: about a minute, as the theme ran on television, the tune first: A, B, A 2, piano ending.

  Band and song: the theme was written for a pilot that was never picked up and given to this series
  afterwards; the singer who recorded it is known for a lazy baritone croon and a scat like a muted
  horn, out of an earlier age; the theme is remembered for that voice over a barroom piano and ragtime
  chords, I III7 VI7 II7 V7.

  Checklist: it is good and memorable because it is cosy and funny, a saloon from another century in a
  modern living room. The hook is the lazy tune over the piano's bounce; the emotion is amused warmth;
  the lift is the piano's own chorus, the tune in octaves over the rag figure, and the scat tag on the
  muted trumpet; the contrast is the bridge on IV; the sounds are a low voice lead, a honky-tonk piano
  in three parts, a tuba, a clarinet and a muted trumpet.

  Phrasing: the lines run on as a patter song's do, two to four bars before a breath; each is accented
  where it starts and at its highest note, and eases at its end.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/tv_theme/uk_butler.yml

  Scene 1, piano alone, 4 bars.
  Scene 2, A, 16 bars.
  Scene 3, B, 8 bars.
  Scene 4, A 2, 8 bars.
  Scene 5, piano chorus, 16 bars.
  Scene 6, B 2, 8 bars.
  Scene 7, A 3, 16 bars.
  Scene 8, scat, 8 bars.
  Scene 9, piano ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
