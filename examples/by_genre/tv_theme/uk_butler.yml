version: 1.0.364
title: UK butler
description: "an old-time ragtime sitcom theme in the manner of the Mr. Belvedere theme (Judy Hart-Angelo and Gary Portnoy, as Leon Redbone sang it), with a tune of its own"
notes: |
  UK butler: an old-time ragtime sitcom theme in the manner of the Mr. Belvedere theme (Judy Hart-
  Angelo and Gary Portnoy, as Leon Redbone sang it), with a tune of its own. This is a homage to the
  Mr. Belvedere theme (Judy Hart-Angelo and Gary Portnoy, as Leon Redbone sang it): its chords, form,
  sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 1.

  A two-beat on a tuba, a banjo and a stride piano on the offbeats, brushes; a lazy tune over ragtime
  chords, a clarinet answering each phrase; a clarinet chorus and a scatted tag on a muted trumpet.

  Subgenre: a ragtime and Dixieland revival, a crooner with an old-time band, used for a sitcom of the
  eighties. Drums: brushes and a soft kick in two, nothing more. Tempo 120, swung. Bass: a tuba on one
  and three. Builds: none. Sounds: a banjo and a stride piano on the offbeats, a clarinet weaving, a
  muted trumpet, a lazy low voice. Melody manner: a relaxed croon that lags, with chromatic steps into
  chord notes; a scatted ending. Form: A A B A, a clarinet chorus, a scat tag.

  Band and song: the singer is known for a lazy baritone croon and scat out of an earlier age; the
  theme for that voice over ragtime chords, I III7 VI7 II7 V7.

  Checklist: it is good and memorable because it is cosy and funny, a voice from the twenties in a
  modern living room. The hook is the lazy tune over the bounce; the emotion is amused warmth; the
  lift is the scat tag on the muted trumpet with the clarinet above; the contrast is the bridge on IV;
  the sounds are a low voice lead, a clarinet, a muted trumpet, a banjo, a piano and a tuba.

  Run it with: llamatron examples/by_genre/tv_theme/uk_butler.yml

  Scene 1, intro, 4 bars.
  Scene 2, A, 16 bars.
  Scene 3, B, 8 bars.
  Scene 4, A 2, 8 bars.
  Scene 5, clarinet, 16 bars.
  Scene 6, B 2, 8 bars.
  Scene 7, A 3, 16 bars.
  Scene 8, scat, 8 bars.
  Scene 9, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
