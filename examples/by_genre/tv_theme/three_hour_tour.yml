version: 1.0.364
title: Three hour tour
description: "a sea-shanty sitcom theme of the sixties in the manner of The Ballad of Gilligan's Isle (Sherwood Schwartz and George Wyle), with a tune of its own"
notes: |
  Three hour tour: a sea-shanty sitcom theme of the sixties in the manner of The Ballad of Gilligan's
  Isle (Sherwood Schwartz and George Wyle), with a tune of its own. This is a homage to The Ballad of
  Gilligan's Isle (Sherwood Schwartz and George Wyle): its chords, form, sounds and drums follow that
  work as Claude knows it, and every tune and rhythm here is new. Rebuild version 1.

  A shanty in minor on i and VII, strummed by a Guitarify on an acoustic guitar with an accordion and
  men's voices; each verse a half step higher, from D minor to F minor.

  Subgenre: a sea shanty sung as a folk ballad, for a sitcom of the sixties. Drums: brushes and a soft
  kick in two, a tambourine. Tempo 132, straight with a lilt. Bass: an acoustic bass on one and three.
  Builds: every verse is a half step higher than the one before. Sounds: a strummed acoustic guitar,
  an accordion, a group of men singing, a ship's bell. Melody manner: a stomping, stepwise shanty in
  dotted rhythm that tells a story. Form: verse after verse, each a key higher.

  Band and song: the theme is known for telling the whole story of its show in verses, for its shanty
  swagger, and for climbing a key with every verse.

  Checklist: it is good and memorable because it is a story you can sing after one hearing, and it
  keeps climbing. The hook is the shanty tune; the emotion is jaunty, with trouble coming; the lift is
  each key change, and the men's voices joining; the contrast is the first verse with the guitar
  alone; the sounds are a voice lead, a choir of men, an accordion, a steel guitar that a Guitarify
  strums, an acoustic bass and a bell.

  Run it with: llamatron examples/by_genre/tv_theme/three_hour_tour.yml

  Scene 1, bell, 4 bars.
  Scene 2, verse 1, 16 bars.
  Scene 3, verse 2, 16 bars.
  Scene 4, verse 3, 16 bars.
  Scene 5, accordion, 8 bars.
  Scene 6, verse 4, 16 bars.
  Scene 7, verse 5, 16 bars.
  Scene 8, ending, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
