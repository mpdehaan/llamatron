version: 1.0.365
title: Three hour tour
description: "a sea-shanty sitcom theme of the sixties in the manner of The Ballad of Gilligan's Isle (Sherwood Schwartz and George Wyle), with tunes of its own"
notes: |
  Three hour tour: a sea-shanty sitcom theme of the sixties in the manner of The Ballad of Gilligan's
  Isle (Sherwood Schwartz and George Wyle), with tunes of its own. This is a homage to The Ballad of
  Gilligan's Isle (Sherwood Schwartz and George Wyle): its chords, form, sounds and drums follow that
  work as Claude knows it, and every tune and rhythm here is new. Rebuild version 3.

  A shanty in minor on i and VII, strummed by a Guitarify on an acoustic guitar; a refrain in which a
  line from the singer is answered by the men; a turn of four bars on VI, III, iv and V; each verse a
  half step higher, from D minor to E minor, in about a minute.

  Subgenre: a sea shanty sung as a folk ballad, for a sitcom of the sixties. Drums: brushes and a soft
  kick in two, a tambourine. Tempo 132, straight with a lilt. Bass: an acoustic bass on one and three.
  Builds: every verse is a half step higher than the one before. Sounds: a strummed acoustic guitar,
  an accordion, a group of men singing, a ship's bell. Melody manner: a stomping, stepwise shanty in
  dotted rhythm that tells a story, a soloist's line answered by the crew. Form: a verse, the crew's
  refrain, a verse a key higher, a turn in the story, a last verse higher again.

  Band and song: the theme is known for telling the whole story of its show in a minute, for its
  shanty swagger, for the crew answering the singer, and for climbing a key with every verse.

  Checklist: it is good and memorable because it is a story you can sing after one hearing, and it
  keeps climbing. The hook is the shanty tune, heard first with the guitar alone; the emotion is
  jaunty, with trouble coming; the lift is each key change and the crew's answers; the contrast is the
  turn in the story, slower notes over the relative major's chords; the sounds are a voice lead, a
  choir of men, an accordion, a steel guitar that a Guitarify strums, an acoustic bass and a bell.

  Run it with: llamatron examples/by_genre/tv_theme/three_hour_tour.yml

  Scene 1, verse 1, 8 bars.
  Scene 2, refrain, 4 bars.
  Scene 3, verse 2, 8 bars.
  Scene 4, the turn, 4 bars.
  Scene 5, verse 3, 8 bars.
  Scene 6, last refrain, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
