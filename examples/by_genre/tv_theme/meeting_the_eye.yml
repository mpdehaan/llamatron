version: 1.0.365
title: Meeting the eye
description: "a one-minute hard-rock cartoon theme of the mid eighties in the manner of the theme of The Transformers (Ford Kinder and Anne Bryant), with a tune of its own"
notes: |
  Meeting the eye: a one-minute hard-rock cartoon theme of the mid eighties in the manner of the theme
  of The Transformers (Ford Kinder and Anne Bryant), with a tune of its own. This is a homage to the
  theme of The Transformers (Ford Kinder and Anne Bryant): its chords, form, sounds and drums follow
  that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 2.

  The band plays the slogan's rhythm alone, then the voices shout it; a chorus on i VII i V and VI VII
  i that a robot voice answers; one low verse; a drum break with the robot alone; the chorus and the
  slogan again.

  Subgenre: hard-rock and synthesizer theme for an action cartoon of the mid eighties, a minute long
  because it opens a children's show. Drums: a driving rock kit, a big snare on two and four, eighth
  hats, the kick on every eighth under the chorus with a crash at its start. Tempo 138, straight.
  Bass: a synth bass in steady eighths. Builds: none are needed in a minute; a two-bar drum break sets
  up the last chorus. Sounds: distorted power chords, synth brass stabs, a sung lead, a robot voice
  that answers. Melody manner: a slogan of two short shouts and a long high note, said again and again
  with the whole band hitting its rhythm, and a robot voice answering low; a low, busy verse. Form:
  the slogan on the band alone, chorus, verse, chorus, drum break, chorus, the slogan to end.

  Band and song: the theme is known for a slogan short enough to shout that starts the song, a
  processed robot voice that answers the singers, and metal guitars under bright synthesizers, all
  over in the time of a title sequence.

  Checklist: it is good and memorable because the slogan comes first, comes often, and the band plays
  its rhythm with the voices. The hook is the slogan: two shouts, a gap and a long note a fourth up,
  the guitars and brass on the same rhythm, heard nine times in a minute; the emotion is heroic
  urgency; the lift is the slogan climbing a step at a time in the chorus's second half; the contrast
  is the verse, low over chugging guitars, and the robot voice alone over the drums; the sounds are a
  voice lead, a choir a third above, a square lead for the robot, a distortion guitar, synth brass and
  a synth bass.

  Run it with: llamatron examples/by_genre/tv_theme/meeting_the_eye.yml

  Scene 1, slogan, 2 bars.
  Scene 2, chorus, 8 bars.
  Scene 3, verse, 8 bars.
  Scene 4, chorus 2, 8 bars.
  Scene 5, drum break, 2 bars.
  Scene 6, last chorus, 8 bars.
  Scene 7, ending, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
