version: 1.0.364
title: Meeting the eye
description: "a hard-rock cartoon theme of the mid eighties in the manner of the theme of The Transformers (Ford Kinder and Anne Bryant), with a tune of its own"
notes: |
  Meeting the eye: a hard-rock cartoon theme of the mid eighties in the manner of the theme of The
  Transformers (Ford Kinder and Anne Bryant), with a tune of its own. This is a homage to the theme of
  The Transformers (Ford Kinder and Anne Bryant): its chords, form, sounds and drums follow that work
  as Claude knows it, and every tune and rhythm here is new. Rebuild version 1.

  Chugging power chords and a synth bass in eighths; a low verse on i and VI and VII; a shouted chorus
  on i VII VI V that a robot voice answers; a bridge, a synth solo and a drum break.

  Subgenre: hard-rock and synthesizer theme for an action cartoon of the mid eighties. Drums: a
  driving rock kit, kick on one and three with pushes, a big snare on two and four, eighth hats, the
  kick doubled in the chorus under a crash. Tempo 138, straight. Bass: a synth bass in steady eighths.
  Builds: a drum break before the last chorus. Sounds: distorted power chords, synth brass stabs, a
  sung lead, a robot voice that answers, a screaming synth solo. Melody manner: a low heroic verse, a
  chorus of short shouted phrases, each answered by the robot voice. Form: riff, verse, chorus,
  bridge, solo, chorus.

  Band and song: the theme is known for a chorus short enough to shout, a processed robot voice that
  answers the singers, and metal guitars under bright synthesizers.

  Checklist: it is good and memorable because the chorus is a slogan and a machine answers it. The
  hook is the shouted chorus with the robot answer; the emotion is heroic urgency; the lift is the
  chorus, the tune an octave up with voices a third above, brass stabs, the doubled kick and a crash;
  the contrast is the verse, low over chugging guitars; the sounds are a voice lead, a choir, a square
  lead for the robot, a distortion guitar, synth brass, a saw lead and a synth bass.

  Run it with: llamatron examples/by_genre/tv_theme/meeting_the_eye.yml

  Scene 1, riff, 4 bars.
  Scene 2, verse, 16 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, riff 2, 4 bars.
  Scene 5, verse 2, 8 bars.
  Scene 6, chorus 2, 8 bars.
  Scene 7, bridge, 8 bars.
  Scene 8, solo, 16 bars.
  Scene 9, chorus 3, 16 bars.
  Scene 10, drum break, 4 bars.
  Scene 11, last chorus, 8 bars.
  Scene 12, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
