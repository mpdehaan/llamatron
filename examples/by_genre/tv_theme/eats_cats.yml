version: 1.0.365
title: Eats cats
description: "a bouncing mid-eighties sitcom instrumental in the manner of the ALF theme (Alf Clausen), with a tune of its own"
notes: |
  Eats cats: a bouncing mid-eighties sitcom instrumental in the manner of the ALF theme (Alf Clausen),
  with a tune of its own. This is a homage to the ALF theme (Alf Clausen): its chords, form, sounds
  and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 2.

  A slap bass alone, then a drum machine and an electric piano; a syncopated synth brass tune over I,
  vi and the flat seventh; a second strain and a sax chorus.

  Subgenre: synth pop-funk for a sitcom of the mid eighties, an instrumental. Drums: a drum machine,
  kick on one, the and of two and three, a gated snare on two and four, sixteenth hats, claps. Tempo
  128, straight. Bass: a slap bass riff in sixteenths that starts the piece alone. Builds: none.
  Sounds: a slap bass, a digital electric piano stabbing chords, a synth brass lead, a sax. Melody
  manner: a playful, syncopated tune that starts off the beat. Form: about a minute, as the theme ran on television, the tune first: A, B, A 4, ending.

  Band and song: the theme is known for its funky bass opening and its cheerful tune over chords that
  lean on the flat seventh.

  Checklist: it is good and memorable because the bass makes you grin before the tune starts. The hook
  is the bass riff, then the brass tune; the emotion is mischief; the lift is the tune arriving over
  the bass; the contrast is the smoother B strain; the sounds are a slap bass, an electric piano,
  synth brass and an alto sax.

  Run it with: llamatron examples/by_genre/tv_theme/eats_cats.yml

  Scene 1, bass, 4 bars.
  Scene 2, drums, 4 bars.
  Scene 3, A, 16 bars.
  Scene 4, B, 8 bars.
  Scene 5, A 2, 8 bars.
  Scene 6, sax, 16 bars.
  Scene 7, B 2, 8 bars.
  Scene 8, A 3, 16 bars.
  Scene 9, bass again, 4 bars.
  Scene 10, A 4, 8 bars.
  Scene 11, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
