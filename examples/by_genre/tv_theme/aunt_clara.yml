version: 1.0.365
title: Aunt Clara
description: "a twinkling light-jazz sitcom theme of the sixties in the manner of the Bewitched theme (Howard Greenfield and Jack Keller), with a tune of its own"
notes: |
  Aunt Clara: a twinkling light-jazz sitcom theme of the sixties in the manner of the Bewitched theme
  (Howard Greenfield and Jack Keller), with a tune of its own. This is a homage to the Bewitched theme
  (Howard Greenfield and Jack Keller): its chords, form, sounds and drums follow that work as Claude
  knows it, and every tune and rhythm here is new. Rebuild version 4.

  A swinging ride, a walking bass and plucked strings; a vibraphone with a skipping tune on I vi ii V,
  a celesta sparkling after each phrase; a bridge through four dominant chords; choruses for a muted
  trumpet and a flute.

  Subgenre: light orchestral jazz for a sitcom of the sixties, cocktail swing. Drums: a ride cymbal
  swinging, brushes, a feathered kick. Tempo 138, swung. Bass: an acoustic bass walking in four.
  Builds: none. Sounds: vibraphone with the tune, a celesta that sparkles at the end of phrases,
  plucked strings on the offbeats, a muted trumpet and a flute. Melody manner: a skipping tune in
  short sequences that step down; a bridge on a chain of dominant chords. Form: about a minute, as the theme ran on television, the tune first: A, B, A 2, ending.

  Band and song: the theme is known for its sparkle, the sound of a spell, over easy swing, and for a
  tune that skips.

  Checklist: it is good and memorable because the sparkle is the show's magic turned into sound. The
  hook is the skipping tune with the sparkle after it; the emotion is charm and mischief; the lift is
  the last chorus with the flute above the vibraphone; the contrast is the bridge of dominants; the
  sounds are a vibraphone, a celesta, pizzicato strings, a muted trumpet, a flute and an acoustic
  bass.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  time-keeping and the chords lean on two and four, the bass walks into the first beat, and the notes
  between the beats are lighter; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/tv_theme/aunt_clara.yml

  Scene 1, intro, 4 bars.
  Scene 2, A, 16 bars.
  Scene 3, B, 8 bars.
  Scene 4, A 2, 8 bars.
  Scene 5, trumpet, 16 bars.
  Scene 6, B 2, 8 bars.
  Scene 7, vibraphone, 16 bars.
  Scene 8, B 3, 8 bars.
  Scene 9, last A, 16 bars.
  Scene 10, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
