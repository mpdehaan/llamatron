version: 1.0.227
title: Spy hunting
description: "a late fifties spy-jazz theme in the manner of Peter Gunn (Henry Mancini), with a riff and a tune of its own"
notes: |
  Spy hunting: a spy theme at 112 beats a minute in E minor, in the manner of the late fifties
  detective shows: a low guitar riff in eighths, doubled by the bass, a surf beat on the ride,
  stabbing brass and a tenor saxophone with the tune. The riff and the tune are its own.

  The riff and the brass are one bar each over chord i, moved through a minor twelve-bar blues
  by a Progression, i i i i iv iv i i v iv i i, so every scene is one chorus of twelve bars.

  Run it with: llamatron examples/by_genre/tv_theme/spy_hunting.yml

  Scene 1, riff, 12 bars: the guitar riff alone.
  Scene 2, drums, 12 bars: the bass doubles the riff and the drums come in.
  Scene 3, brass, 12 bars: the brass stabs join.
  Scene 4, head, 12 bars: the saxophone plays the tune.
  Scene 5, head 2, 12 bars: the tune again.
  Scene 6, break, 12 bars: the brass and the riff, no saxophone.
  Scene 7, last head, 12 bars: the tune to the end.

  When changing this demo:
  - Keep the riff and the stabs one bar long over chord i.
  - Keep every scene a twelve-bar chorus.
  - Keep the riff and the tune original.
real_time: true
protected: true

