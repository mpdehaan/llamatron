version: 1.0.365
title: Spy hunting
description: "a late fifties spy-jazz theme in the manner of Peter Gunn (Henry Mancini), with a riff and a tune of its own"
notes: |
  Spy hunting: a late fifties spy-jazz theme in the manner of Peter Gunn (Henry Mancini), with a riff
  and a tune of its own. This is a homage to Peter Gunn (Henry Mancini): its chords, form, sounds and
  drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 4.

  One bar of low eighths on a twangy guitar, a piano and a bass, on one chord, that never stops; brass
  chords that swell over it; a head in long blue notes and a wailing tenor sax solo; once, the riff
  moves to iv and back.

  Subgenre: spy jazz of the late fifties. Drums: a straight rock beat with a ride. Tempo 120,
  straight. Bass: the riff itself, low eighths that never stop. Builds: brass grows over the riff.
  Sounds: a twangy guitar, piano and bass on the riff, a brass section, a tenor sax. Melody manner:
  long blue notes over the riff. Form: about a minute, as the theme ran on television, the tune first: riff, head, riff out.

  Band and song: the theme is known for one bar that repeats from start to end, and for brass that
  screams over it.

  Checklist: it is good and memorable because the riff is menace on a loop. The hook is the riff; the
  emotion is cool danger; the lift is the brass swelling in; the contrast is the riff alone; the
  sounds are an electric guitar, a piano, a brass section, a trumpet and a tenor sax.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/tv_theme/spy_hunting.yml

  Scene 1, riff, 4 bars.
  Scene 2, drums, 4 bars.
  Scene 3, brass, 8 bars.
  Scene 4, head, 16 bars.
  Scene 5, sax, 16 bars.
  Scene 6, to iv and back, 8 bars.
  Scene 7, head 2, 16 bars.
  Scene 8, shout, 8 bars.
  Scene 9, riff out, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
