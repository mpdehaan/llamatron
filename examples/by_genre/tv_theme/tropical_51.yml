version: 1.0.227
title: Tropical 51
description: "a big-band police-show theme in the manner of Hawaii Five-0 (Morton Stevens), with a fanfare of its own"
notes: |
  Tropical 51: a big-band theme at 150 beats a minute in C minor, in the manner of the late sixties
  police shows: pounding toms, timpani, strings racing in sixteenths, a brass section with the
  fanfare and trombones answering. The fanfare is its own.

  The strings, the bass and the timpani are one bar each over chord i, moved by Progression: the
  A part goes i i VI VII and the B part iv iv i i VI VII i i.

  Run it with: llamatron examples/by_genre/tv_theme/tropical_51.yml

  Scene 1, intro, 8 bars: the toms and the strings.
  Scene 2, fanfare, 16 bars: the brass fanfare.
  Scene 3, answer, 16 bars: the second part, the trombones answering.
  Scene 4, fanfare 2, 16 bars: the fanfare again.
  Scene 5, answer 2, 16 bars: the second part again.
  Scene 6, drums, 8 bars: the toms and the timpani alone.
  Scene 7, fanfare 3, 16 bars: the fanfare.
  Scene 8, last answer, 16 bars: the last answer.

  When changing this demo:
  - Keep the strings, bass and timpani one bar long over chord i.
  - Keep the fanfare original.
