version: 1.0.364
title: Tropical 51
description: "a big-band police-show theme in the manner of Hawaii Five-0 (Morton Stevens), with a fanfare of its own"
notes: |
  Tropical 51: a big-band police-show theme in the manner of Hawaii Five-0 (Morton Stevens), with a
  fanfare of its own. This is a homage to Hawaii Five-0 (Morton Stevens): its chords, form, sounds and
  drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 2.

  Tom-toms and timpani open, then a trumpet fanfare in bold leaps over a driving bass, tambourine and
  brass on the offbeats, the chords falling i VII VI to a major V; trombones answer; and the whole
  thing rises a step, twice.

  Subgenre: big-band surf television theme of the late sixties. Drums: tom-toms to open, then a
  driving rock beat with a tambourine. Tempo 150, straight. Bass: driving eighths. Builds: the key
  rises a step, twice. Sounds: trumpets, trombones, brass on the offbeats, strings. Melody manner: a
  bold fanfare of leaps and long notes. Form: drums, fanfare, answer, up a key.

  Band and song: the theme is known for its drum opening, its soaring brass and its lift into a higher
  key.

  Checklist: it is good and memorable because it surges: drums, brass, then higher. The hook is the
  fanfare; the emotion is excitement; the lift is each key change; the contrast is the drums alone;
  the sounds are a trumpet, a trombone, a brass section and strings.

  Run it with: llamatron examples/by_genre/tv_theme/tropical_51.yml

  Scene 1, drums, 4 bars.
  Scene 2, fanfare, 16 bars.
  Scene 3, answer, 8 bars.
  Scene 4, drums, 4 bars.
  Scene 5, fanfare 2, 8 bars.
  Scene 6, drums 2, 4 bars.
  Scene 7, fanfare, 16 bars.
  Scene 8, answer, 8 bars.
  Scene 9, drums, 4 bars.
  Scene 10, fanfare, 16 bars.
  Scene 11, answer, 8 bars.
  Scene 12, last fanfare, 16 bars.
  Scene 13, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

