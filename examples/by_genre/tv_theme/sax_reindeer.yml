version: 1.0.227
title: Sax reindeer
description: "a breakneck novelty saxophone romp in the manner of Yakety Sax (Boots Randolph), with runs of its own"
notes: |
  Sax reindeer: a novelty romp at 144 beats a minute in B flat major, in the manner of Yakety Sax and
  the chases it scored: a tenor saxophone running in sixteenths, a honky-tonk piano on the
  off-beats, an oom-pah bass and a two-beat kit. Every run is its own.

  The bass and the piano are one bar each over chord I, moved by Progression: the A part goes
  I I IV I and the B part V IV I V. In the middle the piano takes the tune.

  Run it with: llamatron examples/by_genre/tv_theme/sax_reindeer.yml

  Scene 1, intro, 4 bars: the band.
  Scene 2, A, 16 bars: the saxophone runs.
  Scene 3, B, 8 bars: the second part.
  Scene 4, A 2, 16 bars: the runs again.
  Scene 5, piano, 8 bars: the piano takes the tune.
  Scene 6, A 3, 16 bars: the saxophone again.
  Scene 7, B 2, 8 bars: the second part again.
  Scene 8, A 4, 16 bars: the runs once more.
  Scene 9, tag, 16 bars: the saxophone and the piano together.

  When changing this demo:
  - Keep the bass and the piano one bar long over chord I.
  - Keep the runs original.
