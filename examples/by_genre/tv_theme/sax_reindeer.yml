version: 1.0.591
title: Sax reindeer
description: "a breakneck novelty saxophone romp in the manner of Yakety Sax (Boots Randolph), with runs of its own"
notes: |
  Sax reindeer: a breakneck novelty saxophone romp in the manner of Yakety Sax (Boots Randolph), with
  runs of its own. This is a homage to Yakety Sax (Boots Randolph): its chords, form, sounds and drums
  follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 5.

  A tenor sax running in sixteenths over a country two-beat, bass on one and three and the piano and
  guitar on the offbeats, a train beat on the snare; a second part that wails on long notes over IV, I
  and a dominant II; the last time a step higher.

  Subgenre: country novelty instrumental of the early sixties. Drums: a train beat on the snare, kick
  on one and three. Tempo 144, straight. Bass: a two-beat. Builds: none. Sounds: a tenor sax, a honky-
  tonk piano, a guitar on the offbeats. Melody manner: runs of sixteenths, then long wailing notes.
  Form: about a minute, as the theme ran on television, the tune first: A, B, A 3, tag.

  Band and song: the piece is known for breathless runs and for being the sound of a comic chase.

  Checklist: it is good and memorable because it never stops for breath and grins the whole time. The
  hook is the running sax; the emotion is silly speed; the lift is the last time a step higher; the
  contrast is the wailing second part; the sounds are a tenor sax and a honky-tonk piano.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/tv_theme/sax_reindeer.yml

  Scene 1, intro, 4 bars.
  Scene 2, A, 16 bars.
  Scene 3, B, 8 bars.
  Scene 4, A 2, 8 bars.
  Scene 5, piano, 16 bars.
  Scene 6, A 3, 8 bars.
  Scene 7, B 2, 8 bars.
  Scene 8, A 4, 16 bars.
  Scene 9, a step higher, 16 bars.
  Scene 10, tag, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
