version: 1.0.365
title: Go where
description: "Goa trance, an original: a rolling bass, a kick on every beat, and spiralling lines in an Eastern scale that pile up one at a time until a long breakdown lets them go"
notes: |
  Go where: Goa trance, an original: a rolling bass, a kick on every beat, and spiralling lines in an
  Eastern scale that pile up one at a time until a long breakdown lets them go. Version 1.

  An original piece, not a homage to any one work. A long introduction for the kick and the rolling
  bass; the first line; a second under it; a spiralling lead on top; a stripped stretch; a stretch
  where the bass moves; a breakdown with a slow lead, the first line creeping back by a Density, and a
  snare roll; everything at once; and an ending that takes the lines away in the order they came.

  Subgenre: Goa trance of the middle nineties, made for dancing outdoors until morning. Drums: a kick
  on every beat, never varied; an open hat on every offbeat; a clap on two and four; closed hats in
  sixteenths with accents; a snare roll out of the breakdown. Tempo 145. Bass: three sixteenths on the
  root after every kick, the rolling bass, one note for minutes. Sounds: three or four acid-like lines
  of sixteenths, each a different length and register, layered one at a time; a drone pad; a bell-like
  pluck; a slow, sitar-like lead in the breakdown. Melody manner: every line is in the Phrygian
  dominant scale, with its flat second and major third, and spirals: a short figure repeated a step
  higher each time, falling back at the end.

  Checklist: it is good and memorable because nothing ever replaces anything: each new line is added
  to the ones already running, so the piece grows like a rope being braided. The hook is the first
  acid line, sixteen sixteenths around the root and its flat second; the emotion is trance, bright and
  insistent, with awe in the breakdown; the lift is each added line, and the return of the kick after
  the breakdown with every line at once; the contrast is the breakdown, the kick and bass gone and one
  slow lead over a drone; the sounds are a synth bass, three saw and square leads, a pad, a pluck and
  a sitar.

  Run it with: llamatron examples/by_genre/electronic/go_where.yml

  Scene 1, kick and drone, 8 bars.
  Scene 2, rolling bass, 8 bars.
  Scene 3, first line, 16 bars.
  Scene 4, second line, 16 bars.
  Scene 5, spiral, 16 bars.
  Scene 6, stripped, 8 bars.
  Scene 7, the bass moves, 16 bars.
  Scene 8, all four, 16 bars.
  Scene 9, breakdown, 8 bars.
  Scene 10, breakdown, higher, 8 bars.
  Scene 11, creeping back, 8 bars.
  Scene 12, everything, 16 bars.
  Scene 13, everything, higher, 16 bars.
  Scene 14, lines leaving, 8 bars.
  Scene 15, first line alone, 8 bars.
  Scene 16, kick and bass, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original: it follows a genre and no one work.
