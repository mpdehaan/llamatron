version: 1.0.365
title: Percussion fish
description: "drum and bass, an original: a breakbeat that keeps being re-cut, a reese bass, a darting tune, and a school of hand percussion that gets a stretch to itself"
notes: |
  Percussion fish: drum and bass, an original: a breakbeat that keeps being re-cut, a reese bass, a
  darting tune, and a school of hand percussion that gets a stretch to itself. Version 1.

  An original piece, not a homage to any one work. An introduction for pad and piano with the
  percussion arriving; the break; the first drop with the reese and the tune; the same with the school
  of percussion; a breakdown; a build; a second drop on a chopped bass and a re-cut break; the
  percussion alone with the sub; half time; the first drop once more; and an ending for percussion and
  pad.

  Subgenre: drum and bass of the late nineties and after, a rolling breakbeat under a heavy bass with
  jazz chords on top. Drums: a breakbeat at 174, a kick on one and before three, a snare on two and
  four, ghost snares between them, hats or a ride in eighths; the break is re-cut in the second drop,
  the kicks and snares moved; a snare roll in the build; one stretch in half time. Around the kit a
  school of hand percussion, congas, a timbale, a woodblock, a shaker and a cowbell, which come and go
  and get a stretch alone with the sub. Bass: a reese, long detuned notes that bend at the bar's end,
  with a sub under it; in the second drop a chopped line. Sounds: a pad, an electric piano with ninth
  chords, a vibraphone and a flute darting in short flurries. Melody manner: the tune is fish: four
  quick notes, a turn, a gap, then somewhere else.

  Checklist: it is good and memorable because the drums are the lead instrument and are never the same
  for long. The hook is the breakbeat itself and the tune's four-note dart; the emotion is speed
  without hurry, rolling and warm; the lift is each drop after its build, and the percussion joining
  the break; the contrast is the percussion's stretch alone, the half-time stretch, and the breakdown
  for piano; the sounds are a saw reese, a sub bass, a warm pad, an electric piano, a vibraphone, a
  flute, and congas, a timbale, a woodblock, a shaker and a cowbell beside the kit.

  Run it with: llamatron examples/by_genre/electronic/percussion_fish.yml

  Scene 1, pad and piano, 16 bars.
  Scene 2, the break, 16 bars.
  Scene 3, drop, 32 bars.
  Scene 4, drop, with the school, 32 bars.
  Scene 5, breakdown, 16 bars.
  Scene 6, build, 8 bars.
  Scene 7, second drop, 32 bars.
  Scene 8, the school alone, 16 bars.
  Scene 9, half time, 16 bars.
  Scene 10, drop again, 16 bars.
  Scene 11, percussion and pad, 16 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original: it follows a genre and no one work.
