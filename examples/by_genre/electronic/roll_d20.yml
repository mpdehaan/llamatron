version: 1.0.365
title: Roll d20
description: "dungeon synth, an original: one theme carried through a tavern, a road, a crypt and a dragon, on the sounds of an old keyboard pretending to be a medieval band"
notes: |
  Roll d20: dungeon synth, an original: one theme carried through a tavern, a road, a crypt and a
  dragon, on the sounds of an old keyboard pretending to be a medieval band. Version 1.

  An original piece, not a homage to any one work. A prologue for organ and bells; the theme on a
  recorder over a harp; the tavern, a dance for harpsichord and recorder; the road, the theme as a
  march for horn; the crypt, organ and choir; the dragon, a battle; the return, the theme with
  everything; an epilogue for the bell.

  Subgenre: dungeon synth, the home-recorded fantasy music that grew out of black metal's keyboard
  interludes in the nineties. Drums: none of a kit; timpani and a tambourine for the dance, timpani
  and a low drum for the march and the battle, a tolling bell. Tempo: slow, each chapter at its own,
  60 to 104. Bass: a held organ pedal or low strings. Sounds: the stock voices of an old keyboard used
  without embarrassment, a church organ, a choir, strings, a harpsichord, a recorder, a harp, a horn,
  bells. Melody manner: modal and plain, a theme of long notes that a child could play with one
  finger, repeated with a new costume in each chapter rather than developed.

  Checklist: it is good and memorable because it is one theme telling a story: the listener knows the
  tune by the second chapter and hears what happens to it. The hook is the theme's first two bars, a
  rising fifth and a slow fall; the emotion is solemn make-believe, candlelight and maps; the lift is
  the return, the theme with every voice and the dance's counter-tune under it; the contrast is the
  crypt, a different tune of long notes with a flat second over one held chord, and the dragon, the
  fastest and loudest; the sounds are a church organ, a choir, strings, a harpsichord, a recorder, a
  harp, a French horn, tubular bells and timpani.

  Run it with: llamatron examples/by_genre/electronic/roll_d20.yml

  Scene 1, prologue, 8 bars.
  Scene 2, the theme, 8 bars.
  Scene 3, the tavern, 16 bars.
  Scene 4, the road, 16 bars.
  Scene 5, the crypt, 16 bars.
  Scene 6, the dragon, 16 bars.
  Scene 7, the return, 16 bars.
  Scene 8, epilogue, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original: it follows a genre and no one work.
