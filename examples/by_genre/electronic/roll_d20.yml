progressions:
  theme: { chords: [1, 7, 6, 7, 1, 7, 5, 1] }
  dance: { chords: [1, 7, 1, 7, 1, 7, 5, 1] }
  crypt: { chords: [1] }
  dragon: { chords: [1, 2, 1, 4, 1, 6, 7, 1], accidentals: [~, b, ~, ~, ~, ~, ~, ~] }

swells:
  fade: { start: 100, end: 40 }
  grow: { start: 50, end: 110 }

chains:
  theme:
    - progression: theme
  dance:
    - progression: dance
  crypt:
    - progression: crypt
  dragon:
    - progression: dragon
  fade:
    - progression: theme
    - swell: fade
  grow:
    - progression: crypt
    - swell: grow

instruments:
  church organ: { device: "*FluidSynth", gm_sound: 20 }
  choir: { device: "*FluidSynth", gm_sound: 53 }
  strings: { device: "*FluidSynth", gm_sound: 49 }
  harpsichord: { device: "*FluidSynth", gm_sound: 7 }
  recorder: { device: "*FluidSynth", gm_sound: 75 }
  harp: { device: "*FluidSynth", gm_sound: 47 }
  french horn: { device: "*FluidSynth", gm_sound: 61 }
  tubular bells: { device: "*FluidSynth", gm_sound: 15 }
  drum kit: { device: "*FluidSynth" }

songs:
  roll_d20:
    tempo: 72
    scale: D Minor
    genre: Electronic

    tracks:
      timpani: { drum: true, instrument: drum kit }
      tamb: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      toms: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      organ: { instrument: church organ }
      choir: { instrument: choir }
      strings: { instrument: strings }
      harpsichord: { instrument: harpsichord }
      recorder: { instrument: recorder }
      harp: { instrument: harp }
      horn: { instrument: french horn }
      bells: { instrument: tubular bells }

    scenes:
      - name: prologue
        tracks:
          organ: { pattern: fifths, chains: [grow], repeat: 8 }
          bells: { pattern: theme bells, loop: true }
      - name: the theme
        tracks:
          recorder: { pattern: theme, repeat: 1 }
          harp: { pattern: harp, chains: [theme], loop: true }
          strings: { pattern: pedal, chains: [theme], loop: true }
      - name: the tavern
        tempo: 100
        tracks:
          harpsichord: { pattern: dance low, repeat: 2 }
          recorder: { pattern: dance, loop: true }
          harp: { pattern: pluck chords, chains: [dance], loop: true }
          timpani: { pattern: timpani dance, loop: true }
          tamb: { pattern: tamb, loop: true }
          strings: { pattern: pedal, chains: [dance], loop: true }
      - name: the road
        tempo: 84
        tracks:
          horn: { pattern: theme low, repeat: 2 }
          strings: { pattern: chord, chains: [theme], loop: true }
          organ: { pattern: pedal, chains: [theme], loop: true }
          harpsichord: { pattern: counter, loop: true }
          timpani: { pattern: march low, loop: true }
          snare: { pattern: march snare, loop: true }
      - name: the crypt
        tempo: 60
        tracks:
          organ: { pattern: crypt, repeat: 2 }
          choir: { pattern: crypt choir, loop: true }
          strings: { pattern: pedal, chains: [crypt], loop: true }
          bells: { pattern: toll, loop: true }
      - name: the dragon
        tempo: 104
        tracks:
          horn: { pattern: dragon, repeat: 2 }
          strings: { pattern: dragon high, loop: true }
          organ: { pattern: stabs, chains: [dragon], loop: true }
          choir: { pattern: fifths, chains: [dragon], loop: true }
          timpani: { pattern: battle, loop: true }
          toms: { pattern: battle high, loop: true }
          crash: { pattern: battle crash, loop: true }
      - name: the return
        tempo: 76
        tracks:
          horn: { pattern: theme low, repeat: 2 }
          recorder: { pattern: theme high, loop: true }
          choir: { pattern: theme, loop: true }
          harpsichord: { pattern: dance low, loop: true }
          harp: { pattern: harp, chains: [theme], loop: true }
          strings: { pattern: chord, chains: [theme], loop: true }
          organ: { pattern: pedal, chains: [theme], loop: true }
          timpani: { pattern: march low, loop: true }
          bells: { pattern: toll, loop: true }
      - name: epilogue
        tempo: 60
        tracks:
          organ: { pattern: fifths, chains: [fade], repeat: 4 }
          bells: { pattern: last bells, loop: true }
