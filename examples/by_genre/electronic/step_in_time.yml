version: 1.0.365
title: Step in time
description: "modern dubstep, an original: a sad little tune, a snare roll, a dive, and then four bass voices arguing in half-time"
notes: |
  Step in time: modern dubstep, an original: a sad little tune, a snare roll, a dive, and then four
  bass voices arguing in half-time. Version 1.

  An original piece, not a homage to any one work. An introduction with the tune; a build; a drop of
  two four-bar phrases in which four voices trade beats; a switch to a riddim, one growl on one
  pattern; a break; a second build and drop with a reese; a last drop in double time under the tune;
  an ending that dives.

  Subgenre: modern dubstep, the loud festival kind of the twenty-tens and after. Drums: half-time at
  140, a kick on one with pushes, one enormous snare with a clap on the third beat, hats in sixteenths
  with flurries, tom-toms falling into each fourth bar; the build is a snare roll that doubles every
  two bars and then stops dead for half a bar; the last drop goes to double time, a snare on two and
  four. Bass: a sub on the root under everything in the drops, cut off at the snare so that the snare
  lands in a hole. Sounds: a growl, a wobble whose speed changes by the beat, a screech and a laser
  that dives, each speaking for one beat and handing over, with a distorted double of the growl and,
  in the second drop, a reese an octave up; outside the drops, a pad, a plucked arpeggio, a piano and
  a voice-like lead with the tune. Melody manner: the tune is sad and simple over i VI III VII; the
  drops have no tune at all, only the flat second, the root and rhythm, a conversation of bass sounds.

  Checklist: it is good and memorable because of the distance between its two halves, the fragile tune
  and the drop that flattens it, and because in the drop no sound lasts longer than a beat, so the ear
  never settles. The hook is the tune, heard first, and the drop's first bar, a growl, a wobble, a
  screech and a stutter; the emotion is melancholy turning to gleeful violence; the lift is each drop
  after its silence, the second with the reese, and the last in double time with the tune over it; the
  contrast is the break, the tune on a piano; the sounds are a synth bass sub, two growls, a wobble, a
  screech, a laser, a saw reese, a pad, a pluck, a piano and a synth voice.

  Run it with: llamatron examples/by_genre/electronic/step_in_time.yml

  Scene 1, tune, 8 bars.
  Scene 2, tune, with a pulse, 8 bars.
  Scene 3, build, 8 bars.
  Scene 4, drop, 8 bars.
  Scene 5, drop, answered, 8 bars.
  Scene 6, riddim, 8 bars.
  Scene 7, break, 8 bars.
  Scene 8, break, with a pulse, 8 bars.
  Scene 9, build 2, 8 bars.
  Scene 10, drop 2, 8 bars.
  Scene 11, drop 2, answered, 8 bars.
  Scene 12, double time, 8 bars.
  Scene 13, ending, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original: it follows a genre and no one work.
real_time: true
