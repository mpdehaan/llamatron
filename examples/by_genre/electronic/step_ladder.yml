version: 1.0.365
title: Step ladder
description: "classic dubstep, an original: a sub bass with room around it, a snare on three, a dub chord with its echoes, and a bass line that climbs a step at a time"
notes: |
  Step ladder: classic dubstep, an original: a sub bass with room around it, a snare on three, a dub
  chord with its echoes, and a bass line that climbs a step at a time. Version 1.

  An original piece, not a homage to any one work. An introduction of hats, the chord and its echoes;
  the sub and the half-step; the wobble; a bridge without drums; the ladder; a breakdown; the wobble
  again with congas; a switch to a two-step kick; and an ending that removes the wobble, then the
  drums, then the sub.

  Subgenre: dubstep as it was in South London about 2005 and 2006, dark, slow-feeling and mostly
  space. Drums: half-step at 140, a kick on one and a quiet one before three, a snare or rimshot on
  the third beat only, hats that skip rather than run, a conga now and then; later a switch to a two-
  step kick. Bass: a sub, long notes with holes, felt more than heard; over it in places a wobble, the
  same note re-struck at a rate that changes. Sounds: a minor chord stabbed off the beat and repeated
  quieter and quieter, as a dub echo; a breathy flute with three or four notes; a pad; an electric
  piano in the breakdown. Melody manner: almost none, fragments with a flat second, a phrase of three
  notes and then eight bars without it.

  Checklist: it is good and memorable because of what is left out: the snare on three with nothing
  near it, the bass arriving after a gap. The hook is the sub's two-bar line with the chord's echoes
  falling into its holes; the emotion is unease, a night bus, meditative and heavy; the lift is the
  ladder, the bass line moved up a step every two bars for eight bars, and the wobble joining; the
  contrast is the breakdown, an electric piano with the pad; the sounds are a sub bass, a wobble bass,
  an organ-like stab and its two echoes, a pan flute, a pad, an electric piano and a siren-like lead.

  Run it with: llamatron examples/by_genre/electronic/step_ladder.yml

  Scene 1, hats and a chord, 8 bars.
  Scene 2, rimshot, 8 bars.
  Scene 3, the sub, 16 bars.
  Scene 4, wobble, 16 bars.
  Scene 5, bridge, 8 bars.
  Scene 6, the ladder, 16 bars.
  Scene 7, the ladder, with the flute, 16 bars.
  Scene 8, breakdown, 16 bars.
  Scene 9, wobble and congas, 16 bars.
  Scene 10, everything, 16 bars.
  Scene 11, two-step, 16 bars.
  Scene 12, without the wobble, 8 bars.
  Scene 13, without the drums, 8 bars.
  Scene 14, the chord alone, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original: it follows a genre and no one work.
real_time: true
protected: true

