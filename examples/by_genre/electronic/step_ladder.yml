          wobble: { pattern: wobble, loop: true }
          conga: { pattern: conga, loop: true }
          conga low: { pattern: conga low, loop: true }
          crash: { pattern: crash, loop: true }
      - name: everything
        tracks:
          kick: { pattern: kick, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          sub: { pattern: sub b, chains: [root], loop: true }
          stab: { pattern: stab, chains: [root], loop: true }
          echo: { pattern: echo, chains: [root], loop: true }
          far echo: { pattern: far echo, chains: [root], loop: true }
          wobble: { pattern: wobble, loop: true }
          conga: { pattern: conga, loop: true }
          conga low: { pattern: conga low, loop: true }
          flute: { pattern: flute, loop: true }
          keys: { pattern: keys high, loop: true }
          open: { pattern: open, loop: true }
          crash: { pattern: crash, loop: true }
      - name: two-step
        tracks:
          kick: { pattern: kick two, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          rim: { pattern: rim, loop: true }
          sub: { pattern: sub, chains: [ladder], loop: true }
          stab: { pattern: stab, chains: [ladder], loop: true }
          echo: { pattern: echo, chains: [ladder], loop: true }
          far echo: { pattern: far echo, chains: [ladder], loop: true }
          wobble: { pattern: wobble, chains: [ladder], loop: true }
          conga: { pattern: conga, loop: true }
          crash: { pattern: crash, loop: true }
      - name: without the wobble
        tracks:
          kick: { pattern: kick, repeat: 4 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          sub: { pattern: sub, chains: [root], loop: true }
          stab: { pattern: stab, chains: [root], loop: true }
          echo: { pattern: echo, chains: [root], loop: true }
          far echo: { pattern: far echo, chains: [root], loop: true }
          flute: { pattern: flute, loop: true }
          crash: { pattern: crash, loop: true }
      - name: without the drums
        tracks:
          sub: { pattern: sub, chains: [fade], repeat: 4 }
          stab: { pattern: stab, loop: true }
          echo: { pattern: echo, loop: true }
          far echo: { pattern: far echo, loop: true }
          pad: { pattern: pad, loop: true }
          hat: { pattern: hat, chains: [thin], loop: true }
      - name: the chord alone
        tracks:
