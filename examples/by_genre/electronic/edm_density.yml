version: 1.0.206
title: EDM density
description: an EDM track built and broken down by Density alone
notes: |
  EDM density: a club track at 128 beats a minute in F minor, whose every intro, build,
  breakdown and drop comes from Density thinning the same seven patterns, each written once at
  the busiest it will ever play.
  Run it with: llamatron examples/by_genre/electronic/edm_density.yml --to ableton --replace

  Density keeps a share of a clip's notes, the strongest places in the bar first: the bar's
  start, then its middle, the other beats, the eighths and last the sixteenths. At 100% every
  note plays, at 50% the sixteenths between the eighths drop out, at 25% only the beats are
  left. A scene's Density, on the Scene page, ramps every clip of the scene from its start to its
  end; a Density generator in a clip's chain wins over it for that clip. This set makes four,
  sparse, half, rise and fall, each with a one-step chain of the same name.

  Scene 1, intro, 16 bars: the scene's Density from 25% to 100%, the drums and bass filling in.
  Scene 2, build, 8 bars: from 15% to 100%, everything climbing to the snare roll.
  Scene 3, drop, 16 bars: no Density at all, every part as written.
  Scene 4, breakdown, 8 bars: no drums; the pad and the lead running sparse (25%).
  Scene 5, half time, 8 bars: the drums running half (12%), which keeps only the first and third
  beats of each bar, under the full bass and lead.
  Scene 6, second build, 8 bars: from 15% to 100% again, but over four bars, so it fills in
  twice as fast and holds full for the last four.
  Scene 7, second drop, 16 bars: the arp running rise (0% to 100%) and the lead running fall
  (100% to 0%), so they trade places across the drop.
  Scene 8, outro, 16 bars: from 100% down to 25%.

  When changing this demo:
  - Keep every pattern written at full density, so that what thins it is always Density.
  - Keep the same seven patterns in every scene: only the densities change.
  - Keep the scenes' lengths: 96 bars at 128 beats a minute is three minutes.
real_time: true
protected: true

