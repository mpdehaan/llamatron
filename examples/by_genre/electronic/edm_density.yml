densities:
  sparse: { start: 25, end: 25 }
  half: { start: 12, end: 12 }
  rise: { start: 0, end: 100 }
  fall: { start: 100, end: 0 }

chains:
  sparse:
    - density: sparse
  half:
    - density: half
  rise:
    - density: rise
  fall:
    - density: fall

instruments:
  synth bass: { device: "*FluidSynth", gm_sound: 39 }
  sawtooth lead: { device: "*FluidSynth", gm_sound: 82 }
  warm pad: { device: "*FluidSynth", gm_sound: 90 }
  square lead: { device: "*FluidSynth", gm_sound: 81 }
  drum kit: { device: "*FluidSynth" }

songs:
  edm_density:
    tempo: 128
    scale: F Minor
    genre: Electronic

    tracks:
      kick: { drum: true, instrument: drum kit }
      hats: { drum: true, instrument: drum kit }
      clap: { drum: true, instrument: drum kit }
      bass: { instrument: synth bass }
      lead: { instrument: sawtooth lead }
      pad: { instrument: warm pad }
      arp: { instrument: square lead }

    scenes:
      - name: intro
        density_start: 25
        density_end: 100
        tracks:
          kick: { pattern: kick, repeat: 16 }
          hats: { pattern: hats, loop: true }
          bass: { pattern: bass, loop: true }
          pad: { pattern: pad, loop: true }
      - name: build
        density_start: 15
        density_end: 100
        tracks:
          kick: { pattern: kick, repeat: 8 }
          hats: { pattern: hats, loop: true }
          clap: { pattern: roll, loop: true }
          bass: { pattern: bass, loop: true }
          lead: { pattern: lead, loop: true }
          pad: { pattern: pad, loop: true }
          arp: { pattern: arp, loop: true }
      - name: drop
        tracks:
          kick: { pattern: kick, repeat: 16 }
          hats: { pattern: hats, loop: true }
          clap: { pattern: clap, loop: true }
          bass: { pattern: bass, loop: true }
          lead: { pattern: lead, loop: true }
          pad: { pattern: pad, loop: true }
      - name: breakdown
        tracks:
          lead: { pattern: lead, chains: [sparse], loop: true }
          pad: { pattern: pad, chains: [sparse], repeat: 2 }
      - name: half time
        tracks:
          kick: { pattern: kick, chains: [half], repeat: 8 }
          hats: { pattern: hats, chains: [half], loop: true }
          clap: { pattern: clap, chains: [half], loop: true }
          bass: { pattern: bass, loop: true }
          lead: { pattern: lead, loop: true }
      - name: second build
        density_start: 15
        density_end: 100
        density_over: 4
        tracks:
          kick: { pattern: kick, repeat: 8 }
          hats: { pattern: hats, loop: true }
          clap: { pattern: roll, loop: true }
          bass: { pattern: bass, loop: true }
          lead: { pattern: lead, loop: true }
          arp: { pattern: arp, loop: true }
      - name: second drop
        tracks:
          kick: { pattern: kick, repeat: 16 }
          hats: { pattern: hats, loop: true }
          clap: { pattern: clap, loop: true }
          bass: { pattern: bass, loop: true }
          lead: { pattern: lead, chains: [fall], loop: true }
          pad: { pattern: pad, loop: true }
          arp: { pattern: arp, chains: [rise], loop: true }
      - name: outro
        density_start: 100
        density_end: 25
        tracks:
          kick: { pattern: kick, repeat: 16 }
          hats: { pattern: hats, loop: true }
          bass: { pattern: bass, loop: true }
          pad: { pattern: pad, loop: true }
          arp: { pattern: arp, loop: true }
