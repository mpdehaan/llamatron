    drum: true
    step_size: 1/16
    degree: [F, F, F, F, F, F, F, F, F, F, F, F, F, F, F, F]
    accidental: ["#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#", "#"]
    octave: [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3]
    velocity: [100, 55, 80, 55, 100, 55, 80, 55, 100, 55, 80, 55, 100, 55, 80, 55]
  clap:
