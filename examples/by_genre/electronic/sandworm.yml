  synth bass: { device: "*FluidSynth", gm_sound: 39 }
  halo pad: { device: "*FluidSynth", gm_sound: 95 }
  drum kit: { device: "*FluidSynth" }

songs:
  sandworm:
    tempo: 136
    scale: B Minor
    genre: Electronic

    tracks:
      kick: { drum: true, instrument: drum kit }
      clap: { drum: true, instrument: drum kit }
      open: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      bass: { instrument: synth bass }
      lead: { instrument: saw lead }
      lead high: { transpose: 7, instrument: saw lead }
      pad: { instrument: halo pad }

    scenes:
      - name: intro
        tracks:
          kick: { pattern: kit_kick, repeat: 16 }
          hat: { pattern: kit_hat, loop: true }
      - name: build
        density_start: 25
        density_end: 100
        tracks:
          kick: { pattern: kit_kick, repeat: 8 }
          clap: { pattern: kit_clap, loop: true }
          open: { pattern: kit_open, loop: true }
          hat: { pattern: kit_hat, loop: true }
          bass: { pattern: bass, chains: [turn], loop: true }
      - name: drop
