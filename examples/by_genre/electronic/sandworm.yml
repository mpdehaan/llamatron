version: 1.0.227
title: Sandworm
description: "a late nineties trance anthem in the manner of Sandstorm (Darude), its builds made by Density"
notes: |
  Sandworm: a trance anthem at 136 beats a minute in B minor, in the manner of the late nineties: a
  saw lead hammering a stuttering sixteenth-note rhythm, an off-beat bass, a pad for the
  breakdown and a four-on-the-floor kick. The rhythm is its own.

  The lead and the bass are one bar each over chord i, moved by Progression through i VI VII i.
  The two builds are made by the scenes' Density, from 25% to 100%, which thins every clip to its
  strongest beats and fills it back in, and in the last drop a second lead track, transposed up
  seven scale steps, doubles the first an octave up.

  Run it with: llamatron examples/by_genre/electronic/sandworm.yml

  Scene 1, intro, 16 bars: the kick and the hats.
  Scene 2, build, 8 bars: the bass and the full kit, Density rising from 25% to 100%.
  Scene 3, drop, 16 bars: the lead.
  Scene 4, breakdown, 16 bars: the pad and the bass, no drums.
  Scene 5, build 2, 8 bars: the lead returns, Density rising again.
  Scene 6, drop 2, 16 bars: the lead and the full kit.
  Scene 7, last drop, 16 bars: the lead doubled an octave up.
  Scene 8, outro, 8 bars: the kick and the hats.

  When changing this demo:
  - Keep the builds made by the scenes' Density.
  - Keep the lead and the bass one bar long over chord i.
real_time: true
protected: true

