version: 1.0.591
title: Sandworm
description: "a late nineties trance anthem in the manner of Sandstorm (Darude), its builds made by Density"
notes: |
  Sandworm: a late nineties trance anthem in the manner of Sandstorm (Darude), its builds made by
  Density. This is a homage to Sandstorm (Darude): its chords, form, sounds and drums follow that work
  as Claude knows it, and every tune and rhythm here is new. Rebuild version 4.

  A saw lead hammers one note in sixteenths, the riff moved through i, iv, III and VII by a
  Progression; a kick on every beat and a bass galloping on the offbeats; a snare roll and the riff
  thickened by Density before each drop; a long breakdown on the pad.

  Subgenre: trance of the late nineties, the hard, fast kind. Drums: a heavy kick on every beat, the
  whole track rides on it; a clap on two and four; an open hat on every offbeat; closed hats in
  sixteenths; a snare roll that grows into each drop. Tempo 136, straight. Bass: short notes on the
  offbeats, galloping into the next kick. Builds: a long breakdown with no kick, then the roll, then
  the drop with a crash. Sounds: a gritty saw lead doubled for thickness, a sweep pad. Melody manner:
  one note hammered in sixteenths with gaps, the same riff moved to another pitch every few bars; no
  sung tune. Form: beat, riff, build, drop, breakdown, build, drop.

  Band and song: the piece is known for its machine-gun lead riff on one note, its relentless kick,
  and its simple climbs from one pitch level to the next.

  Checklist: the hook is the hammered riff; the emotion is relentless energy; the lift is each drop,
  where the kick, the bass, the crash and both leads return at once after silence under them; the
  contrast is the breakdown, the riff alone and quiet over a pad; the sounds are two saw leads an
  octave apart, a synth bass and a sweep pad; the riff sits mid register and its double an octave
  above.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and the bass lean on the offbeats between the kicks, as dance music does, and the chords and
  tunes on the first beat of the bar; a note pushed ahead of the beat and held over it is accented.
  The kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/electronic/sandworm.yml

  Scene 1, beat, 4 bars.
  Scene 2, riff, 8 bars.
  Scene 3, build, 8 bars.
  Scene 4, drop, 16 bars.
  Scene 5, breakdown, 16 bars.
  Scene 6, build 2, 8 bars.
  Scene 7, drop 2, 16 bars.
  Scene 8, kick and bass, 8 bars.
  Scene 9, last drop, 16 bars.
  Scene 10, outro, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

