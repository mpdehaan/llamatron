generators:
  - { name: loop, kind: chords, mode: progression, chords: [1, 1, 1, 1, 4, 4, 3, 7] }
  - { name: rise, kind: shapes, density_start: 0, density_end: 100 }
  - { name: loop chords, kind: chain, generators: [{ name: loop }] }
  - { name: rise density, kind: chain, generators: [{ name: rise }] }
  - { name: riff rise, kind: chain, generators: [{ name: loop }, { name: rise }] }

instruments:
  - { name: synth bass, device: "*FluidSynth", gm_sound: 39 }
  - { name: saw lead, device: "*FluidSynth", gm_sound: 82 }
  - { name: sweep pad, device: "*FluidSynth", gm_sound: 96 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: sandworm
    tempo: 136
    scale: G Minor
    genre: Electronic

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: clap, drum: true, instrument: drum kit }
      - { name: open, drum: true, instrument: drum kit }
      - { name: hat, drum: true, instrument: drum kit }
      - { name: crash, drum: true, instrument: drum kit }
      - { name: roll, drum: true, instrument: drum kit }
      - { name: bass, instrument: synth bass }
      - { name: lead, instrument: saw lead }
      - { name: lead high, instrument: saw lead }
      - { name: pad, instrument: sweep pad }

    scenes:
      - name: beat
        clips:
          - { track: kick, pattern: kick, repeat: 4 }
          - { track: hat, pattern: hat, loop: true }
          - { track: open, pattern: open, loop: true }
      - name: riff
        clips:
          - { track: kick, pattern: kick, repeat: 8 }
          - { track: clap, pattern: clap, loop: true }
          - { track: open, pattern: open, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: loop chords }], loop: true }
          - { track: lead, pattern: riff quiet, generators: [{ name: loop chords }], loop: true }
      - name: build
        clips:
          - { track: lead, pattern: riff, generators: [{ name: riff rise }], repeat: 8 }
          - { track: roll, pattern: roll, generators: [{ name: rise density }], loop: true }
          - { track: pad, pattern: held, generators: [{ name: loop chords }], loop: true }
      - name: drop
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: clap, pattern: clap, loop: true }
          - { track: open, pattern: open, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: loop chords }], loop: true }
          - { track: lead, pattern: riff, generators: [{ name: loop chords }], loop: true }
          - { track: lead high, pattern: riff high, generators: [{ name: loop chords }], loop: true }
          - { track: crash, pattern: crash, loop: true }
      - name: breakdown
        clips:
          - { track: pad, pattern: held, generators: [{ name: loop chords }], repeat: 16 }
          - { track: lead, pattern: riff quiet, generators: [{ name: loop chords }], loop: true }
      - name: build 2
        clips:
          - { track: lead, pattern: riff, generators: [{ name: riff rise }], repeat: 8 }
          - { track: lead high, pattern: riff high, generators: [{ name: riff rise }], loop: true }
          - { track: roll, pattern: roll, generators: [{ name: rise density }], loop: true }
          - { track: pad, pattern: held, generators: [{ name: loop chords }], loop: true }
      - name: drop 2
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: clap, pattern: clap, loop: true }
          - { track: open, pattern: open, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: loop chords }], loop: true }
          - { track: lead, pattern: riff, generators: [{ name: loop chords }], loop: true }
          - { track: lead high, pattern: riff high, generators: [{ name: loop chords }], loop: true }
          - { track: pad, pattern: held, generators: [{ name: loop chords }], loop: true }
          - { track: crash, pattern: crash, loop: true }
      - name: kick and bass
        clips:
          - { track: kick, pattern: kick, repeat: 8 }
          - { track: clap, pattern: clap, loop: true }
          - { track: open, pattern: open, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: loop chords }], loop: true }
      - name: last drop
        clips:
          - { track: kick, pattern: kick, repeat: 16 }
          - { track: clap, pattern: clap, loop: true }
          - { track: open, pattern: open, loop: true }
          - { track: hat, pattern: hat, loop: true }
          - { track: bass, pattern: bass, generators: [{ name: loop chords }], loop: true }
          - { track: lead, pattern: riff, generators: [{ name: loop chords }], loop: true }
          - { track: lead high, pattern: riff high, generators: [{ name: loop chords }], loop: true }
          - { track: pad, pattern: held, generators: [{ name: loop chords }], loop: true }
          - { track: crash, pattern: crash, loop: true }
      - name: outro
