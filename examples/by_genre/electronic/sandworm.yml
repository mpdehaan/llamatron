          clap: { pattern: kit_clap, loop: true }
          open: { pattern: kit_open, loop: true }
          hat: { pattern: kit_hat, loop: true }
          bass: { pattern: bass, chains: [turn], loop: true }
          lead: { pattern: stab, chains: [turn], loop: true }
      - name: breakdown
        tracks:
          bass: { pattern: bass, chains: [turn], repeat: 16 }
          pad: { pattern: pad, chains: [turn], loop: true }
      - name: build 2
        density_start: 25
        density_end: 100
        tracks:
