songs:
  retro_industries:
    tempo: 112
    scale: B Mixolydian
    genre: Electronic

    tracks:
      pulse: { instrument: synth bass }
      sequencer: { instrument: music box }
      sequencer 2: { instrument: square lead }
      bells: { instrument: glockenspiel }
      reed: { instrument: calliope }
      reed 2: { instrument: ocarina }
      pad: { instrument: warm pad }
      pad 2: { instrument: sweep pad }
      piano: { instrument: piano }

    scenes:
      - name: switched on
        tracks:
          pulse: { pattern: pulse, repeat: 2 }
      - name: industries
        tracks:
          pulse: { pattern: pulse, chains: [works], repeat: 16 }
          sequencer: { pattern: arp, chains: [works worn], loop: true }
          sequencer 2: { pattern: arp high, chains: [works worn], loop: true }
          bells: { pattern: counter, chains: [works], loop: true }
      - name: "industries, with the tune"
        tracks:
          pulse: { pattern: pulse, chains: [works], repeat: 16 }
          sequencer: { pattern: arp, chains: [works worn], loop: true }
          sequencer 2: { pattern: arp high, chains: [works worn], loop: true }
          bells: { pattern: counter, chains: [works], loop: true }
          reed: { pattern: tune, loop: true }
          reed 2: { pattern: tune low, loop: true }
      - name: running down
        tempo: 100
        tracks:
          pulse: { pattern: pulse, chains: [works], repeat: 8 }
          sequencer: { pattern: arp, chains: [works down], loop: true }
          sequencer 2: { pattern: arp high, chains: [works down], loop: true }
          bells: { pattern: counter, chains: [works], loop: true }
          reed: { pattern: tune, loop: true }
          reed 2: { pattern: tune low, loop: true }
          pad: { pattern: drone, chains: [works arrive], loop: true }
      - name: nearly stopped
        tempo: 88
        tracks:
          pulse: { pattern: pulse, chains: [works], repeat: 8 }
          sequencer: { pattern: arp, chains: [works gone], loop: true }
          sequencer 2: { pattern: arp high, chains: [works gone], loop: true }
          reed: { pattern: tune, loop: true }
          reed 2: { pattern: tune low, loop: true }
          pad: { pattern: drone, chains: [works wobble], loop: true }
          pad 2: { pattern: drone low, chains: [works arrive], loop: true }
      - name: lullaby
        tempo: 76
        tracks:
          reed: { pattern: lullaby, repeat: 1 }
          pad: { pattern: drone, chains: [drones wobble], loop: true }
          pad 2: { pattern: drone low, chains: [drones], loop: true }
      - name: "lullaby, two voices"
        tempo: 76
        tracks:
          reed: { pattern: lullaby, repeat: 1 }
          reed 2: { pattern: lullaby low, loop: true }
          bells: { pattern: under, loop: true }
          pad: { pattern: drone, chains: [drones wobble], loop: true }
          pad 2: { pattern: drone low, chains: [drones], loop: true }
      - name: piano
        tempo: 72
        tracks:
          piano: { pattern: piano, repeat: 1 }
          sequencer: { pattern: piano low, loop: true }
