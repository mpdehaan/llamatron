version: 1.0.365
title: Retro industries
description: "a bright sequenced jingle that runs down and melts into a lullaby over drones, in the manner of Kaini Industries and Olson (Boards of Canada), with tunes of its own"
notes: |
  Retro industries: a bright sequenced jingle that runs down and melts into a lullaby over drones, in
  the manner of Kaini Industries and Olson (Boards of Canada), with tunes of its own. This is a homage
  to Kaini Industries and Olson (Boards of Canada): its chords, form, sounds and drums follow that
  work as Claude knows it, and every tune and rhythm here is new. Rebuild version 1.

  A low pulse; the sequencer's arpeggio on I, VII and IV; the tune over it; two stretches that slow as
  a Density thins the arpeggio and the pads rise; the lullaby over drones on I and IV; the lullaby
  with a second voice; a piano alone.

  Subgenre: the short beatless interludes of late nineties Scottish electronic music made to sound
  like the soundtrack of a worn educational film from the seventies. Drums: none at all. Tempo: 112
  for the jingle, stepping down to 76 for the lullaby. Bass: a low pulse from the sequencer in the
  first half, a held drone in the second. Sounds: old analog synthesizers recorded to tape and back
  until the pitch wavers: here every voice is played by two slightly different sounds at once, so that
  they beat against each other as detuned oscillators do, a Density drops a note now and then as a
  worn tape does, and a Swell that rises and falls every two bars breathes the pads as a slow wobble.
  Melody manner: the first half is a machine's jingle, an arpeggio in strict sixteenths with a plain
  tune of long notes over it, in a mode with a flat seventh, cheerful and slightly wrong; the second
  half is a lullaby, a few long notes over two drone chords with sevenths in them, ending on a piano
  alone.

  Band and song: the pair are known for melodies that sound like half-remembered childhood, for
  synthesizers detuned and aged on tape, and for album interludes of a minute or so that say one thing
  and stop. The first piece is a bright, mechanical company jingle; the second is a warm tune over
  drones with a piano at the end.

  Checklist: it is good and memorable because the same four notes that the machine plays briskly come
  back slow, as the lullaby's first phrase, so the second half feels remembered. The hook is the
  arpeggio, and the tune's first four notes; the emotion is nostalgia, cheerful and then tender, with
  something a little off; the lift is the tune arriving over the arpeggio; the contrast is the running
  down, each stretch slower with fewer of the sequencer's notes, into the lullaby; the sounds are a
  music box and a square lead for the sequencer, a calliope and an ocarina for the tune, two pads, a
  low pulse and a piano.

  Run it with: llamatron examples/by_genre/electronic/retro_industries.yml

  Scene 1, switched on, 2 bars.
  Scene 2, industries, 16 bars.
  Scene 3, industries, with the tune, 16 bars.
  Scene 4, running down, 8 bars.
  Scene 5, nearly stopped, 8 bars.
  Scene 6, lullaby, 8 bars.
  Scene 7, lullaby, two voices, 8 bars.
  Scene 8, piano, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

