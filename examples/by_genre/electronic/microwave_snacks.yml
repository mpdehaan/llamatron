version: 1.0.365
title: Microwave snacks
description: "an early-seventies Moog novelty tune in the manner of Popcorn (Hot Butter), with a tune of its own"
notes: |
  Microwave snacks: an early-seventies Moog novelty tune in the manner of Popcorn (Hot Butter), with a
  tune of its own. This is a homage to Popcorn (Hot Butter): its chords, form, sounds and drums follow
  that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 4.

  A popping lead of short notes that bounces through each chord, a bass on root and fifth, a second
  part in the relative major with held strings, and a last time a step higher. Plain and dry, as the
  early synthesizer records were.

  Subgenre: early synthesizer pop of the early seventies, an instrumental novelty. Drums: a plain kick
  and snare with light hats, dry. Tempo 130, straight. Bass: root and fifth. Builds: none. Sounds: one
  popping synth voice of very short notes, strings later. Melody manner: staccato eighths that bounce
  through each chord. Form: A, B in the relative major, A.

  Band and song: the piece is known for the popping sound of its lead and for a tune simple enough to
  whistle.

  Checklist: it is good and memorable because of one sound, the pop of each note, on a tune that
  bounces. The hook is the popping lead; the emotion is playful; the lift is the last time a step
  higher with strings; the contrast is the lead alone with a woodblock; the sounds are a square lead,
  a kalimba below it and synth strings.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/electronic/microwave_snacks.yml

  Scene 1, intro, 4 bars.
  Scene 2, A, 16 bars.
  Scene 3, B, 8 bars.
  Scene 4, A 2, 8 bars.
  Scene 5, alone, 8 bars.
  Scene 6, A 3, 8 bars.
  Scene 7, B 2, 8 bars.
  Scene 8, A 4, 16 bars.
  Scene 9, a step higher, 16 bars.
  Scene 10, ending, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
