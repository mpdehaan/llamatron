version: 1.0.227
title: Microwave snacks
description: "an early-seventies Moog novelty tune in the manner of Popcorn (Hot Butter), with a tune of its own"
notes: |
  Microwave snacks: a synthesizer novelty tune at 130 beats a minute in A minor, in the manner of the
  early seventies: a staccato square lead whose tune bounces off a high repeated note, a synth bass
  on the eighths, a disco beat and claves blipping where a Euclidean rhythm says. The tune is its own.

  The lead plays every other sixteenth on its high note, the trick of the style, and the tune in
  between. The bass is one bar over chord i, moved by Progression: the A part goes i iv and the B
  part VI v. The claves' track keeps 5 of every 8 steps by its Euclidean mask.

  Run it with: llamatron examples/by_genre/electronic/microwave_snacks.yml

  Scene 1, intro, 8 bars: the bass and the drums.
  Scene 2, A, 16 bars: the bouncing tune.
  Scene 3, B, 8 bars: the second tune.
  Scene 4, A 2, 16 bars: the tune with the claves.
  Scene 5, alone, 8 bars: the lead alone.
  Scene 6, A 3, 16 bars: the tune again.
  Scene 7, B 2, 8 bars: the second tune again.
  Scene 8, last A, 16 bars: the tune to the end.

  When changing this demo:
  - Keep the high repeated note between the tune's notes.
  - Keep the tune original.
real_time: true
protected: true

