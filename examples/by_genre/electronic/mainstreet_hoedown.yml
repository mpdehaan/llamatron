version: 1.0.206
title: Main Street Hoedown
description: an original Baroque hoedown for a Moog in the manner of Baroque Hoedown (Perrey and Kingsley)
notes: |
  Main Street Hoedown: an original piece in the style of the 1960s Moog records that played Bach
  as a country hoedown, with a bouncing octave bass, sixteenth-note runs in broken chords, a
  tune doubled in thirds, a harpsichord rolling its chords, and claps on the backbeat.
  Run it with: llamatron examples/by_genre/electronic/mainstreet_hoedown.yml --to ableton --replace

  How it's made:
  - The lead's notes are short, a 1/32 gate on 1/16 steps, for the plucked bounce. A few steps
    glide, for the Moog's swoop, if the synth has portamento turned on.
  - Ornaments are ratchets: Ratchet 2 with a Ratchet Offset of 1 plays the note and the one
    above it in the time of one, a mordent.
  - harmony plays the lead's patterns with transpose: 2 on its track, a third above, in the
    scale, so the tune is doubled in thirds without writing it twice.
  - The two sequence scenes are a Baroque sequence: one bar's figure that comes round a step
    higher, or lower, each time. AX+= adds 1 on the last, empty step of the bar, and AX+Note
    moves every note by AX, the bass's too, so the chords climb with the tune. Each scene resets
    AX as it starts.
  - The harpsichord is one triad a bar through an arpeggiator, up over two octaves.
  - The theme comes back in G major, the dominant, by the scene's Scale, as Baroque pieces move
    to the dominant and home again.
  - The last scene slows from 130 to 100 across its two repeats, a ritardando.
  - A drift called breath moves every part's loudness very slightly, 6 softer to 6 louder and back,
    two bars at a time, so the repeats don't sound mechanical: every clip's chain names it.
real_time: true
protected: true

