version: 1.0.364
title: Mainstreet hoedown
description: "an original Baroque hoedown for a synthesizer in the manner of Baroque Hoedown (Perrey and Kingsley)"
notes: |
  Mainstreet hoedown: an original Baroque hoedown for a synthesizer in the manner of Baroque Hoedown (Perrey
  and Kingsley). This is a homage to Baroque Hoedown (Perrey and Kingsley): its chords, form, sounds
  and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 2.

  A hoedown first, cheerful and bouncing, played on old synthesizers: a boom-chick bass and
  harpsichord, a fiddle tune in sixteenths on a square lead, a baroque sequence round the circle of
  fifths, a lyrical middle in the dominant key and a last time a step higher. No club effects.

  Subgenre: synthesizer novelty music of the late sixties, a hoedown and a baroque piece at once; filed as
  electronic but old in manner. Drums: almost none, a light boom-chick and a woodblock; no club kick.
  Tempo 138, straight. Bass: root and fifth on the beats. Builds: none; baroque sequences and key
  changes instead. Sounds: a square synth lead, a calliope, a harpsichord. Melody manner: fiddle tunes
  in running sixteenths, sequences that step down. Form: tune, sequence, a middle in the dominant, the
  tune a step higher.

  Band and song: the duo is known for cheerful, comic electronic pop; the piece for its bubbling tune
  and its mix of country dance and baroque counterpoint.

  Checklist: it is good and memorable because it is fast, bright and funny, and the tune runs without
  a breath. The hook is the running tune; the emotion is delight; the lift is the key change up a
  step; the contrast is the lyrical middle; the sounds are a square lead, a calliope a third above, a
  harpsichord and a synth bass.

  Run it with: llamatron examples/by_genre/electronic/mainstreet_hoedown.yml

  Scene 1, intro, 4 bars.
  Scene 2, tune, 8 bars.
  Scene 3, tune in thirds, 8 bars.
  Scene 4, sequence, 8 bars.
  Scene 5, tune 2, 8 bars.
  Scene 6, middle, 16 bars.
  Scene 7, sequence in thirds, 8 bars.
  Scene 8, harpsichord alone, 8 bars.
  Scene 9, tune 3, 8 bars.
  Scene 10, a step higher, 16 bars.
  Scene 11, last sequence, 8 bars.
  Scene 12, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

