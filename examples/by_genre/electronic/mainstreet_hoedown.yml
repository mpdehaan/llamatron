arps:
  harpsichord: { step: 1/16, order: up, octave_range: 2 }

drifts:
  breath: { every: 2, steps_to_b: 6, direction: pendulum, a_velocity: -6, b_velocity: 6, restart: whole_song }

chains:
  breath:
    - drift: breath
  harpsichord:
    - drift: breath
    - arp: harpsichord

instruments:
  fiddle: { device: "*FluidSynth", gm_sound: 111 }
  banjo: { device: "*FluidSynth", gm_sound: 106 }
  harpsichord: { device: "*FluidSynth", gm_sound: 7 }
  acoustic bass: { device: "*FluidSynth", gm_sound: 33 }
  drum kit: { device: "*FluidSynth" }

songs:
  mainstreet_hoedown:
    tempo: 138
    scale: C Major
    genre: Electronic

    tracks:
      lead: { instrument: fiddle }
      harmony: { transpose: 2, instrument: banjo }
      harpsichord: { instrument: harpsichord }
      bass: { instrument: acoustic bass }
      clap: { drum: true, instrument: drum kit }
      tick: { drum: true, instrument: drum kit }

    scenes:
      - name: intro
        tracks:
          bass: { pattern: bounce, chains: [breath], repeat: 2 }
          tick: { pattern: tick, loop: true }
      - name: theme
        tracks:
          lead: { pattern: theme, chains: [breath], repeat: 2 }
          bass: { pattern: bounce, chains: [breath], repeat: 2 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: theme in thirds
        tracks:
          lead: { pattern: theme, chains: [breath], repeat: 2 }
          harmony: { pattern: theme, chains: [breath], repeat: 2 }
          bass: { pattern: bounce, chains: [breath], repeat: 2 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: sequence up
        reset: [AX]
        tracks:
          lead: { pattern: climb, chains: [breath], repeat: 8 }
          bass: { pattern: climb_bass, chains: [breath], repeat: 8 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: harpsichord
        tracks:
          harpsichord: { pattern: chords, chains: [harpsichord], repeat: 2 }
          bass: { pattern: bounce, chains: [breath], repeat: 2 }
          tick: { pattern: tick, loop: true }
      - name: theme in G
        scale: G Major
        tracks:
          lead: { pattern: theme, chains: [breath], repeat: 2 }
          harpsichord: { pattern: chords, chains: [harpsichord], repeat: 2 }
          bass: { pattern: bounce, chains: [breath], repeat: 2 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: episode
        tracks:
          lead: { pattern: episode, chains: [breath], repeat: 2 }
          harpsichord: { pattern: chords_minor, chains: [harpsichord], repeat: 2 }
          bass: { pattern: bounce_minor, chains: [breath], repeat: 2 }
          tick: { pattern: tick, loop: true }
      - name: theme with everyone
        tracks:
          lead: { pattern: theme, chains: [breath], repeat: 4 }
          harmony: { pattern: theme, chains: [breath], repeat: 4 }
          harpsichord: { pattern: chords, chains: [harpsichord], repeat: 4 }
          bass: { pattern: bounce, chains: [breath], repeat: 4 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: sequence down
        reset: [AX]
        tracks:
          lead: { pattern: fall, chains: [breath], repeat: 8 }
          harmony: { pattern: fall, chains: [breath], repeat: 8 }
          bass: { pattern: fall_bass, chains: [breath], repeat: 8 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: episode in thirds
        tracks:
          lead: { pattern: episode, chains: [breath], repeat: 2 }
          harmony: { pattern: episode, chains: [breath], repeat: 2 }
          harpsichord: { pattern: chords_minor, chains: [harpsichord], repeat: 2 }
          bass: { pattern: bounce_minor, chains: [breath], repeat: 2 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: last theme
        tracks:
          lead: { pattern: theme, chains: [breath], repeat: 2 }
          harmony: { pattern: theme, chains: [breath], repeat: 2 }
          harpsichord: { pattern: chords, chains: [harpsichord], repeat: 2 }
          bass: { pattern: bounce, chains: [breath], repeat: 2 }
          clap: { pattern: clap, loop: true }
          tick: { pattern: tick, loop: true }
      - name: slowing to the end
        repeat: 2
        tempo_start: 130
        tempo_end: 100
        tracks:
          lead: { pattern: ending, chains: [breath] }
          harmony: { pattern: ending, chains: [breath] }
          bass: { pattern: ending_bass, chains: [breath] }
