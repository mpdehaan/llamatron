version: 1.0.365
title: The mineral
description: "a late-nineties big beat track in the manner of Trip Like I Do (the Crystal Method), with riffs of its own"
notes: |
  The mineral: a late-nineties big beat track in the manner of Trip Like I Do (the Crystal Method),
  with riffs of its own. This is a homage to Trip Like I Do (the Crystal Method): its chords, form,
  sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 4.

  Subgenre: big beat of the late nineties. Drums: a loud funk breakbeat in plain four-four, the kick
  hard on one and again just after three, a heavy snare on two and four with ghost notes, sixteenth
  hats with open hats off the beat. Tempo about 126, straight. Bass: a distorted synth riff in
  sixteenths locked to the kick. Builds: a filter or snare build into a drop back on the break.
  Sounds: distorted bass, acid line, stabs, a short vocal sample repeated. Melody manner: short riffs
  repeated, no sung tune. Form: a long synth opening, break, bass, riff, breakdown, build, drop.

  Band and song: the Crystal Method are known for hard, driving kicks, a dirty bass under them and an
  acid line; Trip Like I Do opens on a synth sequence and a pad with no drums, a spoken sample over
  them, before the break comes in, and returns to the synth in its breakdown.

  Checklist: the hook is the synth sequence that opens the track and then the kick and bass under it;
  the emotion is hypnotic, then driving; the lift is the break coming in after the long opening, and
  each drop, where a second kick on every beat and the crash join; the contrast is the opening and the
  breakdown, with no drums; the sounds are a saw sequence, a pad, a synth bass doubled by a distorted
  guitar, a square acid line and a synth voice as the sample.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/electronic/the_mineral.yml

  Scene 1, synth, 4 bars.
  Scene 2, synth and sample, 8 bars.
  Scene 3, break, 8 bars.
  Scene 4, bass, 8 bars.
  Scene 5, acid, 16 bars.
  Scene 6, breakdown, 8 bars.
  Scene 7, build, 8 bars.
  Scene 8, drop, 16 bars.
  Scene 9, drop 2, 16 bars.
  Scene 10, synth again, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

