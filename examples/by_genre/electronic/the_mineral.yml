          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          open: { pattern: open, loop: true }
          bass: { pattern: bass, chains: [riff, slur], loop: true }
          stabs: { pattern: stabs, chains: [riff], loop: true }
      - name: riff
        tracks:
          kick: { pattern: kick, loop: true }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          open: { pattern: open, loop: true }
          crash: { pattern: crash, loop: true }
          bass: { pattern: bass, chains: [riff, slur], loop: true }
          stabs: { pattern: stabs, chains: [riff], loop: true }
          lead: { pattern: riff, repeat: 8 }
      - name: breakdown
