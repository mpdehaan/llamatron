      snare: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      open: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      bass: { instrument: synth bass }
      stabs: { instrument: polysynth }
      lead: { instrument: saw lead }
      pad: { instrument: sci-fi pad }
      vox: { instrument: synth voice }

    scenes:
      - name: intro
        tracks:
          hat: { pattern: hat, repeat: 8 }
          pad: { pattern: pad, chains: [riff], loop: true }
      - name: break
        tracks:
          kick: { pattern: kick, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          open: { pattern: open, loop: true }
      - name: bass
        tracks:
