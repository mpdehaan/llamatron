  saw lead: { device: "*FluidSynth", gm_sound: 82 }
  sci-fi pad: { device: "*FluidSynth", gm_sound: 104 }
  synth voice: { device: "*FluidSynth", gm_sound: 55 }
  drum kit: { device: "*FluidSynth" }

songs:
  the_mineral:
    tempo: 128
    scale: E Minor
    genre: Electronic

    tracks:
