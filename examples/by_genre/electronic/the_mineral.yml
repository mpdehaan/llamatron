version: 1.0.228
title: The mineral
description: "a late-nineties big beat track in the manner of the Crystal Method's Vegas, with riffs of its own"
notes: |
  The mineral: a big beat track at 128 beats a minute in E minor, in the manner of the Crystal Method's
  album Vegas: a funky breakbeat, a gritty sixteenth-note synth bass that slurs between some notes,
  chord stabs, a screaming saw riff, a sci-fi pad and a wordless synth voice. The riffs are its own.

  The bass's slurs come from a Glide generator called slur, in the bass's chains, which holds a note
  into the next on the steps it marks. The bass and the stabs are one bar each over chord i, moved by
  a Progression through i i VI VII, and the build is a scene whose Density rises from 20% to 100%.

  Run it with: llamatron examples/by_genre/electronic/the_mineral.yml

  Scene 1, intro, 8 bars: the pad and the hats.
  Scene 2, break, 8 bars: the breakbeat alone.
  Scene 3, bass, 16 bars: the slurring bass and the stabs.
  Scene 4, riff, 16 bars: the saw riff.
  Scene 5, breakdown, 8 bars: the pad and the voice, no drums.
  Scene 6, build, 8 bars: everything returns, Density rising from 20% to 100%.
  Scene 7, drop, 16 bars: the riff, the voice and the full break.
  Scene 8, outro, 16 bars: the break and the bass play out.

  When changing this demo:
  - Keep the bass slurred by the slur Glide generator.
  - Keep the build made by the scene's Density.
  - Keep the riffs original.
real_time: true
protected: true

