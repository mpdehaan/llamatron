version: 1.0.227
title: "No more, no more"
description: "an early-nineties eurodance song in the manner of What Is Love (Haddaway), with a melody of its own"
notes: |
  No more, no more: a eurodance song at 124 beats a minute in D minor, in the manner of the early
  nineties: an off-beat synth bass, a piano stabbing a syncopated rhythm, a pad, a driving kit with
  sixteenth hats and a singing synth voice. The melody is its own.

  The bass, the piano and the pad are one bar each over chord i, moved through i VI III VII by a
  Progression.

  Run it with: llamatron examples/by_genre/electronic/nomore_nomore.yml

  Scene 1, intro, 8 bars: the piano and the drums.
  Scene 2, verse, 16 bars: the verse.
  Scene 3, chorus, 16 bars: the chorus.
  Scene 4, break, 8 bars: the pad and the chorus, no drums.
  Scene 5, verse 2, 16 bars: the second verse.
  Scene 6, chorus 2, 16 bars: the chorus again.
  Scene 7, last chorus, 8 bars: the chorus once more.
  Scene 8, outro, 4 bars: the piano and the drums.

  When changing this demo:
  - Keep the bass, piano and pad one bar long over chord i.
  - Keep the melody original.
real_time: true
protected: true

