version: 1.0.591
title: Nomore nomore
description: "an early-nineties eurodance song in the manner of What Is Love (Haddaway), with a melody of its own"
notes: |
  Nomore nomore: an early-nineties eurodance song in the manner of What Is Love (Haddaway), with a
  melody of its own. This is a homage to What Is Love (Haddaway): its chords, form, sounds and drums
  follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 4.

  One loop throughout, i III v VII, a bar each: a stabbed organ riff, a bass on the offbeats, a kick
  on every beat, a house piano in the choruses and a breakdown on the pad.

  Subgenre: Eurodance of the early nineties. Drums: a heavy kick on every beat, a clap on two and
  four, an open hat on every offbeat. Tempo 124, straight. Bass: short notes on the offbeats. Builds:
  a breakdown on the pad, then everything back. Sounds: an organ-like synth stabbing the chords, a
  house piano, a pad, a soulful voice. Melody manner: a short question-like chorus phrase repeated.
  Form: riff, verse, chorus, breakdown.

  Band and song: the song is known for its stabbed synth riff, which plays under the chorus too, for
  its one four-chord loop and for a pleading chorus.

  Checklist: it is good and memorable because the riff and the kick lock into one nodding pulse and
  the chorus asks the same thing again and again. The hook is the stab riff; the emotion is pleading
  and danceable; the lift is the chorus, the riff, the piano and a crash together; the contrast is the
  breakdown; the sounds are an organ, a piano, a warm pad, a voice lead and a synth bass.

  Phrasing: the verse is four lines of a bar and a half, each answered by a short wordless reply on
  the piano; the chorus keeps its short pleading clauses, each entering after the downbeat, with the
  accent on the note it leans on.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and the bass lean on the offbeats between the kicks, as dance music does, and the chords and
  tunes on the first beat of the bar; a note pushed ahead of the beat and held over it is accented.
  The kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/electronic/nomore_nomore.yml

  Scene 1, intro, 8 bars.
  Scene 2, riff, 8 bars.
  Scene 3, verse, 16 bars.
  Scene 4, chorus, 8 bars.
  Scene 5, riff 2, 8 bars.
  Scene 6, verse 2, 8 bars.
  Scene 7, chorus 2, 8 bars.
  Scene 8, breakdown, 8 bars.
  Scene 9, last chorus, 16 bars.
  Scene 10, outro, 6 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

