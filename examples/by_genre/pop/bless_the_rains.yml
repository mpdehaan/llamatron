version: 1.0.227
title: Bless the rains
description: "an early eighties soft-rock song in the manner of Africa (Toto), with a melody of its own"
notes: |
  Bless the rains: a soft-rock song at 96 beats a minute in A major, in the manner of the early
  eighties: a marimba riff in sixteenths, congas, a shaker and a cowbell, a warm pad and a lead
  that rises into the chorus. The melody and the riff are its own.

  The marimba, the bass and the pad are one bar each over chord I, moved by Progression: the
  verse goes I vi IV V and the chorus vi IV I V.

  Run it with: llamatron examples/by_genre/pop/bless_the_rains.yml

  Scene 1, intro, 4 bars: the marimba riff and the percussion.
  Scene 2, verse, 16 bars: the verse.
  Scene 3, chorus, 16 bars: the chorus.
  Scene 4, verse 2, 16 bars: the second verse.
  Scene 5, chorus 2, 16 bars: the chorus to the end.
  Scene 6, outro, 4 bars: the riff alone again.

  When changing this demo:
  - Keep the marimba, bass and pad one bar long over chord I.
  - Keep the melody original.
real_time: true
protected: true

