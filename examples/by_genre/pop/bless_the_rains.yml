version: 1.0.591
title: Bless the rains
description: "an early eighties soft-rock song in the manner of Africa (Toto), with a melody of its own"
notes: |
  Bless the rains: an early eighties soft-rock song in the manner of Africa (Toto), with a melody of
  its own. This is a homage to Africa (Toto): its chords, form, sounds and drums follow that work as
  Claude knows it, and every tune and rhythm here is new. Rebuild version 5.

  The verse is low and quiet and the chorus an anthem: the tune leaps up an octave and holds long high
  notes in three-part harmony over big drums, a driving bass, brass and strings. The verse is in D
  major on I iii vi and the chorus a whole step down, in C major, on vi IV I V, as the song changes
  key; a brass riff on IV iii vi opens and returns; a marimba figure, congas and a flute solo.

  Subgenre: soft rock of the early eighties, studio-polished. Drums: a steady, relaxed groove built
  from a loop of congas and a shaker in sixteenths, a soft kick, a side stick on two and four in the
  verses and a full snare, open hats and a crash in the choruses. Tempo about 93, straight. Bass:
  fretless, following the kick. Builds: none; the lift is the chorus itself. Sounds: a marimba or
  kalimba figure, a synth brass riff, electric piano, stacked voices. Melody manner: a low talking
  verse, a high held chorus in harmony. Form: riff, verse, chorus, with a solo on a flute-like synth.

  Band and song: the band is known for studio precision, a percussion loop and thick vocal harmonies;
  the song for the contrast of its quiet verse and its anthem chorus, the key change between them, and
  its brass riff.

  Checklist: the hook is the chorus sung in harmony; the emotion is yearning that turns triumphant;
  the lift is the chorus, an octave up, three voices, big drums, driving bass, brass and strings; the
  contrast is the low verse on a side stick; the sounds are a voice lead with attack, a choir, synth
  brass, marimba and electric piano.

  Phrasing: the verse's lines are uneven and enter after the beat, and a flute replies in the gaps;
  the chorus's lines begin with a soft pickup, breathe, and the last is held through its bar.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/pop/bless_the_rains.yml

  Scene 1, riff, 4 bars.
  Scene 2, verse, 16 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, verse 2, 8 bars.
  Scene 5, chorus 2, 8 bars.
  Scene 6, flute, 8 bars.
  Scene 7, last chorus, 16 bars.
  Scene 8, riff 3, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

