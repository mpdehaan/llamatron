version: 1.0.591
title: Peanut buttercup
description: "a late sixties soul-pop song in the manner of Build Me Up Buttercup (The Foundations), with a melody of its own"
notes: |
  Peanut buttercup: a late sixties soul-pop song in the manner of Build Me Up Buttercup (The
  Foundations), with a melody of its own. This is a homage to Build Me Up Buttercup (The Foundations):
  its chords, form, sounds and drums follow that work as Claude knows it, and every tune and rhythm
  here is new. Rebuild version 7.

  It starts on its chorus, as the song does: I, a dominant chord on III, IV and V, two bars each, the
  voices answering each clause, then I, its seventh, IV turning minor and home; the verse goes I V
  bVII IV; three hits and an answer on IV, iii and ii, and held notes rising on V.

  Subgenre: British soul-pop of the late sixties, made to sound like Detroit: bright, bouncing and
  built for a room to sing. Drums: a light kick on one and three with a push, a snare on two and four,
  a tambourine on every beat, hats in eighths, hand claps in the last choruses. Tempo 134, a light
  bounce. Bass: busy and tuneful, walking up through each chord. Builds: none in volume; the song
  opens on its chorus and keeps coming back to it, and one half chorus is sung over claps alone.
  Sounds: a piano pounding a chord on every beat, a horn section, a warm lead voice, and a group of
  voices that repeats the end of each of the singer's lines back to him. Melody manner: the chorus is
  one long run-on sentence cut into short clauses of five or six quick notes; after each clause the
  voices repeat its last three notes while the singer breathes, and he comes back in with a pickup
  before they have finished, so that the line never stops; in the middle three long notes, repeated by
  the voices, then a rush of quick notes home. The verse is three short clauses and a longer one,
  twice, each starting just off the beat. Before each chorus the band and the voices hit three times
  and the singer answers, three times over, and then everyone rises on held notes into the chorus.
  Form: the horns play the chorus's opening, chorus, verse, three hits and answers, chorus, verse,
  hits and answers, piano, half a chorus over claps, chorus.

  Band and song: the group is known for a sunny, horn-driven sound and a pleading lead; the song for
  starting on its chorus, for the voices that finish the singer's sentences, for a chord on the third
  step that should be minor and is not, and for the three shouts before each line that leads back to
  the chorus.

  Checklist: it is good and memorable because the singer and the voices share one sentence, each
  clause handed back before the next begins, over chords that climb where the ear does not expect. The
  hook is the chorus's first clause and its echo, heard first on the horns; the emotion is cheerful
  pleading; the lift is the three hits and the held notes rising into the chorus; the contrast is the
  three long notes in the middle of the chorus, and the half chorus over claps; the sounds are a voice
  lead, a choir for the answers, a brass section, a piano and a round bass.

  Phrasing: the lines keep the lengths and rests they were given by the work's phrasing, and now carry
  its stresses: soft pickups, an accent where each line lands and the strongest on its highest note.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  time-keeping and the chords lean on two and four, the bass walks into the first beat, and the notes
  between the beats are lighter; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/pop/peanut_buttercup.yml

  Scene 1, horns, 4 bars.
  Scene 2, chorus, 16 bars.
  Scene 3, verse, 8 bars.
  Scene 4, three hits and an answer, 8 bars.
  Scene 5, chorus 2, 16 bars.
  Scene 6, verse 2, 8 bars.
  Scene 7, three hits again, 8 bars.
  Scene 8, piano, 8 bars.
  Scene 9, half a chorus over claps, 8 bars.
  Scene 10, last chorus, 16 bars.
  Scene 11, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
