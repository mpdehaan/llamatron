version: 1.0.227
title: Peanut buttercup
description: "a late sixties soul-pop song in the manner of Build Me Up Buttercup (The Foundations), with a melody of its own"
notes: |
  Peanut buttercup: a bright soul-pop song at 132 beats a minute in C major, in the manner of the late
  sixties: a bouncing piano, horn stabs on the off-beats, a tambourine on two and four and a lead
  that sings over the top. The melody is its own; only the style is borrowed.

  The bass, the piano and the horns are one bar each over chord I, moved by Progression chains: the
  verse climbs I iii IV V, the chorus goes I V vi IV I V IV V, and the bridge vi iii IV V.

  Run it with: llamatron examples/by_genre/pop/peanut_buttercup.yml

  Scene 1, intro, 4 bars: the band, with no melody.
  Scene 2, verse, 16 bars: the verse.
  Scene 3, chorus, 16 bars: the chorus.
  Scene 4, verse 2, 16 bars: the second verse.
  Scene 5, chorus 2, 16 bars: the chorus again.
  Scene 6, bridge, 8 bars: the bridge.
  Scene 7, last chorus, 16 bars: the last chorus.
  Scene 8, outro, 8 bars: the band plays out.

  When changing this demo:
  - Keep the bass, piano and horns one bar long over chord I.
  - Keep the melody original.
real_time: true
protected: true

