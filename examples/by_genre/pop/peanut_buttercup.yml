version: 1.0.364
title: Peanut buttercup
description: "a late sixties soul-pop song in the manner of Build Me Up Buttercup (The Foundations), with a melody of its own"
notes: |
  Peanut buttercup: a late sixties soul-pop song in the manner of Build Me Up Buttercup (The
  Foundations), with a melody of its own. This is a homage to Build Me Up Buttercup (The Foundations):
  its chords, form, sounds and drums follow that work as Claude knows it, and every tune and rhythm
  here is new. Rebuild version 3.

  It starts on its chorus, as the song does: I, a dominant chord on III, IV and V, the horns answering
  each line; the verse goes I V bVII IV and a climb on IV iii ii V leads back.

  Subgenre: British soul-pop of the late sixties, after Motown. Drums: a bouncing shuffle, a steady
  kick, a snare on two and four doubled by a tambourine, hand claps. Tempo about 134, swung. Bass:
  bouncing between root and fifth. Builds: none. Sounds: a pounding piano, a horn section, a lead
  voice and answering voices. Melody manner: a sing-along chorus in short phrases that leave room for
  an answer. Form: the chorus first, then verse, a climb, chorus.

  Band and song: the song is known for starting on its chorus, for the voices that answer each line,
  and for the dominant chord on III that tugs every time round.

  Checklist: it is good and memorable because anyone can sing the chorus at once and the answers make
  it a conversation. The hook is the chorus with its answers; the emotion is joyful over a sad story;
  the lift is every chorus, with horns, claps and answering voices; the contrast is the verse without
  horns; the sounds are a voice lead, a choir for the answers, brass and piano.

  Run it with: llamatron examples/by_genre/pop/peanut_buttercup.yml

  Scene 1, intro, 4 bars.
  Scene 2, chorus, 8 bars.
  Scene 3, verse, 16 bars.
  Scene 4, climb, 4 bars.
  Scene 5, chorus 2, 8 bars.
  Scene 6, verse 2, 16 bars.
  Scene 7, climb 2, 4 bars.
  Scene 8, chorus 3, 8 bars.
  Scene 9, piano, 8 bars.
  Scene 10, claps, 4 bars.
  Scene 11, last chorus, 16 bars.
  Scene 12, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
