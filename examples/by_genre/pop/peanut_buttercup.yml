version: 1.0.365
title: Peanut buttercup
description: "a late sixties soul-pop song in the manner of Build Me Up Buttercup (The Foundations), with a melody of its own"
notes: |
  Peanut buttercup: a late sixties soul-pop song in the manner of Build Me Up Buttercup (The
  Foundations), with a melody of its own. This is a homage to Build Me Up Buttercup (The Foundations):
  its chords, form, sounds and drums follow that work as Claude knows it, and every tune and rhythm
  here is new. Rebuild version 5.

  It starts on its chorus, as the song does: I, a dominant chord on III, IV and V, two bars each, the
  horns answering each line, then I, its seventh, IV turning minor and home; the verse goes I V bVII
  IV; a climb on IV iii ii ends in three hits for the whole band on V.

  Subgenre: British soul-pop of the late sixties, made to sound like Detroit: bright, bouncing and
  built for a room to sing. Drums: a light kick on one and three with a push, a snare on two and four,
  a tambourine on every beat, hats in eighths, hand claps in the last choruses. Tempo 134, a light
  bounce. Bass: busy and tuneful, walking up through each chord. Builds: none in volume; the song
  opens on its chorus and keeps coming back to it, and one chorus is sung over claps alone. Sounds: a
  piano pounding a chord on every beat, a horn section answering the singer, a warm lead voice, a
  group of voices joining the chorus's second half and shouting three hits with the band before each
  chorus. Melody manner: a chorus of one bouncing shape said four times, a step higher each time as
  the chords climb, then long notes that fall over a major chord turning minor; a talking verse that
  starts off the beat. Form: the horns play the chorus's shape, chorus, verse, a climb and three hits,
  chorus, verse, climb and hits, piano, chorus over claps, chorus.

  Band and song: the group is known for a sunny, horn-driven sound and a pleading lead; the song for
  starting on its chorus, for its singalong answers, for a chord on the third step that should be
  minor and is not, and for the band stopping to shout before the chorus comes round again.

  Checklist: it is good and memorable because the chorus is one shape anyone can sing by the second
  time, the chords under it climb where the ear does not expect, and everybody answers. The hook is
  that chorus shape, heard first on the horns and then four times in every chorus; the emotion is
  cheerful pleading; the lift is the chorus's second half, the voices joining a third above; the
  contrast is the three hits with nothing between them, and the chorus over claps; the sounds are a
  voice lead, a brass section, a piano, a choir and a round bass.

  Run it with: llamatron examples/by_genre/pop/peanut_buttercup.yml

  Scene 1, horns, 4 bars.
  Scene 2, chorus, 16 bars.
  Scene 3, verse, 16 bars.
  Scene 4, climb, 3 bars.
  Scene 5, three hits, 1 bars.
  Scene 6, chorus 2, 16 bars.
  Scene 7, verse 2, 8 bars.
  Scene 8, climb 2, 3 bars.
  Scene 9, three hits 2, 1 bars.
  Scene 10, piano, 8 bars.
  Scene 11, chorus over claps, 8 bars.
  Scene 12, last chorus, 16 bars.
  Scene 13, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
