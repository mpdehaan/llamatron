version: 1.0.227
title: Rick rolling
description: "a late eighties dance-pop song in the manner of Never Gonna Give You Up (Rick Astley), with a melody of its own"
notes: |
  Rick rolling: a dance-pop song at 114 beats a minute in B flat major, in the manner of the late
  eighties hit factories: an octave-bouncing synth bass, off-beat chord stabs, a four-on-the-floor
  disco beat and a singing lead. Every note of the melody is its own; only the style is borrowed.

  The bass and the stabs are one bar each, written over chord I and moved through the chords by
  Progression chains: the verse and chorus go IV V iii vi, and the build-up climbs ii iii IV V.

  Run it with: llamatron examples/by_genre/pop/rick_rolling.yml

  Scene 1, intro, 4 bars: the beat, the bass and the stabs.
  Scene 2, verse, 16 bars: the verse melody.
  Scene 3, build, 8 bars: the climb to the chorus.
  Scene 4, chorus, 16 bars: the chorus.
  Scene 5, verse 2, 16 bars: the second verse.
  Scene 6, build 2, 8 bars: the climb again.
  Scene 7, last chorus, 16 bars: the chorus to the end.

  When changing this demo:
  - Keep the bass and the stabs one bar long over chord I, so that the progressions move them.
  - Keep the melody original, borrowing only the style.
real_time: true
protected: true

