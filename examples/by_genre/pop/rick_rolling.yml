version: 1.0.591
title: Rick rolling
description: "a late eighties dance-pop song in the manner of Never Gonna Give You Up (Rick Astley), with a melody of its own"
notes: |
  Rick rolling: a late eighties dance-pop song in the manner of Never Gonna Give You Up (Rick Astley),
  with a melody of its own. This is a homage to Never Gonna Give You Up (Rick Astley): its chords,
  form, sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new.
  Rebuild version 5.

  Two chords a bar: IV V iii vi under the string hook and the chorus, IV V in the verse; a drum fill
  opens, the band stops before each chorus, and the voice sits low.

  Subgenre: British dance-pop of the late eighties, made by a hit factory. Drums: a drum machine, a
  kick on every beat, a big gated snare on two and four, sixteenth hats, tom fills. Tempo 114,
  straight. Bass: a synth bass bouncing in octaves in sixteenths. Builds: a short climb and a stop
  before the chorus. Sounds: string and brass synth stabs, a deep voice, bright backing voices. Melody
  manner: a low verse, a chorus of short repeated phrases. Form: hook, verse, climb, chorus, bridge.

  Band and song: the singer is known for a deep baritone over a bright, bouncing track; the song for
  its drum fill opening, its string hook and a chorus that repeats one shape with a new ending each
  time.

  Checklist: it is good and memorable because the chorus repeats a three-note pickup so often it
  cannot be forgotten, over a bass that bounces. The hook is the chorus and the string line; the
  emotion is sunny and earnest; the lift is the chorus after the stop, with a crash and a choir a
  third above; the contrast is the verse without stabs; the sounds are a voice lead low, a choir,
  synth strings, synth brass and a synth bass.

  Phrasing: the chorus is six short clauses in two groups of three, each begun by three soft pickup
  notes before the bar and landing with an accent on the downbeat, the third of each group longer and
  followed by a breath; the first pickup is sung over the stop. The verse's lines enter after the
  downbeat and leave two beats of air between them.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and the bass lean on the offbeats between the kicks, as dance music does, and the chords and
  tunes on the first beat of the bar; a note pushed ahead of the beat and held over it is accented.
  The kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/pop/rick_rolling.yml

  Scene 1, fill, 1 bars.
  Scene 2, hook, 8 bars.
  Scene 3, verse, 16 bars.
  Scene 4, build, 3 bars.
  Scene 5, stop, 1 bars.
  Scene 6, chorus, 8 bars.
  Scene 7, verse 2, 8 bars.
  Scene 8, build 2, 3 bars.
  Scene 9, stop 2, 1 bars.
  Scene 10, chorus 2, 8 bars.
  Scene 11, bridge, 8 bars.
  Scene 12, last chorus, 16 bars.
  Scene 13, outro, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
