version: 1.0.227
title: Goodnight world
description: "an early eighties synth-pop song in the manner of Sweet Dreams (Eurythmics), with a melody of its own"
notes: |
  Goodnight world: a synth-pop song at 126 beats a minute in C minor, in the manner of the early
  eighties: a sixteenth-note synth bass that leaps an octave, a cold string pad, a drum machine
  and a saw lead. The melody and the bass line are its own.

  The bass and the pad are one bar each over chord i, moved through i VI v v by a Progression.

  Run it with: llamatron examples/by_genre/pop/goodnight_world.yml

  Scene 1, intro, 8 bars: the bass and the drums.
  Scene 2, first line, 16 bars: the first tune.
  Scene 3, second line, 16 bars: the second tune, higher.
  Scene 4, first again, 16 bars: the first tune again.
  Scene 5, break, 8 bars: the drums drop out.
  Scene 6, second again, 16 bars: the second tune again.
  Scene 7, outro, 16 bars: the band plays out.

  When changing this demo:
  - Keep the bass and the pad one bar long over chord i.
  - Keep the melody original.
real_time: true
protected: true

