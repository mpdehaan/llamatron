version: 1.0.364
title: Goodnight world
description: "an early eighties synth-pop song in the manner of Sweet Dreams (Eurythmics), with a melody of its own"
notes: |
  Goodnight world: an early eighties synth-pop song in the manner of Sweet Dreams (Eurythmics), with a
  melody of its own. This is a homage to Sweet Dreams (Eurythmics): its chords, form, sounds and drums
  follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 4.

  A two-bar synth riff in eighths, two synths an octave apart, over i for a bar and VI and v for half
  a bar each; a pre-chorus on VI V i iv and a bridge on a suspended i and a major IV.

  Subgenre: British synth-pop of the early eighties, cold and minimal. Drums: a drum machine, a kick
  on every beat, a clap on two and four, nothing loose. Tempo 126, straight. Bass and riff: sequenced
  synths in eighths. Builds: none; sections change by adding and removing layers. Sounds: two synths
  an octave apart on the riff, a string synth, stacked voices. Melody manner: a plain, narrow verse,
  held notes in harmony elsewhere. Form: riff, verse, a contrasting section, an instrumental break.

  Band and song: the duo is known for a commanding voice over machines; the song for its hypnotic two-
  bar riff, its stark beat and its layered wordless voices.

  Checklist: it is good and memorable because the riff never stops and everything else is simple
  enough to chant. The hook is the riff; the emotion is cool and a little menacing; the lift is the
  pre-chorus, long notes in two voices over new chords; the contrast is the bridge on the kick alone;
  the sounds are a square lead and a string synth on the riff, a voice lead and a choir.

  Run it with: llamatron examples/by_genre/pop/goodnight_world.yml

  Scene 1, intro, 4 bars.
  Scene 2, intro 2, 4 bars.
  Scene 3, verse, 16 bars.
  Scene 4, pre-chorus, 8 bars.
  Scene 5, instrumental, 8 bars.
  Scene 6, verse 2, 16 bars.
  Scene 7, pre-chorus 2, 8 bars.
  Scene 8, bridge, 8 bars.
  Scene 9, verse 3, 8 bars.
  Scene 10, instrumental 2, 8 bars.
  Scene 11, outro, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

