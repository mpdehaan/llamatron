version: 1.0.591
title: Intersection pact
description: "a hard-driving blues for one guitar and a voice in the manner of Cross Road Blues (Robert Johnson), with the drive of Crossroads as Cream played it, and tunes and guitar figures of its own"
notes: |
  Intersection pact: a hard-driving blues for one guitar and a voice in the manner of Cross Road Blues
  (Robert Johnson), with the drive of Crossroads as Cream played it, and tunes and guitar figures of
  its own. This is a homage to Cross Road Blues (Robert Johnson): its chords, form, sounds and drums
  follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 3.

  A twelve-bar blues on dominant chords for one guitar: a driving riff on the low strings, slide
  answers on the high strings, a foot on every beat; the sung line twice and an answer; stop time
  under the pleading verses; two guitar choruses.

  Subgenre: Delta blues of the nineteen thirties, one man with one acoustic guitar, played with the
  push a rock trio later gave the same song. Drums: none; a foot stamping every beat, hard. Tempo 126,
  a tight shuffle. Bass: the guitar's low strings on a driving riff that climbs through the flat third
  to the seventh, a bar long, again and again. Builds: stop time under the pleading verses, and two
  guitar choruses, the second higher and more insistent. Sounds: one steel-string guitar doing two
  jobs, the riff low and a slide high that answers the voice; a high, urgent voice. Melody manner:
  three lines to a chorus, the first sung twice and then answered; each line starts high, hammers one
  note and falls through the flat seventh and third, leaving two bars for the slide. Form: a four-bar
  turnaround, then twelve bars seven times: verse, pleading verse, guitar, verse, guitar, pleading
  verse, verse.

  Band and song: the player is known for sounding like two guitarists at once, for a slide that
  finishes his sentences and for a voice pitched high and anxious. The song is a man on his knees at a
  crossroads as the sun goes down, begging for mercy and for a ride that nobody stops to give: fear,
  not swagger. The later electric version is remembered for turning that fear into speed, one riff
  driven hard and long solos that never let up.

  Checklist: it is good and memorable because one person fills the whole space, and because the plea
  is real. The hook is the riff and the hammered first line; the emotion is dread and pleading, pushed
  hard; the lift is the pleading verse, the guitar stopping dead under a voice that starts higher; the
  contrast is that stop time against the riff; the sounds are a steel-string guitar low, the same
  guitar high for the slide, a harmonica standing in for the voice, since a sung line needs a sound
  with bite, and a foot.

  Phrasing: each sung line is two bars and the guitar answers for two, as a blues verse goes; the
  lines now lean on their first note and their highest and fall away at the end.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  time-keeping and the chords lean on two and four, the bass walks into the first beat, and the notes
  between the beats are lighter; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/blues/intersection_pact.yml

  Scene 1, turnaround, 4 bars.
  Scene 2, first verse, 12 bars.
  Scene 3, pleading, 12 bars.
  Scene 4, guitar, 12 bars.
  Scene 5, second verse, 12 bars.
  Scene 6, guitar again, 12 bars.
  Scene 7, pleading again, 12 bars.
  Scene 8, last verse, 12 bars.
  Scene 9, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
