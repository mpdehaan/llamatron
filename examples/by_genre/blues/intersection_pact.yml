version: 1.0.364
title: Intersection pact
description: "a Delta blues for one guitar and a voice in the manner of Cross Road Blues (Robert Johnson), with tunes and guitar figures of its own"
notes: |
  Intersection pact: a Delta blues for one guitar and a voice in the manner of Cross Road Blues
  (Robert Johnson), with tunes and guitar figures of its own. This is a homage to Cross Road Blues
  (Robert Johnson): its chords, form, sounds and drums follow that work as Claude knows it, and every
  tune and rhythm here is new. Rebuild version 1.

  A twelve-bar blues on dominant chords for one guitar: a shuffle on the low strings, slide answers on
  the high strings and a turnaround; the sung line twice and an answer; a guitar chorus at the start
  and in the middle.

  Subgenre: Delta blues of the nineteen thirties, one man with one acoustic guitar. Drums: none; only
  a foot tapping the beat. Tempo 96, a shuffle. Bass: the guitar's low strings, the thumb rocking
  between the fifth and the sixth of each chord. Builds: none; intensity comes from the voice and the
  slide. Sounds: one steel-string guitar doing two jobs, a shuffle on the low strings and a slide on
  the high strings that answers the voice; a high, urgent voice. Melody manner: three lines to a
  chorus, the first sung twice and then answered, each line falling through the flat third and seventh
  and leaving two bars for the slide to reply. Form: twelve bars, again and again, a guitar chorus
  first and one in the middle.

  Band and song: the player is known for sounding like two guitarists at once, for a slide that
  finishes his sentences and for a voice pitched high and anxious; the song for its plea at a
  crossroads as night comes on.

  Checklist: it is good and memorable because one person fills the whole space, and the slide answers
  every line like a second voice. The hook is the sung line and the slide's reply; the emotion is
  dread and pleading; the lift is the second kind of chorus, the voice starting an octave up; the
  contrast is the guitar alone; the sounds are a steel-string guitar low, the same guitar high for the
  slide, a harmonica standing in for the voice, since a sung line needs a sound with bite, and a foot.

  Run it with: llamatron examples/by_genre/blues/intersection_pact.yml

  Scene 1, guitar, 12 bars.
  Scene 2, first verse, 12 bars.
  Scene 3, second verse, 12 bars.
  Scene 4, guitar again, 12 bars.
  Scene 5, third verse, 12 bars.
  Scene 6, last verse, 12 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
