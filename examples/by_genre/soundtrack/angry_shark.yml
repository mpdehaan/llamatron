songs:
  angry_shark:
    tempo: 140
    scale: E Minor
    genre: Soundtrack

    tracks:
      basses: { instrument: contrabass }
      cellos: { instrument: cello }
      tuba: { instrument: tuba }
      timpani: { instrument: timpani }
      hits: { drum: true, instrument: drum kit }
      horns: { instrument: horns }

    scenes:
      - name: lurking
        tempo: 70
        tracks:
          basses: { pattern: lurk, repeat: 8 }
      - name: approach
        tempo_start: 70
        tempo_end: 140
        tracks:
          basses: { pattern: approach, repeat: 16 }
          cellos: { pattern: cellos, loop: true }
      - name: attack
        tempo: 150
        tracks:
          basses: { pattern: attack, loop: true }
          cellos: { pattern: cellos, loop: true }
          tuba: { pattern: tuba, repeat: 8 }
          timpani: { pattern: timpani, loop: true }
          hits: { pattern: hits, loop: true }
      - name: chase
        tempo: 150
        tracks:
          basses: { pattern: attack, loop: true }
          cellos: { pattern: cellos, loop: true }
          tuba: { pattern: tuba, loop: true }
          timpani: { pattern: timpani, loop: true }
          hits: { pattern: hits, loop: true }
          horns: { pattern: horns, repeat: 4 }
      - name: chase 2
        tempo: 150
        tracks:
          basses: { pattern: attack, loop: true }
          cellos: { pattern: cellos, loop: true }
          tuba: { pattern: tuba, loop: true }
          timpani: { pattern: timpani, loop: true }
