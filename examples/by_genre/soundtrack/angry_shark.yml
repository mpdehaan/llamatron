version: 1.0.227
title: Angry shark
description: "a menacing orchestral film score in the manner of Jaws (John Williams), two low notes speeding up as the shark comes"
notes: |
  Angry shark: an orchestral score in E minor, in the manner of the mid-seventies thrillers: two low
  notes a half step apart in the double basses, slow at first and faster as the danger comes,
  cellos, a tuba, timpani, low toms and horns with a call of their own.

  The scenes ramp the tempo: the approach speeds up from 70 to 140 beats a minute across its
  bars, the attack and the chase stay at 150, the retreat slows from 150 back to 70, and the last
  scene lurks at 70 again.

  Run it with: llamatron examples/by_genre/soundtrack/angry_shark.yml

  Scene 1, lurking, 8 bars: the basses alone, slowly.
  Scene 2, approach, 16 bars: the cellos join, speeding up from 70 to 140.
  Scene 3, attack, 16 bars: the basses in sixteenths, the tuba, timpani and toms.
  Scene 4, chase, 16 bars: the horns call.
  Scene 5, chase 2, 8 bars: the call again.
  Scene 6, retreat, 8 bars: slowing from 150 to 70.
  Scene 7, lurking again, 8 bars: the basses alone.

  When changing this demo:
  - Keep the tempo ramps on the approach and the retreat.
  - Keep the horn call original.
real_time: true
protected: true

