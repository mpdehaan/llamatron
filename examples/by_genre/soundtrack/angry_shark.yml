version: 1.0.365
title: Angry shark
description: "a menacing orchestral film score in the manner of Jaws (John Williams), a low figure speeding up as the shark comes"
notes: |
  Angry shark: a menacing orchestral film score in the manner of Jaws (John Williams), a low figure
  speeding up as the shark comes. This is a homage to Jaws (John Williams): its chords, form, sounds
  and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 2.

  A creeping cell of three low notes in the basses, first in slow notes with silences, then in eighths
  as each scene is faster; a tuba, horn calls and timpani; a chase on i VI iv V; a calm stretch of
  harp and strings before it comes back.

  Subgenre: orchestral suspense film music of the seventies. Drums: none but timpani, a snare and a
  cymbal in the attacks. Tempo: it speeds up, scene by scene. Bass: the whole idea, a low figure in
  the basses. Builds: the figure gets faster and louder. Sounds: basses, cellos, a tuba, horns, harp.
  Melody manner: a few low notes repeated; horn calls in long notes. Form: lurking, approach, attack,
  calm, return.

  Band and song: the composer is known for themes anyone can hum; this score for a figure so simple
  that speed alone tells how close the danger is.

  Checklist: it is good and memorable because it is almost nothing: a low figure and silence, then
  faster. The hook is the creeping cell; the emotion is dread; the lift is the attack at full speed
  with horns and timpani; the contrast is the calm stretch; the sounds are contrabasses, cellos, tuba,
  French horns.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/soundtrack/angry_shark.yml

  Scene 1, lurking, 8 bars.
  Scene 2, nearer, 8 bars.
  Scene 3, approach, 8 bars.
  Scene 4, attack, 16 bars.
  Scene 5, chase, 16 bars.
  Scene 6, calm, 8 bars.
  Scene 7, lurking again, 8 bars.
  Scene 8, last attack, 8 bars.
  Scene 9, ending, 1 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

