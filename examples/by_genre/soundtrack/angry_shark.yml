  - { name: cello, device: "*FluidSynth", gm_sound: 43 }
  - { name: tuba, device: "*FluidSynth", gm_sound: 59 }
  - { name: timpani, device: "*FluidSynth", gm_sound: 48 }
  - { name: french horn, device: "*FluidSynth", gm_sound: 61 }
  - { name: strings, device: "*FluidSynth", gm_sound: 49 }
  - { name: harp, device: "*FluidSynth", gm_sound: 47 }
  - { name: flute, device: "*FluidSynth", gm_sound: 74 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: angry_shark
    tempo: 150
    scale: D Minor
    genre: Soundtrack

    tracks:
      - { name: cymbal, drum: true, instrument: drum kit }
      - { name: snare, drum: true, instrument: drum kit }
      - { name: basses, instrument: contrabass }
      - { name: cellos, instrument: cello }
      - { name: tuba, instrument: tuba }
      - { name: timpani, instrument: timpani }
      - { name: horns, instrument: french horn }
      - { name: strings, instrument: strings }
      - { name: harp, instrument: harp }
      - { name: flute, instrument: flute }

    scenes:
      - name: lurking
        tempo: 70
        clips:
          - { track: basses, pattern: cell slow, repeat: 2 }
      - name: nearer
        tempo: 90
        clips:
          - { track: basses, pattern: cell, repeat: 8 }
          - { track: cellos, pattern: cell slow, loop: true }
      - name: approach
        tempo: 120
        clips:
          - { track: basses, pattern: cell, repeat: 8 }
          - { track: cellos, pattern: cell, loop: true }
          - { track: tuba, pattern: tuba tune, loop: true }
          - { track: timpani, pattern: timpani, loop: true }
      - name: attack
        clips:
          - { track: basses, pattern: cell fast, repeat: 16 }
          - { track: cellos, pattern: cell fast high, loop: true }
          - { track: horns, pattern: horn call, loop: true }
          - { track: timpani, pattern: timpani, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: cymbal, pattern: cymbal, loop: true }
      - name: chase
        clips:
          - { track: basses, pattern: cell fast, repeat: 16, built_in: { chords: { enabled: true, mode: progression, chords: [1, 6, 4, 5], qualities: [~, ~, ~, M] } } }
          - { track: strings, pattern: stab, loop: true, built_in: { chords: { enabled: true, mode: progression, chords: [1, 6, 4, 5], qualities: [~, ~, ~, M] } } }
          - { track: horns, pattern: chase tune, loop: true }
          - { track: timpani, pattern: timpani, loop: true, built_in: { chords: { enabled: true, mode: progression, chords: [1, 6, 4, 5], qualities: [~, ~, ~, M] } } }
          - { track: snare, pattern: snare, loop: true }
      - name: calm
        tempo: 80
        clips:
          - { track: strings, pattern: held high, repeat: 8, built_in: { chords: { enabled: true, mode: progression, chords: [3, 7, 6, 3] } } }
          - { track: harp, pattern: held, loop: true, built_in: { chords: { enabled: true, mode: progression, chords: [3, 7, 6, 3] }, arp: { enabled: true, step: 1/8, order: up, octave_range: 2 } } }
          - { track: flute, pattern: calm tune, loop: true }
      - name: lurking again
        tempo: 70
        clips:
          - { track: basses, pattern: cell slow, repeat: 2 }
          - { track: tuba, pattern: tuba tune, loop: true }
      - name: last attack
        clips:
          - { track: basses, pattern: cell fast, repeat: 8 }
          - { track: cellos, pattern: cell fast high, loop: true }
          - { track: horns, pattern: horn call, loop: true }
          - { track: timpani, pattern: timpani, loop: true }
          - { track: snare, pattern: snare, loop: true }
          - { track: cymbal, pattern: cymbal, loop: true }
          - { track: strings, pattern: stab, loop: true, built_in: { chords: { enabled: true, mode: progression, chords: [1, 6, 4, 5], qualities: [~, ~, ~, M] } } }
      - name: ending
        tempo: 70
        clips:
          - { track: basses, pattern: cell slow, loop: true }
          - { track: cymbal, pattern: cymbal, repeat: 1 }
