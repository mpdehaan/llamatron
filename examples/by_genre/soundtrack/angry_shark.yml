arps:
  harp: { step: 1/8, order: up, octave_range: 2 }

progressions:
  chase: { chords: [1, 6, 4, 5], qualities: [~, ~, ~, M] }
  calm: { chords: [3, 7, 6, 3] }

chains:
  chase:
    - progression: chase
  calm:
    - progression: calm
  calm harp:
    - progression: calm
    - arp: harp

instruments:
  contrabass: { device: "*FluidSynth", gm_sound: 44 }
  cello: { device: "*FluidSynth", gm_sound: 43 }
  tuba: { device: "*FluidSynth", gm_sound: 59 }
  timpani: { device: "*FluidSynth", gm_sound: 48 }
  french horn: { device: "*FluidSynth", gm_sound: 61 }
  strings: { device: "*FluidSynth", gm_sound: 49 }
  harp: { device: "*FluidSynth", gm_sound: 47 }
  flute: { device: "*FluidSynth", gm_sound: 74 }
  drum kit: { device: "*FluidSynth" }

songs:
  angry_shark:
    tempo: 150
    scale: D Minor
    genre: Soundtrack

    tracks:
      cymbal: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      basses: { instrument: contrabass }
      cellos: { instrument: cello }
      tuba: { instrument: tuba }
      timpani: { instrument: timpani }
      horns: { instrument: french horn }
      strings: { instrument: strings }
      harp: { instrument: harp }
      flute: { instrument: flute }

    scenes:
      - name: lurking
        tempo: 70
        tracks:
          basses: { pattern: cell slow, repeat: 2 }
      - name: nearer
        tempo: 90
        tracks:
          basses: { pattern: cell, repeat: 8 }
          cellos: { pattern: cell slow, loop: true }
      - name: approach
        tempo: 120
        tracks:
          basses: { pattern: cell, repeat: 8 }
          cellos: { pattern: cell, loop: true }
          tuba: { pattern: tuba tune, loop: true }
          timpani: { pattern: timpani, loop: true }
      - name: attack
        tracks:
          basses: { pattern: cell fast, repeat: 16 }
          cellos: { pattern: cell fast high, loop: true }
          horns: { pattern: horn call, loop: true }
          timpani: { pattern: timpani, loop: true }
          snare: { pattern: snare, loop: true }
          cymbal: { pattern: cymbal, loop: true }
      - name: chase
        tracks:
          basses: { pattern: cell fast, chains: [chase], repeat: 16 }
          strings: { pattern: stab, chains: [chase], loop: true }
          horns: { pattern: chase tune, loop: true }
          timpani: { pattern: timpani, chains: [chase], loop: true }
          snare: { pattern: snare, loop: true }
      - name: calm
        tempo: 80
        tracks:
          strings: { pattern: held high, chains: [calm], repeat: 8 }
          harp: { pattern: held, chains: [calm harp], loop: true }
          flute: { pattern: calm tune, loop: true }
      - name: lurking again
        tempo: 70
        tracks:
          basses: { pattern: cell slow, repeat: 2 }
          tuba: { pattern: tuba tune, loop: true }
      - name: last attack
        tracks:
          basses: { pattern: cell fast, repeat: 8 }
          cellos: { pattern: cell fast high, loop: true }
          horns: { pattern: horn call, loop: true }
          timpani: { pattern: timpani, loop: true }
          snare: { pattern: snare, loop: true }
          cymbal: { pattern: cymbal, loop: true }
          strings: { pattern: stab, chains: [chase], loop: true }
      - name: ending
        tempo: 70
        tracks:
          basses: { pattern: cell slow, loop: true }
          cymbal: { pattern: cymbal, repeat: 1 }
