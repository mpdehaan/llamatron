version: 1.0.591
title: Four wheels G
description: "a mid-eighties synth film theme in the manner of Axel F (Harold Faltermeyer), with a hook of its own"
notes: |
  Four wheels G: a mid-eighties synth film theme in the manner of Axel F (Harold Faltermeyer), with a
  hook of its own. This is a homage to Axel F (Harold Faltermeyer): its chords, form, sounds and drums
  follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 3.

  The hook starts alone on a saw lead, short notes with gaps, then the drum machine, a sixteenth-note
  synth bass and synth brass stabs come in one at a time; i for two bars, then VI and VII; a second
  part on a marimba and a slow theme on bells.

  Subgenre: electro-funk film music of the mid eighties, all synthesizers. Drums: a drum machine, a
  syncopated kick, a big snare on two and four, claps. Tempo 117, straight. Bass: a funky synth line
  in sixteenths. Builds: layers enter one at a time. Sounds: a bright saw lead, synth brass stabs, a
  marimba-like second voice. Melody manner: a staccato hook with gaps. Form: hook alone, layers,
  second part, hook.

  Band and song: the piece is known for a hook that starts unaccompanied, and for building a whole
  track from five synth parts entering in turn.

  Checklist: it is good and memorable because the hook is all rhythm and attitude and you hear it bare
  first. The hook is the lead; the emotion is cocky; the lift is each new layer, the bass most; the
  contrast is the slow bell theme; the sounds are a saw lead, a synth bass, synth brass and a marimba.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/soundtrack/four_wheels_g.yml

  Scene 1, hook alone, 4 bars.
  Scene 2, drums, 8 bars.
  Scene 3, bass, 8 bars.
  Scene 4, second part, 8 bars.
  Scene 5, hook, 8 bars.
  Scene 6, bells, 16 bars.
  Scene 7, hook 2, 8 bars.
  Scene 8, break, 8 bars.
  Scene 9, second part 2, 8 bars.
  Scene 10, last hook, 12 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
