version: 1.0.227
title: Four wheels G
description: "a mid-eighties synth film theme in the manner of Axel F (Harold Faltermeyer), with a hook of its own"
notes: |
  Four wheels G: a synth theme at 118 beats a minute in F minor, in the manner of the mid-eighties
  action comedies: a staccato saw lead leaping octaves, a bouncing octave bass in sixteenths, chord
  stabs, bells and a drum machine with a clap. The hook is its own.

  The bass and the stabs are one bar each over chord i, moved by Progression: the hook goes
  i i iv v and the second part VI VII i i.

  Run it with: llamatron examples/by_genre/soundtrack/four_wheels_g.yml

  Scene 1, intro, 8 bars: the bass and the drums.
  Scene 2, hook, 16 bars: the hook.
  Scene 3, second part, 8 bars: the second part.
  Scene 4, hook 2, 16 bars: the hook again.
  Scene 5, bells, 8 bars: the drums and the bells.
  Scene 6, hook 3, 16 bars: the hook with the bells.
  Scene 7, second part 2, 8 bars: the second part again.
  Scene 8, last hook, 8 bars: the hook to the end.

  When changing this demo:
  - Keep the bass and the stabs one bar long over chord i.
  - Keep the hook original.
real_time: true
protected: true

