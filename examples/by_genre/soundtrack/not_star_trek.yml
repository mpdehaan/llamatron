songs:
  not_star_trek:
    tempo: 106
    scale: D Major
    genre: Soundtrack

    tracks:
      snare: { drum: true, instrument: drum kit }
      cymbal: { drum: true, instrument: drum kit }
      timpani: { instrument: timpani }
      strings: { instrument: strings }
      basses: { instrument: contrabass }
      brass: { instrument: brass section }
      horns: { instrument: french horn }
      trumpet: { instrument: trumpet }

    scenes:
      - name: opening
        tracks:
          snare: { pattern: roll, repeat: 4 }
          timpani: { pattern: timpani, chains: [fanfare], loop: true }
          brass: { pattern: held low, chains: [fanfare], loop: true }
      - name: fanfare
        tracks:
          strings: { pattern: held, chains: [fanfare], repeat: 16 }
          basses: { pattern: low, chains: [fanfare], loop: true }
          trumpet: { pattern: fanfare, loop: true }
          brass: { pattern: chords, chains: [fanfare], loop: true }
          timpani: { pattern: timpani, chains: [fanfare], loop: true }
          snare: { pattern: march, loop: true }
          cymbal: { pattern: cymbal, loop: true }
      - name: second theme
        tracks:
          strings: { pattern: second, repeat: 2 }
          basses: { pattern: low, chains: [second], loop: true }
          horns: { pattern: held low, chains: [second], loop: true }
      - name: fanfare 2
        tracks:
          strings: { pattern: held, chains: [fanfare], repeat: 8 }
          basses: { pattern: low, chains: [fanfare], loop: true }
          trumpet: { pattern: fanfare, loop: true }
          brass: { pattern: chords, chains: [fanfare], loop: true }
          timpani: { pattern: timpani, chains: [fanfare], loop: true }
          snare: { pattern: march, loop: true }
          horns: { pattern: fanfare, loop: true }
      - name: bridge
        tracks:
          strings: { pattern: held, chains: [bridge], repeat: 8 }
          basses: { pattern: low, chains: [bridge], loop: true }
          horns: { pattern: bridge, loop: true }
          timpani: { pattern: timpani, chains: [bridge], loop: true }
          snare: { pattern: march, loop: true }
      - name: second theme 2
        tracks:
          strings: { pattern: held, chains: [second], repeat: 8 }
          basses: { pattern: low, chains: [second], loop: true }
          trumpet: { pattern: second, loop: true }
          brass: { pattern: chords, chains: [second], loop: true }
          timpani: { pattern: timpani, chains: [second], loop: true }
          snare: { pattern: march, loop: true }
          horns: { pattern: held low, chains: [second], loop: true }
      - name: finale
        tracks:
          strings: { pattern: held, chains: [fanfare], repeat: 16 }
          basses: { pattern: low, chains: [fanfare], loop: true }
          trumpet: { pattern: fanfare, loop: true }
          brass: { pattern: chords, chains: [fanfare], loop: true }
          timpani: { pattern: timpani, chains: [fanfare], loop: true }
          snare: { pattern: march, loop: true }
          horns: { pattern: fanfare, loop: true }
          cymbal: { pattern: cymbal, loop: true }
      - name: ending
        tracks:
          snare: { pattern: roll, repeat: 4 }
          timpani: { pattern: timpani, chains: [fanfare], loop: true }
          brass: { pattern: held low, chains: [fanfare], loop: true }
          strings: { pattern: held, chains: [fanfare], loop: true }
          cymbal: { pattern: cymbal, loop: true }
