version: 1.0.364
title: Not star trek
description: "a majestic symphonic space-opera theme in the manner of the original Battlestar Galactica (Stu Phillips), with a fanfare of its own"
notes: |
  Not star trek: a majestic symphonic space-opera theme in the manner of the original Battlestar
  Galactica (Stu Phillips), with a fanfare of its own. This is a homage to the original Battlestar
  Galactica (Stu Phillips): its chords, form, sounds and drums follow that work as Claude knows it,
  and every tune and rhythm here is new. Rebuild version 2.

  A trumpet fanfare in dotted rhythms and leaps over brass chords, timpani and a marching snare,
  turning through the borrowed chords bVI and bVII back to I; a lyrical second theme on the strings; a
  bridge on the horns.

  Subgenre: symphonic space-opera television music of the late seventies. Drums: a marching snare,
  timpani, cymbals. Tempo 106, straight. Bass: contrabasses on the beats. Builds: orchestral, to a
  finale. Sounds: a trumpet, brass chords, horns, strings. Melody manner: a fanfare in dotted rhythms
  and leaps; a lyrical second theme. Form: fanfare, second theme, bridge, finale.

  Band and song: the theme is known for its heroic brass and for cadences through borrowed major
  chords.

  Checklist: it is good and memorable because the fanfare leaps and lands on bright unexpected chords.
  The hook is the trumpet fanfare; the emotion is heroic; the lift is the finale with horns doubling;
  the contrast is the string theme; the sounds are trumpet, brass section, French horns, strings and
  timpani.

  Run it with: llamatron examples/by_genre/soundtrack/not_star_trek.yml

  Scene 1, opening, 4 bars.
  Scene 2, fanfare, 16 bars.
  Scene 3, second theme, 16 bars.
  Scene 4, fanfare 2, 8 bars.
  Scene 5, bridge, 8 bars.
  Scene 6, second theme 2, 8 bars.
  Scene 7, finale, 16 bars.
  Scene 8, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

