version: 1.0.228
title: Not Star Trek
description: "a majestic symphonic space-opera theme in the manner of the original Battlestar Galactica (Stu Phillips), with a fanfare of its own"
notes: |
  Not Star Trek: a symphonic theme at 106 beats a minute in D major, in the manner of the original
  Battlestar Galactica's late-seventies television theme: horns with a heroic fanfare, trumpets
  taking it up, strings driving in triplets, a brass section's chords, low strings, timpani and a
  march on the snare. The fanfare and the melodies are its own.

  The strings' triplets, the low strings and the brass chords are one bar each over chord I, moved
  by Progression: the fanfare goes I IV I V, the second theme vi IV I V and the bridge vi iii IV V.
  The opening and the bridge rise from quiet to full by the scenes' Swell.

  Run it with: llamatron examples/by_genre/soundtrack/not_star_trek.yml

  Scene 1, opening, 8 bars: the strings and the timpani, swelling from quiet.
  Scene 2, fanfare, 16 bars: the horns with the fanfare.
  Scene 3, second theme, 16 bars: the trumpet with the second theme.
  Scene 4, fanfare 2, 16 bars: the fanfare on horns and trumpet together.
  Scene 5, bridge, 8 bars: a quieter bridge on the horns, swelling back.
  Scene 6, finale, 16 bars: the fanfare to the end, everything playing.

  When changing this demo:
  - Keep the strings, low strings and brass one bar long over chord I.
  - Keep the opening's and the bridge's swells.
  - Keep the fanfare original.
