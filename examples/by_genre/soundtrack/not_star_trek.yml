          - { track: trumpet, pattern: fanfare, loop: true }
          - { track: brass, pattern: chords, generators: [{ name: fanfare chords }], loop: true }
          - { track: timpani, pattern: timpani, generators: [{ name: fanfare chords }], loop: true }
          - { track: snare, pattern: march, loop: true }
          - { track: cymbal, pattern: cymbal, loop: true }
      - name: second theme
