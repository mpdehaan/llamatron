version: 1.0.365
title: "Imagination, imagination"
description: "a bouncing show tune for a theme-park ride about imagination, in the manner of One Little Spark (Richard M. Sherman and Robert B. Sherman), with tunes of its own"
notes: |
  Imagination, imagination: a bouncing show tune for a theme-park ride about imagination, in the
  manner of One Little Spark (Richard M. Sherman and Robert B. Sherman), with tunes of its own. This
  is a homage to One Little Spark (Richard M. Sherman and Robert B. Sherman): its chords, form, sounds
  and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 1.

  A chorus on I ii V, IV I VI II V with the woodwinds answering each line; a patter verse on I IV V,
  vi II V; a soft-shoe for the clarinet; each chorus a half step higher, from C to D; a tag with the
  last line three times.

  Subgenre: a theme-park ride's show tune of the early eighties, written as a vaudeville soft-shoe: a
  song a host and a small playful character sing to the riders, light enough for a child and crafted
  like a stage number. Drums: brushes, a soft kick in two, a closed hat, a woodblock for the soft-
  shoe. Tempo 124 with a light swing, a steady bounce. Bass: oom-pah, root and fifth. Sounds: a piano
  vamping chords on the offbeats, a clarinet and a flute answering the singer, muted brass stabbing at
  the ends of phrases, bells for sparkle, a light voice. Melody manner: a title phrase of a few quick
  notes and a long one, said twice and then turned; a patter verse of repeated notes that talks more
  than it sings; a middle that leaps a sixth; a last line said three times, the showman's way.

  Band and song: its two songwriter brothers are known for hooks a child sings after one hearing, for
  stepping the whole song up a key for each new chorus, and for chords borrowed from the music hall, a
  major chord on the sixth and the second degrees leading home. The song is an invitation: curiosity
  as a game, delight without irony.

  Checklist: it is good and memorable because the title phrase comes first, comes back at once and is
  answered by the woodwinds each time, as two characters finishing each other's sentences. The hook is
  the title phrase, heard on the clarinet before anyone sings; the emotion is innocent delight, with
  nostalgia in the middle's leap; the lift is each chorus a half step higher, with brass and bells;
  the contrast is the patter verse, and the soft-shoe for clarinet and woodblock; the sounds are a
  voice, a piano, an acoustic bass, a clarinet, a flute, muted brass and bells.

  Run it with: llamatron examples/by_genre/soundtrack/imagination_imagination.yml

  Scene 1, vamp, 4 bars.
  Scene 2, chorus, 16 bars.
  Scene 3, verse, 16 bars.
  Scene 4, chorus 2, 16 bars.
  Scene 5, soft-shoe, 8 bars.
  Scene 6, half a verse, 8 bars.
  Scene 7, chorus 3, 16 bars.
  Scene 8, tag, 8 bars.
  Scene 9, button, 1 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
