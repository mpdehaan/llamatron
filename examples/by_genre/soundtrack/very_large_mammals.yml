version: 1.0.591
title: Very large mammals
description: "a lumbering boogie-woogie film tune in the manner of Baby Elephant Walk (Henry Mancini), with a tune of its own"
notes: |
  Very large mammals: a lumbering boogie-woogie film tune in the manner of Baby Elephant Walk (Henry
  Mancini), with a tune of its own. This is a homage to Baby Elephant Walk (Henry Mancini): its
  chords, form, sounds and drums follow that work as Claude knows it, and every tune and rhythm here
  is new. Rebuild version 3.

  A twelve-bar blues: a boogie bass doubled by a tuba, so that it lumbers, an organ on the offbeats, a
  comic tune high on a calliope that leaves gaps, and brass answering in the gaps.

  Subgenre: comic film music of the early sixties over a boogie-woogie. Drums: a light swing on the
  ride, kick on one and three. Tempo 112, swung. Bass: a boogie figure, twelve bars. Builds: none.
  Sounds: a calliope high above, a tuba with the bass, brass that answers. Melody manner: short high
  phrases with gaps. Form: twelve-bar choruses.

  Band and song: the composer is known for cool, witty themes; this one for a tiny high tune over a
  heavy, lumbering bass.

  Checklist: it is good and memorable because of the joke in the sound, small over large. The hook is
  the calliope tune; the emotion is comic; the lift is the brass answering; the contrast is the walk
  with no organ; the sounds are a calliope, a tuba, an organ and brass.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  time-keeping and the chords lean on two and four, the bass walks into the first beat, and the notes
  between the beats are lighter; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/soundtrack/very_large_mammals.yml

  Scene 1, boogie, 12 bars.
  Scene 2, tune, 12 bars.
  Scene 3, horns, 12 bars.
  Scene 4, walk, 12 bars.
  Scene 5, tune 2, 12 bars.
  Scene 6, stomp, 12 bars.
  Scene 7, last tune, 12 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
