version: 1.0.227
title: Very large mammals
description: "a lumbering boogie-woogie film tune in the manner of Baby Elephant Walk (Henry Mancini), with a tune of its own"
notes: |
  Very large mammals: a boogie-woogie tune at 112 beats a minute in F major, shuffled by the factory
  groove 8th swing 66, in the manner of the early sixties film scores: a walking boogie bass, an
  organ on the off-beats, horn stabs and a calliope with a playful tune of its own.

  The boogie bass, the organ and the horns are one bar each over chord I, moved through the
  twelve-bar blues, I IV I I IV IV I I V IV I V, by a Progression, so every scene is a chorus of
  twelve bars. The horns play a dom7, which stays a dominant seventh on every chord.

  Run it with: llamatron examples/by_genre/soundtrack/very_large_mammals.yml

  Scene 1, boogie, 12 bars: the bass, the organ and the drums.
  Scene 2, tune, 12 bars: the calliope tune.
  Scene 3, horns, 12 bars: the tune with the horns.
  Scene 4, walk, 12 bars: the horns and the band, no tune.
  Scene 5, tune 2, 12 bars: the tune again.
  Scene 6, stomp, 12 bars: the bass and the drums alone.
  Scene 7, last tune, 12 bars: the tune with everything.

  When changing this demo:
  - Keep every scene a twelve-bar chorus.
  - Keep the horns' chord a dom7.
  - Keep the tune original.
