generators:
  - { name: sequence, kind: arp, step: 1/16, order: up, octave_range: 2 }
  - { name: drone, kind: progression, chords: [1, 1, 1, 1, 6, 6, 1, 1] }
  - { name: theme, kind: progression, chords: [1, 6, 4, 5] }
  - { name: rise, kind: swell, start: 60, end: 120, accent: 0 }
  - { name: drone chords, kind: chain, generators: [{ name: drone }] }
  - { name: theme chords, kind: chain, generators: [{ name: theme }] }
  - { name: drone arp, kind: chain, generators: [{ name: drone }, { name: sequence }] }
  - { name: theme arp, kind: chain, generators: [{ name: theme }, { name: sequence }] }
  - { name: rising arp, kind: chain, generators: [{ name: drone }, { name: sequence }, { name: rise }] }

instruments:
  - { name: saw lead, device: "*FluidSynth", gm_sound: 82 }
  - { name: synth bass, device: "*FluidSynth", gm_sound: 39 }
  - { name: sweep pad, device: "*FluidSynth", gm_sound: 96 }
  - { name: square lead, device: "*FluidSynth", gm_sound: 81 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: strange_woodworking
    tempo: 84
    scale: E Minor
    genre: Soundtrack

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: tom, drum: true, instrument: drum kit }
      - { name: sequence, instrument: saw lead }
      - { name: bass, instrument: synth bass }
      - { name: pad, instrument: sweep pad }
      - { name: lead, instrument: square lead }

    scenes:
      - name: sequence
        clips:
          - { track: sequence, pattern: chord, generators: [{ name: drone arp }], repeat: 8 }
      - name: gathering
        clips:
          - { track: sequence, pattern: chord, generators: [{ name: drone arp }], repeat: 8 }
          - { track: bass, pattern: pulse, generators: [{ name: drone chords }], loop: true }
          - { track: kick, pattern: kick, loop: true }
      - name: theme
        clips:
          - { track: sequence, pattern: triad, generators: [{ name: theme arp }], repeat: 16 }
          - { track: bass, pattern: pulse, generators: [{ name: theme chords }], loop: true }
          - { track: pad, pattern: held, generators: [{ name: theme chords }], loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: lead, pattern: theme, loop: true }
      - name: rise
        clips:
          - { track: sequence, pattern: chord, generators: [{ name: rising arp }], repeat: 8 }
          - { track: bass, pattern: pulse, generators: [{ name: drone chords }], loop: true }
          - { track: pad, pattern: held, generators: [{ name: drone chords }], loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: tom, pattern: tom, loop: true }
      - name: alone
        clips:
          - { track: pad, pattern: held, generators: [{ name: drone chords }], repeat: 4 }
      - name: theme 2
        clips:
          - { track: sequence, pattern: triad, generators: [{ name: theme arp }], repeat: 16 }
          - { track: bass, pattern: pulse, generators: [{ name: theme chords }], loop: true }
          - { track: pad, pattern: held, generators: [{ name: theme chords }], loop: true }
          - { track: kick, pattern: kick, loop: true }
          - { track: tom, pattern: tom, loop: true }
          - { track: lead, pattern: theme, loop: true }
      - name: ending
        clips:
          - { track: sequence, pattern: chord, generators: [{ name: drone arp }], repeat: 4 }
