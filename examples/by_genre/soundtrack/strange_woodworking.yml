arps:
  sequence: { step: 1/16, order: up, octave_range: 2 }

progressions:
  dark: { chords: [1, 6, 1, 6] }
  rise: { chords: [4, 6, 7, 5] }

chains:
  sequence:
    - arp: sequence
  dark:
    - progression: dark
  rise:
    - progression: rise

instruments:
  synth bass: { device: "*FluidSynth", gm_sound: 39 }
  halo pad: { device: "*FluidSynth", gm_sound: 95 }
  square lead: { device: "*FluidSynth", gm_sound: 81 }
  sequencer: { device: "*FluidSynth", gm_sound: 82 }
  drum kit: { device: "*FluidSynth" }

songs:
  strange_woodworking:
    tempo: 100
    scale: E Minor
    genre: Soundtrack

    tracks:
      kick: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit, euclid_hits: 7, euclid_steps: 16 }
      sequence: { instrument: sequencer }
      bass: { instrument: synth bass }
      pad: { instrument: halo pad }
      lead: { instrument: square lead }

    scenes:
      - name: sequence
        tracks:
          sequence: { pattern: sequence, chains: [dark, sequence], repeat: 8 }
      - name: gathering
        tracks:
          sequence: { pattern: sequence, chains: [dark, sequence], repeat: 8 }
          bass: { pattern: bass, chains: [dark, sequence], loop: true }
          pad: { pattern: pad, chains: [dark, sequence], loop: true }
      - name: theme
        tracks:
          kick: { pattern: kick, loop: true }
          hat: { pattern: hat, loop: true }
          sequence: { pattern: sequence, chains: [dark, sequence], loop: true }
          bass: { pattern: bass, chains: [dark, sequence], loop: true }
          pad: { pattern: pad, chains: [dark, sequence], loop: true }
          lead: { pattern: a, repeat: 2 }
      - name: rise
        tracks:
          kick: { pattern: kick, loop: true }
          hat: { pattern: hat, loop: true }
          sequence: { pattern: sequence, chains: [rise, sequence], loop: true }
          bass: { pattern: bass, chains: [rise, sequence], loop: true }
          pad: { pattern: pad, chains: [rise, sequence], loop: true }
          lead: { pattern: b, repeat: 2 }
      - name: alone
        tracks:
          sequence: { pattern: sequence, chains: [rise, sequence], repeat: 8 }
      - name: theme 2
        tracks:
          kick: { pattern: kick, loop: true }
          hat: { pattern: hat, loop: true }
          sequence: { pattern: sequence, chains: [dark, sequence], loop: true }
          bass: { pattern: bass, chains: [dark, sequence], loop: true }
          pad: { pattern: pad, chains: [dark, sequence], loop: true }
          lead: { pattern: a, repeat: 2 }
      - name: ending
        tracks:
          sequence: { pattern: sequence, chains: [dark, sequence], repeat: 4 }
          pad: { pattern: pad, chains: [dark, sequence], loop: true }
