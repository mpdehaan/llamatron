  drum kit: { device: "*FluidSynth" }

songs:
  strange_woodworking:
    tempo: 84
    scale: E Minor
    genre: Soundtrack

    tracks:
      kick: { drum: true, instrument: drum kit }
      tom: { drum: true, instrument: drum kit }
      sequence: { instrument: saw lead }
      bass: { instrument: synth bass }
      pad: { instrument: sweep pad }
      lead: { instrument: square lead }

    scenes:
      - name: sequence
        tracks:
          sequence: { pattern: chord, chains: [drone arp], repeat: 8 }
      - name: gathering
        tracks:
          sequence: { pattern: chord, chains: [drone arp], repeat: 8 }
          bass: { pattern: pulse, chains: [drone], loop: true }
          kick: { pattern: kick, loop: true }
      - name: theme
        tracks:
          sequence: { pattern: triad, chains: [theme arp], repeat: 16 }
          bass: { pattern: pulse, chains: [theme], loop: true }
          pad: { pattern: held, chains: [theme], loop: true }
          kick: { pattern: kick, loop: true }
          lead: { pattern: theme, loop: true }
      - name: rise
        tracks:
          sequence: { pattern: chord, chains: [rising arp], repeat: 8 }
          bass: { pattern: pulse, chains: [drone], loop: true }
          pad: { pattern: held, chains: [drone], loop: true }
          kick: { pattern: kick, loop: true }
          tom: { pattern: tom, loop: true }
      - name: alone
        tracks:
          pad: { pattern: held, chains: [drone], repeat: 4 }
      - name: theme 2
        tracks:
          sequence: { pattern: triad, chains: [theme arp], repeat: 16 }
          bass: { pattern: pulse, chains: [theme], loop: true }
          pad: { pattern: held, chains: [theme], loop: true }
          kick: { pattern: kick, loop: true }
          tom: { pattern: tom, loop: true }
          lead: { pattern: theme, loop: true }
      - name: ending
        tracks:
          sequence: { pattern: chord, chains: [drone arp], repeat: 4 }
