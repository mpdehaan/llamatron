version: 1.0.227
title: Strange woodworking
description: "a dark analog-synth score in the manner of Survive and John Carpenter, built on an arpeggiated sequence"
notes: |
  Strange woodworking: a dark synth score at 100 beats a minute in E minor, in the manner of Survive's
  music for Stranger Things and John Carpenter's films: a sequencer pulsing in sixteenths, a deep
  bass, a cold halo pad, a slow square-wave lead and a machine kick, with a hat that only plays
  where a Euclidean rhythm says.

  The sequence is a held chord broken into sixteenths over two octaves by an arpeggiator called
  sequence. The sequence, the bass and the pad are one bar each over chord i, moved by
  Progression: the main part goes i VI i VI and the rise iv VI VII v. The hat track's own
  Euclidean mask keeps 7 of every 16 sixteenths.

  Run it with: llamatron examples/by_genre/soundtrack/strange_woodworking.yml

  Scene 1, sequence, 8 bars: the sequence alone.
  Scene 2, gathering, 8 bars: the bass and the pad join.
  Scene 3, theme, 16 bars: the kick, the hat and the lead.
  Scene 4, rise, 16 bars: the second part.
  Scene 5, alone, 8 bars: the sequence alone again.
  Scene 6, theme 2, 16 bars: the theme again.
  Scene 7, ending, 4 bars: the pad fades with the sequence.

  When changing this demo:
  - Keep the sequence a held chord broken up by the arpeggiator.
  - Keep the hat's Euclidean mask on its track.
  - Keep the melody original.
