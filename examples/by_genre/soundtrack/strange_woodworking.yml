version: 1.0.364
title: Strange woodworking
description: "a dark analog-synth score in the manner of Survive and John Carpenter, built on an arpeggiated sequence"
notes: |
  Strange woodworking: a dark analog-synth score in the manner of Survive and John Carpenter, built on
  an arpeggiated sequence. This is a homage to the scores of Survive and John Carpenter: its chords,
  form, sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new.
  Rebuild version 2.

  One chord arpeggiated in sixteenths runs through everything, barely changing; a pulsing bass on one
  note, a slow pad, a heartbeat kick and a plain theme in long notes on i VI iv v.

  Subgenre: analog synth film and television scores, the late seventies style revived. Drums: a
  heartbeat kick, a few toms. Tempo 84, straight. Bass: one pulsing note. Builds: a slow opening of
  the sound. Sounds: an arpeggiated saw, a sweep pad, a square lead. Melody manner: long plain notes.
  Form: sequence, theme, rise, theme.

  Band and song: these scores are known for one arpeggiated chord that pulses for minutes, and for
  dread made from very little.

  Checklist: it is good and memorable because the sequence hypnotizes and barely changes. The hook is
  the arpeggio; the emotion is unease and wonder; the lift is the rise; the contrast is the pad alone;
  the sounds are a saw lead, a synth bass, a sweep pad.

  Run it with: llamatron examples/by_genre/soundtrack/strange_woodworking.yml

  Scene 1, sequence, 8 bars.
  Scene 2, gathering, 8 bars.
  Scene 3, theme, 16 bars.
  Scene 4, rise, 8 bars.
  Scene 5, alone, 4 bars.
  Scene 6, theme 2, 16 bars.
  Scene 7, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
