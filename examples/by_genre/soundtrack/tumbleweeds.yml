version: 1.0.365
title: Tumbleweeds
description: "an Italian western film theme of the sixties in the manner of the theme of The Good, the Bad and the Ugly (Ennio Morricone), with a tune of its own"
notes: |
  Tumbleweeds: an Italian western film theme of the sixties in the manner of the theme of The Good,
  the Bad and the Ugly (Ennio Morricone), with a tune of its own. This is a homage to the theme of The
  Good, the Bad and the Ugly (Ennio Morricone): its chords, form, sounds and drums follow that work as
  Claude knows it, and every tune and rhythm here is new. Rebuild version 2.

  Galloping tom-toms; an ocarina calls and men's voices answer; a twanging guitar plays the theme on i
  and a major IV; a trumpet climbs over choir and strings; a harmonica alone with a bell in the
  middle.

  Subgenre: Italian western film music of the sixties. Drums: no kit; tom-toms galloping, an eighth
  and two sixteenths, a low drum on one and three, a bell. Tempo 112, straight. Bass: plain roots.
  Builds: from one small voice to a trumpet over everything. Sounds: an ocarina or a whistle that
  calls, men's voices that grunt an answer, a twanging electric guitar with the theme, a harmonica, a
  trumpet, strings, a tubular bell. Melody manner: a short call and a blunt answer; a slow, wide
  theme; a trumpet climax in long notes. Form: call and answer, theme, call, climax, a quiet stretch,
  climax.

  Band and song: the composer is known for scores made of odd single sounds, a whistle, a voice, a
  guitar, a bell, each alone in a great space; this theme for a call that two different sounds trade.

  Checklist: it is good and memorable because each sound is a character, and the call is short enough
  to whistle walking away. The hook is the call and its answer; the emotion is a standoff, lonely and
  proud; the lift is the trumpet climax over choir and strings; the contrast is the harmonica alone
  with the bell; the sounds are an ocarina, a whistle, a choir, a clean electric guitar, a harmonica,
  a trumpet, strings and tubular bells.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/soundtrack/tumbleweeds.yml

  Scene 1, bell, 4 bars.
  Scene 2, call, 8 bars.
  Scene 3, theme, 16 bars.
  Scene 4, call 2, 8 bars.
  Scene 5, climax, 8 bars.
  Scene 6, theme 2, 8 bars.
  Scene 7, alone, 8 bars.
  Scene 8, climax 2, 16 bars.
  Scene 9, call 3, 4 bars.
  Scene 10, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

