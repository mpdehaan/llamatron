version: 1.0.227
title: "Get the traps, Egon"
description: "a mid-eighties spooky funk-pop film theme in the manner of Ghostbusters (Ray Parker Jr.), with a riff of its own"
notes: |
  Get the traps, Egon: a funk-pop film theme at 116 beats a minute in G mixolydian, in the manner of
  the mid-eighties comedy hits: a two-bar synth bass riff, chord stabs, a funk beat, a synth brass
  hook and a sci-fi wail for the ghosts. The riff and the hook are its own.

  The mixolydian scale gives the bass its flat seventh. The riff and the stabs are two bars long
  and play as written, and in the middle part a Progression moves them to IV IV I I.

  Run it with: llamatron examples/by_genre/soundtrack/get_the_traps_egon.yml

  Scene 1, intro, 8 bars: the bass riff and the drums.
  Scene 2, riff, 16 bars: the stabs join.
  Scene 3, hook, 16 bars: the brass hook.
  Scene 4, middle, 8 bars: the middle part, moved to IV and I.
  Scene 5, hook 2, 16 bars: the hook again.
  Scene 6, ghosts, 8 bars: the drums and the ghostly wail.
  Scene 7, last hook, 16 bars: the hook with the wail.

  When changing this demo:
  - Keep the riff and the stabs two bars long.
  - Keep the riff and the hook original.
real_time: true
protected: true

