version: 1.0.364
title: Get the traps Egon
description: "a mid-eighties spooky funk-pop film theme in the manner of Ghostbusters (Ray Parker Jr.), with a riff of its own"
notes: |
  Get the traps Egon: a mid-eighties spooky funk-pop film theme in the manner of Ghostbusters (Ray
  Parker Jr.), with a riff of its own. This is a homage to Ghostbusters (Ray Parker Jr.): its chords,
  form, sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new.
  Rebuild version 3.

  Every bar goes I for two beats, then bVII and IV for one each: synth brass hits and a muted funk
  guitar on the chords, a synth bass riff, a line that a shout answers, a middle on IV and V, and
  ghostly whistles over the drums.

  Subgenre: synth-funk pop of the mid eighties. Drums: a stomping machine beat, a big snare on two and
  four. Tempo 116, straight. Bass: a synth bass riff. Builds: none. Sounds: synth brass hits, a muted
  funk guitar, a shouted answer. Melody manner: a line and a shouted reply. Form: riff, hook, middle,
  a spooky break.

  Band and song: the song is known for the question a crowd answers, and for one bar of three chords
  repeated all through.

  Checklist: it is good and memorable because the crowd gets a part. The hook is the call and the
  shouted answer over the riff; the emotion is spooky fun; the lift is the hook with claps and voices;
  the contrast is the break of whistles over drums; the sounds are synth brass, a muted guitar, a
  voice lead and voices.

  Run it with: llamatron examples/by_genre/soundtrack/get_the_traps_egon.yml

  Scene 1, intro, 4 bars.
  Scene 2, riff, 8 bars.
  Scene 3, hook, 8 bars.
  Scene 4, riff 2, 4 bars.
  Scene 5, hook 2, 8 bars.
  Scene 6, middle, 8 bars.
  Scene 7, riff 3, 8 bars.
  Scene 8, ghosts, 8 bars.
  Scene 9, middle 2, 8 bars.
  Scene 10, last hook, 16 bars.
  Scene 11, riff out, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
