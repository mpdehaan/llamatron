version: 1.0.591
title: Secret chord
description: "Leonard Cohen's chords for Hallelujah in 6/8, played through a Progression, under a melody of its own"
notes: |
  Secret chord: Leonard Cohen's chords for Hallelujah in 6/8, played through a Progression, under a
  melody of its own. This is a homage to Hallelujah (Leonard Cohen): its chords, form, sounds and
  drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 4.

  In 6/8: a piano rolls each chord, a nylon guitar strums it, and a cello sings a tune of its own,
  plain in the verses; a choir and strings come in for the choruses, whose phrases are long falling
  notes. The chords are the song's, a whole step up.

  Subgenre: a slow folk ballad in 6/8 with a gospel chorus. Drums: none, a tambourine at the end.
  Tempo 84. Bass: one note a bar. Builds: voices and strings join. Sounds: a piano, a nylon guitar, a
  cello, a choir. Melody manner: a plain verse, a chorus of long notes. Form: verse, chorus.

  Band and song: the song is known for its rolling 6/8, its chords named in its words, and a chorus of
  one word.

  Checklist: it is good and memorable because it builds from one voice to a choir. The hook is the
  chorus; the emotion is reverent; the lift is the chorus, the cello an octave higher with choir and
  strings; the contrast is the verse; the sounds are a cello, a choir, a piano and a nylon guitar.

  Phrasing: the verse is eight two-bar lines in pairs, each begun by one soft pickup note and ended
  with a breath, the fifth to the seventh climbing; the chorus is one four-note statement made four
  times, each a separate sigh with a breath after, the last held.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/folk/secret_chord.yml

  Scene 1, intro, 4 bars.
  Scene 2, verse, 16 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, verse 2, 16 bars.
  Scene 5, chorus 2, 8 bars.
  Scene 6, verse 3, 16 bars.
  Scene 7, last chorus, 16 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
