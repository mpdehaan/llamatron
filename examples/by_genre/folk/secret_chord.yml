version: 1.0.227
title: Secret chord
description: "Leonard Cohen's chords for Hallelujah in 6/8, played through a Progression, under a melody of its own"
notes: |
  Secret chord: a slow ballad in 6/8 at 84 beats a minute in C major on the chords of Leonard Cohen's
  Hallelujah, with a melody of its own: a rolling piano, a bass, strings in the choruses and a
  cello singing the tune.

  The piano's broken chord, the bass and the strings are each one bar long over chord I, and the
  chords come from Progression chains, as the song goes: the verse C Am C Am F G C G, then
  C F G Am F G E Am, and the chorus F Am F C G C G C. The turnaround's E major is outside the
  scale, whose own chord on 3 is E minor, so that chord of the Progression names its Quality, M.

  Run it with: llamatron examples/by_genre/folk/secret_chord.yml

  Scene 1, intro, 4 bars: the piano alone.
  Scene 2, verse, 16 bars: the first verse.
  Scene 3, chorus, 8 bars: the chorus, with strings.
  Scene 4, verse 2, 16 bars: the second verse, a brush on the beats.
  Scene 5, chorus 2, 8 bars: the chorus.
  Scene 6, verse 3, 16 bars: the third verse.
  Scene 7, chorus 3, 8 bars: the chorus.
  Scene 8, last chorus, 8 bars: the last chorus, the piano and strings alone.

  When changing this demo:
  - Keep the piano, bass and strings one bar long over chord I, so that the progressions play the chords.
  - Keep the melody original: only the chords are the song.
