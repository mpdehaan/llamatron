version: 1.0.365
title: Bad pelican
description: "a galloping heavy metal epic of the mid eighties in the manner of Rime of the Ancient Mariner (Iron Maiden), with riffs and tunes of its own"
notes: |
  Bad pelican: a galloping heavy metal epic of the mid eighties in the manner of Rime of the Ancient
  Mariner (Iron Maiden), with riffs and tunes of its own. This is a homage to Rime of the Ancient
  Mariner (Iron Maiden): its chords, form, sounds and drums follow that work as Claude knows it, and
  every tune and rhythm here is new. Rebuild version 2.

  A bass and guitars galloping on i VI VII over a plain beat; a twin-guitar tune in thirds that opens
  the song and returns; a narrating verse and a broad chorus; a middle at 80 for a bass alone, a clean
  guitar remembering the tune and a pad; a build on tom-toms into a fast instrumental at 168; the
  chorus and the tune again at the gallop.

  Subgenre: British heavy metal of the mid eighties in its long, storytelling form. Drums: plain, one
  bass drum: the kick on one and three with a push, a snare on two and four and eighth hats, since the
  gallop belongs to the bass and the guitars; in the quiet middle no drums at all, then tom-toms
  building. Tempo 152 for the gallop, 80 in the quiet middle, 168 for the fast instrumental. Bass: the
  gallop itself, an eighth and two sixteenths, played loud and leading, and alone in the middle.
  Builds: the middle grows from a bass alone to the fastest part of the song. Sounds: a galloping
  bass, two guitars in harmony, a narrating high voice, a clean guitar and a low pad in the middle.
  Melody manner: a narrative verse of repeated notes; a broader chorus; one twin-guitar tune in thirds
  that keeps coming back. Form: gallop, the twin-guitar tune, verse, chorus, the tune, verse, chorus,
  a slow still middle, a build, a fast instrumental with a solo, chorus, the tune.

  Band and song: the band is known for a galloping bass that leads, two guitars in harmony and long
  songs that tell old stories; this song for its epic length and its becalmed middle, the bass alone
  in near silence before the storm returns.

  Checklist: it is good and memorable because it tells a voyage in its form, the gallop, the dead
  calm, the storm, and one guitar tune carries the listener through all of it. The hook is the twin-
  guitar tune over the gallop: it opens the song, returns after each chorus, is remembered slowly by
  the clean guitar in the calm, and ends the song; the emotion is adventure, then dread, then release;
  the lift is the fast instrumental after the build; the contrast is the quiet middle, a bass, a clean
  guitar and a pad at half the speed; the sounds are a pick bass, two distortion guitars, an
  overdriven guitar, a voice lead, a clean guitar and a warm pad.

  Run it with: llamatron examples/by_genre/metal/bad_pelican.yml

  Scene 1, gallop, 4 bars.
  Scene 2, twin guitars, 8 bars.
  Scene 3, verse, 16 bars.
  Scene 4, chorus, 8 bars.
  Scene 5, twin guitars again, 4 bars.
  Scene 6, verse 2, 8 bars.
  Scene 7, chorus 2, 8 bars.
  Scene 8, becalmed, 8 bars.
  Scene 9, the wind rises, 8 bars.
  Scene 10, storm, 8 bars.
  Scene 11, solo, 8 bars.
  Scene 12, last chorus, 8 bars.
  Scene 13, twin guitars to end, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
