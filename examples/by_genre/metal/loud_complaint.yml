version: 1.0.365
title: Loud complaint
description: "a fast, furious British heavy metal song of the early eighties in the manner of Screaming for Vengeance (Judas Priest), with riffs and tunes of its own"
notes: |
  Loud complaint: a fast, furious British heavy metal song of the early eighties in the manner of
  Screaming for Vengeance (Judas Priest), with riffs and tunes of its own. This is a homage to
  Screaming for Vengeance (Judas Priest): its chords, form, sounds and drums follow that work as
  Claude knows it, and every tune and rhythm here is new. Rebuild version 4.

  A riff with a flat second and a flat fifth for two guitars an octave apart over a plain, heavy beat;
  a verse barked on one note on i VI VII; a chorus of two shouts and a cry on i VI III VII with the
  kick on every beat and the band shouting; a twin-guitar tune, a solo from each guitar and a
  breakdown.

  Subgenre: British heavy metal of the early eighties, fast, precise and angry. Drums: plain and hard,
  one bass drum, never busy: the kick on one and three with a push before three, four to the bar under
  the chorus; a big snare on two and four; hats in eighths, the ride and a crash in the chorus; a
  short fill of snare and tom-toms closing every eight bars. Tempo 184, straight. Bass: eighths,
  steady. Builds: none; it starts at full speed, and a breakdown of kick, bass and muted guitar comes
  before the last chorus. Sounds: two distorted guitars on one riff an octave apart, power chords
  under the voice, a voice that spits the verse and cries out the chorus with the band shouting under
  it, two guitar solos traded. Melody manner: a verse barked on one note in short bursts, each burst
  bitten off by the note a half step above or by the flat fifth, the second half an octave up as the
  temper rises; a chorus of two shouts and a held cry, said three times and then one long cry at the
  top. Form: riff, verse, chorus, twin guitars, two solos, chorus.

  Band and song: the band is known for two lead guitars, a singer who goes from a snarl to a piercing
  cry, and a drummer who keeps a simple, heavy beat and leaves the speed to the guitars. The song is a
  threat: someone wronged past bearing, promising at the top of the voice to get even. Nothing in it
  is sad or resigned; it is rage with a plan.

  Checklist: it is good and memorable because it is all attack over a beat that never wavers, and the
  voice sounds like someone who has had enough. The hook is the riff with its flat second and flat
  fifth, then the chorus's two shouts and a cry; the emotion is fury and menace; the lift is the
  chorus, a kick on every beat, the ride, a crash and the band shouting along; the contrast is the
  breakdown; the sounds are two distortion guitars, an overdriven guitar on the chords, a voice lead
  kept in a man's chest range so that it bites and does not whistle, a choir for the shouts and a pick
  bass.

  Phrasing: the lines keep their spat-out bursts with gaps between; each burst is accented on its
  first note, the quick notes before a long one are softer, and the long screamed notes carry the
  strongest accents.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/metal/loud_complaint.yml

  Scene 1, riff, 8 bars.
  Scene 2, verse, 16 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, riff 2, 4 bars.
  Scene 5, verse 2, 8 bars.
  Scene 6, chorus 2, 8 bars.
  Scene 7, twin guitars, 16 bars.
  Scene 8, solo, first guitar, 8 bars.
  Scene 9, solo, second guitar, 8 bars.
  Scene 10, twin guitars 2, 8 bars.
  Scene 11, chorus 3, 16 bars.
  Scene 12, breakdown, 8 bars.
  Scene 13, last chorus, 16 bars.
  Scene 14, ending, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
