version: 1.0.364
title: Loud complaint
description: "a fast British heavy metal song of the early eighties in the manner of Screaming for Vengeance (Judas Priest), with riffs and tunes of its own"
notes: |
  Loud complaint: a fast British heavy metal song of the early eighties in the manner of Screaming for
  Vengeance (Judas Priest), with riffs and tunes of its own. This is a homage to Screaming for
  Vengeance (Judas Priest): its chords, form, sounds and drums follow that work as Claude knows it,
  and every tune and rhythm here is new. Rebuild version 1.

  A riff for two guitars a third apart over a kick in constant eighths; a clipped verse on i VI VII; a
  chorus of long high notes on i VI III VII; a twin-guitar tune, a solo from each guitar and a
  breakdown.

  Subgenre: British heavy metal of the early eighties, fast and precise. Drums: the kick in constant
  eighths like two bass drums, a hard snare on two and four, eighth hats, the ride and a crash in the
  chorus. Tempo 184, straight. Bass: eighths locked to the kick. Builds: none; it starts at full
  speed, and a breakdown of kick, bass and muted guitar comes before the last chorus. Sounds: two
  distorted guitars, one riff in harmony a third apart, power chords under the voice, a singer in a
  very high scream, two guitar solos traded. Melody manner: a clipped verse; a chorus of long high
  notes held like screams; twin-guitar tunes in thirds. Form: riff, verse, chorus, twin guitars, two
  solos, chorus.

  Band and song: the band is known for two lead guitars in harmony and a singer with a piercing high
  register; the song for speed, a relentless kick and a chorus screamed at the top of the voice.

  Checklist: it is good and memorable because it is all attack: nothing lets up, and the voice goes
  higher than seems possible. The hook is the twin-guitar riff, then the screamed chorus; the emotion
  is fury; the lift is the chorus, long notes an octave above the verse over the ride and a crash; the
  contrast is the breakdown; the sounds are two distortion guitars, an overdriven guitar on the
  chords, a voice lead and a pick bass.

  Run it with: llamatron examples/by_genre/metal/loud_complaint.yml

  Scene 1, riff, 8 bars.
  Scene 2, verse, 16 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, riff 2, 4 bars.
  Scene 5, verse 2, 8 bars.
  Scene 6, chorus 2, 8 bars.
  Scene 7, twin guitars, 16 bars.
  Scene 8, solo, first guitar, 8 bars.
  Scene 9, solo, second guitar, 8 bars.
  Scene 10, twin guitars 2, 8 bars.
  Scene 11, chorus 3, 16 bars.
  Scene 12, breakdown, 8 bars.
  Scene 13, last chorus, 16 bars.
  Scene 14, ending, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
