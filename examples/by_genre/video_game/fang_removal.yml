version: 1.0.227
title: Fang removal
description: "a gothic eight-bit stage theme in the manner of Castlevania's Vampire Killer (Kinuyo Yamashita and Satoe Terashima), with a melody of its own"
notes: |
  Fang removal: a gothic stage theme at 150 beats a minute in D harmonic minor, in the manner of the
  eight-bit castle games: a square-wave lead, a second square a third below it, a driving octave
  bass and a busy kit. The melody is its own.

  The harmonic minor scale makes the fifth chord major, with its sharp seventh, which gives the
  style its gothic pull. The bass is one bar over chord i, moved by Progression: the A part goes
  i VI iv V and the B part iv i V i. The harmony track plays the lead's pattern transposed two
  scale steps down.

  Run it with: llamatron examples/by_genre/video_game/fang_removal.yml

  Scene 1, intro, 8 bars: the bass and the drums.
  Scene 2, A, 16 bars: the lead.
  Scene 3, B, 8 bars: the second part.
  Scene 4, A harmony, 16 bars: the lead with its harmony.
  Scene 5, bridge, 8 bars: the harmony alone.
  Scene 6, A 2, 16 bars: the lead again.
  Scene 7, B 2, 8 bars: the second part with harmony.
  Scene 8, A 3, 16 bars: the lead with harmony.
  Scene 9, last A, 16 bars: the lead to the end.

  When changing this demo:
  - Keep the harmonic minor scale.
  - Keep the harmony track a transposed copy of the lead.
  - Keep the melody original.
