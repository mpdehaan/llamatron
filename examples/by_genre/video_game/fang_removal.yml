version: 1.0.364
title: Fang removal
description: "a gothic eight-bit stage theme in the manner of Castlevania's Vampire Killer (Kinuyo Yamashita and Satoe Terashima), with a melody of its own"
notes: |
  Fang removal: a gothic eight-bit stage theme in the manner of Castlevania's Vampire Killer (Kinuyo
  Yamashita and Satoe Terashima), with a melody of its own. This is a homage to Castlevania's Vampire
  Killer (Kinuyo Yamashita and Satoe Terashima): its chords, form, sounds and drums follow that work
  as Claude knows it, and every tune and rhythm here is new. Rebuild version 2.

  Three voices and noise, as the old console had: a square lead with a jumping, syncopated tune, a
  bass in octaves in sixteenths, and a second square that plays each chord as a fast arpeggio; the
  chords fall i VII VI to a major V.

  Subgenre: eight-bit console stage music of the late eighties. Drums: noise, a plain rock beat. Tempo
  150, straight. Bass: octaves in sixteenths. Builds: none. Sounds: two square waves and a bass.
  Melody manner: a syncopated, jumping lead; chords as fast arpeggios. Form: A, B, A.

  Band and song: the piece is known for a driving bass and a tune that jumps on the offbeats.

  Checklist: it is good and memorable because three voices sound like a band. The hook is the lead
  over the bass; the emotion is gothic drive; the lift is the B strain; the contrast is the bridge
  without the lead; the sounds are square leads and a synth bass.

  Run it with: llamatron examples/by_genre/video_game/fang_removal.yml

  Scene 1, intro, 4 bars.
  Scene 2, A, 16 bars.
  Scene 3, B, 8 bars.
  Scene 4, A 2, 8 bars.
  Scene 5, bridge, 8 bars.
  Scene 6, A 3, 16 bars.
  Scene 7, B 2, 8 bars.
  Scene 8, A 4, 16 bars.
  Scene 9, B 3, 8 bars.
  Scene 10, last A, 16 bars.
  Scene 11, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
