version: 1.0.227
title: Incoming message
description: "nine minutes after Mega Man 2's intro and boss themes (Takashi Tateishi): ten stages, each a theme of its own, ending on the intro"
notes: |
  Incoming message: nine minutes of stage themes at 150 beats a minute, after Mega Man 2's intro and boss
  themes and the great Japanese game composers: ten stages, each in a key of its own, changing theme
  exactly nine times, with a one-bar fill and a rising chip arpeggio between each, and the last a
  reprise of the first. Every theme is its own.

  Each stage's patterns are named after it, stage_0 to stage_9. Each stage is two scenes, the tune
  and the tune doubled by a harmony two scale steps below, and every scene sets its stage's scale.
  The chip track plays a held chord broken into thirty-second notes by the arpeggiator called chip,
  the way the old sound chips played chords, and a Progression for each stage moves it and the bass.
  The tune passes between instruments fit for the composers and the bands that play their music: a
  square wave, a distortion guitar and a saw lead.

  Run it with: llamatron examples/by_genre/video_game/incoming_message.yml

  Scene 1, stage_0, dawn, 16 bars: dawn, in E minor, on the square.
  Scene 2, stage_0, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 3, to stage_1, 1 bars: a one-bar fill into stage_1.
  Scene 4, stage_1, the first boss, 16 bars: the first boss, in A minor, on the guitar.
  Scene 5, stage_1, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 6, to stage_2, 1 bars: a one-bar fill into stage_2.
  Scene 7, stage_2, the sky fortress, 16 bars: the sky fortress, in D major, on the square.
  Scene 8, stage_2, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 9, to stage_3, 1 bars: a one-bar fill into stage_3.
  Scene 10, stage_3, the machine works, 16 bars: the machine works, in C minor, on the saw.
  Scene 11, stage_3, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 12, to stage_4, 1 bars: a one-bar fill into stage_4.
  Scene 13, stage_4, the bubble lake, 16 bars: the bubble lake, in F major, on the square.
  Scene 14, stage_4, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 15, to stage_5, 1 bars: a one-bar fill into stage_5.
  Scene 16, stage_5, the steel wall, 16 bars: the steel wall, in B minor, on the guitar.
  Scene 17, stage_5, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 18, to stage_6, 1 bars: a one-bar fill into stage_6.
  Scene 19, stage_6, the clockwork garden, 16 bars: the clockwork garden, in G major, on the square.
  Scene 20, stage_6, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 21, to stage_7, 1 bars: a one-bar fill into stage_7.
  Scene 22, stage_7, the long fall, 16 bars: the long fall, in D dorian, on the saw.
  Scene 23, stage_7, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 24, to stage_8, 1 bars: a one-bar fill into stage_8.
  Scene 25, stage_8, the doctor's castle, 16 bars: the doctor's castle, in C# harmonic minor, on the guitar.
  Scene 26, stage_8, doubled, 16 bars: the tune again with a harmony two steps below.
  Scene 27, to stage_9, 1 bars: a one-bar fill into stage_9.
  Scene 28, stage_9, dawn again, 16 bars: dawn again, in E minor, on the square.
  Scene 29, stage_9, doubled, 16 bars: the tune again with a harmony two steps below.

  When changing this demo:
  - Keep the patterns named after their stage.
  - Keep exactly nine changes of theme, with a one-bar fill between each.
  - Keep the last stage a reprise of the first.
  - Keep the themes original.
