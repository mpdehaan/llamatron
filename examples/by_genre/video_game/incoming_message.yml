version: 1.0.591
title: Incoming message
description: "nine minutes after Mega Man 2's intro and boss themes (Takashi Tateishi): ten stages, each a theme of its own, ending on the first"
notes: |
  Incoming message: nine minutes after Mega Man 2's intro and boss themes (Takashi Tateishi): ten
  stages, each a theme of its own, ending on the first. This is a homage to Mega Man 2's themes
  (Takashi Tateishi): its chords, form, sounds and drums follow that work as Claude knows it, and
  every tune and rhythm here is new. Rebuild version 3.

  Ten stages, each in a key of its own, changing theme exactly nine times, with a one-bar fill and a
  rising chip arpeggio between each, and the last a reprise of the first with everything playing.
  Every theme is its own. Each stage's patterns are named after it, stage_0 to stage_9, and a
  Progression of sixteen chords carries each stage's bass, arpeggio and guitar.

  Subgenre: the stage themes of late eighties Japanese action games, rock songs written for three
  voices and a noise channel. Drums: a rock beat that changes with the stage, a kick on one and three
  with a push, four to the bar, or broken; a snare on two and four with a fill each eight bars; hats
  in eighths or sixteenths. Tempo 150, never slowing. Bass: eighths, a gallop or octaves on the root,
  by stage. Sounds: a square lead with the tune, a second voice a third below, a chip arpeggio
  spinning each chord in sixteenths, a saw doubling the tune low, a distortion guitar's chords. Melody
  manner: a minor-key tune of eight bars with a strong rhythm of its own, then a second strain that
  lifts over other chords and ends on the major dominant to turn round.

  Band and song: the game's music is known for tunes strong enough to be played by rock bands decades
  later, each stage's theme a character, minor keys at a run, and a second strain that always lifts.

  Checklist: it is good and memorable because every stage is a different tune over the same
  unstoppable drive, and each is heard twice, plain and then with the whole machine. The hook of each
  stage is its first two bars; the emotion is urgency and courage; the lift is each stage's second
  strain and its doubled repeat, with the harmony, the arpeggio and the guitar; the contrast is each
  stage's key, beat and bass, and the one-bar fill with a rising arpeggio between stages; the sounds
  are a square lead, a harmony voice, a chip, a saw lead, a synth bass and a distortion guitar.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/video_game/incoming_message.yml

  Scene 1, stage_0, dawn, 16 bars.
  Scene 2, stage_0, doubled, 16 bars.
  Scene 3, to stage_1, 1 bars.
  Scene 4, stage_1, the first boss, 16 bars.
  Scene 5, stage_1, doubled, 16 bars.
  Scene 6, to stage_2, 1 bars.
  Scene 7, stage_2, the sky fortress, 16 bars.
  Scene 8, stage_2, doubled, 16 bars.
  Scene 9, to stage_3, 1 bars.
  Scene 10, stage_3, the machine works, 16 bars.
  Scene 11, stage_3, doubled, 16 bars.
  Scene 12, to stage_4, 1 bars.
  Scene 13, stage_4, the bubble lake, 16 bars.
  Scene 14, stage_4, doubled, 16 bars.
  Scene 15, to stage_5, 1 bars.
  Scene 16, stage_5, the forest of wires, 16 bars.
  Scene 17, stage_5, doubled, 16 bars.
  Scene 18, to stage_6, 1 bars.
  Scene 19, stage_6, the frozen gate, 16 bars.
  Scene 20, stage_6, doubled, 16 bars.
  Scene 21, to stage_7, 1 bars.
  Scene 22, stage_7, the deep vault, 16 bars.
  Scene 23, stage_7, doubled, 16 bars.
  Scene 24, to stage_8, 1 bars.
  Scene 25, stage_8, the last climb, 16 bars.
  Scene 26, stage_8, doubled, 16 bars.
  Scene 27, to stage_9, 1 bars.
  Scene 28, stage_9, dawn again, 16 bars.
  Scene 29, stage_9, doubled, 16 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
