version: 1.0.591
title: Dangerous to go alone
description: "an adventure game's two themes run end to end, a heroic overworld march and an eerie dungeon, in the manner of The Legend of Zelda's overworld and dungeon themes (Koji Kondo), with tunes of its own"
notes: |
  Dangerous to go alone: an adventure game's two themes run end to end, a heroic overworld march and
  an eerie dungeon, in the manner of The Legend of Zelda's overworld and dungeon themes (Koji Kondo),
  with tunes of its own. This is a homage to The Legend of Zelda's overworld and dungeon themes (Koji
  Kondo): its chords, form, sounds and drums follow that work as Claude knows it, and every tune and
  rhythm here is new. Rebuild version 2.

  A fanfare on I, VII, VI and V; the march, its second strain and the march again; a fall down the
  stairs; the dungeon's figure on i VII VI V, then with its slow tune; a climb back; the march once
  more with everything.

  Subgenre: the music of a mid-eighties adventure game for a console with two square voices, a
  triangle bass and a noise channel. Drums: the noise channel as a marching snare, a long note and two
  short over and over, with a soft kick; none in the dungeon but a slow heartbeat on a low drum. Tempo
  140 for the overworld, 120 for the dungeon. Bass: a gallop on the root above ground, long low notes
  below. Sounds: a square lead, a second square a third below, a chip arpeggio, a triangle bass; in
  the dungeon a thinner pulse with the figure and a hollow lead. Melody manner: above ground a march
  in a major key that borrows the chords a whole step and two whole steps below the key note, bold
  dotted rhythms and leaps; below ground a figure of sixteenths that sinks a step with each chord,
  under a slow tune with a flat second.

  Band and song: the game's music is known for an overworld theme that sounds like setting out, heroic
  and a little wistful because of its borrowed chords, and a dungeon theme of nothing but a looping,
  sinking figure that makes every room feel the same and worse.

  Checklist: it is good and memorable because the two halves are the same adventure, daylight and then
  the dark, and the march comes back at the end as relief. The hook is the march's first two bars; the
  emotion is courage, then dread, then courage again; the lift is the march's second strain on IV, and
  the harmony joining; the contrast is the dungeon, slower, with no drums; the sounds are two square
  leads, a chip, a synth bass and a noise snare.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/video_game/dangerous_to_go_alone.yml

  Scene 1, fanfare, 4 bars.
  Scene 2, overworld, 8 bars.
  Scene 3, overworld, two voices, 8 bars.
  Scene 4, second strain, 8 bars.
  Scene 5, overworld again, 8 bars.
  Scene 6, down the stairs, 1 bars.
  Scene 7, dungeon, 8 bars.
  Scene 8, dungeon, deeper, 8 bars.
  Scene 9, dungeon, deepest, 16 bars.
  Scene 10, up the stairs, 1 bars.
  Scene 11, daylight, 8 bars.
  Scene 12, second strain again, 8 bars.
  Scene 13, last march, 8 bars.
  Scene 14, ending, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
