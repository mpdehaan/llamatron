version: 1.0.591
title: In another castle
description: "a platform game's four worlds and a victory, each with sounds of its own, in the manner of the themes of Super Mario Bros. (Koji Kondo), with tunes of its own"
notes: |
  In another castle: a platform game's four worlds and a victory, each with sounds of its own, in the
  manner of the themes of Super Mario Bros. (Koji Kondo), with tunes of its own. This is a homage to
  the themes of Super Mario Bros. (Koji Kondo): its chords, form, sounds and drums follow that work as
  Claude knows it, and every tune and rhythm here is new. Rebuild version 2.

  World one, the bouncing tune and its middle; a pipe down; world two, the underground riff, then with
  a creeping answer; a pipe; world three, the waltz twice, the second time with harp and strings; a
  pipe; the castle; the victory fanfare and a last chord.

  Subgenre: the music of a mid-eighties platform game, written for two square voices, a triangle bass
  and noise, here given different sounds for each world as the request for this demo asked. Drums:
  above ground a light kit, a kick, a snare on the backbeat and a ticking hat; underground only a
  click; under water none; in the castle timpani; a crash for the victory. Tempo: 100 above and below
  ground, 120 for the waltz, 132 for the castle, 120 for the fanfare. Bass: bouncing root and fifth
  above ground; the underground riff is its own bass; oom-pah-pah under water; a held organ pedal in
  the castle. Sounds: square leads above ground; a slap bass and a marimba underground; a music box, a
  harp and strings under water; an organ, a harpsichord and low brass in the castle; brass and bells
  for the victory. Melody manner: above ground a syncopated, bouncing tune that never lands on the
  beat twice running; underground a riff of octave jumps and silences that slides down by half steps;
  under water a sweet waltz of long notes; in the castle a fast figure coiling round the key note and
  its flat second, climbing by minor thirds; then rising arpeggios on I, the flat VI, the flat VII and
  I.

  Band and song: the game's music is known for a first tune as cheerful as a tune can be, a second of
  almost nothing that is slightly worrying, a waltz for swimming, a castle theme that will not sit
  still, and a few bars of fanfare that mean it is over, for now.

  Checklist: it is good and memorable because each world is a different band and a different feeling,
  joined by one falling figure, the pipe. The hook is the first world's bouncing tune; the emotion
  goes from happy to uneasy to dreamy to tense to triumphant; the lift is the victory after the
  castle; the contrast is every change of world; the sounds change with each.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/video_game/in_another_castle.yml

  Scene 1, start, 1 bars.
  Scene 2, world one, 8 bars.
  Scene 3, world one, middle, 4 bars.
  Scene 4, world one again, 8 bars.
  Scene 5, pipe, 1 bars.
  Scene 6, world two, underground, 8 bars.
  Scene 7, world two, something follows, 8 bars.
  Scene 8, pipe again, 1 bars.
  Scene 9, world three, under water, 12 bars.
  Scene 10, world three, deeper, 12 bars.
  Scene 11, last pipe, 1 bars.
  Scene 12, the castle, 8 bars.
  Scene 13, the castle, the bridge, 8 bars.
  Scene 14, victory, 4 bars.
  Scene 15, the last chord, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
