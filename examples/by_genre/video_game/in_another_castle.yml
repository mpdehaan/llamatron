progressions:
  one: { chords: [1, 1, 4, 4, 5, 5, 1, 1] }
  middle: { chords: [4, 1, 4, 5] }
  castle: { chords: [1, 1, 3, 3, 5, 5, 7, 7], accidentals: [~, ~, ~, ~, b, b, b, b] }
  win: { chords: [1, 6, 7, 1], accidentals: [~, b, b, ~] }

chains:
  one:
    - progression: one
  middle:
    - progression: middle
  castle:
    - progression: castle
  win:
    - progression: win

instruments:
  square lead: { device: "*FluidSynth", gm_sound: 81 }
  second square: { device: "*FluidSynth", gm_sound: 81 }
  synth bass: { device: "*FluidSynth", gm_sound: 39 }
  slap bass: { device: "*FluidSynth", gm_sound: 37 }
  marimba: { device: "*FluidSynth", gm_sound: 13 }
  clavinet: { device: "*FluidSynth", gm_sound: 8 }
  music box: { device: "*FluidSynth", gm_sound: 11 }
  harp: { device: "*FluidSynth", gm_sound: 47 }
  strings: { device: "*FluidSynth", gm_sound: 49 }
  acoustic bass: { device: "*FluidSynth", gm_sound: 33 }
  church organ: { device: "*FluidSynth", gm_sound: 20 }
  harpsichord: { device: "*FluidSynth", gm_sound: 7 }
  low brass: { device: "*FluidSynth", gm_sound: 58 }
  brass: { device: "*FluidSynth", gm_sound: 62 }
  bells: { device: "*FluidSynth", gm_sound: 15 }
  drum kit: { device: "*FluidSynth" }

songs:
  in_another_castle:
    tempo: 100
    scale: G Major
    genre: Video Game

    tracks:
      kick: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      click: { drum: true, instrument: drum kit }
      timpani: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      lead: { instrument: square lead }
      harmony: { instrument: second square }
      bass: { instrument: synth bass }
      riff: { instrument: slap bass }
      riff high: { instrument: marimba }
      creep: { instrument: clavinet }
      box: { instrument: music box }
      harp: { instrument: harp }
      strings: { instrument: strings }
      waltz bass: { instrument: acoustic bass }
      organ: { instrument: church organ }
      harpsichord: { instrument: harpsichord }
      menace: { instrument: low brass }
      brass: { instrument: brass }
      bells: { instrument: bells }

    scenes:
      - name: start
        tracks:
          hat: { pattern: hat, repeat: 1 }
          bass: { pattern: bounce, loop: true }
      - name: world one
        tracks:
          kick: { pattern: kick, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bounce, chains: [one], loop: true }
          lead: { pattern: world one, loop: true }
      - name: "world one, middle"
        tracks:
          kick: { pattern: kick, repeat: 4 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bounce, chains: [middle], loop: true }
          lead: { pattern: middle, loop: true }
          harmony: { pattern: middle harmony, loop: true }
      - name: world one again
        tracks:
          kick: { pattern: kick, repeat: 8 }
          snare: { pattern: snare, loop: true }
          hat: { pattern: hat, loop: true }
          bass: { pattern: bounce, chains: [one], loop: true }
          lead: { pattern: world one, loop: true }
          harmony: { pattern: world one harmony, loop: true }
      - name: pipe
        tracks:
          lead: { pattern: pipe, repeat: 1 }
      - name: "world two, underground"
        scale: E Minor
        tracks:
          riff: { pattern: under, repeat: 2 }
          riff high: { pattern: under high, loop: true }
      - name: "world two, something follows"
        scale: E Minor
        tracks:
          riff: { pattern: under, repeat: 2 }
          riff high: { pattern: under high, loop: true }
          creep: { pattern: creep, loop: true }
          click: { pattern: click, loop: true }
      - name: pipe again
        scale: E Minor
        tracks:
          riff high: { pattern: pipe, repeat: 1 }
      - name: "world three, under water"
        scale: D Major
        tempo: 120
        tracks:
          box: { pattern: waltz, repeat: 1 }
          waltz bass: { pattern: oom, loop: true }
          harp: { pattern: pah, loop: true }
      - name: "world three, deeper"
        scale: D Major
        tempo: 120
        tracks:
          box: { pattern: waltz, repeat: 1 }
          bells: { pattern: waltz high, loop: true }
          waltz bass: { pattern: oom, loop: true }
          harp: { pattern: harp, loop: true }
          strings: { pattern: strings, loop: true }
      - name: last pipe
        scale: A Minor
        tempo: 132
        tracks:
          box: { pattern: pipe, repeat: 1 }
      - name: the castle
        scale: A Minor
        tempo: 132
        tracks:
          harpsichord: { pattern: coil, chains: [castle], repeat: 8 }
          organ: { pattern: pedal, chains: [castle], loop: true }
          timpani: { pattern: timpani, loop: true }
      - name: "the castle, the bridge"
        scale: A Minor
        tempo: 132
        tracks:
          harpsichord: { pattern: coil, chains: [castle], repeat: 8 }
          creep: { pattern: coil high, chains: [castle], loop: true }
          organ: { pattern: pedal, chains: [castle], loop: true }
          menace: { pattern: menace, loop: true }
          timpani: { pattern: timpani, loop: true }
          crash: { pattern: crash, loop: true }
      - name: victory
        tempo: 120
        tracks:
          brass: { pattern: win, chains: [win], repeat: 4 }
          bells: { pattern: win high, chains: [win], loop: true }
          bass: { pattern: win bass, chains: [win], loop: true }
          crash: { pattern: crash, loop: true }
          snare: { pattern: snare, loop: true }
      - name: the last chord
        tempo: 120
        tracks:
          brass: { pattern: last, repeat: 1 }
          bells: { pattern: last, loop: true }
          bass: { pattern: last bass, loop: true }
          crash: { pattern: crash, loop: true }
          kick: { pattern: kick, loop: true }
