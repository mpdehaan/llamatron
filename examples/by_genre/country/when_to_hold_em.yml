version: 1.0.365
title: "When to hold 'em"
description: "a country story song of the late seventies in the manner of The Gambler (Don Schlitz, as Kenny Rogers recorded it), with a tune of its own"
notes: |
  When to hold 'em: a country story song of the late seventies in the manner of The Gambler (Don
  Schlitz, as Kenny Rogers recorded it), with a tune of its own. This is a homage to The Gambler (Don
  Schlitz, as Kenny Rogers recorded it): its chords, form, sounds and drums follow that work as Claude
  knows it, and every tune and rhythm here is new. Rebuild version 2.

  A Guitarify picks a bass note and strums each chord of I, IV and V; the fiddle opens with the chorus
  phrase; a quick verse and a chorus of one phrase climbing step by step; the third verse and all
  after a half step up; one chorus over hand claps and a kick alone.

  Subgenre: a country story ballad of the late seventies, a tale told in verses with a chorus of
  advice. Drums: a soft kick on one and three and brushes on two and four, nothing else, and hand
  claps where the band drops out. Tempo 172 counted in two, straight. Bass: root and fifth, one and
  three. Builds: the key rises a half step for the third verse, and one chorus is sung over claps
  alone. Sounds: an acoustic guitar picking a bass note and strumming, a warm low voice, a fiddle,
  voices joining the chorus. Melody manner: a chorus made of one short phrase said four times, the
  same rhythm each time, three quick notes leading into it, each a step higher than the last, like a
  list of rules; a verse that runs in quick notes up an arch and settles. Form: the fiddle plays the
  chorus phrase, verse, verse, chorus, verse a half step up, chorus, chorus over claps, chorus.

  Band and song: the singer is known for a warm, grainy voice that tells a story plainly; the song for
  its tale of a stranger's advice, its three chords, its half-step lift, and a chorus that is a list
  of rules, each line cut to the same pattern so that a room can sing it after one hearing.

  Checklist: it is good and memorable because the chorus says one thing four ways to one rhythm, and
  the band stepping away makes the room sing. The hook is that chorus phrase, heard first on the
  fiddle and then thirty-two times in the choruses; the emotion is weary wisdom; the lift is the
  phrase climbing a step each time, the half step up, then the chorus with voices; the contrast is the
  chorus over claps alone; the sounds are a voice lead, a choir, a steel-string guitar that a
  Guitarify picks and strums, a fiddle and an acoustic bass.

  Run it with: llamatron examples/by_genre/country/when_to_hold_em.yml

  Scene 1, fiddle, 8 bars.
  Scene 2, verse 1, 16 bars.
  Scene 3, verse 2, 16 bars.
  Scene 4, chorus, 16 bars.
  Scene 5, verse 3, 16 bars.
  Scene 6, chorus 2, 16 bars.
  Scene 7, chorus over claps, 16 bars.
  Scene 8, last chorus, 16 bars.
  Scene 9, ending, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

