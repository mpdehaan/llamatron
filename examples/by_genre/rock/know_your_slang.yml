version: 1.0.227
title: Know your slang
description: "an indie rock song in the manner of the Shins' New Slang and Know Your Onion, with melodies of its own"
notes: |
  Know your slang: an indie rock song at 116 beats a minute in G major, in two moods after the Shins:
  the lilting acoustic strum and tambourine of New Slang, and the jangling electric guitar and
  full kit of Know Your Onion. The melodies are its own.

  The steel guitar strums with the track's own Strum, down and up as a hand would, and the strum,
  the bass and the jangle are one bar each over chord I, moved by Progression: the verse goes
  I V vi IV, the chorus IV I V V and the jangling part I IV vi V.

  Run it with: llamatron examples/by_genre/rock/know_your_slang.yml

  Scene 1, intro, 4 bars: the strummed guitar alone.
  Scene 2, verse, 16 bars: the acoustic verse, tambourine and a soft kick.
  Scene 3, chorus, 16 bars: the chorus.
  Scene 4, jangle, 16 bars: the electric guitar and the full kit.
  Scene 5, verse 2, 16 bars: the acoustic verse again.
  Scene 6, jangle 2, 16 bars: the jangling part with its tune.
  Scene 7, outro, 4 bars: the strum alone.

  When changing this demo:
  - Keep the strum, the bass and the jangle one bar long over chord I.
  - Keep the strum on the guitar track.
  - Keep the melodies original.
