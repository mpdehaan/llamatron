version: 1.0.365
title: Know your slang
description: "an upbeat indie rock song in two moods after the Shins' New Slang and Know Your Onion: a bass-and-strum acoustic guitar with a tambourine, then a jangling electric guitar at a faster tempo"
notes: |
  Know your slang: an upbeat indie rock song in two moods after the Shins' New Slang and Know Your
  Onion: a bass-and-strum acoustic guitar with a tambourine, then a jangling electric guitar at a
  faster tempo. This is a homage to New Slang and Know Your Onion (the Shins): its chords, form,
  sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 5.

  A bass note and a strum to each chord, a tambourine in eighths and a busy bass; the second half
  faster and jangling, with a chorus of its own.

  Subgenre: indie pop of the early two thousands, acoustic and jangling. Drums: a light beat, a
  tambourine in eighths, a side stick. Tempo 132, straight. Bass: busy. Builds: a faster jangling
  half. Sounds: a strummed acoustic guitar, a jangling electric. Melody manner: a wandering sung line.
  Form: two halves, each with a chorus.

  Band and song: the band is known for bittersweet tunes over bright strumming.

  Checklist: it is good and memorable because the strum never stops and the tune floats over it. The
  hook is the strum and the tune; the emotion is bittersweet; the lift is the jangling half; the
  contrast is the first half; the sounds are acoustic and electric guitars.

  Phrasing: the lines are gentle and short, a bar or two each with a breath after, and the wordless
  refrain is set apart from them by rests on either side.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/know_your_slang.yml

  Scene 1, intro, 4 bars.
  Scene 2, verse, 16 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, jangle, 16 bars.
  Scene 5, jangle chorus, 8 bars.
  Scene 6, verse 2, 16 bars.
  Scene 7, chorus 2, 8 bars.
  Scene 8, jangle 2, 16 bars.
  Scene 9, jangle chorus 2, 8 bars.
  Scene 10, outro, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

