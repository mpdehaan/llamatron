version: 1.0.364
title: Volcano
description: "a solo guitar showpiece in the manner of Van Halen's Eruption: picked runs, a dive, a fast study and tapped arpeggios, none of which comes back"
notes: |
  Volcano: a solo guitar showpiece of a minute and a half in E minor. This is a homage to Eruption
  by Van Halen: like that solo it is short, the band hits one chord and leaves the guitar alone, and
  the guitar goes through episodes that never come back, each at its own tempo, ending in tapped
  arpeggios and a dive. Every note is its own, and it stays out of that solo's key.

  The picked runs, the wide held notes, the two dives and the trill are written out, note by note.
  The rest is made by generators. The tremolo is two bars of eighth notes: an AutoRatchet chops
  each into four, and a Drift called climb moves the notes up the scale a little at random every
  half bar. The study is four figures of half a bar, which a Progression takes round the circle of
  fifths in minor, a chord every half bar. The tapping is a triad held twice a bar: a Progression
  of sixteen chords moves it, a Voice leading keeps each chord near the last, and an arpeggiator
  breaks it into sixteenth-note triplets from the top note down. The higher tapping has no
  Progression: a Drift called restless moves the triad every half bar, climbing, and an arpeggiator
  runs it up and down two octaves. The song has a seed, so the Drifts choose the same notes on
  every play.

  Run it with: llamatron examples/by_genre/rock/volcano.yml

  Scene 1, hit, 2 bars at 100: the band hits a chord a bar.
  Scene 2, picking, 4 bars at 126: fast picked runs in sextuplets, low to high.
  Scene 3, bends, 4 bars at 96: wide held notes.
  Scene 4, dive, 1 bar at 96: a chromatic fall of nearly three octaves.
  Scene 5, tremolo, 6 bars at 138: tremolo picking that climbs.
  Scene 6, study, 8 bars at 144: a fast study in a classical manner.
  Scene 7, shake, 2 bars at 90: a trill, a held note and a silence.
  Scene 8, tapping, 8 bars at 150: tapped arpeggios, the chords moving by small steps.
  Scene 9, tapping higher, 8 bars at 168: wider arpeggios, climbing.
  Scene 10, last dive, 2 bars at 96: a fall of three octaves to the low string.
  Scene 11, last chord, 2 bars at 80: the band comes back for one chord.

  When changing this demo:
  - Keep the guitar alone between the band's first chord and its last.
  - Keep every episode different: nothing comes back, and nothing repeats by the bar.
  - Keep it about a minute and a half, an exception to the three minutes of the other demos.
  - Keep every note its own: nothing of the solo is used.
