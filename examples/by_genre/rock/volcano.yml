version: 1.0.227
title: Volcano
description: "a solo guitar showpiece in the manner of Van Halen's Eruption: runs, trills and tapped arpeggios"
notes: |
  Volcano: a solo guitar showpiece at 120 beats a minute in E minor, in the manner of Van Halen's
  Eruption: the band hits a chord and leaves the guitar alone for runs in thirty-second notes,
  trills, and tapped arpeggios in sextuplets, before the band comes back to end it.

  The runs are one bar, moved by a Progression through i i VI VII. The tapping is a held chord broken
  up by an arpeggiator called tapping, in sixteenth-note triplets over two octaves, up and down,
  while a Progression moves the chord through i VI iv v.

  Run it with: llamatron examples/by_genre/rock/volcano.yml

  Scene 1, hits, 8 bars: the band hits a chord a bar.
  Scene 2, runs, 16 bars: the guitar alone, running.
  Scene 3, tapping, 32 bars: the tapped arpeggios.
  Scene 4, trill, 8 bars: a trill.
  Scene 5, tapping 2, 16 bars: the tapping with the bass.
  Scene 6, ending, 8 bars: the band back, the guitar running over it.

  When changing this demo:
  - Keep the tapping a held chord broken up by the arpeggiator.
  - Keep the guitar alone between the band's hits.
real_time: true
protected: true

