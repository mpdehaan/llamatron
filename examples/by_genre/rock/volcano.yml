version: 1.0.591
title: Volcano
description: "a solo guitar showpiece in the manner of Van Halen's Eruption: picked runs, bends, a dive, a fast study and tapped arpeggios, with the opening run coming back at the end"
notes: |
  Volcano: a solo guitar showpiece in the manner of Van Halen's Eruption: picked runs, bends, a dive,
  a fast study and tapped arpeggios, with the opening run coming back at the end. This is a homage to
  Van Halen's Eruption: picked runs: its chords, form, sounds and drums follow that work as Claude
  knows it, and every tune and rhythm here is new. Rebuild version 4.

  The band hits one chord and leaves; picked runs, bends, a dive, tremolo picking, a study on a circle
  of chords that a Progression moves, tremolo picking that an AutoRatchet chops into four and a Drift
  pushes upward, arpeggios tapped in sextuplets by an Arpeggiator on i VI VII V and again wider on i
  VI iv V, the opening run once more, a last dive and a last chord. It stays out of that solo's key.

  Subgenre: the unaccompanied guitar solo of late seventies hard rock, a minute and a half of one
  player showing everything the instrument can do. Drums: one hit with the band at the start and one
  at the end, nothing between. Tempo: each episode at its own, from 80 to 144. Bass: with the band's
  two hits only. Sounds: one distortion guitar, a rhythm guitar and a bass for the hits. Melody
  manner: episodes rather than a tune, picked runs that climb in threes, wide bends held long, a dive
  on the bar, tremolo picking, a study that could be a violin exercise, and arpeggios tapped with both
  hands.

  Band and song: the solo is known for arriving on a record with no warning, for the tapping that
  every guitarist then had to learn, and for sounding improvised though every episode has a shape.

  Checklist: it is good and memorable because each episode is a new trick and none overstays. The hook
  is the tapped arpeggios, the trick everyone remembers, and the opening run, which returns before the
  end; the emotion is exuberance, a player showing off and enjoying it; the lift is each rise in
  speed, to the tapping an octave higher; the contrast is the slow bends between the fast parts; the
  sounds are a distortion guitar, and a rhythm guitar, a pick bass, a kick and a crash for the two
  hits.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: every
  part leans on the first beat of the bar and a little on the middle one, and the notes between the
  beats are lighter; a note pushed ahead of the beat and held over it is accented. The kick, snare and
  crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/volcano.yml

  Scene 1, hit, 1 bars.
  Scene 2, picking, 4 bars.
  Scene 3, bends, 4 bars.
  Scene 4, dive, 2 bars.
  Scene 5, tremolo, 4 bars.
  Scene 6, study, 8 bars.
  Scene 7, tapping, 8 bars.
  Scene 8, tapping higher, 8 bars.
  Scene 9, picking again, 4 bars.
  Scene 10, last dive, 2 bars.
  Scene 11, last chord, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

