generators:
  - { name: tapping, kind: arp, step: 1/24, order: down }
  - { name: tapping wide, kind: arp, step: 1/24, order: up_down, octave_range: 2 }
  - { name: tremolo, kind: auto_ratchet, counts: [4] }
  - { name: climb, kind: drift, every: 1/2, steps_to_b: 12, direction: forward, seed: 7, restart: on_new_scene, a_degree: 0, b_degree: 4, a_degree_random: 1, b_degree_random: 2 }
  - { name: study, kind: progression, chords: [1, 4, 7, 3, 6, 2, 5, 1], qualities: [~, ~, ~, ~, ~, ~, M, ~] }
  - { name: tap, kind: progression, chords: [1, 6, 7, 5], qualities: [~, ~, ~, M] }
  - { name: tap high, kind: progression, chords: [1, 6, 4, 5], qualities: [~, ~, ~, M] }
  - { name: study chords, kind: chain, generators: [{ name: study }] }
  - { name: tap chords, kind: chain, generators: [{ name: tap }, { name: tapping }] }
  - { name: tap high chords, kind: chain, generators: [{ name: tap high }, { name: tapping wide }] }
  - { name: tremolo ratchet, kind: chain, generators: [{ name: climb }, { name: tremolo }] }

instruments:
  - { name: rhythm guitar, device: "*FluidSynth", gm_sound: 30 }
  - { name: pick bass, device: "*FluidSynth", gm_sound: 35 }
  - { name: distortion guitar, device: "*FluidSynth", gm_sound: 31 }
  - { name: drum kit, device: "*FluidSynth" }

songs:
  - name: volcano
    tempo: 100
    scale: E Minor
    genre: Rock

    tracks:
      - { name: kick, drum: true, instrument: drum kit }
      - { name: crash, drum: true, instrument: drum kit }
      - { name: rhythm, instrument: rhythm guitar }
      - { name: bass, instrument: pick bass }
      - { name: guitar, instrument: distortion guitar }

    scenes:
      - name: hit
        clips:
          - { track: kick, pattern: hit kick, repeat: 1 }
          - { track: crash, pattern: hit crash, loop: true }
          - { track: rhythm, pattern: hit chord, loop: true }
          - { track: bass, pattern: hit bass, loop: true }
      - name: picking
        tempo: 132
        clips:
          - { track: guitar, pattern: run, repeat: 1 }
      - name: bends
        tempo: 80
        clips:
          - { track: guitar, pattern: bends, repeat: 1 }
      - name: dive
        clips:
          - { track: guitar, pattern: dive, repeat: 1 }
      - name: tremolo
        tempo: 138
        clips:
          - { track: guitar, pattern: tremolo, generators: [{ name: tremolo ratchet }], repeat: 2 }
      - name: study
        tempo: 126
        clips:
          - { track: guitar, pattern: study, generators: [{ name: study chords }], repeat: 8 }
      - name: tapping
        tempo: 126
        clips:
          - { track: guitar, pattern: tap chord, generators: [{ name: tap chords }], repeat: 8 }
      - name: tapping higher
        tempo: 132
        clips:
          - { track: guitar, pattern: tap chord, generators: [{ name: tap high chords }], repeat: 8 }
      - name: picking again
        tempo: 138
        clips:
          - { track: guitar, pattern: run, repeat: 1 }
      - name: last dive
        clips:
          - { track: guitar, pattern: dive, repeat: 1 }
      - name: last chord
        tempo: 80
        clips:
          - { track: kick, pattern: hit kick, repeat: 2 }
          - { track: crash, pattern: hit crash, loop: true }
          - { track: rhythm, pattern: last, loop: true }
          - { track: bass, pattern: hit bass, loop: true }
          - { track: guitar, pattern: last, loop: true }
