arps:
  tapping: { step: 1/24, order: down }
  tapping wide: { step: 1/24, order: up_down, octave_range: 2 }

auto_ratchets:
  tremolo: { counts: [4] }

drifts:
  climb: { every: 1/2, steps_to_b: 12, direction: forward, seed: 7, restart: on_new_scene, a_degree: 0, b_degree: 4, a_degree_random: 1, b_degree_random: 2 }

progressions:
  study: { chords: [1, 4, 7, 3, 6, 2, 5, 1], qualities: [~, ~, ~, ~, ~, ~, M, ~] }
  tap: { chords: [1, 6, 7, 5], qualities: [~, ~, ~, M] }
  tap high: { chords: [1, 6, 4, 5], qualities: [~, ~, ~, M] }

chains:
  study:
    - progression: study
  tap:
    - progression: tap
    - arp: tapping
  tap high:
    - progression: tap high
    - arp: tapping wide
  tremolo:
    - drift: climb
    - auto_ratchet: tremolo

instruments:
  rhythm guitar: { device: "*FluidSynth", gm_sound: 30 }
  pick bass: { device: "*FluidSynth", gm_sound: 35 }
  distortion guitar: { device: "*FluidSynth", gm_sound: 31 }
  drum kit: { device: "*FluidSynth" }

songs:
  volcano:
    tempo: 100
    scale: E Minor
    genre: Rock

    tracks:
      kick: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      rhythm: { instrument: rhythm guitar }
      bass: { instrument: pick bass }
      guitar: { instrument: distortion guitar }

    scenes:
      - name: hit
        tracks:
          kick: { pattern: hit kick, repeat: 1 }
          crash: { pattern: hit crash, loop: true }
          rhythm: { pattern: hit chord, loop: true }
          bass: { pattern: hit bass, loop: true }
      - name: picking
        tempo: 132
        tracks:
          guitar: { pattern: run, repeat: 1 }
      - name: bends
        tempo: 80
        tracks:
          guitar: { pattern: bends, repeat: 1 }
      - name: dive
        tracks:
          guitar: { pattern: dive, repeat: 1 }
      - name: tremolo
        tempo: 138
        tracks:
          guitar: { pattern: tremolo, chains: [tremolo], repeat: 2 }
      - name: study
        tempo: 126
        tracks:
          guitar: { pattern: study, chains: [study], repeat: 8 }
      - name: tapping
        tempo: 126
        tracks:
          guitar: { pattern: tap chord, chains: [tap], repeat: 8 }
      - name: tapping higher
        tempo: 132
        tracks:
          guitar: { pattern: tap chord, chains: [tap high], repeat: 8 }
      - name: picking again
        tempo: 138
        tracks:
          guitar: { pattern: run, repeat: 1 }
      - name: last dive
        tracks:
          guitar: { pattern: dive, repeat: 1 }
      - name: last chord
        tempo: 80
        tracks:
          kick: { pattern: hit kick, repeat: 2 }
          crash: { pattern: hit crash, loop: true }
          rhythm: { pattern: last, loop: true }
          bass: { pattern: hit bass, loop: true }
          guitar: { pattern: last, loop: true }
