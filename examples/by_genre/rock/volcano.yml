arps:
  tapping: { step: 1/24, order: down }
  tapping wide: { step: 1/24, order: up_down, octave_range: 2 }

auto_ratchets:
  tremolo: { counts: [4] }

drifts:
  climb: { every: 1/2, steps_to_b: 12, direction: forward, seed: 7, restart: on_new_scene, a_degree: 0, b_degree: 4, a_degree_random: 1, b_degree_random: 2 }
  restless: { every: 1/2, steps_to_b: 16, direction: forward, seed: 11, restart: on_new_scene, a_degree: -2, b_degree: 5, a_degree_random: 2, b_degree_random: 3 }

progressions:
  circle: { chords: [1, 4, 7, 3, 6, 2, 5, 1], every: 1/2 }
  steps: { chords: [1, 6, 4, 5, 1, 7, 3, 6, 4, 2, 7, 3, 6, 4, 5, 1], every: 1/2 }

voice_leadings:
  near: { lowest_octave: 5, highest_octave: 6 }

chains:
  tremolo:
    - drift: climb
    - auto_ratchet: tremolo
  etude:
    - progression: circle
  tap:
    - progression: steps
    - voice_leading: near
    - arp: tapping
  tap high:
    - drift: restless
    - arp: tapping wide

instruments:
  distortion guitar: { device: "*FluidSynth", gm_sound: 31 }
  rhythm guitar: { device: "*FluidSynth", gm_sound: 31 }
  pick bass: { device: "*FluidSynth", gm_sound: 35 }
  drum kit: { device: "*FluidSynth" }

