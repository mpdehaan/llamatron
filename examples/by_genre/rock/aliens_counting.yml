version: 1.0.227
title: Aliens counting
description: "a mid-eighties synth-rock anthem in the manner of The Final Countdown (Europe), with a fanfare of its own"
notes: |
  Aliens counting: a synth-rock anthem at 118 beats a minute in F sharp minor, in the manner of the mid
  eighties: a synth brass fanfare in sixteenths, power chords, a pick bass, a pad and a rock beat
  with crashes. The fanfare and the verse are its own.

  The guitar, the bass and the pad are one bar each over chord i, moved by Progression: the
  fanfare goes i VI iv v and the verse i i VI VII.

  Run it with: llamatron examples/by_genre/rock/aliens_counting.yml

  Scene 1, intro, 8 bars: the pad alone.
  Scene 2, fanfare, 8 bars: the brass fanfare.
  Scene 3, verse, 16 bars: the verse.
  Scene 4, fanfare 2, 8 bars: the fanfare again.
  Scene 5, verse 2, 16 bars: the second verse.
  Scene 6, fanfare 3, 8 bars: the fanfare.
  Scene 7, solo, 8 bars: the fanfare an octave down on the voice.
  Scene 8, last fanfare, 16 bars: the fanfare to the end.

  When changing this demo:
  - Keep the guitar, bass and pad one bar long over chord i.
  - Keep the fanfare original.
real_time: true
protected: true

