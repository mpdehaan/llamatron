version: 1.0.365
title: Aliens counting
description: "a mid-eighties synth-rock anthem in the manner of The Final Countdown (Europe), with a fanfare of its own"
notes: |
  Aliens counting: a mid-eighties synth-rock anthem in the manner of The Final Countdown (Europe),
  with a fanfare of its own. This is a homage to The Final Countdown (Europe): its chords, form,
  sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 2.

  A fanfare on i VI iv VII and i VI iv V; a verse on i i VI VII; a chorus on the fanfare's chords,
  each line answered by the brass; a guitar solo, a breakdown and a last chorus twice.

  Subgenre: Swedish arena rock of the middle eighties, a hard rock band fronted by a synthesizer
  fanfare. Drums: big and plain, a kick on one and three with a push, a huge snare on two and four,
  hats in eighths, a crash at each section, a snare fill each eight bars. Tempo 118. Bass: a gallop on
  the root, a long note and two short, all through. Sounds: a synth brass fanfare, power chords, a
  pad, a high clear voice, a guitar solo. Melody manner: a fanfare of quick pickups into long notes; a
  verse that starts after the beat and waits; a chorus of one short line that the fanfare answers.

  Band and song: the band is known for this one fanfare, played on a keyboard like a call to launch,
  and for a song about leaving Earth that sounds like a victory.

  Checklist: it is good and memorable because the fanfare is the song: it opens it, answers the chorus
  and closes it. The hook is the fanfare; the emotion is triumph with a farewell in it; the lift is
  the chorus over the fanfare's chords with the brass answering each line; the contrast is the
  breakdown, the fanfare soft over the pad alone; the sounds are synth brass, a distortion guitar, a
  pick bass, a polysynth pad and a voice.

  Phrasing: the lines keep their lengths and rests; each verse line's two quick opening notes are soft
  pickups, each line is accented where it lands and at its highest note, and every line now ends with
  a breath.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/aliens_counting.yml

  Scene 1, fanfare, 8 bars.
  Scene 2, verse, 8 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, fanfare 2, 8 bars.
  Scene 5, verse 2, 8 bars.
  Scene 6, chorus 2, 8 bars.
  Scene 7, solo, 8 bars.
  Scene 8, breakdown, 4 bars.
  Scene 9, last chorus, 16 bars.
  Scene 10, last fanfare, 8 bars.
  Scene 11, ending, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
