version: 1.0.362
title: Aliens counting
description: "a mid-eighties synth-rock anthem in the manner of The Final Countdown (Europe), with a fanfare of its own"
notes: |
  Aliens counting: a synth-rock anthem at 118 beats a minute in E minor, in the manner of the mid
  eighties: a synth brass fanfare in sixteenths, power chords, a pick bass, a pad and a rock beat
  with crashes. This is a homage to The Final Countdown by Europe: the chords of the fanfare and of
  the verse are that song's, in another key, and the fanfare, the verse's tune, the solo and every
  rhythm are its own.

  The guitar's pattern is one held note a bar, the bass and the pad one bar each over chord i. A
  Progression moves them, i VI iv VII under the fanfare and i i iv iv in the verse, and a Guitarify
  after it in the guitar's chain makes each note a power chord and plays it: three ringing down
  strokes a bar under the fanfare, a muted gallop in sixteenths in the verse and the solo, and one
  held chord a bar at the end.

  Run it with: llamatron examples/by_genre/rock/aliens_counting.yml

  Scene 1, intro, 8 bars: the pad alone.
  Scene 2, fanfare, 8 bars: the brass fanfare over ringing power chords.
  Scene 3, verse, 16 bars: the voice over the galloping guitar.
  Scene 4, fanfare 2, 8 bars: the fanfare again.
  Scene 5, verse 2, 16 bars: the second verse.
  Scene 6, solo, 16 bars: the voice's solo over the gallop and the fanfare's chords.
  Scene 7, last fanfare, 16 bars: the fanfare and the solo together.
  Scene 8, ending, 2 bars: a held chord and a crash.

  When changing this demo:
  - Keep the guitar one held note a bar, moved by a Progression and made power chords by a Guitarify.
  - Keep the fanfare, the tunes and the rhythms its own: only the chords are the song's.
  - Keep it out of F sharp minor, the song's key.
real_time: true
protected: true

