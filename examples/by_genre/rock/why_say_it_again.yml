version: 1.0.591
title: Why say it again
description: "a taut new wave song of the late seventies in the manner of Psycho Killer (Talking Heads), with a bass line and tunes of its own"
notes: |
  Why say it again: a taut new wave song of the late seventies in the manner of Psycho Killer (Talking
  Heads), with a bass line and tunes of its own. This is a homage to Psycho Killer (Talking Heads):
  its chords, form, sounds and drums follow that work as Claude knows it, and every tune and rhythm
  here is new. Rebuild version 2.

  A staccato bass alone, then a plain kit and two thin guitars; a clipped verse on a dominant I and a
  flat VII; a stuttering chorus on flat VI, flat VII and a minor i; a bridge of long notes; a coda of
  scratching guitar.

  Subgenre: New York new wave and art-funk of the late seventies, dry and wiry. Drums: tight and plain
  with no fills to speak of, a kick on every beat, a dry snare on two and four, closed eighth hats.
  Tempo 122, straight. Bass: the centre of the song, a sparse staccato line that starts alone and
  never loosens. Builds: instruments enter one at a time; a scratching guitar coda. Sounds: a bass,
  two thin clean guitars, one chopping chords on the offbeats and one picking single notes, a nervous
  voice. Melody manner: clipped, half-spoken verse phrases with long gaps; a chorus that stutters on
  one note; a bridge of long notes, as if in another language. Form: bass, drums, guitar, verse,
  chorus, bridge, a noisy coda.

  Band and song: the band is known for nervous funk played without ornament, and a singer who sounds
  wound tight; the song for a bass line that opens it alone, a stuttered chorus and a calm, strange
  bridge.

  Checklist: it is good and memorable because of tension that never breaks: little happens, exactly,
  and the stutter sticks. The hook is the bass line, then the stuttered chorus; the emotion is anxiety
  held still; the lift is the chorus, moving to borrowed major chords with the voice an octave up; the
  contrast is the bridge of long notes; the sounds are a finger bass, two clean guitars, an overdriven
  guitar for the coda and a voice lead.

  Phrasing: the verse and chorus keep their clipped, nervous lines with long silences between; the
  stutters are accented on their first note and their highest; the bridge's long lines now take a
  breath in each bar.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/why_say_it_again.yml

  Scene 1, bass, 4 bars.
  Scene 2, drums, 4 bars.
  Scene 3, guitar, 4 bars.
  Scene 4, verse, 16 bars.
  Scene 5, chorus, 8 bars.
  Scene 6, verse 2, 8 bars.
  Scene 7, chorus 2, 8 bars.
  Scene 8, bridge, 8 bars.
  Scene 9, verse 3, 8 bars.
  Scene 10, chorus 3, 8 bars.
  Scene 11, coda, 12 bars.
  Scene 12, bass again, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
