version: 1.0.364
title: "Gain distance, pedestrian"
description: "a funky hard rock song of the early seventies in the manner of Walk Away (James Gang), with a riff and tunes of its own"
notes: |
  Gain distance, pedestrian: a funky hard rock song of the early seventies in the manner of Walk Away
  (James Gang), with a riff and tunes of its own. This is a homage to Walk Away (James Gang): its
  chords, form, sounds and drums follow that work as Claude knows it, and every tune and rhythm here
  is new. Rebuild version 1.

  A syncopated riff of single notes and rests on an overdriven guitar against a funky kit with ghost
  notes; a bluesy verse over the riff; a chorus in harmony on IV, I and V; a solo; a long ending of
  two slide guitars on flat VII, IV and I.

  Subgenre: American hard rock of the early seventies played by a trio with a funk drummer's feel.
  Drums: funky and loose-limbed, the kick syncopated on sixteenths, never four on the floor, a fat
  snare on two and four with ghost notes between, eighth hats with an open hat barking before the bar,
  a tambourine in the chorus. Tempo 100, straight sixteenths. Bass: syncopated with the kick, leaving
  holes. Builds: the ending piles up guitars. Sounds: an overdriven guitar riff of single notes and
  stabs with rests, a clean guitar scratching sixteenths, a bluesy voice, voices in harmony in the
  chorus, slide guitars at the end. Melody manner: a bluesy verse with flat thirds and sevenths,
  starting off the beat; a chorus in harmony that opens out on IV. Form: riff, verse, chorus, solo,
  chorus, a long ending of layered slide guitars.

  Band and song: the band is known for a guitarist whose riffs are as much rhythm as notes, and for a
  drummer who swings hard rock like funk; the song for its strutting riff, its harmonized chorus and
  an ending where guitars stack up over one another.

  Checklist: it is good and memorable because the riff struts: the rests are as funky as the notes,
  and the drums push against it. The hook is the riff; the emotion is swagger, walking out; the lift
  is the chorus on IV, voice and harmony with tambourine and a crash; the contrast is the riff's dry
  verse; the sounds are an overdriven guitar, a clean guitar scratching, a finger bass, a voice lead,
  a choir and two slide guitars on an overdriven sound.

  Run it with: llamatron examples/by_genre/rock/gain_distance_pedestrian.yml

  Scene 1, riff, 4 bars.
  Scene 2, verse, 8 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, riff 2, 4 bars.
  Scene 5, verse 2, 8 bars.
  Scene 6, chorus 2, 8 bars.
  Scene 7, solo, 8 bars.
  Scene 8, chorus 3, 8 bars.
  Scene 9, slide guitars, 16 bars.
  Scene 10, riff 3, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
