version: 1.0.227
title: Not werewolves
description: "an upbeat honky-tonk piano rock song of outlaws on the chords of Warren Zevon's Frank and Jesse James, opening like saloon music"
notes: |
  Not werewolves: an upbeat piano rock song in F major at 106 beats a minute, on the chords of
  Warren Zevon's Frank and Jesse James, in its key, with a melody, a solo and parts of its own: a
  vintage upright piano carries everything, ragtime like The Entertainer but rock, with a ballad
  in the middle. It opens like saloon music, the two hands alone: a stride left hand leaping from
  bass note to chord under a ragtime right hand. Then the band comes in, a bass and a rock beat,
  and the tune is played on the honky-tonk piano in octaves (two tracks, the lower one transposed
  down seven degrees), with the right hand's chords pushed between its lines.

  The verse goes Dm F, C F, Dm C, Bb F, twice, ending Bb, C and F; the chorus Dm and C, F, Bb, F,
  its last time ending Bb, Dm, so that the song ends on D minor. Every part is written out note
  for note in close voicings, rather than moved by Progression, which would leap a chord up from
  F as far as a sixth.

  Run it with: llamatron examples/by_genre/rock/not_werewolves.yml

  Scene 1, saloon, 8 bars: the stride left hand and the ragtime right hand alone.
  Scene 2, verse, 16 bars: the band comes in, the tune in octaves.
  Scene 3, chorus, 8 bars.
  Scene 4, piano solo, 8 bars: ragtime runs and tremolos in octaves, on the ride.
  Scene 5, verse 2, 16 bars.
  Scene 6, ballad, 8 bars: the drums drop out, a rolling left hand and soft strings under the chorus's chords.
  Scene 7, last chorus, 16 bars: the band and the strings, ending on D minor.

  When changing this demo:
  - Keep the piano the star: no flute, fiddle or other lead instrument.
  - Keep the opening like saloon music, the two hands alone, and the song upbeat.
  - Keep the chords of Frank and Jesse James, in F major, and the melody original.
