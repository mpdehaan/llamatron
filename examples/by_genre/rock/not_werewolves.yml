version: 1.0.591
title: Not werewolves
description: "an upbeat honky-tonk piano rock song of outlaws on the chords of Warren Zevon's Frank and Jesse James, opening like saloon music"
notes: |
  Not werewolves: an upbeat honky-tonk piano rock song of outlaws on the chords of Warren Zevon's
  Frank and Jesse James, opening like saloon music. This is a homage to Frank and Jesse James (Warren
  Zevon): its chords, form, sounds and drums follow that work as Claude knows it, and every tune and
  rhythm here is new. Rebuild version 3.

  The piano is the star: a stride left hand, a bass note and a chord for each chord of the song, moved
  by a progression and voiced by Voice leading, under a ragtime right hand; the verse two chords a bar
  on vi I, V I, vi V, IV I; a ballad in the middle; ends on vi.

  Subgenre: Californian piano rock of the seventies, a story song, here played as saloon music. Drums:
  a plain country-rock beat, kick on one and three, snare on two and four. Tempo 106, straight. Bass:
  root and fifth. Builds: a band entrance after the piano alone. Sounds: a honky-tonk piano above all,
  strings in the chorus. Melody manner: a ragtime right hand, syncopated, over a stride left hand.
  Form: verse, chorus, a slow middle, chorus.

  Band and song: the writer is known for wry story songs at the piano; the song for its rolling piano
  and its tale of two outlaws.

  Checklist: it is good and memorable because the piano tells the story by itself before the band
  joins. The hook is the right hand over the stride; the emotion is rollicking, then wistful; the lift
  is the chorus with the band and strings; the contrast is the slow ballad in the middle; the sound is
  a honky-tonk piano, three ways.

  Phrasing: the piano's right hand sings the chorus and the ballad as a voice would, in two-bar lines
  with a breath after each and the accent on each line's highest note; the rolling verse figure stays
  a piano's.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/not_werewolves.yml

  Scene 1, saloon, 8 bars.
  Scene 2, saloon end, 2 bars.
  Scene 3, verse, 8 bars.
  Scene 4, verse end, 2 bars.
  Scene 5, chorus, 8 bars.
  Scene 6, piano solo, 8 bars.
  Scene 7, solo end, 2 bars.
  Scene 8, verse 2, 8 bars.
  Scene 9, verse 2 end, 2 bars.
  Scene 10, ballad, 8 bars.
  Scene 11, chorus 2, 8 bars.
  Scene 12, last chorus, 8 bars.
  Scene 13, ending, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

