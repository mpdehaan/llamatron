version: 1.0.362
title: Training montage
description: "an early eighties arena-rock song in the manner of Eye of the Tiger (Survivor), for a training montage"
notes: |
  Training montage: an arena-rock song at 108 beats a minute in D minor, in the manner of the early
  eighties: muted guitar stabs locked to the kick, a finger bass, a pad, a rock beat and a brass
  lead. This is a homage to Eye of the Tiger by Survivor: the chords of the verse and of the chorus
  are that song's, in another key, and the stabs' rhythm, the build, the tunes and the bass lines
  are its own.

  The guitar's pattern is one held note a bar. A Progression moves the note, i VI VII i in the
  verse, iv v VI VII in the build and iv III VII VI in the chorus, and a Guitarify after it in the
  same chain makes each note a power chord and plays it: stabs between muted strokes in the verse,
  eight down strokes a bar in the build and a muted chug in the chorus. The bass and the pad are
  one bar each over chord i, moved by the same Progressions.

  Run it with: llamatron examples/by_genre/rock/training_montage.yml

  Scene 1, intro, 4 bars: the stabs, the kick and a crash.
  Scene 2, verse, 16 bars: the brass with the verse's tune over the stabs.
  Scene 3, build, 8 bars: the whole kit, the guitar in down strokes, rising.
  Scene 4, chorus, 16 bars: the chorus over the chugging guitar.
  Scene 5, verse 2, 8 bars: the verse again, half as long.
  Scene 6, build 2, 8 bars: the build again.
  Scene 7, last chorus, 16 bars: the chorus to the end.
  Scene 8, ending, 4 bars: the stabs alone again.

  When changing this demo:
  - Keep the guitar one held note a bar, moved by a Progression and made power chords by a Guitarify.
  - Keep the stabs' rhythm and the tunes its own: only the chords are the song's.
  - Keep it out of C minor, the song's key.
real_time: true
protected: true

