songs:
  training_montage:
    tempo: 108
    scale: C Minor
    genre: Rock

    tracks:
      kick: { drum: true, instrument: drum kit }
      snare: { drum: true, instrument: drum kit }
      hat: { drum: true, instrument: drum kit }
      crash: { drum: true, instrument: drum kit }
      hits: { instrument: distortion guitar }
      bass: { instrument: finger bass }
      pad: { instrument: polysynth }
      lead: { instrument: brass }

    scenes:
      - name: intro
        tracks:
          kick: { pattern: hits_kick, repeat: 8 }
          crash: { pattern: crash, loop: true }
          hits: { pattern: hits, chains: [verse], loop: true }
          bass: { pattern: bass, chains: [verse], loop: true }
      - name: verse
