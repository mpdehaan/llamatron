version: 1.0.365
title: Training montage
description: "an early eighties arena-rock song in the manner of Eye of the Tiger (Survivor), for a training montage"
notes: |
  Training montage: an early eighties arena-rock song in the manner of Eye of the Tiger (Survivor),
  for a training montage. This is a homage to Eye of the Tiger (Survivor): its chords, form, sounds
  and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 2.

  A muted pulse with chord hits of its own rhythm; a verse on i VI VII i; a chorus on iv VII i i, iv
  VII VI VI with the band's answers; a guitar solo over the verse; a breakdown and a last chorus
  twice.

  Subgenre: American arena rock of the early eighties, written for a film's training scenes. Drums:
  plain and heavy, a kick on one and three with a push, a snare on two and four, hats in eighths, a
  crash where the chords hit. Tempo 108. Bass: eighths on the root, locked to the kick. Sounds: one
  guitar chugging a muted note in sixteenths without stopping, a second guitar hitting chords against
  it, a pad, a gritty voice, the band shouting the chorus's answers. Melody manner: a low verse in
  short, clipped lines that break off; a chorus that starts after the beat and climbs, each line
  answered by the band.

  Band and song: the song is known for its opening, a muted pulse and chords that land like punches,
  and for a chorus about getting up again that a whole arena answers.

  Checklist: it is good and memorable because the pulse never stops and the hits never land where the
  ear expects, so it sounds like someone training. The hook is the pulse with its hits, then the
  chorus's rising line; the emotion is determination; the lift is the chorus with the band answering;
  the contrast is the breakdown, the pulse alone; the sounds are a muted guitar, a distortion guitar,
  a finger bass, a pad, a voice and a choir.

  Phrasing: the lines keep their short punched shapes and rests; the two quick notes that open each
  chorus line are soft pickups and the note they reach is accented.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/training_montage.yml

  Scene 1, pulse, 4 bars.
  Scene 2, hits, 4 bars.
  Scene 3, verse, 8 bars.
  Scene 4, build, 4 bars.
  Scene 5, chorus, 8 bars.
  Scene 6, hits 2, 4 bars.
  Scene 7, verse 2, 8 bars.
  Scene 8, build 2, 4 bars.
  Scene 9, chorus 2, 8 bars.
  Scene 10, solo, 8 bars.
  Scene 11, breakdown, 4 bars.
  Scene 12, last chorus, 16 bars.
  Scene 13, ending, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

