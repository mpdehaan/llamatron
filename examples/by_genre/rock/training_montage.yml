progressions:
  verse: { chords: [1, 6, 7, 1] }
  build: { chords: [4, 5, 6, 7] }
  chorus: { chords: [4, 3, 7, 6] }

guitarifies:
  stabs: { bar: [down, nothing, nothing, mute, nothing, nothing, down, nothing, nothing, nothing, mute, nothing, down, nothing, mute, nothing], accents: [true, false, false, false, false, false, true, false, false, false, false, false, true, false, false, false], cell: 1/16, single_notes: power_chord, spread: 2, fade: 0 }
  all down: { bar: [down, down, down, down, down, down, down, down], accents: [true, false, false, false, true, false, false, false], cell: 1/8, single_notes: power_chord, spread: 2, fade: 0 }
  chug: { bar: [mute, mute, down, mute, mute, mute, down, mute], accents: [false, false, true, false, false, false, true, false], cell: 1/8, single_notes: power_chord, spread: 2, fade: 0 }

chains:
  verse:
    - progression: verse
  build:
    - progression: build
  chorus:
    - progression: chorus
  verse stabs:
    - progression: verse
    - guitarify: stabs
  build all down:
    - progression: build
    - guitarify: all down
  chorus chug:
    - progression: chorus
    - guitarify: chug

instruments:
  distortion guitar: { device: "*FluidSynth", gm_sound: 31 }
  finger bass: { device: "*FluidSynth", gm_sound: 34 }
  polysynth: { device: "*FluidSynth", gm_sound: 91 }
  brass: { device: "*FluidSynth", gm_sound: 62 }
  drum kit: { device: "*FluidSynth" }

