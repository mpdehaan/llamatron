version: 1.0.227
title: Training montage
description: "an early eighties arena-rock song in the manner of Eye of the Tiger (Survivor), for a training montage"
notes: |
  Training montage: an arena-rock song at 108 beats a minute in C minor, in the manner of the early
  eighties film anthems: muted guitar chords hit in a syncopated rhythm with the kick, then a
  driving rock beat, a synth pad, and a brass lead. The rhythm and the melody are its own.

  The guitar's hits, the bass and the pad are one bar each over chord i, moved by Progression:
  the verse goes i i VI VII, the build VI VII i i, and the chorus i VII VI VII.

  Run it with: llamatron examples/by_genre/rock/training_montage.yml

  Scene 1, intro, 8 bars: the hits and the kick together.
  Scene 2, verse, 16 bars: the verse over the hits.
  Scene 3, build, 8 bars: the build.
  Scene 4, chorus, 16 bars: the chorus.
  Scene 5, verse 2, 16 bars: the second verse.
  Scene 6, build 2, 8 bars: the build again.
  Scene 7, last chorus, 8 bars: the last chorus.

  When changing this demo:
  - Keep the hits, the bass and the pad one bar long over chord i.
  - Keep the melody original.
real_time: true
protected: true

