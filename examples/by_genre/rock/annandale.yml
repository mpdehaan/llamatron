version: 1.0.364
title: Annandale
description: "a seventies jazz-rock song in the manner of Steely Dan's My Old School, with a horn line of its own"
notes: |
  Annandale: a seventies jazz-rock song in the manner of Steely Dan's My Old School, with a horn line
  of its own. This is a homage to My Old School (Steely Dan): its chords, form, sounds and drums
  follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild version 3.

  A straight groove under a pumping piano on chords with added ninths; the guitar answers each line of
  the verse; horns punch the chorus, which is sung high in harmony, and play a riff on I bVII IV
  between sections; a guitar solo over the verse.

  Subgenre: jazz-rock of the early seventies, a rock and rhythm-and-blues band playing jazz chords.
  Drums: a tight, straight rock beat, not swung: kick on one, on the and of two and on three, a crisp
  snare on two and four, eighth-note hats, a tambourine in the choruses. Tempo about 118. Bass: a busy
  rhythm-and-blues line in eighths. Builds: none; the chorus lifts by adding horns and voices. Sounds:
  an acoustic piano pumping chords in eighths, a horn section, a stinging overdriven guitar, voices in
  harmony. Melody manner: a wordy, syncopated verse in short phrases that leave gaps, a high chorus
  hook repeated. Form: verse, chorus, horn riff, a long guitar solo, chorus, a ride-out with horns and
  guitar.

  Band and song: the band is known for studio precision, jazz chords with added seconds, sardonic
  story lyrics and hired soloists; the song for its punching horn arrangement, for a guitar that
  answers every line of the verse and then solos, and for a chorus the whole band shouts.

  Checklist: it is good and memorable because three things answer each other, the voice, the guitar
  and the horns, over a groove that never loosens. The hook is the chorus line with the horns hitting
  under it; the emotion is defiant and gleeful; the lift is the chorus, the tune up high in two-part
  harmony, horns, crash and tambourine; the contrast is the verse, piano, bass and drums with only the
  guitar answering; the sounds are a voice lead with a choir a third below, a brass section, an
  overdriven guitar and an acoustic piano.

  Run it with: llamatron examples/by_genre/rock/annandale.yml

  Scene 1, horns, 4 bars.
  Scene 2, verse, 16 bars.
  Scene 3, chorus, 8 bars.
  Scene 4, horns 2, 4 bars.
  Scene 5, verse 2, 8 bars.
  Scene 6, chorus 2, 8 bars.
  Scene 7, guitar solo, 16 bars.
  Scene 8, last chorus, 16 bars.
  Scene 9, ride out, 8 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
