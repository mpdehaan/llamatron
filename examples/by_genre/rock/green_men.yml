version: 1.0.591
title: Green men
description: "a fast pop-punk song in the manner of American Idiot (Green Day): a stop-start riff of power chords, and wide open choruses"
notes: |
  Green men: a fast pop-punk song in the manner of American Idiot (Green Day): a stop-start riff of
  power chords, and wide open choruses. This is a homage to American Idiot (Green Day): a stop-start
  riff of power chords: its chords, form, sounds and drums follow that work as Claude knows it, and
  every tune and rhythm here is new. Rebuild version 6.

  A riff of power chords, two to a bar, I IV bVII IV; a verse muted for two bars and answered for two;
  a chorus on IV I V I; a solo over the chorus chords.

  Subgenre: pop-punk of the two thousands. Drums: a fast punk beat, the snare driving, kick on one and
  the and of two. Tempo 180, straight. Bass: eighths on the roots. Builds: stops and starts. Sounds:
  distorted guitars in power chords, muted in the verse. Melody manner: a shouted, narrow tune. Form:
  riff, verse, chorus, solo.

  Band and song: the song is known for its stop-start riff and its shouted chorus.

  Checklist: it is good and memorable because the riff hits and stops and the drums fill the holes.
  The hook is the riff; the emotion is angry fun; the lift is the open chorus; the contrast is the
  muted verse; the sounds are a distortion guitar, a pick bass.

  Phrasing: the verse is four fast lines of a bar and a half, each followed by two beats in which the
  stop-start riff is heard alone; the chorus's lines are longer, each begun on a held, accented note
  and ended with a breath.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/green_men.yml

  Scene 1, intro, 4 bars.
  Scene 2, intro 2, 4 bars.
  Scene 3, verse, 16 bars.
  Scene 4, chorus, 16 bars.
  Scene 5, verse 2, 16 bars.
  Scene 6, chorus 2, 16 bars.
  Scene 7, solo, 16 bars.
  Scene 8, last chorus, 32 bars.
  Scene 9, outro, 12 bars.
  Scene 10, ending, 2 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
