version: 1.0.227
title: Green men
description: "a pop-punk song in the manner of Green Day in the late nineties and early 2000s, its power chords strummed"
notes: |
  Green men: a pop-punk song at 180 beats a minute in E major, in the manner of Green Day and Sum 41:
  eighth-note power chords, a pick bass on every eighth, a fast kick and snare, and a shouted lead.
  The melody is its own.

  The guitar's power chords are strummed: the track strums every chord down, tight, the way a
  pick rakes the strings, and in the bridge a Strum generator called rake, in the clips' chains,
  wins over the track's and strums down and up, looser. The guitar and the bass are one bar each,
  moved by Progression: the verse goes I V vi IV, the chorus IV I V vi.

  Run it with: llamatron examples/by_genre/rock/green_men.yml

  Scene 1, intro, 8 bars: the guitar alone, then the band.
  Scene 2, verse, 16 bars: the verse.
  Scene 3, chorus, 16 bars: the chorus, a crash on every bar.
  Scene 4, verse 2, 16 bars: the second verse.
  Scene 5, chorus 2, 16 bars: the chorus again.
  Scene 6, bridge, 16 bars: the bridge, the guitar raked down and up.
  Scene 7, chorus 3, 16 bars: the chorus.
  Scene 8, verse 3, 16 bars: the verse once more.
  Scene 9, last chorus, 16 bars: the last chorus.

  When changing this demo:
  - Keep the guitar track strummed, and the rake generator in the bridge.
  - Keep the melody original.
real_time: true
protected: true

