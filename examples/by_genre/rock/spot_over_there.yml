version: 1.0.591
title: Spot over there
description: "an early 2000s power-pop song in the manner of Stacy's Mom (Fountains of Wayne): muted power chords in the verse, open chords in the chorus, and a key change for the solo"
notes: |
  Spot over there: an early 2000s power-pop song in the manner of Stacy's Mom (Fountains of Wayne):
  muted power chords in the verse, open chords in the chorus, and a key change for the solo. This is a
  homage to Stacy's Mom (Fountains of Wayne): muted power chords in the verse: its chords, form,
  sounds and drums follow that work as Claude knows it, and every tune and rhythm here is new. Rebuild
  version 5.

  A muted verse on I IV V IV, two chords a bar; a pre-chorus on iii IV; a chorus on IV I V vi; the
  solo and last chorus a minor third higher.

  Subgenre: power pop of the early two thousands. Drums: a straight rock beat, hand claps. Tempo 120,
  straight. Bass: eighths. Builds: a pre-chorus, a key change up for the solo. Sounds: muted guitars,
  a synth lead, voices. Melody manner: a bright sung chorus. Form: verse, pre-chorus, chorus, solo.

  Band and song: the song is known for its muted two-chord-a-bar verse, its bright chorus and its lift
  a minor third up.

  Checklist: it is good and memorable because the chorus is bright and the key jumps. The hook is the
  chorus; the emotion is cheeky; the lift is the key change; the contrast is the muted verse; the
  sounds are guitars, a synth lead and keys.

  Phrasing: the verse is four lines of a bar and a half with two beats of air after each; the chorus
  opens with a short four-note title clause, a rest that a second voice echoes, and then an answering
  line, and does so again.

  Dynamics: every part keeps a full default velocity and moves a little from it by its rhythm: the
  hats and shakers lean on the beats, the bass on the first beat of the bar, the chords on two and
  four, and a tune on its downbeats; a note pushed ahead of the beat and held over it is accented. The
  kick, snare and crashes are as the drummer plays them.

  Run it with: llamatron examples/by_genre/rock/spot_over_there.yml

  Scene 1, intro, 4 bars.
  Scene 2, verse, 16 bars.
  Scene 3, pre-chorus, 4 bars.
  Scene 4, chorus, 8 bars.
  Scene 5, verse 2, 16 bars.
  Scene 6, pre-chorus 2, 4 bars.
  Scene 7, chorus 2, 8 bars.
  Scene 8, solo, 8 bars.
  Scene 9, last chorus, 16 bars.
  Scene 10, outro, 4 bars.

  When changing this demo:
  - Keep the drums as the Subgenre paragraph describes them, the kick first.
  - Keep what the Checklist paragraph calls the hook and the lift.
  - Keep every tune original, and the demo out of the key of the work it follows.
real_time: true
protected: true

