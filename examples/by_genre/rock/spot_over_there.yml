version: 1.0.227
title: Spot over there
description: "an early 2000s power-pop song in the manner of Stacy's Mom (Fountains of Wayne), with a melody of its own"
notes: |
  Spot over there: a power-pop song at 120 beats a minute in E major, in the manner of the early
  2000s: driving eighth-note power chords, a pick bass on every eighth, a rock beat with a crash
  on every chorus bar, and a bright lead. The melody is its own.

  The guitar plays root and fifth, the scale chord 5, and the guitar and the bass are one bar each,
  moved by Progression: the verse goes I V IV V, the chorus IV V I vi and the bridge vi IV I V.

  Run it with: llamatron examples/by_genre/rock/spot_over_there.yml

  Scene 1, intro, 4 bars: the guitar and the drums.
  Scene 2, verse, 16 bars: the verse.
  Scene 3, chorus, 16 bars: the chorus, a crash on every bar.
  Scene 4, verse 2, 16 bars: the second verse.
  Scene 5, chorus 2, 16 bars: the chorus again.
  Scene 6, bridge, 8 bars: the bridge.
  Scene 7, last chorus, 16 bars: the last chorus.

  When changing this demo:
  - Keep the guitar and the bass one bar long over chord I.
  - Keep the melody original.
real_time: true
protected: true

